<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квиз - Выбор игры</title>
    <link rel="stylesheet" href="/styles/common.css">
    <style>
        /* Специфичные стили для страницы выбора квиза */
        .container {
            max-width: 1200px;
            width: 100%;
            text-align: center;
        }

        h1 {
            animation: fadeInDown 0.8s ease;
        }

        .subtitle {
            font-size: 20px;
            margin-bottom: 50px;
            opacity: 0.9;
            animation: fadeInDown 1s ease;
        }

        .quizzes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .quiz-icon {
            font-size: 64px;
            margin-bottom: 20px;
            display: block;
            animation: bounce 2s infinite;
        }

        .quiz-title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
        }

        .quiz-description {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .quiz-info {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 14px;
        }

        .quiz-info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .quiz-info-icon {
            font-size: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Выберите квиз</h1>
        <p class="subtitle">Выберите тему для вашей игры</p>
        
        <div id="loading" class="loading">Загрузка квизов...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="quizzes-grid" class="quizzes-grid" style="display: none;"></div>
    </div>

    <script>
        // Загрузка списка квизов
        async function loadQuizzes() {
            try {
                const response = await fetch('/api/quizzes');
                if (!response.ok) {
                    throw new Error('Ошибка загрузки квизов');
                }
                const quizzes = await response.json();
                displayQuizzes(quizzes);
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Не удалось загрузить квизы. Убедитесь, что сервер запущен.';
            }
        }

        function displayQuizzes(quizzes) {
            const loading = document.getElementById('loading');
            const grid = document.getElementById('quizzes-grid');
            
            loading.style.display = 'none';
            grid.style.display = 'grid';
            grid.innerHTML = '';

            quizzes.forEach((quiz, index) => {
                const card = document.createElement('div');
                card.className = 'quiz-card' + (quiz.comingSoon ? ' coming-soon' : '');
                card.style.animationDelay = (index * 0.1) + 's';
                
                if (!quiz.comingSoon) {
                    card.addEventListener('click', () => {
                        // Если квиз поддерживает соло-режим, переходим на solo.html
                        if (quiz.soloMode) {
                            window.location.href = `/solo.html?quiz=${quiz.id}`;
                        } else {
                            window.location.href = `/host.html?quiz=${quiz.id}`;
                        }
                    });
                }

                const icon = quiz.icon || '📚';
                const description = quiz.description || 'Проверьте свои знания!';
                const questionInfo = quiz.questionInfo || `${quiz.questionCount || 0} вопросов`;
                const avgTime = quiz.avgTime || 0;

                const modeBadge = quiz.soloMode ? '<div style="margin-top: 10px; font-size: 14px; opacity: 0.8;">🎮 Соло-режим</div>' : '';
                
                card.innerHTML = `
                    <span class="quiz-icon">${icon}</span>
                    <div class="quiz-title">${quiz.name}</div>
                    <div class="quiz-description">${description}</div>
                    ${modeBadge}
                    <div class="quiz-info">
                        <div class="quiz-info-item">
                            <span class="quiz-info-icon">❓</span>
                            <span>${questionInfo}</span>
                        </div>
                        <div class="quiz-info-item">
                            <span class="quiz-info-icon">⏱️</span>
                            <span>~${avgTime} сек</span>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // Загружаем квизы при загрузке страницы
        loadQuizzes();
    </script>
</body>
</html>
