<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квиз - Выбор игры</title>
    <!-- Новая система фреймов -->
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/layout.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="/styles/quiz-card.css">
    <link rel="stylesheet" href="/styles/frame1.css">
    <link rel="stylesheet" href="/styles/frame2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Days+One&family=Handlee&family=Kalam:wght@300;400;700&family=Open+Sans:wght@400;500;600;700&family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;600;700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    
    <!-- Конфигурация видимости фреймов -->
    <script>
        window.pageLayoutConfig = {
            showFrame1: true,   // Панель кнопок
            showFrame2: false,  // Логотип скрыт на этой странице
            showFrame4: true,   // Правила безопасности
            showFrame5: true    // Информация о создателе
        };
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Стили body теперь управляются через layout-system.css */
        /* Удаляем старые стили, которые конфликтуют с grid-системой */

        /* --- Каркас HUB-зон на странице --- */

        /* Базовый класс для любой HUB-зоны */
        .hub-zone {
            width: 100%;
            box-sizing: border-box;
        }

        /* HUB3 — основная зона контента */
        /* Стили управляются через layout.css и layout-system.css */

        /* Внутренний контейнер внутри HUB3 */
        /* Стили управляются через layout.css */

        /* HUB4 и HUB5 — нижние полосы, прокручиваются вместе с контентом */
        /* Стили управляются через layout.css */

        /* Парящие элементы перемещены в Hub3 через layout.css */
        
        /* Стили для контента внутри HUB3 */
        /* Padding уже установлен выше, не переопределяем */
        
        /* Убеждаемся, что loading и error не занимают место */
        .hub3 > .container > #loading,
        .hub3 > .container > #error {
            display: none !important;
            margin: 0 !important;
            padding: 0 !important;
            height: 0 !important;
            min-height: 0 !important;
            max-height: 0 !important;
            overflow: hidden !important;
            visibility: hidden !important;
            position: absolute !important;
            top: -9999px !important;
            left: -9999px !important;
        }
        
        /* Убеждаемся, что quizzes-grid начинается с самого верха */
        .hub3 > .container > #quizzes-grid {
            margin-top: 0 !important;
            padding-top: 0 !important;
            margin-bottom: 0 !important;
            padding-bottom: 0 !important;
        }
        
        /* Убеждаемся, что первая карточка не имеет отступов */
        .hub3 > .container > #quizzes-grid > .quiz-card:first-child {
            margin-top: 0 !important;
            padding-top: 0 !important;
        }

        /* Общие стили для заголовков */
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Caveat', cursive;
        }

        .main-title {
            margin-bottom: 10px;
            animation: fadeInDown 0.8s ease;
            text-align: center;
        }



        /* Сетка квизов - адаптивная, как на gnu-quiz.html */
        .quizzes-grid {
            display: grid;
            grid-template-columns: 1fr; /* 1 колонка по умолчанию (мобильные) */
            gap: clamp(20px, 4vw, 28px); /* Адаптивный отступ, как на gnu-quiz.html */
            margin: clamp(20px, 6vw, 40px) auto 0 auto; /* Центрирование по горизонтали, отступ сверху */
            padding: 0; /* Отступы уже есть у родительского контейнера */
            max-width: 1200px;
            width: 100%;
            align-items: stretch; /* Растягиваем карточки на одинаковую высоту */
            align-content: center; /* Выравнивание содержимого по центру вертикально */
            justify-items: stretch; /* Растягиваем карточки по ширине */
            box-sizing: border-box;
        }
        
        /* Все карточки в grid должны иметь одинаковую высоту */
        .quizzes-grid > .quiz-card {
            height: 100%; /* Занимают всю доступную высоту в grid-ячейке */
        }
        
        /* Убираем отступ перед первой карточкой в grid */
        .quizzes-grid > .quiz-card:first-child {
            margin-top: 0 !important;
            padding-top: 0 !important;
        }

        /* Базовые стили карточек вынесены в quiz-card.css */
        /* Здесь только специфичные стили для цветов карточек */
        
        /* Первая карточка не должна иметь отступов сверху */
        .quizzes-grid > .quiz-card:first-child {
            margin-top: 0 !important;
            padding-top: 25px !important; /* Сохраняем внутренний padding */
            animation: none !important; /* Отключаем анимацию для первой карточки */
            opacity: 1 !important;
            transform: none !important;
        }

        /* Первый доступный квиз - стиль Академа (голубая карточка) */
        .quiz-card:nth-child(1) {
            /* Цвет фона устанавливается через JavaScript из конфигурации квиза */
            border: none;
            box-shadow: 
                0 6px 0px rgba(43, 122, 138, 0.3),
                0 8px 16px rgba(43, 122, 138, 0.1);
        }

        .quiz-card:nth-child(1):hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 8px 0px rgba(0, 0, 0, 0.2),
                0 12px 24px rgba(0, 0, 0, 0.15);
            opacity: 0.9;
        }

        .quiz-card:nth-child(1):hover .quiz-title,
        .quiz-card:nth-child(1):hover .quiz-subtitle,
        .quiz-card:nth-child(1):hover .quiz-info-item,
        .quiz-card:nth-child(1):hover .quiz-info-item span {
            color: #373639;
            filter: brightness(1.1);
        }

        .quiz-card:nth-child(1):hover div[style*="Caveat"] {
            filter: brightness(1.1) !important;
        }

        /* Стили для первой карточки (цвет текста) */
        .quiz-card:nth-child(1) .quiz-title,
        .quiz-card:nth-child(1) .quiz-subtitle {
            color: #373639;
        }

        .quiz-card:nth-child(1) .quiz-icon {
            display: none;
        }

        /* SVG иконки в стиле "от руки маркером" */
        .hand-drawn-icon {
            width: 32px;
            height: 32px;
            display: inline-block;
            vertical-align: middle;
        }


        /* Вторая карточка - зеленый стиль Газпрома */
        .quiz-card:nth-child(2) {
            /* Цвет фона устанавливается через JavaScript из конфигурации квиза */
            border: none;
            box-shadow: 
                0 6px 0px rgba(0, 107, 60, 0.3),
                0 8px 16px rgba(0, 107, 60, 0.1);
        }

        .quiz-card:nth-child(2):hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 8px 0px rgba(0, 0, 0, 0.2),
                0 12px 24px rgba(0, 0, 0, 0.15);
            opacity: 0.9;
        }

        .quiz-card:nth-child(2):hover .quiz-title,
        .quiz-card:nth-child(2):hover .quiz-subtitle,
        .quiz-card:nth-child(2):hover .quiz-info-item,
        .quiz-card:nth-child(2):hover .quiz-info-item span {
            color: #373639;
            filter: brightness(1.1);
        }

        .quiz-card:nth-child(2):hover div[style*="Caveat"] {
            filter: brightness(1.1) !important;
        }

        /* Стили для второй карточки (цвет текста) */
        .quiz-card:nth-child(2) .quiz-title,
        .quiz-card:nth-child(2) .quiz-subtitle {
            color: #373639;
        }

        .quiz-card:nth-child(2) .quiz-icon {
            display: none;
        }

        /* Третья карточка - фиолетовый стиль Квиз-Questions */
        .quiz-card:nth-child(3) {
            /* Цвет фона устанавливается через JavaScript из конфигурации квиза */
            border: none;
            box-shadow: 
                0 6px 0px rgba(199, 124, 246, 0.3),
                0 8px 16px rgba(199, 124, 246, 0.1);
        }

        .quiz-card:nth-child(3):hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 8px 0px rgba(0, 0, 0, 0.2),
                0 12px 24px rgba(0, 0, 0, 0.15);
            opacity: 0.9;
        }

        .quiz-card:nth-child(3):hover .quiz-title,
        .quiz-card:nth-child(3):hover .quiz-subtitle,
        .quiz-card:nth-child(3):hover .quiz-info-item,
        .quiz-card:nth-child(3):hover .quiz-info-item span {
            color: #373639;
            filter: brightness(1.1);
        }

        .quiz-card:nth-child(3):hover div[style*="Caveat"] {
            filter: brightness(1.1) !important;
        }

        /* Стили для третьей карточки (цвет текста) */
        .quiz-card:nth-child(3) .quiz-title,
        .quiz-card:nth-child(3) .quiz-subtitle {
            color: #373639;
        }

        .quiz-card:nth-child(3) .quiz-icon {
            display: none;
        }

        .quiz-card:nth-child(n+3) .quiz-title {
            color: #373639 !important;
            font-family: 'Days One', sans-serif !important;
            font-weight: 700 !important;
            font-size: 28px !important;
        }

        .quiz-card:nth-child(n+3) .quiz-subtitle {
            color: #373639 !important;
            font-family: 'Days One', sans-serif !important;
            font-weight: 400 !important;
            font-size: 22px !important;
            margin-top: 8px !important;
        }

        .quiz-card:nth-child(n+3) .quiz-description {
            color: #373639 !important;
            font-family: 'Days One', sans-serif !important;
            font-size: 22px !important;
        }

        .quiz-card:nth-child(n+3) .quiz-info-item {
            color: #373639 !important;
        }

        .quiz-card:nth-child(n+3) .quiz-info-item span {
            color: #373639 !important;
        }

        .quiz-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3), transparent);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .quiz-card:hover::before {
            opacity: 1;
        }

        .quiz-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 8px 0px rgba(0, 0, 0, 0.2),
                0 12px 24px rgba(0, 0, 0, 0.15);
            background: rgba(245, 245, 245, 0.6); /* Полупрозрачный при наведении */
        }

        /* Текст становится ярче при наведении */
        .quiz-card:hover .quiz-title,
        .quiz-card:hover .quiz-subtitle,
        .quiz-card:hover .quiz-info-item,
        .quiz-card:hover .quiz-info-item span {
            color: #000;
            filter: brightness(1.1);
        }
        

        .quiz-card:active {
            transform: translateY(-4px) scale(1.01);
        }

        .quiz-icon {
            font-size: clamp(36px, 8vw, 56px); /* Адаптивный размер, как на gnu-quiz.html */
            margin-bottom: clamp(10px, 2.5vw, 16px); /* Адаптивный отступ, как на gnu-quiz.html */
            display: block;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
            animation: iconFloat 3s ease-in-out infinite;
            flex-shrink: 0;
            line-height: 1;
            width: clamp(36px, 8vw, 56px); /* Адаптивная ширина, как на gnu-quiz.html */
            height: clamp(56px, 10vw, 72px); /* Адаптивная высота, как на gnu-quiz.html */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Базовые стили для quiz-title, quiz-description, quiz-info и т.д. вынесены в quiz-card.css */

        /* Загрузка и ошибки */
        .loading {
            text-align: center;
            padding: 60px 40px;
            font-size: 22px;
            margin: 0;
            display: none; /* По умолчанию скрыт */
            color: #000;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            text-shadow: 2px 2px 0px #A8E063;
            position: relative;
        }

        .loading::before {
            content: 'ooo';
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            opacity: 0.3;
            letter-spacing: 8px;
        }

        .error {
            background: #fb6c6b; /* Новая розовая */
            border: 4px solid #000;
            color: #FFFFFF;
            padding: 20px;
            border-radius: 25px;
            margin: 0; /* Убираем отступы */
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            box-shadow: 0 6px 0px rgba(0, 0, 0, 0.3), 0 8px 16px rgba(0, 0, 0, 0.2);
            display: none; /* По умолчанию скрыт */
        }

        /* Анимации */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(0); /* Убираем translateY, чтобы не создавать отступ */
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Отключаем анимацию для первой карточки, чтобы она не создавала отступ */
        .quizzes-grid > .quiz-card:first-child {
            animation: none !important;
            opacity: 1 !important;
        }

        /* Меню выбора персонажа */
        .character-menu {
            position: relative;
            display: inline-block;
            z-index: 10001 !important; /* Выше Frame 1 (10000) */
            overflow: visible;
        }


        /* Стрелка вниз под кнопкой персонажа (нарисованная маркером) */
        .character-menu-arrow {
            position: absolute;
            top: calc(100% + 5px);
            left: 0;
            transform: translateX(0);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 14px solid #000;
            animation: bounceDown 1.5s ease-in-out infinite;
            display: none;
            filter: drop-shadow(1px 1px 0 rgba(0,0,0,0.3)) 
                    drop-shadow(-1px 1px 0 rgba(0,0,0,0.3));
            cursor: pointer;
            z-index: 10001 !important; /* Выше Frame 1 (10000) */
        }

        @keyframes bounceDown {
            0%, 100% {
                transform: translateX(0) translateY(0);
            }
            50% {
                transform: translateX(0) translateY(5px);
            }
        }

        .character-menu-dropdown {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            background: transparent;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-start;
            white-space: nowrap;
            width: auto;
            min-width: auto;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            max-height: 0;
            overflow: hidden;
            z-index: 10001 !important; /* Выше Frame 1 (10000) */
        }

        .character-menu-dropdown.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            max-height: none;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            overflow: visible;
            display: flex;
            z-index: 10001 !important; /* Выше Frame 1 (10000) */
        }

        .character-option {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease, transform 0.3s ease, opacity 0.3s ease;
            background: transparent;
            position: relative;
            flex-shrink: 0;
            opacity: 0;
            transform: translateY(-20px);
            z-index: 10001 !important; /* Выше Frame 1 (10000) */
        }

        .character-menu-dropdown.active .character-option {
            opacity: 1;
            transform: translateY(0);
        }

        .character-menu-dropdown.active .character-option:nth-child(1) {
            transition-delay: 0.05s;
        }

        .character-menu-dropdown.active .character-option:nth-child(2) {
            transition-delay: 0.1s;
        }

        .character-menu-dropdown.active .character-option:nth-child(3) {
            transition-delay: 0.15s;
        }

        .character-menu-dropdown.active .character-option:nth-child(4) {
            transition-delay: 0.2s;
        }

        .character-menu-dropdown.active .character-option:nth-child(5) {
            transition-delay: 0.25s;
        }

        .character-menu-dropdown.active .character-option:nth-child(6) {
            transition-delay: 0.3s;
        }

        .character-menu-dropdown.active .character-option:nth-child(7) {
            transition-delay: 0.35s;
        }

        .character-menu-dropdown.active .character-option:nth-child(8) {
            transition-delay: 0.4s;
        }

        /* Плавное закрытие в обратном порядке */
        .character-menu-dropdown:not(.active) .character-option {
            transition-delay: 0s;
            opacity: 0;
            transform: translateY(-20px);
        }

        .character-option:hover {
            transform: translateY(0) scale(1.1);
        }

        .character-option.selected {
            /* Выделение выбранного персонажа - без дополнительных обводок */
            opacity: 1; /* Гарантируем полную непрозрачность для выбранного элемента */
        }

        .character-preview {
            width: 100%;
            height: 100%;
            flex-shrink: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .character-preview svg {
            width: 100%;
            height: 100%;
        }

        .character-name {
            display: none;
        }

        /* Стили для SVG персонажей */
        .character-circle {
            width: 100%;
            height: 100%;
            border-radius: 50% 45% 55% 50%;
            position: relative;
            overflow: hidden;
        }

        .character-face {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Адаптивность - планшеты и десктопы (≥768px) - 2 колонки, как на gnu-quiz.html */
        @media (min-width: 768px) {
            .quizzes-grid {
                grid-template-columns: 1fr 1fr; /* 2 колонки на планшетах и десктопах */
                gap: clamp(24px, 4vw, 32px); /* Адаптивный отступ, как на gnu-quiz.html */
                margin-top: clamp(20px, 6vw, 40px); /* Отступ сверху, как на gnu-quiz.html */
                padding: 0 clamp(16px, 4vw, 24px); /* Отступы от краев экрана */
                align-items: stretch; /* Растягиваем карточки на одинаковую высоту */
                align-content: center; /* Выравнивание содержимого по центру вертикально */
                justify-items: stretch; /* Растягиваем карточки по ширине */
            }
        }
        
        /* Адаптивность - средние экраны (1024px и выше) - можно оставить 2 колонки или сделать 3 */
        @media (min-width: 1024px) {
            .quizzes-grid {
                grid-template-columns: repeat(2, 1fr); /* 2 колонки для соответствия gnu-quiz.html */
                gap: clamp(24px, 4vw, 32px);
                margin: clamp(20px, 6vw, 40px) auto 0 auto; /* Центрирование по горизонтали, отступ сверху */
                padding: 0; /* Отступы уже есть у родительского контейнера */
                align-items: stretch; /* Растягиваем карточки на одинаковую высоту */
                justify-items: stretch; /* Растягиваем карточки по ширине */
            }

            .quiz-card:nth-child(1) .quiz-title {
                font-size: clamp(24px, 3.5vw, 32px); /* Адаптивный размер с сохранением пропорций */
            }

            .quiz-card:nth-child(2) .quiz-title {
                font-size: clamp(22px, 3.2vw, 30px);
            }

            .quiz-card:nth-child(3) .quiz-title {
                font-size: clamp(22px, 3.2vw, 30px);
            }

            .quiz-card:nth-child(4) .quiz-title {
                font-size: clamp(22px, 3.2vw, 30px);
            }

            .quiz-card .quiz-title {
                font-size: clamp(24px, 3.5vw, 32px);
            }

            .quiz-card:nth-child(1) .quiz-subtitle,
            .quiz-card:nth-child(2) .quiz-subtitle,
            .quiz-card:nth-child(3) .quiz-subtitle,
            .quiz-card:nth-child(4) .quiz-subtitle,
            .quiz-card .quiz-subtitle {
                font-size: clamp(18px, 2.8vw, 26px);
            }

            .quiz-card:nth-child(1) .quiz-info,
            .quiz-card:nth-child(2) .quiz-info,
            .quiz-card:nth-child(3) .quiz-info,
            .quiz-card:nth-child(4) .quiz-info,
            .quiz-card .quiz-info {
                font-size: clamp(20px, 3.2vw, 30px);
            }

            .quiz-card:nth-child(1) .quiz-info-item span:last-child,
            .quiz-card:nth-child(2) .quiz-info-item span:last-child,
            .quiz-card:nth-child(3) .quiz-info-item span:last-child,
            .quiz-card:nth-child(4) .quiz-info-item span:last-child,

    <script>
        // Персонажи - кусочки пазлов (8 штук для квадрата 4x2)
        const characters = [
            { id: 'happy', name: 'Радость', color: '#abf67c', position: 0, emotion: 'happy' },
            { id: 'wink', name: 'Подмигивашка', color: '#c77cf6', position: 1, emotion: 'wink' },
            { id: 'smile', name: 'Улыбка', color: '#f67cab', position: 2, emotion: 'smile' },
            { id: 'grumpy', name: 'Хмурик', color: '#7cabf6', position: 3, emotion: 'grumpy' },
            { id: 'sad', name: 'Грустинка', color: '#7ce8f6', position: 4, emotion: 'sad' },
            { id: 'surprised', name: 'Удивлёнка', color: '#f68a7c', position: 5, emotion: 'surprised' },
            { id: 'laugh', name: 'Смешинка', color: '#f2f67c', position: 6, emotion: 'laugh' },
            { id: 'thoughtful', name: 'Думалка', color: '#8a7cf6', position: 7, emotion: 'thoughtful' }
        ];

        let selectedCharacterId = 'happy';

        // Вспомогательные функции для создания SVG элементов
        function createCircle(cx, cy, r) {
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', cx);
            circle.setAttribute('cy', cy);
            circle.setAttribute('r', r);
            circle.setAttribute('fill', '#000');
            circle.setAttribute('stroke', 'none');
            return circle;
        }

        function createPath(d) {
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', d);
            return path;
        }

        // Создание рожицы в стиле маркера (как на референсе)
        function createFace(emotion) {
            const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            group.setAttribute('stroke', '#000');
            group.setAttribute('stroke-width', '6');
            group.setAttribute('fill', 'none');
            group.setAttribute('stroke-linecap', 'round');
            group.setAttribute('stroke-linejoin', 'round');
            
            switch(emotion) {
                case 'happy':
                case 'wink':
                case 'smile':
                case 'grumpy':
                case 'sad':
                case 'surprised':
                case 'laugh':
                case 'thoughtful':
                default:
                    // Одинаковая мордочка для всех: 2 глаза и улыбающийся рот
                    group.appendChild(createCircle(35, 35, 4)); // Левый глаз - точка
                    group.appendChild(createCircle(65, 35, 4)); // Правый глаз - точка
                    group.appendChild(createPath('M 30 58 Q 50 68 70 58')); // Улыбающийся рот
                    break;
            }
            
            return group;
        }

        // Функция для создания SVG персонажа - простой круг
        function createCharacterSVG(color, emotion, position, size = 100) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', size);
            svg.setAttribute('height', size);
            svg.setAttribute('viewBox', '-10 -10 120 120'); // Расширенный viewBox для волос, выходящих за границы
            svg.setAttribute('overflow', 'visible');
            
            // Простой круг - полностью заполнен цветом с прозрачностью и черной обводкой
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', '50');
            circle.setAttribute('cy', '50');
            circle.setAttribute('r', '50');
            circle.setAttribute('fill', color);
            circle.setAttribute('stroke', '#000');
            circle.setAttribute('stroke-width', '3');
            circle.setAttribute('opacity', '1');
            svg.appendChild(circle);
            
            // Рожица в стиле маркера (Caveat) - центрируем в круге
            const face = createFace(emotion);
            // Лицо уже центрировано в координатах 0-100, просто добавляем его
            svg.appendChild(face);
            
            return svg;
        }

        // Инициализация меню персонажей больше не нужна - Frame1 делает это автоматически

        // Загрузка списка квизов
        async function loadQuizzes() {
            try {
                const response = await fetch('/api/quizzes');
                if (!response.ok) {
                    throw new Error('Ошибка загрузки квизов');
                }
                const quizzes = await response.json();
                displayQuizzes(quizzes);
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Не удалось загрузить квизы. Убедитесь, что сервер запущен.';
            }
        }

        function displayQuizzes(quizzes) {
            const loading = document.getElementById('loading');
            const grid = document.getElementById('quizzes-grid');
            
            loading.style.display = 'none';
            grid.style.display = 'grid';
            grid.innerHTML = '';

            // Создаем только реальные квизы (без пустых карточек "СКОРО")
            const existingQuizzes = quizzes || [];
            
            // Создаем список квизов для отображения
            // Ищем квиз 'gnu' (новый ID) или 'friends-quiz' (старый ID для обратной совместимости)
            const gnuQuiz = existingQuizzes.find(q => q.id === 'gnu') || existingQuizzes.find(q => q.id === 'friends-quiz');
            const akademQuiz = existingQuizzes.find(q => q.id === 'akadem');
            const gazpromQuiz = existingQuizzes.find(q => q.id === 'gazprom');
            
            // Если квиз не найден, выводим ошибку в консоль
            if (!gnuQuiz) {
                console.error('Квиз ГНУ не найден в списке квизов:', existingQuizzes);
            }

            // Создаем виртуальный квиз для ЧГК
            const quizQuestionsQuiz = {
                id: 'chgk',
                name: 'ЧГК',
                display: {
                    title: 'ЧГК',
                    subtitle: 'интеллектуальная игра',
                    phrase: 'Игра с ведущим',
                    questionsDisplay: '30 из 30',
                    timeDisplay: 'по {time} сек'
                },
                colors: {
                    background: '#c77cf6', // Фиолетовый цвет
                    text: '#373639',
                    shadow: 'rgba(199, 124, 246, 0.3)'
                },
                questionCount: 30,
                avgTime: 60
            };

            // Список реальных квизов для отображения
            // Академгородок должен быть первым
            // Квиз ГНУ скрыт с главной страницы
            const realQuizzes = [
                akademQuiz, // Академгородок (первый)
                gazpromQuiz, // Газпром (второй)
                quizQuestionsQuiz // Квиз-Questions (третий)
                // gnuQuiz скрыт с главной страницы
            ].filter(q => q !== null && q !== undefined);
            
            console.log('Квизы для отображения:', realQuizzes);
            console.log('Академгородок найден:', !!akademQuiz);
            console.log('Газпром найден:', !!gazpromQuiz);
            if (gazpromQuiz) {
                console.log('Данные квиза Газпром:', {
                    id: gazpromQuiz.id,
                    name: gazpromQuiz.name,
                    questionCount: gazpromQuiz.questionCount,
                    display: gazpromQuiz.display
                });
            }

            // Создаем карточки только для реальных квизов
            // Массив всех цветов персонажей
            const characterColors = ['#abf67c', '#c77cf6', '#f67cab', '#7cabf6', '#7ce8f6', '#f68a7c', '#f2f67c', '#8a7cf6'];
            
            // Массив для отслеживания использованных цветов
            const usedColors = [];
            
            for (let i = 0; i < realQuizzes.length; i++) {
                const quiz = realQuizzes[i];
                
                if (quiz) {
                    // Существующий квиз
                    const card = document.createElement('div');
                    card.className = 'quiz-card';
                    card.style.animationDelay = (i * 0.1) + 's';
                    
                    // Выбор цвета карточки
                    let cardColor;
                    // Используем цвет из конфигурации квиза, если есть
                    if (quiz.colors && quiz.colors.background) {
                        cardColor = quiz.colors.background;
                    } else if (i === 0) {
                        // Первая карточка (академ) - используем цвет из конфигурации или зеленый
                        cardColor = '#abf67c';
                    } else if (i === 1) {
                        // Вторая карточка (Газпром) - используем цвет из конфигурации или зеленый Газпрома
                        cardColor = '#7cf6c7';
                    } else {
                        // Остальные карточки - случайный цвет из персонажей
                        // Исключаем уже использованные цвета
                        const availableColors = characterColors.filter(color => !usedColors.includes(color));
                        if (availableColors.length === 0) {
                            // Если все цвета использованы, сбрасываем список
                            usedColors.length = 0;
                            usedColors.push('#abf67c', '#f68a7c'); // Оставляем первые два использованными
                            cardColor = characterColors[Math.floor(Math.random() * characterColors.length)];
                        } else {
                            cardColor = availableColors[Math.floor(Math.random() * availableColors.length)];
                        }
                        usedColors.push(cardColor);
                    }
                    
                    // Применяем цвет карточки
                    card.style.background = cardColor;
                    
                    // Объявляем переменные для всех квизов
                    const icon = quiz.icon || '📚';
                    const description = quiz.description || 'Проверьте свои знания!';
                    const questionCount = quiz.questionCount || 0;
                    const avgTime = quiz.avgTime || 0;

                    // Обработчики кликов для разных типов карточек
                    // Поддерживаем как новый ID 'gnu', так и старый 'friends-quiz'
                    if (quiz.id === 'gnu' || quiz.id === 'friends-quiz') {
                        // Чемпионат ГНУ - открывает отдельную страницу
                        card.addEventListener('click', () => {
                            window.location.href = `/gnu-quiz.html`;
                        });
                    } else if (quiz.id === 'chgk') {
                        // ЧГК - открывает страницу chgk-host
                        card.addEventListener('click', () => {
                            window.location.href = `/chgk-host.html`;
                        });
                    } else {

        // Функция для адаптации размера фразы под ширину логотипа (использует FrameCommon)
        function adaptSubtitleToLogo() {
            if (typeof FrameCommon !== 'undefined') {
                FrameCommon.adaptSubtitleToLogo();
                return;
            }
            const logo = document.querySelector('.hub2-logo-section .logo');
            const subtitle = document.querySelector('.hub2-logo-section .subtitle');
            
            if (!logo || !subtitle) return;
            
            // Ждем загрузки изображения
            function adjustSize() {
                const logoWidth = logo.offsetWidth;
                if (logoWidth === 0) return; // Логотип еще не загружен
                
                // Сохраняем оригинальный размер шрифта из CSS для начальной точки
                const baseFontSize = parseFloat(window.getComputedStyle(subtitle).fontSize) || 50;
                
                // Используем бинарный поиск для точного подбора размера
                let minFontSize = 10;
                let maxFontSize = 200;
                let bestFontSize = baseFontSize;
                const tolerance = 2; // Допустимая погрешность в пикселях
                
                // Бинарный поиск оптимального размера
                for (let i = 0; i < 20; i++) { // Максимум 20 итераций
                    const testFontSize = (minFontSize + maxFontSize) / 2;
                    subtitle.style.fontSize = testFontSize + 'px';
                    
                    // Ждем перерисовки
                    void subtitle.offsetWidth;
                    
                    const subtitleWidth = subtitle.scrollWidth;
                    
                    if (Math.abs(subtitleWidth - logoWidth) < tolerance) {
                        bestFontSize = testFontSize;
                        break;
                    } else if (subtitleWidth < logoWidth) {
                        minFontSize = testFontSize;
                        bestFontSize = testFontSize;
                    } else {
                        maxFontSize = testFontSize;
                    }
                }
                
                // Устанавливаем найденный размер с небольшим запасом (98% для безопасности)
                subtitle.style.fontSize = (bestFontSize * 0.98) + 'px';
            }
            
            // Если изображение уже загружено
            if (logo.complete) {
                adjustSize();
            } else {
                // Ждем загрузки изображения
                logo.addEventListener('load', adjustSize, { once: true });
                logo.addEventListener('error', adjustSize, { once: true }); // На случай ошибки загрузки
            }
            
            // Также вызываем сразу (на случай если изображение уже загружено)
            setTimeout(adjustSize, 100);
        }

        // Функция больше не нужна - позиционирование управляется через CSS Grid
        function updateContainerPadding() {
            // Позиционирование теперь управляется через CSS Grid в layout-system.css
            return;
        }
        
        // Сохраняем оригинальную функцию loadQuizzes
        const originalLoadQuizzes = loadQuizzes;
        
        // Переопределяем loadQuizzes, чтобы вызывать updateContainerPadding после загрузки
        loadQuizzes = async function() {
            await originalLoadQuizzes();

            const updatePosition = () => {
                // Ждем отрисовки карточек и обновляем позицию
                // Используем FrameCommon напрямую, если он доступен
                // Используем несколько requestAnimationFrame для гарантии правильной отрисовки
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            if (typeof FrameCommon !== 'undefined') {
                                // Проверяем, что Frame1 и Frame2 инициализированы
                                // Позиционирование теперь управляется через CSS Grid
                                // Никаких действий не требуется
                            } else {
                                updateContainerPadding();
                            }
                            adaptSubtitleToLogo();
                        });
                    });
                });
            };
            
            updatePosition();
        };
        
        // НЕ загружаем квизы сразу - дождемся инициализации Frame1 и Frame2
        // loadQuizzes() будет вызван после инициализации Hub
        
        // Меню персонажей будет инициализировано через Frame1

        window.addEventListener('load', () => {

        });

    <script>
        // Инициализация Frame1 и Frame2 после загрузки скриптов
        (function() {
            // Обновление позиции Frame2 при полной загрузке страницы
            window.addEventListener('load', () => {
                if (typeof FrameCommon !== 'undefined') {
                    FrameCommon.updateFrame2Position();
                }
            });
            
            function initHubs() {
                try {
                    // Проверяем, что скрипты загружены
                    if (typeof Frame1 === 'undefined' || typeof Frame2 === 'undefined' || typeof FrameCommon === 'undefined') {
                        console.warn('Hub скрипты еще не загружены, повторная попытка через 100мс...');
                        setTimeout(initHubs, 100);
                        return;
                    }
                    
                    console.log('Инициализация Frame1 и Frame2...');
                    
                    // Инициализация Frame1 с кнопкой "Войти" и "Настройки"
                    Frame1.init({
                        showLogin: true,
                        showSettings: true
                    });
                    
                    // Инициализация Frame2 с логотипом и фразой
                    Frame2.init();
                    
                    // Обновление позиций - ждем полной отрисовки
                    // Используем несколько requestAnimationFrame для гарантии правильной отрисовки
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            requestAnimationFrame(() => {
                                // Обновляем позицию Frame2 относительно Frame1
                                FrameCommon.updateFrame2Position();
                                // Адаптируем размер логотипа
                                FrameCommon.adaptSubtitleToLogo();
                                
                                console.log('Frame1 и Frame2 успешно инициализированы');
                                
                                // Загружаем квизы ПОСЛЕ инициализации Hub
                                // Это гарантирует правильный порядок: Hub -> карточки -> обновление позиции
                                if (typeof loadQuizzes === 'function') {
                                    loadQuizzes();
                                }
                            });
                        });
                    });
                } catch (error) {
                    console.error('Ошибка при инициализации Hub:', error);
                }
            }
            
            // Запускаем инициализацию после загрузки DOM
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => {
                    setTimeout(initHubs, 200);
                });
            } else {
                // Если документ уже загружен, запускаем сразу
                setTimeout(initHubs, 200);
            }
            
            // Обновление при изменении размера окна
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    if (typeof FrameCommon !== 'undefined') {
                        console.log('resize (index.html): обновляем позицию Frame2 и размер логотипа');
                        
                        // Обновляем позицию Frame2 относительно Frame1
                        FrameCommon.updateFrame2Position();
                        // Адаптируем размер логотипа
                        FrameCommon.adaptSubtitleToLogo();
                    }
                }, 100);
            });
        })();
    </script>
