<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квиз - Выбор игры</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Days+One&family=Handlee&family=Kalam:wght@300;400;700&family=Open+Sans:wght@400;500;600;700&family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;600;700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', 'Montserrat', 'Open Sans', sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            background: #F2F2F2; /* Светло-серый фон */
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px 20px;
            position: relative;
            z-index: 2;
            text-align: center;
        }

        /* Общие стили для заголовков */
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Caveat', cursive;
        }

        .main-title {
            margin-bottom: 10px;
            animation: fadeInDown 0.8s ease;
            text-align: center;
        }

        .main-title .hey {
            font-family: 'Days One', sans-serif;
            font-size: 116px;
            font-weight: 700;
            color: #383638;
            display: inline-block;
            transform: rotate(-2deg);
            letter-spacing: 16px;
            text-shadow: 4px 4px 0px #ff7674;
            position: relative;
            text-transform: uppercase;
        }

        /* Буква М с точками над ней */
        .letter-m {
            position: relative;
            display: inline-block;
        }

        /* Зеленая точка (левая) - над левой верхушкой М */
        .letter-m::before {
            content: '';
            position: absolute;
            top: clamp(-3px, -0.4vw, -6px); /* Адаптивная позиция сверху */
            left: 20%;
            transform: translateX(calc(-50% - clamp(3px, 0.5vw, 6px))); /* Адаптивный сдвиг */
            width: clamp(25px, 3vw, 40px); /* Адаптивный размер */
            height: clamp(25px, 3vw, 40px);
            background: #A8E063; /* Лайм-зеленый */
            border-radius: 50%;
            z-index: 10;
            box-shadow: 
                clamp(1.5px, 0.17vw, 2.5px) clamp(0.7px, 0.08vw, 1.2px) 0 0 #000,
                clamp(0.7px, 0.08vw, 1.2px) clamp(1.5px, 0.17vw, 2.5px) 0 0 #000,
                clamp(-0.7px, -0.08vw, -1.2px) clamp(0.7px, 0.08vw, 1.2px) 0 0 #000,
                clamp(0.4px, 0.04vw, 0.6px) clamp(-0.7px, -0.08vw, -1.2px) 0 0 #000,
                clamp(-1.1px, -0.12vw, -1.8px) clamp(0.4px, 0.04vw, 0.6px) 0 0 #000,
                clamp(1.1px, 0.12vw, 1.8px) clamp(-0.4px, -0.04vw, -0.6px) 0 0 #000,
                clamp(-0.4px, -0.04vw, -0.6px) clamp(1.1px, 0.12vw, 1.8px) 0 0 #000;
        }

        /* Розовая точка (правая) - над правой верхушкой М */
        .letter-m::after {
            content: '';
            position: absolute;
            top: clamp(-3px, -0.4vw, -6px); /* Адаптивная позиция сверху */
            left: 70%;
            transform: translateX(calc(-50% + clamp(2px, 0.3vw, 4px))); /* Адаптивный сдвиг */
            width: clamp(25px, 3vw, 40px); /* Адаптивный размер */
            height: clamp(25px, 3vw, 40px);
            background: #FF6B6B; /* Коралловый */
            border-radius: 50%;
            z-index: 10;
            box-shadow: 
                clamp(-1.5px, -0.17vw, -2.5px) clamp(0.7px, 0.08vw, 1.2px) 0 0 #000,
                clamp(-0.7px, -0.08vw, -1.2px) clamp(1.5px, 0.17vw, 2.5px) 0 0 #000,
                clamp(0.7px, 0.08vw, 1.2px) clamp(0.7px, 0.08vw, 1.2px) 0 0 #000,
                clamp(-0.4px, -0.04vw, -0.6px) clamp(-0.7px, -0.08vw, -1.2px) 0 0 #000,
                clamp(1.1px, 0.12vw, 1.8px) clamp(0.4px, 0.04vw, 0.6px) 0 0 #000,
                clamp(-1.1px, -0.12vw, -1.8px) clamp(-0.4px, -0.04vw, -0.6px) 0 0 #000,
                clamp(0.4px, 0.04vw, 0.6px) clamp(1.1px, 0.12vw, 1.8px) 0 0 #000;
        }

        /* Подзаголовок */
        .subtitle {
            font-family: 'Caveat', cursive;
            font-size: 52px;
            color: #383638;
            margin-bottom: 30px;
            font-weight: 400;
            animation: fadeInDown 1s ease;
            text-shadow: none;
            position: relative;
            display: block;
            text-align: center;
        }

        /* Декоративные волнистые элементы */
        .container::before {
            content: '';
            position: absolute;
            top: -50px;
            left: -50px;
            width: 200px;
            height: 200px;
            background: #A8E063; /* Лайм-зеленый */
            border-radius: 50% 40% 60% 30%;
            opacity: 0.4;
            z-index: -1;
            animation: wobble 6s ease-in-out infinite;
        }

        .container::after {
            content: '';
            position: absolute;
            bottom: -80px;
            right: -80px;
            width: 250px;
            height: 250px;
            background: #FF6B6B; /* Коралловый */
            border-radius: 40% 50% 30% 60%;
            opacity: 0.3;
            z-index: -1;
            animation: wobble 8s ease-in-out infinite reverse;
        }

        @keyframes wobble {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(5deg) scale(1.1); }
            50% { transform: rotate(-5deg) scale(0.9); }
            75% { transform: rotate(3deg) scale(1.05); }
        }

        /* Сетка квизов - 3 в ряд */
        .quizzes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Карточки квизов в стиле Teen Talk - светлые с черными контурами */
        .quiz-card {
            background: rgba(245, 245, 245, 0.85); /* Светло-серый фон, полупрозрачный как пластиковый стикер */
            border-radius: 25px;
            padding: 25px 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease, color 0.3s ease;
            border: none;
            box-shadow: 
                0 6px 0px rgba(0, 0, 0, 0.3),
                0 8px 16px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden; /* Ограничиваем кликабельную область рамкой */
            animation: fadeInUp 0.6s ease;
            animation-fill-mode: both;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            min-height: 0;
        }

        /* Пустые карточки (placeholder) - стиль СКОРО */
        .quiz-card.empty {
            background: #FFFFFF; /* Белый фон */
            border: none;
            cursor: pointer;
            box-shadow: 
                0 6px 0px rgba(56, 54, 56, 0.3),
                0 8px 16px rgba(56, 54, 56, 0.1);
            transition: background-color 0.3s ease;
        }

        .quiz-card.empty:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 8px 0px rgba(56, 54, 56, 0.4),
                0 12px 24px rgba(56, 54, 56, 0.15);
            background: rgba(255, 255, 255, 0.9); /* Белый полупрозрачный при наведении */
        }

        .quiz-card.empty:hover .quiz-title,
        .quiz-card.empty:hover .quiz-subtitle,
        .quiz-card.empty:hover .quiz-info-item,
        .quiz-card.empty:hover .quiz-info-item span {
            color: #383638;
            filter: brightness(1.1);
        }

        .quiz-card.empty .quiz-icon {
            display: none;
        }

        .quiz-card.empty .quiz-title {
            color: #383638;
            font-family: 'Days One', sans-serif;
            font-weight: 700;
            font-size: 32px;
            opacity: 1;
            text-transform: uppercase;
        }

        .quiz-card.empty .quiz-subtitle {
            color: #383638;
            font-family: 'Days One', sans-serif;
            font-weight: 400;
            font-size: 26px;
            margin-top: 8px;
            opacity: 1;
        }

        .quiz-card.empty .quiz-description {
            display: none;
        }

        .quiz-card.empty .quiz-info {
            font-family: 'Caveat', cursive;
            font-size: 30px;
            border-top: none;
            padding-top: 0;
        }

        .quiz-card.empty .quiz-info-item {
            font-family: 'Caveat', cursive;
            color: #383638;
        }

        .quiz-card.empty .quiz-info-item span:last-child {
            font-family: 'Caveat', cursive;
            font-weight: 400;
            font-size: 30px;
            color: #383638;
        }

        /* Первый доступный квиз - специальный стиль */
        .quiz-card:not(.empty):nth-child(1) {
            background: rgba(180, 242, 0, 0.85); /* Полупрозрачный как пластиковый стикер */
            border: none;
            box-shadow: 
                0 6px 0px rgba(0, 193, 89, 0.3),
                0 8px 16px rgba(0, 193, 89, 0.1);
        }

        .quiz-card:not(.empty):nth-child(1):hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 8px 0px rgba(0, 193, 89, 0.4),
                0 12px 24px rgba(0, 193, 89, 0.15);
            background: rgba(180, 242, 0, 0.6); /* Полупрозрачный при наведении */
        }

        .quiz-card:not(.empty):nth-child(1):hover .quiz-title,
        .quiz-card:not(.empty):nth-child(1):hover .quiz-subtitle,
        .quiz-card:not(.empty):nth-child(1):hover .quiz-info-item,
        .quiz-card:not(.empty):nth-child(1):hover .quiz-info-item span {
            color: #00C159;
            filter: brightness(1.1);
        }

        .quiz-card:not(.empty):nth-child(1):hover div[style*="Caveat"] {
            filter: brightness(1.1) !important;
        }

        .quiz-card:not(.empty):nth-child(1) .quiz-title {
            color: #00C159;
            font-family: 'Days One', sans-serif;
            font-weight: 700;
            font-size: 28px;
        }

        .quiz-card:not(.empty):nth-child(1) .quiz-subtitle {
            color: #00C159;
            font-family: 'Days One', sans-serif;
            font-weight: 400;
            font-size: 22px;
            margin-top: 8px;
        }

        .quiz-card:not(.empty):nth-child(1) .quiz-divider {
            display: none;
        }

        .quiz-card:not(.empty):nth-child(1) .quiz-icon {
            display: none;
        }

        .quiz-card:not(.empty):nth-child(1) .quiz-info {
            font-family: 'Caveat', cursive;
            font-size: 30px;
            border-top: none;
            padding-top: 0;
        }

        .quiz-card:not(.empty):nth-child(1) .quiz-info-item {
            font-family: 'Caveat', cursive;
            color: #383638;
        }

        .quiz-card:not(.empty):nth-child(1) .quiz-info-item span:last-child {
            font-family: 'Caveat', cursive;
            font-weight: 400;
            font-size: 30px;
        }

        /* SVG иконки в стиле "от руки маркером" */
        .hand-drawn-icon {
            width: 32px;
            height: 32px;
            display: inline-block;
            vertical-align: middle;
        }

        /* Вторая карточка - специальный стиль желтый */
        .quiz-card:not(.empty):nth-child(2) {
            background: rgba(255, 213, 0, 0.85); /* Ярко-желтый полупрозрачный как пластиковый стикер */
            border: none;
            box-shadow: 
                0 6px 0px rgba(204, 170, 0, 0.3),
                0 8px 16px rgba(204, 170, 0, 0.1);
        }

        .quiz-card:not(.empty):nth-child(2):hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 8px 0px rgba(204, 170, 0, 0.4),
                0 12px 24px rgba(204, 170, 0, 0.15);
            background: rgba(255, 213, 0, 0.6); /* Ярко-желтый полупрозрачный при наведении */
        }

        .quiz-card:not(.empty):nth-child(2):hover .quiz-title,
        .quiz-card:not(.empty):nth-child(2):hover .quiz-subtitle,
        .quiz-card:not(.empty):nth-child(2):hover .quiz-info-item,
        .quiz-card:not(.empty):nth-child(2):hover .quiz-info-item span {

            filter: brightness(1.1);
        }

        .quiz-card:not(.empty):nth-child(2):hover div[style*="Caveat"] {
            filter: brightness(1.1) !important;
        }

        .quiz-card:not(.empty):nth-child(2) .quiz-title {
            color: #ff7664;
            font-family: 'Days One', sans-serif;

            font-size: 28px;
        }

        .quiz-card:not(.empty):nth-child(2) .quiz-subtitle {
            color: #ff7664;
            font-family: 'Days One', sans-serif;
            font-weight: 400;
            font-size: 22px;
            margin-top: 8px;
        }

        }

        .quiz-card:not(.empty):nth-child(2) .quiz-icon {
            display: none;
        }

        .quiz-card:not(.empty):nth-child(2) .quiz-info {

            font-size: 30px;
            border-top: none;
            padding-top: 0;
        }

        .quiz-card:not(.empty):nth-child(2) .quiz-info-item {
            font-family: 'Caveat', cursive;

        }

        .quiz-card:not(.empty):nth-child(2) .quiz-info-item span:last-child {
            font-family: 'Caveat', cursive;
            font-weight: 400;
            font-size: 30px;
        }

        /* Третья карточка - специальный стиль розовый (ТЕСТ-МЕЛОМАН) */
        .quiz-card:not(.empty):nth-child(3) {
            background: rgba(255, 147, 239, 0.85); /* Розовый полупрозрачный как пластиковый стикер */
            border: none;
            box-shadow: 
                0 6px 0px rgba(204, 118, 191, 0.3),
                0 8px 16px rgba(204, 118, 191, 0.1);
        }

        .quiz-card:not(.empty):nth-child(3):hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 8px 0px rgba(204, 118, 191, 0.4),
                0 12px 24px rgba(204, 118, 191, 0.15);
            background: rgba(255, 147, 239, 0.6); /* Розовый полупрозрачный при наведении */
        }

        .quiz-card:not(.empty):nth-child(3):hover .quiz-title,
        .quiz-card:not(.empty):nth-child(3):hover .quiz-subtitle,
        .quiz-card:not(.empty):nth-child(3):hover .quiz-info-item,
        .quiz-card:not(.empty):nth-child(3):hover .quiz-info-item span {
            color: #9867f9;
            filter: brightness(1.1);
        }

        .quiz-card:not(.empty):nth-child(3):hover div[style*="Caveat"] {
            filter: brightness(1.1) !important;
        }

        .quiz-card:not(.empty):nth-child(3) .quiz-title {
            color: #9867f9;
            font-family: 'Days One', sans-serif;
            font-weight: 700;
            font-size: 28px;
        }

        .quiz-card:not(.empty):nth-child(3) .quiz-subtitle {
            color: #9867f9;
            font-family: 'Days One', sans-serif;
            font-weight: 400;
            font-size: 22px;
            margin-top: 8px;
        }

        .quiz-card:not(.empty):nth-child(3) .quiz-divider {
            display: none;
        }

        .quiz-card:not(.empty):nth-child(3) .quiz-icon {
            display: none;
        }

        .quiz-card:not(.empty):nth-child(3) .quiz-info {

            font-size: 30px;

            padding-top: 0;
        }

        .quiz-card:not(.empty):nth-child(3) .quiz-info-item {

        }

        .quiz-card:not(.empty):nth-child(3) .quiz-info-item span:last-child {
            font-family: 'Caveat', cursive;
            font-weight: 400;
            font-size: 24px;
        }

        /* Четвертая карточка (Тест-меломан) - фиолетовый стиль из брендбука */
        .quiz-card:not(.empty):nth-child(4) {
            background: linear-gradient(135deg, rgba(152, 103, 249, 0.25), rgba(204, 118, 191, 0.25)) !important;
            border: 2px solid rgba(152, 103, 249, 0.5) !important;
            box-shadow: 
                0 4px 0px rgba(152, 103, 249, 0.3),
                0 6px 12px rgba(152, 103, 249, 0.2);
        }

        .quiz-card:not(.empty):nth-child(4):hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 8px 0px rgba(152, 103, 249, 0.4),
                0 12px 24px rgba(152, 103, 249, 0.15);
            background: rgba(152, 103, 249, 0.35) !important;
        }

        .quiz-card:not(.empty):nth-child(4):hover .quiz-title,
        .quiz-card:not(.empty):nth-child(4):hover .quiz-subtitle,
        .quiz-card:not(.empty):nth-child(4):hover .quiz-info-item,
        .quiz-card:not(.empty):nth-child(4):hover .quiz-info-item span {
            color: #9867f9;
            filter: brightness(1.1);
        }

        .quiz-card:not(.empty):nth-child(4):hover div[style*="Caveat"] {
            filter: brightness(1.1) !important;
        }

        .quiz-card:not(.empty):nth-child(4) .quiz-title {
            color: #9867f9;
            font-family: 'Days One', sans-serif;
            font-weight: 700;
            font-size: 28px;
        }

        .quiz-card:not(.empty):nth-child(4) .quiz-subtitle {
            color: #9867f9;
            font-family: 'Days One', sans-serif;
            font-weight: 400;
            font-size: 22px;
            margin-top: 8px;
        }

        .quiz-card:not(.empty):nth-child(4) .quiz-divider {
            display: none;
        }

        .quiz-card:not(.empty):nth-child(4) .quiz-icon {
            display: none;
        }

        .quiz-card:not(.empty):nth-child(4) .quiz-info {
            font-family: 'Caveat', cursive;
            font-size: 30px;
            border-top: none;
            padding-top: 0;
        }

        .quiz-card:not(.empty):nth-child(4) .quiz-info-item {
            font-family: 'Caveat', cursive;
            color: #383638;
        }

        .quiz-card:not(.empty):nth-child(4) .quiz-info-item span:last-child {
            font-family: 'Caveat', cursive;
            font-weight: 400;
            font-size: 24px;
        }

        /* Все карточки кроме первой, второй, третьей и четвертой - единый стиль */
        .quiz-card:not(.empty):nth-child(n+5) {
            background: #FFFFFF !important; /* Белый фон */
            border: none !important;
        }

        .quiz-card:not(.empty):nth-child(n+5):hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 8px 0px rgba(56, 54, 56, 0.4),
                0 12px 24px rgba(56, 54, 56, 0.15);
            background: rgba(255, 255, 255, 0.9) !important; /* Белый полупрозрачный при наведении */
        }

        .quiz-card:not(.empty):nth-child(3):hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 8px 0px rgba(0, 0, 0, 0.4),
                0 12px 24px rgba(0, 0, 0, 0.15);
            background: rgba(255, 255, 255, 0.9) !important; /* Чуть полупрозрачный при наведении */
        }

        .quiz-card:not(.empty):nth-child(n+5):hover .quiz-title,
        .quiz-card:not(.empty):nth-child(n+5):hover .quiz-subtitle,
        .quiz-card:not(.empty):nth-child(n+5):hover .quiz-info-item,
        .quiz-card:not(.empty):nth-child(n+5):hover .quiz-info-item span {
            color: #383638;
            filter: brightness(1.1);
        }

        .quiz-card:not(.empty):nth-child(n+5) .quiz-title {
            color: #383638 !important;
            font-family: 'Days One', sans-serif !important;
            font-weight: 700 !important;
            font-size: 28px !important;
        }

        .quiz-card:not(.empty):nth-child(n+5) .quiz-subtitle {
            color: #383638 !important;
            font-family: 'Days One', sans-serif !important;
            font-weight: 400 !important;
            font-size: 22px !important;
            margin-top: 8px !important;
        }

        .quiz-card:not(.empty):nth-child(n+4) .quiz-info-item {

        .quiz-card:not(.empty):nth-child(n+4) .quiz-info-item span {

        .quiz-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3), transparent);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .quiz-card:hover::before {
            opacity: 1;
        }

        .quiz-card:not(.empty):hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow:

    </div>

    <script>
        // Персонажи - кусочки пазлов (8 штук для квадрата 4x2)
        const characters = [
            { id: 'happy', name: 'Радость', color: '#A8E6CF', position: 0, emotion: 'happy' }, // Светлый бирюзовый/мятно-зеленый (главный - не меняем)
            { id: 'wink', name: 'Подмигивашка', color: '#FFB3D9', position: 1, emotion: 'wink' }, // Пастельный розовый (в тон #FF7664)
            { id: 'smile', name: 'Улыбка', color: '#D4F5A0', position: 2, emotion: 'smile' }, // Пастельный лайм-зеленый (в тон #B4F200)
            { id: 'grumpy', name: 'Хмурик', color: '#B3E5FC', position: 3, emotion: 'grumpy' }, // Пастельный голубой
            { id: 'sad', name: 'Грустинка', color: '#FFE082', position: 4, emotion: 'sad' }, // Пастельный желтый (в тон #f9db75)
            { id: 'surprised', name: 'Удивлёнка', color: '#CE93D8', position: 5, emotion: 'surprised' }, // Лавандовый
            { id: 'laugh', name: 'Смешинка', color: '#FFAB91', position: 6, emotion: 'laugh' }, // Пастельный коралловый (в тон #FF7664)
            { id: 'thoughtful', name: 'Думалка', color: '#F48FB1', position: 7, emotion: 'thoughtful' } // Более сочный розовый
        ];

        let selectedCharacterId = 'happy';

        // Вспомогательные функции для создания SVG элементов
        function createCircle(cx, cy, r) {
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', cx);
            circle.setAttribute('cy', cy);
            circle.setAttribute('r', r);
            circle.setAttribute('fill', '#000');
            circle.setAttribute('stroke', 'none');
            return circle;
        }

        function createPath(d) {
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', d);
            return path;
        }

        // Создание рожицы в стиле маркера (как на референсе)
        function createFace(emotion) {
            const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            group.setAttribute('stroke', '#000');
            group.setAttribute('stroke-width', '6');
            group.setAttribute('fill', 'none');
            group.setAttribute('stroke-linecap', 'round');
            group.setAttribute('stroke-linejoin', 'round');
            
            switch(emotion) {
                case 'happy':
                case 'wink':
                case 'smile':
                case 'grumpy':
                case 'sad':
                case 'surprised':
                case 'laugh':
                case 'thoughtful':
                default:
                    // Одинаковая мордочка для всех: 2 глаза и улыбающийся рот
                    group.appendChild(createCircle(35, 35, 4)); // Левый глаз - точка
                    group.appendChild(createCircle(65, 35, 4)); // Правый глаз - точка
                    group.appendChild(createPath('M 30 58 Q 50 68 70 58')); // Улыбающийся рот
                    break;
            }
            
            return group;
        }

        // Функция для создания SVG персонажа - простой круг
        function createCharacterSVG(color, emotion, position, size = 100) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', size);
            svg.setAttribute('height', size);
            svg.setAttribute('viewBox', '-10 -10 120 120'); // Расширенный viewBox для волос, выходящих за границы
            svg.setAttribute('overflow', 'visible');
            
            // Простой круг
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', '50');
            circle.setAttribute('cy', '50');
            circle.setAttribute('r', '45');
            circle.setAttribute('fill', color);
            svg.appendChild(circle);
            
            // Рожица в стиле маркера (Caveat) - центрируем в круге
            const face = createFace(emotion);
            // Лицо уже центрировано в координатах 0-100, просто добавляем его
            svg.appendChild(face);
            
            return svg;
        }

        // Инициализация меню персонажей
        function initCharacterMenu() {
            const menuButton = document.getElementById('character-menu-button');
            const menuDropdown = document.getElementById('character-menu-dropdown');
            const selectedCharacterSVG = document.getElementById('selected-character');
            
            // Устанавливаем персонажа по умолчанию
            const defaultChar = characters.find(c => c.id === selectedCharacterId);
            if (defaultChar) {
                const svg = createCharacterSVG(defaultChar.color, defaultChar.emotion, defaultChar.position, 50);
                selectedCharacterSVG.innerHTML = svg.innerHTML;
                // Устанавливаем цвет фона кнопки
                menuButton.style.background = defaultChar.color;
            }
            
            // Создаем список персонажей
            characters.forEach(char => {
                const option = document.createElement('div');
                option.className = 'character-option' + (char.id === selectedCharacterId ? ' selected' : '');
                option.dataset.characterId = char.id;
                
                const preview = document.createElement('div');
                preview.className = 'character-preview';
                const charSVG = createCharacterSVG(char.color, char.emotion, char.position, 40);
                preview.appendChild(charSVG);
                
                option.appendChild(preview);
                
                option.addEventListener('click', () => {
                    selectedCharacterId = char.id;
                    const newSVG = createCharacterSVG(char.color, char.emotion, char.position, 50);
                    selectedCharacterSVG.innerHTML = newSVG.innerHTML;
                    
                    // Обновляем цвет фона кнопки
                    menuButton.style.background = char.color;
                    
                    // Обновляем выделение
                    document.querySelectorAll('.character-option').forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    option.classList.add('selected');
                    
                    // Закрываем меню
                    menuDropdown.classList.remove('active');
                    menuButton.classList.remove('active');
                    
                    // Сохраняем выбор в localStorage
                    localStorage.setItem('selectedCharacter', char.id);
                });
                
                menuDropdown.appendChild(option);
            });
            
            // Функция переключения меню
            function toggleMenu() {
                menuDropdown.classList.toggle('active');
                menuButton.classList.toggle('active');
            }
            
            // Обработчик клика на кнопку (мордочку)
            menuButton.addEventListener('click', (e) => {
                e.stopPropagation();
                toggleMenu();
            });
            
            // Обработчик клика на стрелку
            const menuArrow = document.getElementById('character-menu-arrow');
            if (menuArrow) {
                menuArrow.addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleMenu();
                });
            }
            
            // Закрытие при клике вне меню
            document.addEventListener('click', (e) => {
                const menuArrow = document.getElementById('character-menu-arrow');
                if (!menuButton.contains(e.target) && 
                    !menuDropdown.contains(e.target) && 
                    (!menuArrow || !menuArrow.contains(e.target))) {
                    menuDropdown.classList.remove('active');
                    menuButton.classList.remove('active');
                }
            });
            
            // Загружаем сохраненный выбор
            const savedChar = localStorage.getItem('selectedCharacter');
            if (savedChar && characters.find(c => c.id === savedChar)) {
                selectedCharacterId = savedChar;
                const savedCharData = characters.find(c => c.id === savedChar);
                const svg = createCharacterSVG(savedCharData.color, savedCharData.emotion, savedCharData.position, 50);
                selectedCharacterSVG.innerHTML = svg.innerHTML;
                // Устанавливаем цвет фона кнопки
                menuButton.style.background = savedCharData.color;
            }
        }

        // Загрузка списка квизов
        async function loadQuizzes() {
            try {
                const response = await fetch('/api/quizzes');
                if (!response.ok) {
                    throw new Error('Ошибка загрузки квизов');
                }
                const quizzes = await response.json();
                displayQuizzes(quizzes);
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Не удалось загрузить квизы. Убедитесь, что сервер запущен.';
            }
        }

                        `;
                    } else if (i === 3) {
                        // Специальный стиль для четвертой карточки (Меломан)
                        // Иконка вопроса - маркерный шрифт
                        const questionIcon = `<svg class="hand-drawn-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                            <text x="20" y="32" 
                                  font-family="Kalam, cursive" 
                                  font-size="36" 
                                  font-weight="700"
                                  fill="#383638" 
                                  text-anchor="middle">?</text>
                        </svg>`;
                        
                        // SVG иконка часов "от руки маркером" - рисованные часы
                        const clockIcon = `<svg class="hand-drawn-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                            <path d="M 16 6 Q 11 6, 7 10 Q 5.5 11.5, 5.5 16 Q 5.5 20.5, 9 24 Q 10.5 25.5, 16 25.5 Q 21.5 25.5, 25 22 Q 26.5 20.5, 26.5 16 Q 26.5 11.5, 23 8 Q 21.5 6.5, 16 6" 
                                  stroke="#383638" stroke-width="4" fill="none" 
                                  stroke-linecap="round" stroke-linejoin="round"/>
                            <!-- Часовая стрелка (вверх) -->
                            <line x1="16" y1="16" x2="16" y2="10" 
                                  stroke="#383638" stroke-width="3.5" 
                                  stroke-linecap="round"/>
                            <!-- Минутная стрелка (вправо) -->
                            <line x1="16" y1="16" x2="21" y2="21" 
                                  stroke="#383638" stroke-width="3.5" 
                                  stroke-linecap="round"/>
                        </svg>`;

                        cardHTML = `
                            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; min-height: 0; width: 100%;">
                                <div class="quiz-title">ТЕСТ-МЕЛОМАН</div>
                                <div class="quiz-subtitle">угадай мелодию</div>
                                <div style="font-family: 'Caveat', cursive; font-size: 22px; color: #ff7664; margin: 10px 0; text-align: center; transform: rotate(-1deg);">музыка нааас связала</div>
                            </div>
                            <div class="quiz-info">
                                <div class="quiz-info-item">
                                    ${questionIcon}
                                    <span>10</span>
                                </div>
                                <div class="quiz-info-item">
                                    ${clockIcon}
                                    <span>30 сек.</span>
                                </div>
                            </div>
                        `;
                    } else {
                        const descriptionHTML = description ? `<div class="quiz-description">${description}</div>` : '';
                        
                        // Вычисляем уровень песка внизу на основе времени квиза
                        const timeSeconds = avgTime || 0;
                        const maxTime = 60;
                        const sandLevel = Math.min((timeSeconds / maxTime) * 100, 100);
                        const bottomSandTop = 24 - (9 * (sandLevel / 100)); // Верхняя граница песка внизу (чем больше времени, тем ниже граница)
                        
                        // SVG иконка песочных часов "от руки маркером"
                        const clockIconSVG = `<svg class="hand-drawn-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                            <!-- Верхняя часть песочных часов -->
                            <path d="M 8 4 Q 8 4, 8 8 Q 8 10, 10 12 Q 12 13, 16 13 Q 20 13, 22 12 Q 24 10, 24 8 Q 24 4, 24 4" 
                                  stroke="#383638" stroke-width="3.5" fill="none" 
                                  stroke-linecap="round" stroke-linejoin="round"/>
                            <!-- Узкая часть (горлышко) -->
                            <path d="M 10 13 Q 13 14, 16 14.5 Q 19 14, 22 13" 
                                  stroke="#383638" stroke-width="3.5" fill="none" 
                                  stroke-linecap="round" stroke-linejoin="round"/>
                            <!-- Нижняя часть песочных часов -->
                            <path d="M 8 15 Q 8 15, 8 19 Q 8 21, 10 23 Q 12 24, 16 24 Q 20 24, 22 23 Q 24 21, 24 19 Q 24 15, 24 15" 
                                  stroke="#383638" stroke-width="3.5" fill="none" 
                                  stroke-linecap="round" stroke-linejoin="round"/>
                            <!-- Песок внизу (уровень зависит от времени) -->
                            <path d="M 8 15 Q 8 19, 10 21 Q 12 22, 16 22 Q 20 22, 22 21 Q 24 19, 24 15 L 24 ${bottomSandTop} Q 22 ${bottomSandTop + 2}, 20 ${bottomSandTop + 3} Q 18 ${bottomSandTop + 4}, 16 ${bottomSandTop + 4} Q 14 ${bottomSandTop + 4}, 12 ${bottomSandTop + 3} Q 10 ${bottomSandTop + 2}, 8 ${bottomSandTop} Z" 
                                  fill="#383638" opacity="0.7"/>
                            <!-- Песок вверху (остаток) -->
                            <path d="M 8 4 Q 8 8, 10 10 Q 12 11, 16 11 Q 20 11, 22 10 Q 24 8, 24 4 L 24 8 Q 22 10, 20 11 Q 18 12, 16 12 Q 14 12, 12 11 Q 10 10, 8 8 Z" 
                                  fill="#383638" opacity="0.3"/>
                        </svg>`;
                        
                        cardHTML = `
                            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; min-height: 0; width: 100%;">
                    <span class="quiz-icon">${icon}</span>
                    <div class="quiz-title">${quiz.name}</div>
                                ${descriptionHTML}
                            </div>
                    <div class="quiz-info">
                        <div class="quiz-info-item">
                            <span class="quiz-info-icon">❓</span>
                            <span>${questionCount} вопросов</span>
                        </div>
                        <div class="quiz-info-item">
                                    ${clockIconSVG}
                            <span>~${avgTime} сек</span>
                        </div>
                            </div>
                        `;
                    }
                    
                    card.innerHTML = cardHTML;

                    grid.appendChild(card);
                } else {
                    // Пустой слот (placeholder)
                    const card = document.createElement('div');
                    card.className = 'quiz-card empty';
                    card.style.animationDelay = (i * 0.1) + 's';

                    // Иконка вопроса - маркерный шрифт (как в первом квизе)
                    const questionIcon = `<svg class="hand-drawn-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                        <text x="20" y="32" 
                              font-family="Kalam, cursive" 
                              font-size="36" 
                              font-weight="700"
                              fill="#383638" 
                              text-anchor="middle">?</text>
                    </svg>`;
                    
                    // SVG иконка часов "от руки маркером" - рисованные часы (как в первом квизе)
                    const clockIcon = `<svg class="hand-drawn-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                        <path d="M 16 6 Q 11 6, 7 10 Q 5.5 11.5, 5.5 16 Q 5.5 20.5, 9 24 Q 10.5 25.5, 16 25.5 Q 21.5 25.5, 25 22 Q 26.5 20.5, 26.5 16 Q 26.5 11.5, 23 8 Q 21.5 6.5, 16 6" 
                              stroke="#383638" stroke-width="4" fill="none" 
                              stroke-linecap="round" stroke-linejoin="round"/>
                        <!-- Часовая стрелка (вверх) -->
                        <line x1="16" y1="16" x2="16" y2="10" 
                              stroke="#383638" stroke-width="3.5" 
                              stroke-linecap="round"/>
                        <!-- Минутная стрелка (вправо) -->
                        <line x1="16" y1="16" x2="21" y2="21" 
                              stroke="#383638" stroke-width="3.5" 
                              stroke-linecap="round"/>
                    </svg>`;

                    card.innerHTML = `
                        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; min-height: 0; width: 100%;">
                            <div class="quiz-title">СКОРО</div>
                            <div class="quiz-subtitle">новый тест здесь</div>
                        </div>
                        <div class="quiz-info">
                            <div class="quiz-info-item">
                                ${questionIcon}
                                <span>...</span>
                            </div>
                            <div class="quiz-info-item">
                                ${clockIcon}
                                <span>...</span>
                            </div>
                        </div>
                    `;

                    // Пустые карточки тоже открывают гифки
                    card.addEventListener('click', () => {
                        // Открываем страницу Gifer с тегом "ожидаю"
                        const giferUrl = 'https://gifer.com/ru/s/%D0%BE%D0%B6%D0%B8%D0%B4%D0%B0%D1%8E';
                        // Создаем временную ссылку для открытия в новой вкладке
                        const link = document.createElement('a');
                        link.href = giferUrl;
                        link.target = '_blank';
                        link.rel = 'noopener noreferrer';
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    });

                    grid.appendChild(card);
                }
            }
        }

        // Загружаем квизы при загрузке страницы
        loadQuizzes();
        
        // Инициализируем меню персонажей
        initCharacterMenu();
    </script>

</body>
</html>
