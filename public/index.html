<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квиз - Выбор игры</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Days+One&family=Kalam:wght@300;400;700&family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            background: #f2f2f2; /* Новый фон */
        }
        
        /* HUB стили */
        .hub {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #f2f2f2; /* Цвет основного фона сайта */
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            z-index: 1000;
            border-bottom: none;
            box-shadow: none;
            width: 100%;
            overflow: visible; /* Разрешаем видимость всего содержимого, включая фразу */
            min-height: 240px; /* Минимальная высота для размещения логотипа и фразы */
        }

        .hub-content {
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            position: relative;
        }

        /* Секция с логотипом и фразой */
        .hub-logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            left: 50%;
            top: 40px;
            transform: translateX(-50%);
            gap: 5px;
            pointer-events: none;
            width: 100%; /* Полная ширина для центрирования */
            max-width: 100%; /* Ограничиваем максимальную ширину */
            padding: 0 20px; /* Отступы по бокам для предотвращения обрезания */
            box-sizing: border-box;
        }
        
        .hub-logo-section * {
            pointer-events: auto;
        }

        .hub-logo-section .logo {
            max-width: 100%;
            height: auto;
            max-height: 150px;
            width: auto;
            transform: rotate(-2deg);
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        .hub-logo-section .subtitle {
            font-family: 'Caveat', cursive;
            font-size: clamp(33.6px, 6.3vw, 50.4px); /* Увеличение на 40% */
            color: #393639;
            margin: 0;
            font-weight: 400;
            line-height: 1.2;
            white-space: nowrap;
            overflow: visible; /* Разрешаем видимость всей фразы */
            text-overflow: clip; /* Не обрезаем текст */
            max-width: 100%; /* Ограничиваем ширину */
        }

        .hub-actions {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }

        .hub-button {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(245, 245, 245, 0.85);
            border: 2px solid #393639;
            border-radius: 12px;
            color: #393639;
            text-decoration: none;
            font-family: 'Days One', sans-serif;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.3s;
            box-shadow: 
                0 2px 0px rgba(0, 0, 0, 0.2),
                0 4px 8px rgba(0, 0, 0, 0.1);
            white-space: nowrap;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .hub-button:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 0px rgba(0, 0, 0, 0.3),
                0 8px 16px rgba(0, 0, 0, 0.15);
            background: rgba(245, 245, 245, 0.6);
        }
        
        .hub-button:active {
            transform: translateY(0px);
        }
        
        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px 20px;
            /* padding-top устанавливается динамически через JavaScript */
            position: relative;
            z-index: 2;
            text-align: center;
        }
        
        /* Отдельный блок для карточек квизов под HUB */
        .quizzes-section {
            width: 100%;
            margin: 0 auto;
            padding: 0 20px 20px; /* padding-top устанавливается динамически через JavaScript */
            position: relative;
            z-index: 2;
            text-align: center;
        }
        
        .quizzes-section .container {
            padding: 0;
        }

        /* Общие стили для заголовков */
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Caveat', cursive;
        }

        .main-title {
            margin-bottom: 10px;
            animation: fadeInDown 0.8s ease;
            text-align: center;
        }

        /* Адаптивная ширина HUB */
        @media (min-width: 1024px) {
            .hub {
                padding: 20px 40px;
                min-height: 260px; /* Увеличиваем минимальную высоту на широких экранах для размещения логотипа и фразы */
                overflow: visible; /* Разрешаем видимость всего содержимого */
            }
            
            .hub-content {
                max-width: 1400px;
                margin: 0 auto;
                justify-content: space-between;
                position: relative;
                min-height: 240px; /* Минимальная высота для размещения логотипа и фразы */
            }
            
            .hub-logo-section {
                position: absolute;
                left: 50%;
                top: 40px;
                transform: translateX(-50%);
                display: flex;
                justify-content: center;
                align-items: center;
                max-width: calc(100% - 80px); /* Учитываем padding контейнера */
                width: auto;
                padding: 0 20px; /* Отступы по бокам */
                box-sizing: border-box;
            }
            
            .hub-logo-section .logo {
                max-height: 150px;
            }
            
            .hub-logo-section .subtitle {
                font-size: clamp(33.6px, 6.3vw, 50.4px); /* Увеличение на 40% */
                white-space: nowrap;
                overflow: visible;
                text-overflow: clip;
            }
            
            .hub-actions {
                order: 3;
                flex-shrink: 0;
            }
            
            /* padding-top устанавливается динамически через JavaScript */
        }

        /* Очень широкие экраны - дополнительная защита от обрезания фразы */
        @media (min-width: 1920px) {
            .hub {
                min-height: 280px; /* Еще больше высоты для очень широких экранов */
            }
            
            .hub-content {
                min-height: 260px;
            }
            
            .hub-logo-section {
                max-width: calc(100% - 120px); /* Больше отступы для очень широких экранов */
            }
            
            .hub-logo-section .subtitle {
                font-size: clamp(33.6px, 4vw, 60px); /* Ограничиваем максимальный размер на очень широких экранах */
            }
        }

        @media (max-width: 1023px) and (min-width: 769px) {
            .hub {
                padding: 15px 30px;
            }
            
            .hub-content {
                max-width: 100%;
            }
            
            .hub-logo-section {
                position: absolute;
                left: 50%;
                top: 30px;
                transform: translateX(-50%);
            }
            
            .hub-logo-section .logo {
                max-height: 120px;
            }
            
            .hub-logo-section .subtitle {
                font-size: clamp(33.6px, 6.3vw, 50.4px); /* Увеличение на 40% */
            }
            
            .hub-actions {
                order: 3;
                flex-shrink: 0;
            }
            
            /* padding-top устанавливается динамически через JavaScript */
        }

        @media (max-width: 768px) {
            .hub {
                padding: 12px 20px;
            }
            
            .hub-content {
                max-width: 100%;
                justify-content: center;
            }
            
            .hub-logo-section {
                position: static;
                transform: none;
                flex: 1 1 100%;
                order: 1;
                width: 100%;
            }
            
            .hub-logo-section .logo {
                max-height: 80px;
            }
            
            .hub-logo-section .subtitle {
                font-size: clamp(26.88px, 5.04vw, 40.32px); /* Уменьшение на 20% от увеличенного размера */
            }
            
            .hub-actions {
                order: 2;
                margin: 10px auto 0;
            }
            
            /* padding-top устанавливается динамически через JavaScript */
        }

        @media (max-width: 480px) {
            .hub {
                padding: 10px 15px;
            }
            
            .hub-logo-section .logo {
                max-height: 60px;
            }
            
            .hub-logo-section .subtitle {
                font-size: clamp(26.88px, 5.04vw, 40.32px); /* Уменьшение на 20% от увеличенного размера */
            }
            
            /* padding-top устанавливается динамически через JavaScript */
        }

        /* Декоративные волнистые элементы */
        .quizzes-section::before {
            content: '';
            position: absolute;
            /* top устанавливается динамически через JavaScript */
            left: -50px;
            width: 200px;
            height: 200px;
            background: #d6fbbf; /* Парящий элемент */
            border-radius: 50% 40% 60% 30%;
            opacity: 0.9;
            z-index: -1;
            animation: wobble 6s ease-in-out infinite;
            pointer-events: none;
        }

        .quizzes-section::after {
            content: '';
            position: absolute;
            bottom: -80px;
            right: -80px;
            width: 250px;
            height: 250px;
            background: #fececd; /* Парящий элемент */
            border-radius: 40% 50% 30% 60%;
            opacity: 0.9;
            z-index: -1;
            animation: wobble 8s ease-in-out infinite reverse;
            pointer-events: none;
        }

        @keyframes wobble {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(5deg) scale(1.1); }
            50% { transform: rotate(-5deg) scale(0.9); }
            75% { transform: rotate(3deg) scale(1.05); }
        }

        /* Сетка квизов - 3 в ряд */
        .quizzes-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Карточки квизов в стиле Teen Talk - светлые с черными контурами */
        .quiz-card {
            background: rgba(245, 245, 245, 0.85); /* Светло-серый фон, полупрозрачный как пластиковый стикер */
            border-radius: 25px;
            padding: 25px 20px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease, color 0.3s ease;
            border: none;
            box-shadow: 
                0 6px 0px rgba(0, 0, 0, 0.15),
                0 8px 16px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden; /* Ограничиваем кликабельную область рамкой */
            animation: fadeInUp 0.6s ease;
            animation-fill-mode: both;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            min-height: 0;
        }

        /* Первый доступный квиз - специальный стиль (зеленая карточка) */
        .quiz-card:nth-child(1) {
            background: #abf67c; /* Новый зеленый фон */
            border: none;
            box-shadow: 
                0 6px 0px rgba(47, 185, 93, 0.3),
                0 8px 16px rgba(47, 185, 93, 0.1);
        }

        .quiz-card:nth-child(1):hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 8px 0px rgba(0, 0, 0, 0.2),
                0 12px 24px rgba(0, 0, 0, 0.15);
            background: rgba(171, 246, 124, 0.9);
        }

        .quiz-card:nth-child(1):hover .quiz-title,
        .quiz-card:nth-child(1):hover .quiz-subtitle,
        .quiz-card:nth-child(1):hover .quiz-info-item,
        .quiz-card:nth-child(1):hover .quiz-info-item span {
            color: #373639;
            filter: brightness(1.1);
        }

        .quiz-card:nth-child(1):hover div[style*="Caveat"] {
            filter: brightness(1.1) !important;
        }

        .quiz-card:nth-child(1) .quiz-title {
            color: #373639;
            font-family: 'Days One', sans-serif;
            font-weight: 700;
            font-size: 28px;
        }

        .quiz-card:nth-child(1) .quiz-subtitle {
            color: #373639;
            font-family: 'Days One', sans-serif;
            font-weight: 400;
            font-size: 22px;
            margin-top: 8px;
        }

        .quiz-card:nth-child(1) .quiz-divider {
            display: none;
        }

        .quiz-card:nth-child(1) .quiz-icon {
            display: none;
        }

        .quiz-card:nth-child(1) .quiz-info {
            font-family: 'Caveat', cursive;
            font-size: 30px;
            border-top: none;
            padding-top: 0;
        }

        .quiz-card:nth-child(1) .quiz-info-item {
            font-family: 'Caveat', cursive;
            color: #393639;
        }

        .quiz-card:nth-child(1) .quiz-info-item span:last-child {
            font-family: 'Caveat', cursive;
            font-weight: 400;
            font-size: 30px;
        }
        
        /* Цвет Caveat фраз на зеленой карточке */
        .quiz-card:nth-child(1) div[style*="Caveat"] {
            color: #354fba !important;
        }

        /* SVG иконки в стиле "от руки маркером" */
        .hand-drawn-icon {
            width: 32px;
            height: 32px;
            display: inline-block;
            vertical-align: middle;
        }


        /* Вторая карточка - розовый стиль */
        .quiz-card:nth-child(2) {
            background: #f68a7c; /* Розовый фон */
            border: none;
            box-shadow: 
                0 6px 0px rgba(250, 87, 52, 0.3),
                0 8px 16px rgba(250, 87, 52, 0.1);
        }

        .quiz-card:nth-child(2):hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 8px 0px rgba(0, 0, 0, 0.2),
                0 12px 24px rgba(0, 0, 0, 0.15);
            background: rgba(246, 138, 124, 0.9);
        }

        .quiz-card:nth-child(2):hover .quiz-title,
        .quiz-card:nth-child(2):hover .quiz-subtitle,
        .quiz-card:nth-child(2):hover .quiz-info-item,
        .quiz-card:nth-child(2):hover .quiz-info-item span {
            color: #373639;
            filter: brightness(1.1);
        }

        .quiz-card:nth-child(2):hover div[style*="Caveat"] {
            filter: brightness(1.1) !important;
        }

        .quiz-card:nth-child(2) .quiz-title {
            color: #373639;
            font-family: 'Days One', sans-serif;
            font-weight: 700;
            font-size: 28px;
        }

        .quiz-card:nth-child(2) .quiz-subtitle {
            color: #373639;
            font-family: 'Days One', sans-serif;
            font-weight: 400;
            font-size: 22px;
            margin-top: 8px;
        }

        .quiz-card:nth-child(2) .quiz-divider {
            display: none;
        }

        .quiz-card:nth-child(2) .quiz-icon {
            display: none;
        }

        .quiz-card:nth-child(2) .quiz-info {
            font-family: 'Caveat', cursive;
            font-size: 30px;
            border-top: none;
            padding-top: 0;
        }

        .quiz-card:nth-child(2) .quiz-info-item {
            font-family: 'Caveat', cursive;
            color: #393639;
        }

        .quiz-card:nth-child(2) .quiz-info-item span:last-child {
            font-family: 'Caveat', cursive;
            font-weight: 400;
            font-size: 24px;
        }
        
        /* Цвет Caveat фраз на розовой карточке */
        .quiz-card:nth-child(2) div[style*="Caveat"] {
            color: #354fba !important;
        }

            font-family: 'Days One', sans-serif !important;
            font-weight: 700 !important;
            font-size: 28px !important;
        }

        .quiz-card:nth-child(n+3) .quiz-title {
            color: #373639 !important;
            font-family: 'Days One', sans-serif !important;
            font-weight: 700 !important;
            font-size: 28px !important;
        }

        .quiz-card:nth-child(n+3) .quiz-subtitle {
            color: #373639 !important;
            font-family: 'Days One', sans-serif !important;
            font-weight: 400 !important;
            font-size: 22px !important;
            margin-top: 8px !important;
        }

        .quiz-card:nth-child(n+3) .quiz-description {
            color: #373639 !important;
            font-family: 'Days One', sans-serif !important;
            font-size: 22px !important;
        }

        .quiz-card:nth-child(n+3) .quiz-info-item {
            color: #373639 !important;
        }

        .quiz-card:nth-child(n+3) .quiz-info-item span {
            color: #373639 !important;
        }

        .quiz-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3), transparent);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .quiz-card:hover::before {
            opacity: 1;
        }

        .quiz-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 8px 0px rgba(0, 0, 0, 0.2),
                0 12px 24px rgba(0, 0, 0, 0.15);
            background: rgba(245, 245, 245, 0.6); /* Полупрозрачный при наведении */
        }

        /* Текст становится ярче при наведении */
        .quiz-card:hover .quiz-title,
        .quiz-card:hover .quiz-subtitle,
        .quiz-card:hover .quiz-info-item,
        .quiz-card:hover .quiz-info-item span {
            color: #000;
            filter: brightness(1.1);
        }
        

        .quiz-card:active {
            transform: translateY(-4px) scale(1.01);
        }

        .quiz-icon {
            font-size: 48px;
            margin-bottom: 10px;
            display: block;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
            animation: iconFloat 3s ease-in-out infinite;
            flex-shrink: 0;
            line-height: 1;
        }

        @keyframes iconFloat {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-8px) rotate(5deg);
            }
        }

        .quiz-title {
            font-family: 'Days One', sans-serif;
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #000; /* Черный текст */
            line-height: 1.1;
            flex-shrink: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-shadow: 1px 1px 0px rgba(255,255,255,0.5);
        }

        .quiz-description {
            font-family: 'Days One', sans-serif;
            font-size: 22px;
            color: #333;
            margin-bottom: 10px;
            line-height: 1.5;
            font-weight: 400;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            min-height: 0;
        }

        .quiz-info {
            display: flex;
            justify-content: space-around;
            margin-top: auto;
            padding-top: 12px;
            border-top: 3px solid #000; /* Черная линия */
            font-size: 20px;
            width: 100%;
            flex-shrink: 0;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
        }

        .quiz-info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #000; /* Черный текст */
            font-family: 'Montserrat', sans-serif;
        }

        .quiz-info-icon {
            font-size: 20px;
            opacity: 1;
        }

        .quiz-info-item span:last-child {
            font-weight: 500;
            font-size: 20px;
            font-family: 'Days One', sans-serif;
        }

        /* Загрузка и ошибки */
        .loading {
            text-align: center;
            padding: 60px 40px;
            font-size: 22px;
            color: #000;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            text-shadow: 2px 2px 0px #A8E063;
            position: relative;
        }

        .loading::before {
            content: 'ooo';
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            opacity: 0.3;
            letter-spacing: 8px;
        }

        .error {
            background: #fb6c6b; /* Новая розовая */
            border: 4px solid #000;
            color: #FFFFFF;
            padding: 20px;
            border-radius: 25px;
            margin: 20px 0;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            box-shadow: 0 6px 0px rgba(0, 0, 0, 0.3), 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        /* Анимации */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Меню выбора персонажа */
        .character-menu {
            position: relative;
            display: inline-block;
            z-index: 1001;
            overflow: visible;
        }


        /* Стрелка вниз под кнопкой персонажа (нарисованная маркером) */
        .character-menu-arrow {
            position: absolute;
            top: calc(100% + 5px);
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 14px solid #000;
            animation: bounceDown 1.5s ease-in-out infinite;
            display: none;
            filter: drop-shadow(1px 1px 0 rgba(0,0,0,0.3)) 
                    drop-shadow(-1px 1px 0 rgba(0,0,0,0.3));
            cursor: pointer;
            z-index: 1001;

        @keyframes bounceDown {
            0%, 100% {
                transform: translateX(-50%) translateY(0);

            50% {
                transform: translateX(-50%) translateY(5px);

        .character-menu-dropdown {
            position: absolute;
            top: calc(100% + 10px);

            overflow: visible;

<body>
    <!-- HUB блок -->
    <div class="hub" id="hub">
        <div class="hub-content">
            <div class="hub-logo-section">
                <img src="/images/logo.png" alt="ВМЕСТЕ" class="logo">
                <p class="subtitle">хорошие люди объединяются играми</p>
            </div>
            <div class="hub-actions">
                <div class="character-menu">
                    <a href="#" class="hub-button" id="login-button">Войти</a>
                    <div class="character-menu-arrow" id="character-menu-arrow"></div>
                    <div class="character-menu-dropdown" id="character-menu-dropdown">
                        <!-- Персонажи будут добавлены через JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>
 
    <!-- Отдельный блок для карточек квизов под HUB -->
    <div class="quizzes-section">
        <div class="container">
            <div id="loading" class="loading">Загрузка квизов...</div>
            <div id="error" class="error" style="display: none;"></div>
            <div id="quizzes-grid" class="quizzes-grid" style="display: none;"></div>
        </div>
    </div>

    <script>
        // Персонажи - кусочки пазлов (8 штук для квадрата 4x2)
        const characters = [
            { id: 'happy', name: 'Радость', color: '#abf67c', position: 0, emotion: 'happy' },
            { id: 'wink', name: 'Подмигивашка', color: '#c77cf6', position: 1, emotion: 'wink' },
            { id: 'smile', name: 'Улыбка', color: '#f67cab', position: 2, emotion: 'smile' },
            { id: 'grumpy', name: 'Хмурик', color: '#7cabf6', position: 3, emotion: 'grumpy' },
            { id: 'sad', name: 'Грустинка', color: '#7ce8f6', position: 4, emotion: 'sad' },
            { id: 'surprised', name: 'Удивлёнка', color: '#f68a7c', position: 5, emotion: 'surprised' },
            { id: 'laugh', name: 'Смешинка', color: '#f2f67c', position: 6, emotion: 'laugh' },
            { id: 'thoughtful', name: 'Думалка', color: '#8a7cf6', position: 7, emotion: 'thoughtful' }
        ];

        let selectedCharacterId = 'happy';

        // Вспомогательные функции для создания SVG элементов
        function createCircle(cx, cy, r) {
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', cx);
            circle.setAttribute('cy', cy);
            circle.setAttribute('r', r);
            circle.setAttribute('fill', '#000');
            circle.setAttribute('stroke', 'none');
            return circle;
        }

        function createPath(d) {
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', d);
            return path;
        }

        // Создание рожицы в стиле маркера (как на референсе)
        function createFace(emotion) {
            const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            group.setAttribute('stroke', '#000');
            group.setAttribute('stroke-width', '6');
            group.setAttribute('fill', 'none');
            group.setAttribute('stroke-linecap', 'round');
            group.setAttribute('stroke-linejoin', 'round');
            
            switch(emotion) {
                case 'happy':
                case 'wink':
                case 'smile':
                case 'grumpy':
                case 'sad':
                case 'surprised':
                case 'laugh':
                case 'thoughtful':
                default:
                    // Одинаковая мордочка для всех: 2 глаза и улыбающийся рот
                    group.appendChild(createCircle(35, 35, 4)); // Левый глаз - точка
                    group.appendChild(createCircle(65, 35, 4)); // Правый глаз - точка
                    group.appendChild(createPath('M 30 58 Q 50 68 70 58')); // Улыбающийся рот
                    break;
            }
            
            return group;
        }

        // Функция для создания SVG персонажа - простой круг
        function createCharacterSVG(color, emotion, position, size = 100) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', size);
            svg.setAttribute('height', size);
            svg.setAttribute('viewBox', '-10 -10 120 120'); // Расширенный viewBox для волос, выходящих за границы
            svg.setAttribute('overflow', 'visible');
            
            // Простой круг - полностью заполнен цветом с прозрачностью и черной обводкой
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', '50');
            circle.setAttribute('cy', '50');
            circle.setAttribute('r', '50');
            circle.setAttribute('fill', color);
            circle.setAttribute('stroke', '#000');
            circle.setAttribute('stroke-width', '3');
            circle.setAttribute('opacity', '1');
            svg.appendChild(circle);
            
            // Рожица в стиле маркера (Caveat) - центрируем в круге
            const face = createFace(emotion);
            // Лицо уже центрировано в координатах 0-100, просто добавляем его
            svg.appendChild(face);
            
            return svg;
        }

        // Инициализация меню персонажей
        function initCharacterMenu() {
            const loginButton = document.getElementById('login-button');
            const menuDropdown = document.getElementById('character-menu-dropdown');
            
            // Устанавливаем персонажа по умолчанию
            const defaultChar = characters.find(c => c.id === selectedCharacterId);
            if (defaultChar) {
                // Устанавливаем цвет фона кнопки "Войти"
                loginButton.style.background = defaultChar.color;
            }
            
            // Создаем список персонажей
            characters.forEach(char => {
                const option = document.createElement('div');
                option.className = 'character-option' + (char.id === selectedCharacterId ? ' selected' : '');
                option.dataset.characterId = char.id;
                
                const preview = document.createElement('div');
                preview.className = 'character-preview';
                const charSVG = createCharacterSVG(char.color, char.emotion, char.position, 32); // Уменьшено на 20% (40 * 0.8 = 32)
                preview.appendChild(charSVG);
                
                option.appendChild(preview);
                
                option.addEventListener('click', () => {
                    selectedCharacterId = char.id;
                    
                    // Обновляем цвет фона кнопки "Войти"
                    loginButton.style.background = char.color;
                    
                    // Сохраняем цвет персонажа в localStorage
                    localStorage.setItem('selectedCharacterColor', char.color);
                    
                    // Обновляем выделение
                    document.querySelectorAll('.character-option').forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    option.classList.add('selected');
                    
                    // Закрываем меню
                    menuDropdown.classList.remove('active');
                    
                    // Сохраняем выбор в localStorage
                    localStorage.setItem('selectedCharacter', char.id);
                });
                
                menuDropdown.appendChild(option);
            });
            
            // Функция переключения меню
            function toggleMenu() {
                menuDropdown.classList.toggle('active');
            }
            
            // Обработчик клика на кнопку "Войти"
            loginButton.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation();
                toggleMenu();
            });
            
            // Закрытие при клике вне меню
            document.addEventListener('click', (e) => {
                const characterMenu = document.querySelector('.character-menu');
                if (!characterMenu.contains(e.target)) {
                    menuDropdown.classList.remove('active');
                }
            });
            
            // Загружаем сохраненный выбор
            const savedChar = localStorage.getItem('selectedCharacter');
            if (savedChar && characters.find(c => c.id === savedChar)) {
                selectedCharacterId = savedChar;
                const savedCharData = characters.find(c => c.id === savedChar);
                // Устанавливаем цвет фона кнопки "Войти"
                loginButton.style.background = savedCharData.color;
                // Сохраняем цвет в localStorage для других страниц
                localStorage.setItem('selectedCharacterColor', savedCharData.color);
                // Обновляем выделение в меню
                document.querySelectorAll('.character-option').forEach(opt => {
                    opt.classList.remove('selected');
                    if (opt.dataset.characterId === savedChar) {
                        opt.classList.add('selected');
                    }
                });
            } else {
                // Если нет сохраненного персонажа, устанавливаем цвет по умолчанию
                const defaultChar = characters.find(c => c.id === selectedCharacterId);
                if (defaultChar) {
                    localStorage.setItem('selectedCharacterColor', defaultChar.color);
                }
            }
        }

        // Загрузка списка квизов
        async function loadQuizzes() {
            try {
                const response = await fetch('/api/quizzes');
                if (!response.ok) {
                    throw new Error('Ошибка загрузки квизов');
                }
                const quizzes = await response.json();
                displayQuizzes(quizzes);
            } catch (error) {
                console.error('Ошибка:', error);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'block';
                document.getElementById('error').textContent = 'Не удалось загрузить квизы. Убедитесь, что сервер запущен.';
            }
        }

        function displayQuizzes(quizzes) {
            const loading = document.getElementById('loading');
            const grid = document.getElementById('quizzes-grid');
            
            loading.style.display = 'none';
            grid.style.display = 'grid';
            grid.innerHTML = '';

            // Создаем только реальные квизы (без пустых карточек "СКОРО")
            const existingQuizzes = quizzes || [];
            
            // Создаем список квизов для отображения
            // Ищем квиз 'gnu' (новый ID) или 'friends-quiz' (старый ID для обратной совместимости)
            const gnuQuiz = existingQuizzes.find(q => q.id === 'gnu') || existingQuizzes.find(q => q.id === 'friends-quiz');
            
            // Если квиз не найден, выводим ошибку в консоль
            if (!gnuQuiz) {
                console.error('Квиз ГНУ не найден в списке квизов:', existingQuizzes);
            }

            // Список реальных квизов для отображения
            const realQuizzes = [
                gnuQuiz // Чемпионат ГНУ
            ].filter(q => q !== null && q !== undefined);
            
            console.log('Квизы для отображения:', realQuizzes);

            // Создаем карточки только для реальных квизов
            // Массив всех цветов персонажей
            const characterColors = ['#abf67c', '#c77cf6', '#f67cab', '#7cabf6', '#7ce8f6', '#f68a7c', '#f2f67c', '#8a7cf6'];
            
            // Массив для отслеживания использованных цветов
            const usedColors = [];
            
            for (let i = 0; i < realQuizzes.length; i++) {
                const quiz = realQuizzes[i];
                
                if (quiz) {
                    // Существующий квиз
                    const card = document.createElement('div');
                    card.className = 'quiz-card';
                    card.style.animationDelay = (i * 0.1) + 's';
                    
                    // Выбор цвета карточки
                    let cardColor;
                    if (i === 0) {
                        // Первая карточка - всегда зеленый
                        cardColor = '#abf67c';
                    } else if (i === 1) {
                        // Вторая карточка - всегда розовый
                        cardColor = '#f68a7c';
                    } else {
                        // Остальные карточки - случайный цвет из персонажей
                        // Исключаем уже использованные цвета
                        const availableColors = characterColors.filter(color => !usedColors.includes(color));
                        if (availableColors.length === 0) {
                            // Если все цвета использованы, сбрасываем список
                            usedColors.length = 0;
                            usedColors.push('#abf67c', '#f68a7c'); // Оставляем первые два использованными
                            cardColor = characterColors[Math.floor(Math.random() * characterColors.length)];
                        } else {
                            cardColor = availableColors[Math.floor(Math.random() * availableColors.length)];
                        }
                        usedColors.push(cardColor);
                    }
                    
                    // Применяем цвет карточки
                    card.style.background = cardColor;
                    
                    // Объявляем переменные для всех квизов
                    const icon = quiz.icon || '📚';
                    const description = quiz.description || 'Проверьте свои знания!';
                    const questionCount = quiz.questionCount || 0;
                    const avgTime = quiz.avgTime || 0;

                    // Обработчики кликов для разных типов карточек
                    // Поддерживаем как новый ID 'gnu', так и старый 'friends-quiz'
                    if (quiz.id === 'gnu' || quiz.id === 'friends-quiz') {
                        // Чемпионат ГНУ - открывает отдельную страницу
                        card.addEventListener('click', () => {
                            window.location.href = `/gnu-quiz.html`;
                        });
                    }

                    // Специальный стиль для первого квиза
                    let cardHTML = '';
                    // Поддерживаем как новый ID 'gnu', так и старый 'friends-quiz'
                    if (quiz.id === 'gnu' || quiz.id === 'friends-quiz') {
                        // Иконка вопроса - черный цвет
                        const questionIcon = `<svg class="hand-drawn-icon" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                            <text x="20" y="32" 
                                  font-family="Kalam, cursive" 
                                  font-size="36" 
                                  font-weight="700"
                                  fill="#000" 
                                  text-anchor="middle">?</text>
                        </svg>`;
                        
                        // Извлекаем время из квиза (по умолчанию 15 секунд для первого квиза)
                        const timeSeconds = avgTime || 15;
                        
                        // SVG иконка часов "от руки маркером" - черный цвет
                        const clockIcon = `<svg class="hand-drawn-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                            <path d="M 16 6 Q 11 6, 7 10 Q 5.5 11.5, 5.5 16 Q 5.5 20.5, 9 24 Q 10.5 25.5, 16 25.5 Q 21.5 25.5, 25 22 Q 26.5 20.5, 26.5 16 Q 26.5 11.5, 23 8 Q 21.5 6.5, 16 6" 
                                  stroke="#000" stroke-width="4" fill="none" 
                                  stroke-linecap="round" stroke-linejoin="round"/>
                            <!-- Часовая стрелка (вверх) -->
                            <line x1="16" y1="16" x2="16" y2="10" 
                                  stroke="#000" stroke-width="3.5" 
                                  stroke-linecap="round"/>
                            <!-- Минутная стрелка (вправо) -->
                            <line x1="16" y1="16" x2="21" y2="21" 
                                  stroke="#000" stroke-width="3.5" 
                                  stroke-linecap="round"/>
                        </svg>`;

                        cardHTML = `
                            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; min-height: 0; width: 100%;">
                                <div class="quiz-title" style="color: #373639;">ЧЕМПИОНАТ ГНУ</div>
                                <div class="quiz-subtitle" style="color: #373639;">цели братишек</div>
                                <div style="font-family: 'Caveat', cursive; font-size: 28px; color: #354fba; margin: 35px 0 10px 0; text-align: center; transform: rotate(-2deg);">девушки тоже братишки</div>
                            </div>
                            <div class="quiz-info">
                                <div class="quiz-info-item">
                                    ${questionIcon}
                                    <span style="color: #000;">15 из ${questionCount}</span>
                                </div>
                                <div class="quiz-info-item">
                                    ${clockIcon}
                                    <span style="color: #000;">по ${timeSeconds} сек</span>
                                </div>
                            </div>
                        `;
                    } else {
                        const descriptionHTML = description ? `<div class="quiz-description">${description}</div>` : '';
                        
                        // Вычисляем уровень песка внизу на основе времени квиза
                        const timeSeconds = avgTime || 0;
                        const maxTime = 60;
                        const sandLevel = Math.min((timeSeconds / maxTime) * 100, 100);
                        const bottomSandTop = 24 - (9 * (sandLevel / 100)); // Верхняя граница песка внизу (чем больше времени, тем ниже граница)
                        
                        // SVG иконка песочных часов "от руки маркером" - черный цвет
                        const clockIconSVG = `<svg class="hand-drawn-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
                            <!-- Верхняя часть песочных часов -->
                            <path d="M 8 4 Q 8 4, 8 8 Q 8 10, 10 12 Q 12 13, 16 13 Q 20 13, 22 12 Q 24 10, 24 8 Q 24 4, 24 4" 
                                  stroke="#000" stroke-width="3.5" fill="none" 
                                  stroke-linecap="round" stroke-linejoin="round"/>
                            <!-- Узкая часть (горлышко) -->
                            <path d="M 10 13 Q 13 14, 16 14.5 Q 19 14, 22 13" 
                                  stroke="#000" stroke-width="3.5" fill="none" 
                                  stroke-linecap="round" stroke-linejoin="round"/>
                            <!-- Нижняя часть песочных часов -->
                            <path d="M 8 15 Q 8 15, 8 19 Q 8 21, 10 23 Q 12 24, 16 24 Q 20 24, 22 23 Q 24 21, 24 19 Q 24 15, 24 15" 
                                  stroke="#000" stroke-width="3.5" fill="none" 
                                  stroke-linecap="round" stroke-linejoin="round"/>
                            <!-- Песок внизу (уровень зависит от времени) -->
                            <path d="M 8 15 Q 8 19, 10 21 Q 12 22, 16 22 Q 20 22, 22 21 Q 24 19, 24 15 L 24 ${bottomSandTop} Q 22 ${bottomSandTop + 2}, 20 ${bottomSandTop + 3} Q 18 ${bottomSandTop + 4}, 16 ${bottomSandTop + 4} Q 14 ${bottomSandTop + 4}, 12 ${bottomSandTop + 3} Q 10 ${bottomSandTop + 2}, 8 ${bottomSandTop} Z" 
                                  fill="#000" opacity="0.7"/>
                            <!-- Песок вверху (остаток) -->
                            <path d="M 8 4 Q 8 8, 10 10 Q 12 11, 16 11 Q 20 11, 22 10 Q 24 8, 24 4 L 24 8 Q 22 10, 20 11 Q 18 12, 16 12 Q 14 12, 12 11 Q 10 10, 8 8 Z" 
                                  fill="#000" opacity="0.3"/>
                        </svg>`;
                        
                        cardHTML = `
                            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; min-height: 0; width: 100%;">
                    <span class="quiz-icon">${icon}</span>
                    <div class="quiz-title">${quiz.name}</div>
                                ${descriptionHTML}
                            </div>
                    <div class="quiz-info">
                        <div class="quiz-info-item">
                            <span class="quiz-info-icon">❓</span>
                            <span>${questionCount} вопросов</span>
                        </div>
                        <div class="quiz-info-item">
                                    ${clockIconSVG}
                            <span>~${avgTime} сек</span>
                        </div>
                            </div>
                        `;
                    }
                    
                    card.innerHTML = cardHTML;

                    grid.appendChild(card);
                }
            }
        }

        // Функция для вычисления высоты HUB и установки отступа блока с карточками
        function updateContainerPadding() {
            const hub = document.getElementById('hub');
            const quizzesSection = document.querySelector('.quizzes-section');
            
            if (hub && quizzesSection) {
                // Получаем высоту HUB
                const hubHeight = hub.offsetHeight;
                // Устанавливаем отступ: высота HUB + дополнительный отступ
                // Для широкой версии (>= 1024px) увеличиваем отступ, чтобы карточки не перекрывались логотипом
                // Для узкой версии (<= 768px) уменьшаем отступ
                const isWideScreen = window.innerWidth >= 1024;
                const isNarrowScreen = window.innerWidth <= 768;
                let additionalPadding;
                if (isWideScreen) {
                    // Минимальный отступ на широких экранах, чтобы карточки были близко к HUB
                    additionalPadding = 40;
                } else if (isNarrowScreen) {
                    // Для узких экранов увеличиваем отступ, чтобы опустить карточки ниже
                    additionalPadding = 60;
                    quizzesSection.style.marginTop = '0';
                } else {
                    additionalPadding = 40;
                    quizzesSection.style.marginTop = '0';
                }
                const paddingTop = hubHeight + additionalPadding;
                quizzesSection.style.paddingTop = paddingTop + 'px';
                
                // Также обновляем позицию парящего элемента
                let style = document.getElementById('dynamic-hub-spacing');
                if (!style) {
                    style = document.createElement('style');
                    style.id = 'dynamic-hub-spacing';
                    document.head.appendChild(style);
                }
                style.textContent = `
                    .quizzes-section::before {
                        top: ${hubHeight + 20}px !important;
                    }
                `;
            }
        }
        
        // Сохраняем оригинальную функцию loadQuizzes
        const originalLoadQuizzes = loadQuizzes;
        
        // Переопределяем loadQuizzes, чтобы вызывать updateContainerPadding после загрузки
        loadQuizzes = async function() {
            await originalLoadQuizzes();
            setTimeout(updateContainerPadding, 100);
        };
        
        // Загружаем квизы при загрузке страницы
        loadQuizzes();
        
        // Инициализируем меню персонажей
        initCharacterMenu();
        
        // Вызываем функцию после инициализации меню и загрузки квизов
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(updateContainerPadding, 300); // Задержка для полной загрузки HUB и меню
            });
        } else {
            setTimeout(updateContainerPadding, 300);
        }
        
        // Вызываем функцию при изменении размера окна
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(updateContainerPadding, 100);
        });
    </script>

</body>
