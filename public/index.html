<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квиз - Выбор игры</title>
    <link rel="stylesheet" href="/styles/brand-style.css">
    <link rel="stylesheet" href="/styles/quiz-card.css">
    <link rel="stylesheet" href="/styles/hub1.css">
    <link rel="stylesheet" href="/styles/hub2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Days+One&family=Handlee&family=Kalam:wght@300;400;700&family=Open+Sans:wght@400;500;600;700&family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;600;700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    <script src="/scripts/hub-common.js"></script>
    <script src="/scripts/hub1.js"></script>
    <script src="/scripts/hub2.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            background: #f2f2f2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0 20px 20px 20px;
            position: relative;
            /* padding-bottom будет обновляться динамически через JavaScript для HUB4/HUB5 */
        }

        /* --- Каркас HUB-зон на странице --- */

        /* Базовый класс для любой HUB-зоны */
        .hub-zone {
            width: 100%;
            box-sizing: border-box;
        }

        /* HUB3 — основная зона контента */
        .hub3 {
            flex: 1 0 auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Внутренний контейнер внутри HUB3 */
        .hub3 > .container {
            margin: 0 auto;
            max-width: 1200px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 2; /* Ниже Hub1 (1001), Hub2 (1000), HUB4/HUB5 (999), но выше парящих элементов (z-index: -1) */
        }

        /* HUB4 и HUB5 — нижние полосы, фиксированные снизу (как HUB1/HUB2 сверху) */
        .hub4,
        .hub5 {
            position: fixed;
            left: 0;
            right: 0;
            background: var(--hub1-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: var(--hub1-padding);
            min-height: auto;
            box-sizing: border-box;
            width: 100%;
            z-index: 999; /* Ниже HUB1 (1001) и HUB2 (1000), но выше парящих элементов (z-index: -1) */
            transition: bottom 0.3s ease;
            will-change: bottom;
        }

        /* HUB5 — самая нижняя полоса (фиксирована внизу) */
        .hub5 {
            bottom: 0;
        }

        /* HUB4 — над HUB5 (bottom будет рассчитываться динамически через JavaScript) */
        .hub4 {
            bottom: auto; /* Устанавливается динамически через JavaScript в hub-common.js */
        }

        /* Парящие элементы */
        body::before {
            content: '';
            position: fixed;
            /* top устанавливается динамически через JavaScript */
            left: -50px;
            width: 200px;
            height: 200px;
            background: #d6fbbf; /* Парящий элемент */
            border-radius: 50% 40% 60% 30%;
            opacity: 0.9;
            z-index: -1; /* Ниже HUB1 (1001), HUB2 (1000), HUB4/HUB5 (999) и контента HUB3 (2), но выше фона */
            animation: wobble 6s ease-in-out infinite;
            pointer-events: none;
        }
        
        body::after {
            content: '';
            position: fixed;
            /* bottom устанавливается динамически через JavaScript */
            right: -80px;
            width: 250px;
            height: 250px;
            background: #fececd; /* Парящий элемент */
            border-radius: 40% 50% 30% 60%;
            opacity: 0.9;
            z-index: -1; /* Ниже HUB1 (1001), HUB2 (1000), HUB4/HUB5 (999) и контента HUB3 (2), но выше фона */
            animation: wobble 8s ease-in-out infinite reverse;
            pointer-events: none;
        }
        
        @keyframes wobble {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(5deg) scale(1.1); }
            50% { transform: rotate(-5deg) scale(0.9); }
            75% { transform: rotate(3deg) scale(1.05); }
        }
        
        /* Стили для контента внутри HUB3 */
        .hub3 > .container {
            padding: 0;
        }
        
        /* Убеждаемся, что loading и error не занимают место */
        .hub3 > .container > #loading,
        .hub3 > .container > #error {
            display: none !important;
            margin: 0 !important;
            padding: 0 !important;
            height: 0 !important;
            min-height: 0 !important;
            max-height: 0 !important;
            overflow: hidden !important;
            visibility: hidden !important;
            position: absolute !important;
            top: -9999px !important;
            left: -9999px !important;
        }
        
        /* Убеждаемся, что quizzes-grid начинается с самого верха */
        .hub3 > .container > #quizzes-grid {
            margin-top: 0 !important;
            padding-top: 0 !important;
            margin-bottom: 0 !important;
            padding-bottom: 0 !important;
        }
        
        /* Убеждаемся, что первая карточка не имеет отступов */
        .hub3 > .container > #quizzes-grid > .quiz-card:first-child {
            margin-top: 0 !important;
            padding-top: 0 !important;
        }

        /* Общие стили для заголовков */
        h1, h2, h3, h4, h5, h6 {
            font-family: 'Caveat', cursive;
        }

        .main-title {
            margin-bottom: 10px;
            animation: fadeInDown 0.8s ease;
            text-align: center;
        }



        /* Сетка квизов - адаптивная, как на gnu-quiz.html */
        .quizzes-grid {
            display: grid;
            grid-template-columns: 1fr; /* 1 колонка по умолчанию (мобильные) */
            gap: clamp(20px, 4vw, 28px); /* Адаптивный отступ, как на gnu-quiz.html */
            margin: 0 auto; /* Убираем все отступы - контент начинается сразу после Hub2 */
            margin-top: clamp(20px, 6vw, 40px); /* Отступ сверху, как на gnu-quiz.html */
            padding: 0 clamp(16px, 4vw, 24px); /* Отступы от краев экрана */
            max-width: 1200px;
            width: 100%;
            align-items: center; /* Выравнивание по центру вертикально */
            align-content: center; /* Выравнивание содержимого по центру вертикально */
            justify-items: center; /* Выравнивание по центру горизонтально */
        }
        
        /* Убираем отступ перед первой карточкой в grid */
        .quizzes-grid > .quiz-card:first-child {
            margin-top: 0 !important;
            padding-top: 0 !important;
        }

        /* Базовые стили карточек вынесены в quiz-card.css */
        /* Здесь только специфичные стили для цветов карточек */
        
        /* Первая карточка не должна иметь отступов сверху */
        .quizzes-grid > .quiz-card:first-child {
            margin-top: 0 !important;
            padding-top: 25px !important; /* Сохраняем внутренний padding */
            animation: none !important; /* Отключаем анимацию для первой карточки */
            opacity: 1 !important;
            transform: none !important;
        }

        /* Первый доступный квиз - специальный стиль (зеленая карточка) */
        .quiz-card:nth-child(1) {
            background: #abf67c; /* Новый зеленый фон */
            border: none;
            box-shadow: 
                0 6px 0px rgba(47, 185, 93, 0.3),
                0 8px 16px rgba(47, 185, 93, 0.1);
        }

        .quiz-card:nth-child(1):hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 8px 0px rgba(0, 0, 0, 0.2),
                0 12px 24px rgba(0, 0, 0, 0.15);
            background: rgba(171, 246, 124, 0.9);
        }

        .quiz-card:nth-child(1):hover .quiz-title,
        .quiz-card:nth-child(1):hover .quiz-subtitle,
        .quiz-card:nth-child(1):hover .quiz-info-item,
        .quiz-card:nth-child(1):hover .quiz-info-item span {
            color: #373639;
            filter: brightness(1.1);
        }

        .quiz-card:nth-child(1):hover div[style*="Caveat"] {
            filter: brightness(1.1) !important;
        }

        /* Стили для первой карточки (цвет текста) */
        .quiz-card:nth-child(1) .quiz-title,
        .quiz-card:nth-child(1) .quiz-subtitle {
            color: #373639;
        }

        .quiz-card:nth-child(1) .quiz-icon {
            display: none;
        }

        /* SVG иконки в стиле "от руки маркером" */
        .hand-drawn-icon {
            width: 32px;
            height: 32px;
            display: inline-block;
            vertical-align: middle;
        }


        /* Вторая карточка - розовый стиль */
        .quiz-card:nth-child(2) {
            background: #f68a7c; /* Розовый фон */
            border: none;
            box-shadow: 
                0 6px 0px rgba(250, 87, 52, 0.3),
                0 8px 16px rgba(250, 87, 52, 0.1);
        }

        .quiz-card:nth-child(2):hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 8px 0px rgba(0, 0, 0, 0.2),
                0 12px 24px rgba(0, 0, 0, 0.15);
            background: rgba(246, 138, 124, 0.9);
        }

        .quiz-card:nth-child(2):hover .quiz-title,
        .quiz-card:nth-child(2):hover .quiz-subtitle,
        .quiz-card:nth-child(2):hover .quiz-info-item,
        .quiz-card:nth-child(2):hover .quiz-info-item span {
            color: #373639;
            filter: brightness(1.1);
        }

        .quiz-card:nth-child(2):hover div[style*="Caveat"] {
            filter: brightness(1.1) !important;
        }

        /* Стили для второй карточки (цвет текста) */
        .quiz-card:nth-child(2) .quiz-title,
        .quiz-card:nth-child(2) .quiz-subtitle {
            color: #373639;
        }

        .quiz-card:nth-child(2) .quiz-icon {
            display: none;
        }

        .quiz-card:nth-child(n+3) .quiz-title {
            color: #373639 !important;
            font-family: 'Days One', sans-serif !important;
            font-weight: 700 !important;
            font-size: 28px !important;
        }

        .quiz-card:nth-child(n+3) .quiz-subtitle {
            color: #373639 !important;
            font-family: 'Days One', sans-serif !important;
            font-weight: 400 !important;
            font-size: 22px !important;
            margin-top: 8px !important;
        }

        .quiz-card:nth-child(n+3) .quiz-description {
            color: #373639 !important;
            font-family: 'Days One', sans-serif !important;
            font-size: 22px !important;
        }

        .quiz-card:nth-child(n+3) .quiz-info-item {
            color: #373639 !important;
        }

        .quiz-card:nth-child(n+3) .quiz-info-item span {
            color: #373639 !important;
        }

        .quiz-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3), transparent);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .quiz-card:hover::before {
            opacity: 1;
        }

        .quiz-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 8px 0px rgba(0, 0, 0, 0.2),
                0 12px 24px rgba(0, 0, 0, 0.15);
            background: rgba(245, 245, 245, 0.6); /* Полупрозрачный при наведении */
        }

        /* Текст становится ярче при наведении */
        .quiz-card:hover .quiz-title,
        .quiz-card:hover .quiz-subtitle,
        .quiz-card:hover .quiz-info-item,
        .quiz-card:hover .quiz-info-item span {
            color: #000;
            filter: brightness(1.1);
        }
        

        .quiz-card:active {
            transform: translateY(-4px) scale(1.01);
        }

        .quiz-icon {
            font-size: clamp(36px, 8vw, 56px); /* Адаптивный размер, как на gnu-quiz.html */
            margin-bottom: clamp(10px, 2.5vw, 16px); /* Адаптивный отступ, как на gnu-quiz.html */
            display: block;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
            animation: iconFloat 3s ease-in-out infinite;
            flex-shrink: 0;
            line-height: 1;
            width: clamp(36px, 8vw, 56px); /* Адаптивная ширина, как на gnu-quiz.html */
            height: clamp(56px, 10vw, 72px); /* Адаптивная высота, как на gnu-quiz.html */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Базовые стили для quiz-title, quiz-description, quiz-info и т.д. вынесены в quiz-card.css */

        /* Загрузка и ошибки */
        .loading {
            text-align: center;
            padding: 60px 40px;
            font-size: 22px;
            margin: 0;
            display: none; /* По умолчанию скрыт */
            color: #000;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            text-shadow: 2px 2px 0px #A8E063;
            position: relative;
        }

        .loading::before {
            content: 'ooo';
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            opacity: 0.3;
            letter-spacing: 8px;
        }

        .error {
            background: #fb6c6b; /* Новая розовая */
            border: 4px solid #000;
            color: #FFFFFF;
            padding: 20px;
            border-radius: 25px;
            margin: 0; /* Убираем отступы */
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            box-shadow: 0 6px 0px rgba(0, 0, 0, 0.3), 0 8px 16px rgba(0, 0, 0, 0.2);
            display: none; /* По умолчанию скрыт */
        }

        /* Анимации */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(0); /* Убираем translateY, чтобы не создавать отступ */
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Отключаем анимацию для первой карточки, чтобы она не создавала отступ */
        .quizzes-grid > .quiz-card:first-child {
            animation: none !important;
            opacity: 1 !important;
        }

        /* Меню выбора персонажа */
        .character-menu {
            position: relative;
            display: inline-block;
            z-index: 1001;
            overflow: visible;
        }


        /* Стрелка вниз под кнопкой персонажа (нарисованная маркером) */
        .character-menu-arrow {
            position: absolute;
            top: calc(100% + 5px);
            left: 0;
            transform: translateX(0);
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-top: 14px solid #000;
            animation: bounceDown 1.5s ease-in-out infinite;
            display: none;
            filter: drop-shadow(1px 1px 0 rgba(0,0,0,0.3)) 
                    drop-shadow(-1px 1px 0 rgba(0,0,0,0.3));
            cursor: pointer;
            z-index: 1001;
        }

        @keyframes bounceDown {
            0%, 100% {
                transform: translateX(0) translateY(0);
            }
            50% {
                transform: translateX(0) translateY(5px);
            }
        }

        .character-menu-dropdown {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            background: transparent;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-start;
            white-space: nowrap;
            width: auto;
            min-width: auto;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            max-height: 0;
            overflow: hidden;
        }

        .character-menu-dropdown.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            max-height: none;
            transition: opacity 0.2s ease, visibility 0.2s ease;
            overflow: visible;
            display: flex;
        }

        .character-option {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease, transform 0.3s ease, opacity 0.3s ease;
            background: transparent;
            position: relative;
            flex-shrink: 0;
            opacity: 0;
            transform: translateY(-20px);
        }

        .character-menu-dropdown.active .character-option {
            opacity: 1;
            transform: translateY(0);
        }

        .character-menu-dropdown.active .character-option:nth-child(1) {
            transition-delay: 0.05s;
        }

        .character-menu-dropdown.active .character-option:nth-child(2) {
            transition-delay: 0.1s;
        }

        .character-menu-dropdown.active .character-option:nth-child(3) {
            transition-delay: 0.15s;
        }

        .character-menu-dropdown.active .character-option:nth-child(4) {
            transition-delay: 0.2s;
        }

        .character-menu-dropdown.active .character-option:nth-child(5) {
            transition-delay: 0.25s;
        }

        .character-menu-dropdown.active .character-option:nth-child(6) {
            transition-delay: 0.3s;
        }

        .character-menu-dropdown.active .character-option:nth-child(7) {
            transition-delay: 0.35s;
        }

        .character-menu-dropdown.active .character-option:nth-child(8) {
            transition-delay: 0.4s;
        }

        /* Плавное закрытие в обратном порядке */
        .character-menu-dropdown:not(.active) .character-option {
            transition-delay: 0s;
            opacity: 0;
            transform: translateY(-20px);
        }

        .character-option:hover {
            transform: translateY(0) scale(1.1);
        }

        .character-option.selected {
            /* Выделение выбранного персонажа - без дополнительных обводок */
            opacity: 1; /* Гарантируем полную непрозрачность для выбранного элемента */
        }

        .character-preview {
            width: 100%;
            height: 100%;
            flex-shrink: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .character-preview svg {
            width: 100%;
            height: 100%;
        }

        .character-name {
            display: none;
        }

        /* Стили для SVG персонажей */
        .character-circle {
            width: 100%;
            height: 100%;
            border-radius: 50% 45% 55% 50%;
            position: relative;
            overflow: hidden;
        }

        .character-face {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Адаптивность - планшеты и десктопы (≥768px) - 2 колонки, как на gnu-quiz.html */
        @media (min-width: 768px) {
            .quizzes-grid {
                grid-template-columns: 1fr 1fr; /* 2 колонки на планшетах и десктопах */
                gap: clamp(24px, 4vw, 32px); /* Адаптивный отступ, как на gnu-quiz.html */
                margin-top: clamp(20px, 6vw, 40px); /* Отступ сверху, как на gnu-quiz.html */
                padding: 0 clamp(16px, 4vw, 24px); /* Отступы от краев экрана */
                align-items: center; /* Выравнивание по центру вертикально */
                align-content: center; /* Выравнивание содержимого по центру вертикально */
                justify-items: center; /* Выравнивание по центру горизонтально */
            }
        }
        
        /* Адаптивность - средние экраны (1024px и выше) - можно оставить 2 колонки или сделать 3 */
        @media (min-width: 1024px) {
            .quizzes-grid {
                grid-template-columns: repeat(2, 1fr); /* 2 колонки для соответствия gnu-quiz.html */
                gap: clamp(24px, 4vw, 32px);
                margin-top: clamp(20px, 6vw, 40px);
                padding: 0 clamp(16px, 4vw, 24px); /* Отступы от краев экрана */
            }

            .quiz-card:nth-child(1) .quiz-title {
                font-size: clamp(24px, 3.5vw, 32px); /* Адаптивный размер с сохранением пропорций */
            }

            .quiz-card:nth-child(2) .quiz-title {
                font-size: clamp(22px, 3.2vw, 30px);
            }

            .quiz-card:nth-child(3) .quiz-title {
                font-size: clamp(22px, 3.2vw, 30px);
            }

            .quiz-card:nth-child(4) .quiz-title {
                font-size: clamp(22px, 3.2vw, 30px);
            }

            .quiz-card .quiz-title {
                font-size: clamp(24px, 3.5vw, 32px);
            }

            .quiz-card:nth-child(1) .quiz-subtitle,
            .quiz-card:nth-child(2) .quiz-subtitle,
            .quiz-card:nth-child(3) .quiz-subtitle,
            .quiz-card:nth-child(4) .quiz-subtitle,
            .quiz-card .quiz-subtitle {
                font-size: clamp(18px, 2.8vw, 26px);
            }

            .quiz-card:nth-child(1) .quiz-info,
            .quiz-card:nth-child(2) .quiz-info,
            .quiz-card:nth-child(3) .quiz-info,
            .quiz-card:nth-child(4) .quiz-info,
            .quiz-card .quiz-info {
                font-size: clamp(20px, 3.2vw, 30px);
            }

            .quiz-card:nth-child(1) .quiz-info-item span:last-child,
            .quiz-card:nth-child(2) .quiz-info-item span:last-child,

        ];

        let selectedCharacterId = 'happy';

        // Вспомогательные функции для создания SVG элементов
        function createCircle(cx, cy, r) {
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', cx);
            circle.setAttribute('cy', cy);
            circle.setAttribute('r', r);
            circle.setAttribute('fill', '#000');
            circle.setAttribute('stroke', 'none');
            return circle;
        }

        function createPath(d) {
            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            path.setAttribute('d', d);
            return path;
        }

        // Создание рожицы в стиле маркера (как на референсе)
        function createFace(emotion) {
            const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            group.setAttribute('stroke', '#000');
            group.setAttribute('stroke-width', '6');
            group.setAttribute('fill', 'none');
            group.setAttribute('stroke-linecap', 'round');
            group.setAttribute('stroke-linejoin', 'round');
            
            switch(emotion) {
                case 'happy':
                case 'wink':
                case 'smile':
                case 'grumpy':
                case 'sad':
                case 'surprised':
                case 'laugh':
                case 'thoughtful':
                default:
                    // Одинаковая мордочка для всех: 2 глаза и улыбающийся рот
                    group.appendChild(createCircle(35, 35, 4)); // Левый глаз - точка
                    group.appendChild(createCircle(65, 35, 4)); // Правый глаз - точка
                    group.appendChild(createPath('M 30 58 Q 50 68 70 58')); // Улыбающийся рот
                    break;
            }
            
            return group;
        }

        // Функция для создания SVG персонажа - простой круг
        function createCharacterSVG(color, emotion, position, size = 100) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('width', size);
            svg.setAttribute('height', size);
            svg.setAttribute('viewBox', '-10 -10 120 120'); // Расширенный viewBox для волос, выходящих за границы
            svg.setAttribute('overflow', 'visible');
            
            // Простой круг - полностью заполнен цветом с прозрачностью и черной обводкой
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', '50');
            circle.setAttribute('cy', '50');
            circle.setAttribute('r', '50');
            circle.setAttribute('fill', color);
            circle.setAttribute('stroke', '#000');
            circle.setAttribute('stroke-width', '3');
            circle.setAttribute('opacity', '1');
            svg.appendChild(circle);
            
            // Рожица в стиле маркера (Caveat) - центрируем в круге
            const face = createFace(emotion);
            // Лицо уже центрировано в координатах 0-100, просто добавляем его
            svg.appendChild(face);
            
            return svg;

        // Функция для адаптации размера фразы под ширину логотипа (использует HubCommon)
        function adaptSubtitleToLogo() {
            if (typeof HubCommon !== 'undefined') {
                HubCommon.adaptSubtitleToLogo();
                return;
            }
            const logo = document.querySelector('.hub2-logo-section .logo');
            const subtitle = document.querySelector('.hub2-logo-section .subtitle');
            
            if (!logo || !subtitle) return;
            
            // Ждем загрузки изображения
            function adjustSize() {
                const logoWidth = logo.offsetWidth;
                if (logoWidth === 0) return; // Логотип еще не загружен
                
                // Сохраняем оригинальный размер шрифта из CSS для начальной точки
                const baseFontSize = parseFloat(window.getComputedStyle(subtitle).fontSize) || 50;
                
                // Используем бинарный поиск для точного подбора размера
                let minFontSize = 10;
                let maxFontSize = 200;
                let bestFontSize = baseFontSize;
                const tolerance = 2; // Допустимая погрешность в пикселях
                
                // Бинарный поиск оптимального размера
                for (let i = 0; i < 20; i++) { // Максимум 20 итераций
                    const testFontSize = (minFontSize + maxFontSize) / 2;
                    subtitle.style.fontSize = testFontSize + 'px';
                    
                    // Ждем перерисовки
                    void subtitle.offsetWidth;
                    
                    const subtitleWidth = subtitle.scrollWidth;
                    
                    if (Math.abs(subtitleWidth - logoWidth) < tolerance) {
                        bestFontSize = testFontSize;
                        break;
                    } else if (subtitleWidth < logoWidth) {
                        minFontSize = testFontSize;
                        bestFontSize = testFontSize;
                    } else {
                        maxFontSize = testFontSize;
                    }
                }
                
                // Устанавливаем найденный размер с небольшим запасом (98% для безопасности)
                subtitle.style.fontSize = (bestFontSize * 0.98) + 'px';
            }
            
            // Если изображение уже загружено
            if (logo.complete) {
                adjustSize();
            } else {
                // Ждем загрузки изображения
                logo.addEventListener('load', adjustSize, { once: true });
                logo.addEventListener('error', adjustSize, { once: true }); // На случай ошибки загрузки
            }
            
            // Также вызываем сразу (на случай если изображение уже загружено)
            setTimeout(adjustSize, 100);
        }

        // Функция для вычисления высоты Hub и установки отступа блока с карточками (использует HubCommon)
        function updateContainerPadding() {
            if (typeof HubCommon !== 'undefined') {
                HubCommon.updateContentPadding('.hub3 > .container');
                HubCommon.updateFloatingElementsPosition();
                return;
            }
        }
        
        // Сохраняем оригинальную функцию loadQuizzes
        const originalLoadQuizzes = loadQuizzes;
        
        // Переопределяем loadQuizzes, чтобы вызывать updateContainerPadding после загрузки
        loadQuizzes = async function() {
            await originalLoadQuizzes();
            
            // Функция для обновления позиции после загрузки карточек
            const updatePosition = () => {
                // Ждем отрисовки карточек и обновляем позицию
                // Используем HubCommon напрямую, если он доступен
                // Используем несколько requestAnimationFrame для гарантии правильной отрисовки
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            if (typeof HubCommon !== 'undefined') {
                                // Проверяем, что Hub1 и Hub2 инициализированы
                                const hub1 = document.getElementById('hub1');
                                const hub2 = document.getElementById('hub2');
                                if (hub1 && hub2) {
                                    HubCommon.updateContentPadding('.hub3 > .container');
                                } else {
                                    // Если Hub еще не инициализированы, ждем их инициализации
                                    console.log('loadQuizzes: ожидаем инициализации Hub1 и Hub2...');
                                    setTimeout(updatePosition, 100);
                                }
                            } else {
                                updateContainerPadding();
                            }
                            adaptSubtitleToLogo();
                        });
                    });
                });
            };
            
            updatePosition();
        };
        
        // НЕ загружаем квизы сразу - дождемся инициализации Hub1 и Hub2
        // loadQuizzes() будет вызван после инициализации Hub
        
        // Меню персонажей будет инициализировано через Hub1
        
        // Адаптируем при загрузке изображения логотипа
        window.addEventListener('load', () => {
            adaptSubtitleToLogo();
        });
    </script>
    
    <script>
        // Инициализация Hub1 и Hub2 после загрузки скриптов
        (function() {
            function initHubs() {
                try {
                    // Проверяем, что скрипты загружены
                    if (typeof Hub1 === 'undefined' || typeof Hub2 === 'undefined' || typeof HubCommon === 'undefined') {
                        console.warn('Hub скрипты еще не загружены, повторная попытка через 100мс...');
                        setTimeout(initHubs, 100);
                        return;
                    }
                    
                    console.log('Инициализация Hub1 и Hub2...');
                    
                    // Инициализация Hub1 с кнопкой "Войти" и "Настройки"
                    Hub1.init({
                        showLogin: true,
                        showSettings: true
                    });
                    
                    // Инициализация Hub2 с логотипом и фразой
                    Hub2.init();
                    
                    // Обновление позиций - ждем полной отрисовки
                    // Используем несколько requestAnimationFrame для гарантии правильной отрисовки
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            requestAnimationFrame(() => {
                                HubCommon.updateHub2Position();
                                HubCommon.updateHub4Position();
                                HubCommon.updateContentPadding('.hub3 > .container');
                                HubCommon.updateFloatingElementsPosition();
                                HubCommon.updateBodyPaddingBottom();
                                HubCommon.adaptSubtitleToLogo();
                                
                                console.log('Hub1 и Hub2 успешно инициализированы');
                                
                                // Загружаем квизы ПОСЛЕ инициализации Hub
                                // Это гарантирует правильный порядок: Hub -> карточки -> обновление позиции
                                if (typeof loadQuizzes === 'function') {
                                    loadQuizzes();
                                }
                            });
                        });
                    });
                } catch (error) {
                    console.error('Ошибка при инициализации Hub:', error);
                }
            }
            
            // Запускаем инициализацию после загрузки DOM
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => {
                    setTimeout(initHubs, 200);
                });
            } else {
                // Если документ уже загружен, запускаем сразу
                setTimeout(initHubs, 200);
            }
            
            // Обновление при изменении размера окна
            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    if (typeof HubCommon !== 'undefined') {
                        // Сбрасываем флаг, чтобы разрешить обновление при resize
                        HubCommon._positionInitialized = false;
                        HubCommon._lastCorrectMarginTop = null;
                        
                        console.log('resize (index.html): обновляем позиции после изменения размера окна');
                        
                        // Обновляем позиции в правильном порядке
                        HubCommon.updateHub2Position();
                        // Используем requestAnimationFrame для гарантии правильной отрисовки
                        requestAnimationFrame(() => {
                            requestAnimationFrame(() => {
                                HubCommon.updateHub4Position();
                                HubCommon.updateContentPadding('.hub3 > .container');
                                HubCommon.updateFloatingElementsPosition();
                                HubCommon.updateBodyPaddingBottom();
                                HubCommon.adaptSubtitleToLogo();
                            });
                        });
                    }
                }, 100);
            });
        })();
    </script>
    
    <!-- Hub1 и Hub2 скрипты -->
    <script src="/scripts/hub-common.js"></script>
    <script src="/scripts/hub1.js"></script>
    <script src="/scripts/hub2.js"></script>
