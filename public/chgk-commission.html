    <style>
        /* Специфичные стили для страницы комиссии */
        .hub3 > .container {
            max-width: 900px;
        }

        .waiting-screen {

        .question-info {
            background: rgba(245, 245, 245, 0.9);
            border: 3px solid #393639;

            padding: 20px;
            margin: 20px 0;
            box-shadow:

        }

        .question-info h2 {
            font-family: 'Days One', sans-serif;

            color: #393639;

        .question-text {

            font-family: 'Montserrat', sans-serif;

            margin-bottom: 15px;
            line-height: 1.5;
        }

        .correct-answer {
            font-size: 18px;

            font-weight: 700;

            background: rgba(0, 193, 89, 0.1);

            margin-top: 10px;

        .answers-list {
            margin-top: 20px;

        .answer-item {

            box-shadow:

        }

        .answer-item:hover {
            transform: translateY(-1px);
            box-shadow:

                0 4px 8px rgba(0, 0, 0, 0.12);
        }

        .answer-item.verified {
            border-color: #00C159;
            background: rgba(0, 193, 89, 0.05);
        }

        .answer-item.verified.incorrect {
            border-color: #ff7664;
            background: rgba(255, 118, 100, 0.05);
        }

        .answer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .player-name {
            font-family: 'Days One', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #393639;
            text-transform: uppercase;
        }

        .answer-time {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            color: #666;
        }

        .answer-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            color: #393639;
            line-height: 1.4;
            margin-bottom: 10px;
            padding: 8px;
            background: rgba(245, 245, 245, 0.5);
            border-radius: 6px;
            min-height: 40px;
        }

        .answer-text:empty::before,
        .answer-text:has-text("")::before {
            content: '(Нет ответа)';
            color: #999;
            font-style: italic;
        }

        .answer-text {
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            word-break: break-word;
        }

        .verification-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .verification-btn {
            padding: 8px 16px;
            font-family: 'Days One', sans-serif;
            font-size: 14px;
            font-weight: 700;
            border: 2px solid #393639;
            border-radius: 8px;
            cursor: pointer !important;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            pointer-events: auto !important;
            opacity: 1 !important;
        }
        
        .verification-btn:disabled {
            opacity: 0.5 !important;
            cursor: not-allowed !important;
        }

        .verification-btn.correct {
            background: #abf67c;
            color: #2fb95d;
            border-color: #2fb95d;
        }

        .verification-btn.correct:hover {
            transform: translateY(-2px);

        .verification-btn.incorrect {

            color: #FFFFFF;
            border-color: #ff7664;
        }

        .verification-btn.incorrect:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 4px 0px rgba(255, 118, 100, 0.3),
                0 6px 12px rgba(255, 118, 100, 0.2);
        }

        .verification-btn.revoke {
            background: rgba(245, 245, 245, 0.9);
            color: #393639;
            border-color: #393639;
        }

        .verification-btn.revoke:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 4px 0px rgba(0, 0, 0, 0.2),
                0 6px 12px rgba(0, 0, 0, 0.1);
        }

        .score-input {
            width: 100px;
            padding: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            border: 2px solid #393639;
            border-radius: 8px;

        }

        .verification-status {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            color: #00C159;
            font-weight: 700;
            margin-top: 6px;
        }

        .verification-status.revoked {
            color: #ff7664;
        }

        .status-bar {
            background: rgba(245, 245, 245, 0.9);
            border: 3px solid #393639;
            border-radius: 16px;
            padding: 15px;
            margin: 20px 0;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            color: #393639;
            font-weight: 600;
        }

        .next-question-btn {

            margin: 30px auto;

            font-family: 'Days One', sans-serif;
            font-size: 20px;
            font-weight: 700;
            background: #abf67c;
            border: 3px solid #2fb95d;
            border-radius: 12px;
            color: #2fb95d;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 
                0 4px 0px rgba(47, 185, 93, 0.3),

            letter-spacing: 1px;
            display: none;

        .next-question-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 0px rgba(47, 185, 93, 0.4),
                0 10px 20px rgba(47, 185, 93, 0.2);
        }

        .next-question-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .show-leaderboard-btn {
            width: 100%;
            max-width: 400px;
            margin: 30px auto;
            padding: 15px 30px;
            font-family: 'Days One', sans-serif;
            font-size: 20px;
            font-weight: 700;
            background: #abf67c;
            border: 3px solid #2fb95d;
            border-radius: 12px;
            color: #2fb95d;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 
                0 4px 0px rgba(47, 185, 93, 0.3),
                0 8px 16px rgba(47, 185, 93, 0.1);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: none;
        }

        .show-leaderboard-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 0px rgba(47, 185, 93, 0.4),
                0 10px 20px rgba(47, 185, 93, 0.2);
        }

        .show-leaderboard-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .start-timer-btn {
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            padding: 15px 30px;

            background: #ff7664;
            border: 3px solid #393639;
            border-radius: 12px;
            color: #FFFFFF;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 
                0 4px 0px rgba(57, 54, 57, 0.3),
                0 8px 16px rgba(0, 0, 0, 0.1);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block !important; /* Принудительно показываем при необходимости */
            visibility: visible !important;

        .start-timer-btn:hover:not(:disabled) {

        }

        .start-timer-btn:disabled {

<body>
    <!-- HUB3: основная зона контента -->
    <div class="hub-zone hub3">
        <div class="container">
            <!-- Экран ожидания -->
            <div id="waiting-screen" class="waiting-screen">
                <h1>Счетная комиссия</h1>
                <div class="status" id="waiting-status">Подключение к комнате...</div>
                <div style="margin-top: 30px; padding: 20px; background: rgba(245, 245, 245, 0.9); border: 3px solid #393639; border-radius: 16px; max-width: 500px; margin-left: auto; margin-right: auto;">
                    <p style="font-family: 'Montserrat', sans-serif; font-size: 16px; color: #393639; line-height: 1.6;">

                        После начала игры здесь будут отображаться ответы игроков для проверки.

            <!-- Экран проверки -->
            <div id="verification-screen" style="display: none;">
                <!-- Информация о вопросе -->

        <!-- Frame 5: Информация о создателе -->
        <section class="frame frame-5" data-frame="about" id="hub5">

    <script>
        // Проверка, что страница открыта через сервер
        if (window.location.protocol === 'file:') {
            document.body.innerHTML = `
                <div style="text-align: center; padding: 40px; color: white;">
                    <h1 style="font-size: 48px; margin-bottom: 20px;">⚠️ Ошибка</h1>
                    <p style="font-size: 24px; margin-bottom: 30px;">
                        Страница открыта неправильно!
                    </p>
                    <p style="font-size: 18px; margin-bottom: 30px;">
                        Откройте страницу через сервер: http://localhost:3000/chgk-commission.html
                    </p>
                </div>
            `;
            throw new Error('Страница должна быть открыта через http://localhost:3000/');
        }

        // Ожидание загрузки socket.io
        function waitForSocketIO(callback, maxAttempts = 50) {
            let attempts = 0;
            const checkInterval = setInterval(() => {
                attempts++;
                if (typeof io !== 'undefined') {
                    clearInterval(checkInterval);
                    callback();
                } else if (attempts >= maxAttempts) {
                    clearInterval(checkInterval);
                    console.error('Socket.io не загружен за 5 секунд!');
                }
            }, 100);
        }

        waitForSocketIO(() => {
            initApp();
        });

        let socket = null;
        let roomCode = null;
        let currentQuestionIndex = null;
        let currentQuestion = null;
        let answers = [];

        // Расчет баллов на основе времени ответа
        function calculateScore(answerTime) {
            const maxScore = 1000;
            const questionTime = 60000; // 1 минута
            const score = Math.max(0, Math.floor(maxScore * (1 - answerTime / questionTime)));
            return score;
        }

        // Проверка ответа (глобальная функция) - должна быть определена ДО initApp
        window.verifyAnswer = async function(playerId, isCorrect) {
            console.log('🔍 verifyAnswer вызвана:', { playerId, isCorrect, roomCode, currentQuestionIndex });
            console.log(`🔍 Проверка ответа: playerId=${playerId}, isCorrect=${isCorrect}`);
            console.log(`🔍 Доступные ответы:`, answers.map(a => ({ 
                playerId: a.playerId || a.id, 
                id: a.id,
                playerName: a.playerName,
                verified: a.verified 
            })));
            
            // Ищем ответ по playerId, учитывая разные форматы
            const answer = answers.find(a => {
                const aPlayerId = a.playerId || a.id || '';
                return aPlayerId === playerId || a.id === playerId;
            });
            
            if (!answer) {
                console.error(`❌ Ответ не найден для playerId=${playerId}`);
                console.error(`❌ Все доступные playerId:`, answers.map(a => ({ playerId: a.playerId || a.id, id: a.id })));
                alert(`Ошибка: ответ не найден для playerId=${playerId}`);
                return;
            }
            
            // Проверяем, не проверен ли уже ответ
            if (answer.verified) {
                console.warn(`⚠️ Ответ уже проверен для playerId=${playerId}`);
                // Не блокируем, позволяем изменить проверку
            }

            console.log(`✅ Найден ответ для проверки:`, answer);
            const score = isCorrect ? calculateScore(answer.time) : 0;

            try {
                const response = await fetch('/api/chgk/verify-answer', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        roomCode: roomCode,
                        questionIndex: currentQuestionIndex,
                        playerId: playerId,
                        isCorrect: isCorrect,
                        score: score
                    })
                });

                if (response.ok) {
                    answer.verified = true;
                    answer.verification = {
                        isCorrect: isCorrect,
                        score: score,
                        verifiedAt: Date.now()
                    };
                    updateAnswersList();
                    socket.emit('intellectual-verification-updated', {
                        roomCode: roomCode,
                        questionIndex: currentQuestionIndex
                    });
                }
            } catch (error) {
                console.error('Ошибка проверки ответа:', error);
                alert('Ошибка при проверке ответа');
            }
        };

        // Отмена проверки (глобальная функция) - должна быть определена ДО initApp
        window.revokeVerification = async function(playerId) {
            console.log('🔍 revokeVerification вызвана:', { playerId, roomCode, currentQuestionIndex });
            try {
                const response = await fetch('/api/chgk/revoke-verification', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        roomCode: roomCode,
                        questionIndex: currentQuestionIndex,
                        playerId: playerId
                    })
                });

                if (response.ok) {
                    const answer = answers.find(a => {
                        const aPlayerId = a.playerId || a.id || '';
                        return aPlayerId === playerId || a.id === playerId;
                    });
                    if (answer) {
                        answer.verified = false;
                        answer.verification = null;
                        updateAnswersList();
                        socket.emit('intellectual-verification-updated', {
                            roomCode: roomCode,
                            questionIndex: currentQuestionIndex
                        });
                    }
                }
            } catch (error) {
                console.error('Ошибка отмены проверки:', error);
                alert('Ошибка при отмене проверки');
            }
        };

        function initApp() {
            // Инициализация Frame1
            Frame1.init({
                showBack: true,
                backUrl: '/index.html',
                showSettings: false
            });

            // Получаем код комнаты из URL
            const urlParams = new URLSearchParams(window.location.search);
            roomCode = urlParams.get('room');
            
            if (!roomCode) {
                alert('Код комнаты не указан');
                window.location.href = '/index.html';
                return;
            }

            socket = io();

            // Настраиваем делегирование событий для кнопок проверки
            setupVerificationButtonsDelegation();

            // Регистрируем обработчики событий ПЕРЕД подключением
            setupSocketHandlers();

            // Подключаемся к комнате как комиссия
            socket.emit('intellectual-commission-join', {
                roomCode: roomCode
            });
        }
        
        // Настройка делегирования событий для кнопок проверки
        function setupVerificationButtonsDelegation() {
            const answersListEl = document.getElementById('answers-list');
            if (!answersListEl) {
                // Если элемент еще не существует, попробуем позже
                setTimeout(setupVerificationButtonsDelegation, 100);
                return;
            }
            
            // Удаляем старый обработчик, если он был
            const oldHandler = answersListEl._verificationClickHandler;
            if (oldHandler) {
                answersListEl.removeEventListener('click', oldHandler);
            }
            
            // Создаем новый обработчик
            const clickHandler = function(e) {
                console.log('🔍 Событие клика получено:', e.target, e.currentTarget);
                
                const btn = e.target.closest('.verification-btn');
                if (!btn) {
                    console.log('🔍 Клик не по кнопке проверки, игнорируем');
                    return;
                }
                
                console.log('🔍 Найдена кнопка проверки:', btn);
                
                e.preventDefault();
                e.stopPropagation();
                
                const action = btn.getAttribute('data-action');
                const playerId = btn.getAttribute('data-player-id');
                const isCorrectAttr = btn.getAttribute('data-is-correct');
                
                console.log(`🔍 Атрибуты кнопки: action=${action}, playerId=${playerId}, data-is-correct=${isCorrectAttr}`);
                console.log('🔍 Все атрибуты кнопки:', Array.from(btn.attributes).map(a => `${a.name}="${a.value}"`).join(', '));
                
                if (!playerId) {
                    console.error('❌ playerId не найден в data-атрибуте');
                    console.error('Кнопка HTML:', btn.outerHTML);
                    return;
                }
                
                if (action === 'verify') {
                    const isCorrect = isCorrectAttr === 'true';
                    console.log(`✅ Вызов verifyAnswer: playerId=${playerId}, isCorrect=${isCorrect}`);
                    console.log('🔍 Проверка доступности функции verifyAnswer:', typeof window.verifyAnswer);
                    if (typeof window.verifyAnswer === 'function') {
                        try {
                            window.verifyAnswer(playerId, isCorrect);
                        } catch (error) {
                            console.error('❌ Ошибка при вызове verifyAnswer:', error);
                        }
                    } else {
                        console.error('❌ Функция verifyAnswer не найдена или не является функцией');
                        console.error('window.verifyAnswer:', typeof window.verifyAnswer, window.verifyAnswer);
                        console.error('window объект:', Object.keys(window).filter(k => k.includes('verify')));
                    }
                } else if (action === 'revoke') {
                    console.log(`✅ Вызов revokeVerification: playerId=${playerId}`);
                    console.log('🔍 Проверка доступности функции revokeVerification:', typeof window.revokeVerification);
                    if (typeof window.revokeVerification === 'function') {
                        try {
                            window.revokeVerification(playerId);
                        } catch (error) {
                            console.error('❌ Ошибка при вызове revokeVerification:', error);
                        }
                    } else {
                        console.error('❌ Функция revokeVerification не найдена или не является функцией');
                        console.error('window.revokeVerification:', typeof window.revokeVerification, window.revokeVerification);
                        console.error('window объект:', Object.keys(window).filter(k => k.includes('revoke')));
                    }
                } else {
                    console.error('❌ Неизвестное действие:', action);
                }
            };
            
            // Сохраняем ссылку на обработчик для возможности удаления
            answersListEl._verificationClickHandler = clickHandler;
            answersListEl.addEventListener('click', clickHandler);
            
            // Проверяем доступность функций
            console.log('✅ Делегирование событий настроено для кнопок проверки');
            console.log('🔍 Проверка доступности функций:');
            console.log('  window.verifyAnswer:', typeof window.verifyAnswer);
            console.log('  window.revokeVerification:', typeof window.revokeVerification);
            
            if (typeof window.verifyAnswer !== 'function') {

            }
        });


        // Обновление списка ответов
        function updateAnswersList() {
            const answersListEl = document.getElementById('answers-list');
            const verifiedCountEl = document.getElementById('verified-count');
            
            if (!answersListEl) return;

            const verifiedCount = answers.filter(a => a.verified).length;
            if (verifiedCountEl) {
                verifiedCountEl.textContent = verifiedCount;
            }

            answersListEl.innerHTML = answers.map(answer => {
                const verification = answer.verification;
                const verified = !!verification;
                const isCorrect = verification?.isCorrect;
                const score = verification?.score || 0;
                // Поддерживаем оба формата: answer.answer и answer.text
                const answerText = answer.answer || answer.text || '(Нет ответа)';
                const answerDisplay = answerText.length > 100 ? answerText.substring(0, 100) + '...' : answerText;
                // Поддерживаем оба формата для имени игрока
                const playerName = answer.playerName || 'Неизвестный';
                // Поддерживаем оба формата для playerId
                const playerId = answer.playerId || answer.id || '';
                // Экранируем для HTML атрибутов
                const escapedPlayerId = String(playerId).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                const escapedPlayerName = String(playerName).replace(/"/g, '&quot;').replace(/'/g, '&#39;');

                return `
                    <div class="answer-item ${verified ? (isCorrect ? 'verified' : 'verified incorrect') : ''}" data-player-id="${escapedPlayerId}">
                        <div class="answer-header">
                            <span class="player-name">${escapedPlayerName}</span>
                            <span class="answer-time">${answer.time ? Math.round(answer.time / 1000) : 0}с</span>
                        </div>
                        <div class="answer-text" title="${String(answerText).replace(/"/g, '&quot;')}">${String(answerDisplay).replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>
                        ${verified ? `
                            <div class="verification-status ${!isCorrect ? 'revoked' : ''}">
                                ${isCorrect ? `✓ Правильно (${score})` : '✗ Неправильно'}
                            </div>
                            <div class="verification-controls">
                                <button class="verification-btn revoke" data-action="revoke" data-player-id="${escapedPlayerId}" type="button">
                                    Отменить
                                </button>
                            </div>
                        ` : `
                            <div class="verification-controls">
                                <button class="verification-btn correct" data-action="verify" data-is-correct="true" data-player-id="${escapedPlayerId}" type="button">
                                    ✓
                                </button>
                                <button class="verification-btn incorrect" data-action="verify" data-is-correct="false" data-player-id="${escapedPlayerId}" type="button">
                                    ✗
                                </button>
                            </div>
                        `}
                    </div>
                `;
            }).join('');
            
            // Убеждаемся, что делегирование событий настроено
            setupVerificationButtonsDelegation();
            
            // Убеждаемся, что все кнопки проверки активны и не заблокированы
            setTimeout(() => {
                const verificationButtons = document.querySelectorAll('.verification-btn');
                console.log(`🔍 Найдено ${verificationButtons.length} кнопок проверки`);
                verificationButtons.forEach((btn, index) => {
                    btn.disabled = false;
                    btn.style.pointerEvents = 'auto';
                    btn.style.opacity = '1';
                    btn.style.cursor = 'pointer';
                    
                    // Проверяем наличие data-атрибутов
                    const action = btn.getAttribute('data-action');
                    const playerId = btn.getAttribute('data-player-id');
                    console.log(`  Кнопка ${index + 1}: action=${action}, playerId=${playerId}, disabled=${btn.disabled}`);
                });
                console.log(`✅ Обновлено ${verificationButtons.length} кнопок проверки, все активны`);
            }, 50);
        }

        // Загрузка ответов для текущего вопроса
        async function loadAnswers() {
            try {
                console.log(`📥 Загрузка ответов для комнаты ${roomCode}, вопроса ${currentQuestionIndex}`);
                const response = await fetch(`/api/chgk/answers/${roomCode}/${currentQuestionIndex}`);
                if (!response.ok) {
                    throw new Error(`Ошибка загрузки ответов: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                console.log('📋 Получены данные:', data);
                
                currentQuestion = data.question;
                answers = data.answers || [];

                console.log(`✅ Загружено ${answers.length} ответов`);

                const questionNumberEl = document.getElementById('question-number');
                const questionTextEl = document.getElementById('question-text');
                const correctAnswerEl = document.getElementById('correct-answer');
                const totalAnswersEl = document.getElementById('total-answers');

                if (questionNumberEl) {
                    questionNumberEl.textContent = currentQuestionIndex + 1;
                }
                if (questionTextEl && currentQuestion) {
                    questionTextEl.textContent = currentQuestion.question;
                }
                if (correctAnswerEl && currentQuestion) {
                    // Показываем правильный ответ для всех вопросов
                    if (currentQuestion.answer) {
                        correctAnswerEl.textContent = currentQuestion.answer;
                    } else {
                        correctAnswerEl.textContent = 'Правильный ответ не найден';
                    }
                }
                if (totalAnswersEl) {
                    totalAnswersEl.textContent = answers.length;
                }

                updateAnswersList();
                
                // Проверяем, что кнопки проверки созданы и активны
                setTimeout(() => {
                    const verificationButtons = document.querySelectorAll('.verification-btn');
                    console.log(`🔍 Проверка кнопок проверки: найдено ${verificationButtons.length} кнопок`);
                    verificationButtons.forEach((btn, index) => {
                        console.log(`  Кнопка ${index + 1}: disabled=${btn.disabled}, onclick=${btn.onclick ? 'есть' : 'нет'}, style.display=${btn.style.display}`);
                    });
                }, 100);
            } catch (error) {
                console.error('❌ Ошибка загрузки ответов:', error);
                const answersListEl = document.getElementById('answers-list');
                if (answersListEl) {
                    answersListEl.innerHTML = `<div style="padding: 20px; text-align: center; color: #ff7664;">Ошибка загрузки ответов: ${error.message}</div>`;
                }
            }
        }
    </script>

    <script src="/scripts/layout.js"></script>

    <script src="/scripts/frame5-copyright.js"></script>

</body>
