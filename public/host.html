<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квиз - Главный экран</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <!-- Hub блок для статуса игроков -->
    <div class="hub-container" id="hub-container" style="display: none;">
        <div id="hub-players-list"></div>
    </div>
    
    <div class="container host-container">
        <!-- Лобби -->
        <div id="lobby-screen" class="lobby-screen">
            <h1 class="lobby-title">Создайте комнату</h1>
            <div id="room-code" class="room-code">Создание комнаты...</div>
            <div class="status small">Игроки могут подключиться по этому коду</div>
            <div id="qr-placeholder" class="qr-placeholder" style="display: none;">
                Загрузка QR-кода...
            </div>
            <div id="qr-container" class="qr-container" style="display: none;">
                <canvas id="qrcode"></canvas>
            </div>
            <div id="qr-link" style="display: none; margin: 20px 0; text-align: center;">
                <a id="player-link" href="#" target="_blank" style="color: var(--text-white); text-decoration: underline; font-size: 16px;">Ссылка для игроков</a>
            </div>
            <div class="players-list">
                <h2>Игроки (<span id="players-count">0</span>/14)</h2>
                <div id="players-list"></div>
            </div>
            <button id="start-btn" class="btn primary-action" disabled>Начать игру</button>
        </div>

        <!-- Игровой экран -->
        <div id="game-screen" class="game-screen">
            <!-- Вопрос -->
            <div id="question-screen" class="question-screen">
                <div class="question-number host">
                    Вопрос <span id="question-num">1</span> из <span id="total-questions">10</span>
                </div>
                <div id="question-text" class="question-text host"></div>
                <div id="timer" class="timer host">15</div>
                <div class="status small secondary-info" id="question-status">Игроки отвечают...</div>
            </div>

            <!-- Результаты вопроса -->
            <div id="results-screen" class="results-screen" style="display: none;">
                <h2>Результаты вопроса</h2>
                <div id="correct-answer" class="correct-answer"></div>
                <div class="leaderboard">
                    <h3>Таблица лидеров</h3>
                    <div id="leaderboard"></div>
                </div>
                <button id="next-btn" class="btn primary-action" disabled>Следующий вопрос</button>
            </div>

            <!-- Финальные результаты -->
            <div id="final-results" class="final-results" style="display: none;">
                <h1 style="font-size: 48px; margin-bottom: 40px;">Игра завершена!</h1>
                <div class="leaderboard">
                    <h2>Финальные результаты</h2>
                    <div id="final-leaderboard"></div>
                </div>
                <button id="restart-btn" class="btn primary-action" style="margin-top: 40px;">Новая игра</button>
            </div>
        </div>
    </div>

    <script>
        // Проверка, что страница открыта через сервер
        if (window.location.protocol === 'file:') {
            document.body.innerHTML = `
                <div style="text-align: center; padding: 40px; color: white;">
                    <h1 style="font-size: 48px; margin-bottom: 20px;">Ошибка</h1>
                    <p style="font-size: 24px; margin-bottom: 30px;">
                        Страница открыта неправильно!
                    </p>
                    <p style="font-size: 18px; margin-bottom: 30px;">
                        Откройте страницу через сервер:
                    </p>
                    <a href="http://localhost:3000/host.html" 
                       style="display: inline-block; background: white; color: #667eea; 
                              padding: 15px 30px; border-radius: 10px; text-decoration: none; 
                              font-size: 20px; font-weight: bold; margin-top: 20px;">
                        http://localhost:3000/host.html
                    </a>
                    <p style="font-size: 16px; margin-top: 30px; opacity: 0.8;">
                        Убедитесь, что сервер запущен: <code>node server.js</code>
                    </p>
                </div>
            `;
            throw new Error('Страница должна быть открыта через http://localhost:3000/');
        }

        // Ожидание загрузки socket.io
        function waitForSocketIO(callback, maxAttempts = 50) {
            let attempts = 0;
            const checkInterval = setInterval(() => {
                attempts++;
                if (typeof io !== 'undefined') {
                    clearInterval(checkInterval);
                    callback();
                } else if (attempts >= maxAttempts) {
                    clearInterval(checkInterval);
                    console.error('Socket.io не загружен за 5 секунд!');
                    document.body.innerHTML = `
                        <div style="text-align: center; padding: 40px; color: white;">
                            <h1 style="font-size: 48px; margin-bottom: 20px;">Ошибка загрузки</h1>
                            <p style="font-size: 24px; margin-bottom: 30px;">
                                Socket.io не загружен
                            </p>
                            <p style="font-size: 18px; margin-bottom: 30px;">
                                Убедитесь, что сервер запущен и откройте:
                            </p>
                            <a href="http://localhost:3000/host.html" 
                               style="display: inline-block; background: white; color: #667eea; 
                                      padding: 15px 30px; border-radius: 10px; text-decoration: none; 
                                      font-size: 20px; font-weight: bold; margin-top: 20px;">
                                http://localhost:3000/host.html
                            </a>
                            <p style="font-size: 16px; margin-top: 30px; opacity: 0.8;">
                                Запустите сервер: <code>node server.js</code>
                            </p>
                        </div>
                    `;
                }
            }, 100);
        }

        // Инициализация после загрузки socket.io
        waitForSocketIO(() => {
            initApp();
        });

        let socket = null;
        let roomCode = null;
        let currentTimer = null;
        let serverUrl = null;

        function initApp() {
            socket = io();

            // Получение IP-адреса сервера
            async function getServerUrl() {
                try {
                    const response = await fetch('/api/server-ip');
                    const data = await response.json();
                    serverUrl = data.url;
                    console.log('IP сервера:', serverUrl);
                    return serverUrl;
                } catch (error) {
                    console.error('Ошибка получения IP:', error);
                    // Используем текущий origin как fallback
                    serverUrl = window.location.origin;
                    return serverUrl;
                }
            }

            // Генерация QR-кода через API
            async function generateQRCode(roomCode) {
                // Получаем URL сервера с IP-адресом
                if (!serverUrl) {
                    await getServerUrl();
                }
                
                // Формируем URL для игрока
                const baseUrl = serverUrl || window.location.origin;
                const playerUrl = `${baseUrl}/player.html?room=${roomCode}`;
                console.log('Генерация QR-кода для URL:', playerUrl);
                
                const qrContainer = document.getElementById('qr-container');
                const qrPlaceholder = document.getElementById('qr-placeholder');
                const qrCanvas = document.getElementById('qrcode');
                
                // Показываем ссылку для игроков сразу
                const qrLink = document.getElementById('qr-link');
                const playerLink = document.getElementById('player-link');
                if (qrLink && playerLink) {
                    playerLink.href = playerUrl;
                    playerLink.textContent = playerUrl;
                    qrLink.style.display = 'block';
                }
                
                // Показываем индикатор загрузки
                qrPlaceholder.style.display = 'block';
                qrPlaceholder.innerHTML = 'Генерация QR-кода...';
                qrContainer.style.display = 'none';
                
                // Генерируем QR-код через API
                const apiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(playerUrl)}`;
                const img = document.createElement('img');
                img.src = apiUrl;
                img.alt = 'QR Code';
                img.style.maxWidth = '100%';
                img.style.height = 'auto';
                img.crossOrigin = 'anonymous';
                
                img.onload = function() {
                    try {
                        // Очищаем canvas и рисуем изображение
                        const ctx = qrCanvas.getContext('2d');
                        qrCanvas.width = 250;
                        qrCanvas.height = 250;
                        // Очищаем canvas
                        ctx.clearRect(0, 0, 250, 250);
                        // Рисуем белый фон
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, 250, 250);
                        // Рисуем QR-код
                        ctx.drawImage(img, 0, 0, 250, 250);
                        qrPlaceholder.style.display = 'none';
                        qrContainer.style.display = 'flex';
                        console.log('QR-код успешно сгенерирован через API');
                    } catch (error) {
                        console.error('Ошибка при отрисовке QR-кода:', error);
                        // Если не получилось нарисовать на canvas, просто показываем изображение
                        qrContainer.innerHTML = '';
                        qrContainer.appendChild(img);
                        qrPlaceholder.style.display = 'none';
                        qrContainer.style.display = 'flex';
                    }
                };
                
                img.onerror = function() {
                    console.error('Не удалось загрузить QR-код через API');
                    qrPlaceholder.style.display = 'block';
                    qrPlaceholder.innerHTML = `
                        <div style="text-align: center; padding: 20px;">
                            <strong>QR-код недоступен</strong><br>
                            Используйте ссылку выше<br>
                            <strong>Код: ${roomCode}</strong>
                        </div>
                    `;
                    qrContainer.style.display = 'none';
                };
                
                // Загружаем изображение
                img.style.display = 'none';
                document.body.appendChild(img);
            }

            // Создание комнаты
            async function createRoom() {
                const roomCodeElement = document.getElementById('room-code');
                const qrPlaceholder = document.getElementById('qr-placeholder');
                
                try {
                    console.log('Попытка создать комнату...');
                    roomCodeElement.textContent = 'Подключение к серверу...';
                    
                    // Сначала получаем IP-адрес сервера
                    await getServerUrl();
                    
                    const response = await fetch('/api/create-room', { method: 'POST' });
                    
                    if (!response.ok) {
                        throw new Error(`Ошибка сервера: ${response.status} ${response.statusText}`);
                    }
                    
                    const data = await response.json();
                    console.log('Комната создана:', data);
                    
                    if (!data.roomCode) {
                        throw new Error('Сервер не вернул код комнаты');
                    }
                    
                    roomCode = data.roomCode;
                    
                    // Обновляем отображение кода комнаты
                    roomCodeElement.textContent = roomCode;
                    console.log('Код комнаты установлен:', roomCode);
                    
                    // Показываем IP-адрес для подключения
                    if (serverUrl && serverUrl !== window.location.origin) {
                        const ipInfo = document.createElement('div');
                        ipInfo.className = 'status';
                        ipInfo.style.marginTop = '10px';
                        ipInfo.style.fontSize = '14px';
                        ipInfo.innerHTML = `Подключение: <strong>${serverUrl}</strong>`;
                        roomCodeElement.parentNode.insertBefore(ipInfo, roomCodeElement.nextSibling);
                    }
                    
                    // Генерируем QR-код
                    console.log('Начинаем генерацию QR-кода...');
                    await generateQRCode(roomCode);
                    
                    // Подключаемся к комнате
                    socket.emit('host-join', roomCode);
                } catch (error) {
                    console.error('Ошибка создания комнаты:', error);
                    roomCodeElement.textContent = 'Ошибка подключения';
                    
                    // Показываем подробную ошибку
                    if (qrPlaceholder) {
                        qrPlaceholder.style.display = 'block';
                        qrPlaceholder.innerHTML = `
                            <strong>Ошибка:</strong><br>
                            ${error.message}<br><br>
                            <strong>Убедитесь, что:</strong><br>
                            1. Сервер запущен (npm start)<br>
                            2. Вы открыли страницу через http://localhost:3000/host.html<br>
                            3. Нет проблем с сетью
                        `;
                    }
                }
            }

            // Подключение хоста
            socket.on('host-connected', (data) => {
                console.log('Хост подключен');
                updatePlayersList(data.players || []);
                updateHubPlayers(data.players || []);
            });

            // Обновление списка игроков
            socket.on('player-list-updated', (data) => {
                updatePlayersList(data.players || []);
                updateHubPlayers(data.players || []);
            });

            function updatePlayersList(players) {
                const list = document.getElementById('players-list');
                list.innerHTML = '';
                players.forEach(player => {
                    const item = document.createElement('div');
                    item.className = 'player-item';
                    item.textContent = player.name;
                    list.appendChild(item);
                });
                document.getElementById('players-count').textContent = players.length;
                document.getElementById('start-btn').disabled = players.length === 0;
            }
            
            // Функция обновления hub блока
            function updateHubPlayers(players) {
                const hubList = document.getElementById('hub-players-list');
                const hubContainer = document.getElementById('hub-container');
                
                if (!hubList || !hubContainer) return;
                
                if (players.length === 0) {
                    hubContainer.style.display = 'none';
                    return;
                }
                
                // Показываем hub, если есть игроки
                hubContainer.style.display = 'block';
                
                hubList.innerHTML = '';
                players.forEach(player => {
                    const sticker = document.createElement('div');
                    sticker.className = 'hub-player-sticker';
                    // По умолчанию показываем "!" (не готов) - статус будет обновляться при ready-status
                    sticker.innerHTML = `
                        <span class="hub-player-name">${player.name}</span>
                        <span class="hub-status-indicator" data-status="waiting">!</span>
                    `;
                    hubList.appendChild(sticker);
                });
            }

            // Начало игры
            document.getElementById('start-btn').addEventListener('click', () => {
                socket.emit('start-game', roomCode);
            });

            socket.on('game-started', () => {
                document.getElementById('lobby-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'block';
                // Показываем hub блок
                const hubContainer = document.getElementById('hub-container');
                if (hubContainer) {
                    hubContainer.style.display = 'block';
                }
            });

            // Вопрос
            socket.on('question', (data) => {
                document.getElementById('question-screen').style.display = 'block';
                document.getElementById('results-screen').style.display = 'none';
                document.getElementById('final-results').style.display = 'none';
                
                // Сбрасываем статусы ответов в hub на "не ответил" (?)
                const hubList = document.getElementById('hub-players-list');
                if (hubList) {
                    const stickers = hubList.querySelectorAll('.hub-player-sticker');
                    stickers.forEach(sticker => {
                        const indicator = sticker.querySelector('.hub-status-indicator');
                        if (indicator) {
                            indicator.textContent = '?';
                            indicator.setAttribute('data-status', 'answering');
                        }
                    });
                }
                
                document.getElementById('question-num').textContent = data.questionNumber;
                document.getElementById('total-questions').textContent = data.totalQuestions;
                document.getElementById('question-text').textContent = data.question;
                
                // Таймер
                let timeLeft = data.time;
                document.getElementById('timer').textContent = timeLeft;
                document.getElementById('question-status').textContent = 'Игроки отвечают...';
                
                if (currentTimer) clearInterval(currentTimer);
                currentTimer = setInterval(() => {
                    timeLeft--;
                    document.getElementById('timer').textContent = timeLeft;
                    if (timeLeft <= 0) {
                        clearInterval(currentTimer);
                    }
                }, 1000);
            });

            // Статус ответов игроков
            socket.on('answer-status', (data) => {
                const questionStatus = document.getElementById('question-status');
                
                // Обновляем hub блок с статусами ответов
                if (data.players && data.players.length > 0) {
                    const hubList = document.getElementById('hub-players-list');
                    if (hubList) {
                        const stickers = hubList.querySelectorAll('.hub-player-sticker');
                        data.players.forEach((player) => {
                            // Находим стикер по имени игрока
                            const sticker = Array.from(stickers).find(st => {
                                const nameElement = st.querySelector('.hub-player-name');
                                return nameElement && nameElement.textContent.trim() === player.name.trim();
                            });
                            
                            if (sticker) {
                                const indicator = sticker.querySelector('.hub-status-indicator');
                                if (indicator) {
                                    if (player.answered) {
                                        indicator.textContent = '✓';
                                        indicator.setAttribute('data-status', 'answered');
                                    } else {
                                        indicator.textContent = '?';
                                        indicator.setAttribute('data-status', 'answering');
                                    }
                                }
                            }
                        });
                    }
                }
                
                if (data.allAnswered) {
                    if (questionStatus) questionStatus.textContent = 'Все ответили! Переход к результатам...';
                    if (currentTimer) clearInterval(currentTimer);
                } else {
                    if (questionStatus) questionStatus.textContent = `Игроки отвечают... (${data.answeredCount}/${data.totalPlayers})`;
                }
            });

            // Результаты вопроса
            socket.on('results', (data) => {
                clearInterval(currentTimer);
                document.getElementById('question-screen').style.display = 'none';
                document.getElementById('results-screen').style.display = 'block';
                
                // Сбрасываем статусы готовности в hub на "не готов" (!)
                if (data.players && data.players.length > 0) {
                    const hubList = document.getElementById('hub-players-list');
                    if (hubList) {
                        const stickers = hubList.querySelectorAll('.hub-player-sticker');
                        stickers.forEach(sticker => {
                            const indicator = sticker.querySelector('.hub-status-indicator');
                            if (indicator) {
                                indicator.textContent = '!';
                                indicator.setAttribute('data-status', 'waiting');
                            }
                        });
                    }
                }
                
                
                document.getElementById('correct-answer').textContent = 
                    `Правильный ответ: ${data.correctAnswerText}`;
                
                const leaderboard = document.getElementById('leaderboard');
                leaderboard.innerHTML = '';
                data.players.forEach((player, index) => {
                    const item = document.createElement('div');
                    let className = 'leaderboard-item';
                    if (index === 0) className += ' first';
                    else if (index === 1) className += ' second host-second';
                    else if (index === 2) className += ' third';
                    
                    item.className = className;
                    item.style.animationDelay = (index * 0.1) + 's';
                    
                    item.innerHTML = `
                        <span>${index + 1}. ${player.name}</span>
                        <span>${player.score} очков</span>
                    `;
                    leaderboard.appendChild(item);
                });

                // Сбрасываем кнопку следующего вопроса
                const nextBtn = document.getElementById('next-btn');
                if (nextBtn) nextBtn.disabled = true;
            });

            // Статус готовности игроков
            socket.on('ready-status', (data) => {
                console.log('ready-status получен:', data);
                const nextBtn = document.getElementById('next-btn');
                
                // Обновляем hub блок с статусами готовности
                if (data.players && data.players.length > 0) {
                    const hubList = document.getElementById('hub-players-list');
                    if (hubList) {
                        const stickers = hubList.querySelectorAll('.hub-player-sticker');
                        data.players.forEach((player) => {
                            // Находим стикер по имени игрока
                            const sticker = Array.from(stickers).find(st => {
                                const nameElement = st.querySelector('.hub-player-name');
                                return nameElement && nameElement.textContent.trim() === player.name.trim();
                            });
                            
                            if (sticker) {
                                const indicator = sticker.querySelector('.hub-status-indicator');
                                if (indicator) {
                                    if (player.ready) {
                                        indicator.textContent = '✓';
                                        indicator.setAttribute('data-status', 'ready');
                                    } else {
                                        indicator.textContent = '!';
                                        indicator.setAttribute('data-status', 'waiting');
                                    }
                                }
                            }
                        });
                    }
                }
                
                // Управляем кнопкой следующего вопроса
                if (nextBtn) {
                    if (data.allReady) {
                        nextBtn.disabled = false;
                        console.log('Кнопка "Следующий вопрос" активирована');
                    } else {
                        nextBtn.disabled = true;
                    }
                }
            });

            // Следующий вопрос
            document.getElementById('next-btn').addEventListener('click', () => {
                socket.emit('next-question', roomCode);
            });

            // Финальные результаты
            socket.on('game-finished', (data) => {
            document.getElementById('question-screen').style.display = 'none';
            document.getElementById('results-screen').style.display = 'none';
            document.getElementById('final-results').style.display = 'block';
            
            const leaderboard = document.getElementById('final-leaderboard');
            leaderboard.innerHTML = '';
            const finalMessages = {
                0: 'Чемпион!',
                1: 'Второе место!',
                2: 'Третье место!'
            };
            
            data.results.forEach((player, index) => {
                const item = document.createElement('div');
                let className = 'leaderboard-item';
                if (index === 0) className += ' first';
                else if (index === 1) className += ' second host-second';
                else if (index === 2) className += ' third';
                
                item.className = className;
                item.style.animationDelay = (index * 0.1) + 's';
                
                const message = finalMessages[index] || '';
                item.innerHTML = `
                    <span>${index + 1}. ${player.name} ${message}</span>
                    <span>${player.score} очков</span>
                `;
                leaderboard.appendChild(item);
            });
        });

            // Новая игра
            document.getElementById('restart-btn').addEventListener('click', () => {
                location.reload();
            });

            // Инициализация
            createRoom();
        } // конец initApp()
    </script>
</body>
</html>
