<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квиз - Главный экран</title>
    <link rel="stylesheet" href="/styles/brand-style.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* Специфичные стили для страницы хоста */
        .lobby-screen {
            text-align: center;
        }
        
        /* Отступ для контента, чтобы hub не перекрывал текст */
        body.with-hub .container {
            padding-top: 80px;
        }
        
        @media (max-width: 768px) {
            body.with-hub .container {
                padding-top: 100px;
            }
        }

        .room-code {
            font-size: 72px;
            font-weight: bold;
            letter-spacing: 10px;
            margin: 30px 0;
            font-family: 'Days One', sans-serif;
            color: var(--color-dark);
        }

        #qrcode {
            display: block;
            margin: 0 auto;
        }

        .qr-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            text-align: center;
        }

        .qr-placeholder {
            text-align: center;
            margin: 20px 0;
            font-size: 16px;
            opacity: 0.7;
        }

        /* Адаптивные стили для QR-кода */
        @media (max-width: 768px) {
            .qr-container {
                margin: 15px 0;
            }
            
            #qrcode {
                max-width: 200px;
                height: auto;
            }
        }

        @media (max-width: 480px) {
            .qr-container {
                margin: 10px 0;
            }
            
            #qrcode {
                max-width: 180px;
                height: auto;
            }
            
            .room-code {
                font-size: 48px;
                letter-spacing: 6px;
            }
        }

        .game-screen {
            display: none;
        }

        .question-screen {
            text-align: center;
        }

        .question-number {
            font-size: 24px;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .question-text {
            font-size: 36px;
            margin: 40px 0;
            line-height: 1.4;
            font-family: 'Days One', sans-serif;
            color: var(--color-dark);
        }

        .results-screen {
            text-align: center;
        }

        .correct-answer {
            background: rgba(0, 193, 89, 0.25);
            border: 3px solid var(--color-green-alt);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            font-size: 24px;
            font-family: 'Days One', sans-serif;
            color: var(--color-dark);
            box-shadow: 
                0 4px 0px rgba(0, 193, 89, 0.3),
                0 6px 12px rgba(0, 193, 89, 0.2);
        }

        .final-results {
            text-align: center;
        }

        .final-results h1 {
            font-size: 48px;
            margin-bottom: 40px;
        }

        /* HUB стили */
        .hub {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255, 242, 242, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            z-index: 1000;
            border-bottom: none;
            box-shadow: none;
        }

        .hub-content {
            max-width: 1400px;
            margin: 0;
            padding-left: 20px;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .hub-players {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }

        .hub-player {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(245, 245, 245, 0.85);
            border: 2px solid #393639;
            border-radius: 20px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: 'Nunito', sans-serif;
            box-shadow: 
                0 2px 0px rgba(0, 0, 0, 0.2),
                0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .hub-player:hover {
            background: rgba(245, 245, 245, 0.6);
            transform: translateY(-2px);
        }

        .hub-player-name {
            font-weight: 500;
        }

        .hub-player-status {
            font-size: 16px;
            min-width: 18px;
            text-align: center;
        }

        .hub-player-status.answering {
            color: #FF9800;
        }

        .hub-player-status.answered {
            color: #4CAF50;
        }

        .hub-player-status.ready {
            color: #4CAF50;
        }

        .hub-player-status.waiting {
            color: #FF9800;
        }

        .hub-player-status.loading {
            color: #9E9E9E;
        }

        .hub-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }


        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        /* Унифицированная кнопка Назад */
        .back-button-hub {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(245, 245, 245, 0.85);
            border: 2px solid #393639;
            border-radius: 12px;
            color: #393639;
            text-decoration: none;
            font-family: 'Days One', sans-serif;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.3s;
            box-shadow: 
                0 2px 0px rgba(0, 0, 0, 0.2),
                0 4px 8px rgba(0, 0, 0, 0.1);
            white-space: nowrap;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        
        .back-button-hub:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 0px rgba(0, 0, 0, 0.3),
                0 8px 16px rgba(0, 0, 0, 0.15);
            background: rgba(245, 245, 245, 0.6);
        }
        
        .back-button-hub:active {
            transform: translateY(0px);
        }

    </style>
</head>
<body class="with-hub">
    <!-- HUB блок -->
    <div class="hub" id="hub">
        <div class="hub-content">
            <div class="hub-actions">
                <a href="/gnu-quiz.html" class="back-button-hub">← Назад</a>
            </div>
            <div class="hub-players" id="hub-players">
                <!-- Игроки будут добавлены динамически -->
            </div>
        </div>
    </div>

    <div class="container">
        <!-- Лобби -->
        <div id="lobby-screen" class="lobby-screen">
            <h1>Создайте комнату</h1>
            <div id="room-code" class="room-code">Создание комнаты...</div>
            <div class="status">Игроки могут подключиться по этому коду</div>
            <div id="qr-placeholder" class="qr-placeholder" style="display: none;">
                Загрузка QR-кода...
            </div>
            <div id="qr-container" class="qr-container" style="display: none;">
                <canvas id="qrcode"></canvas>
            </div>
            <div id="qr-link" style="display: none; margin: 20px 0; text-align: center;">
                <a id="player-link" href="#" target="_blank" style="color: white; text-decoration: underline; font-size: 16px;">Ссылка для игроков</a>
            </div>
            
            <div style="display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-top: 32px;">
                <button id="start-btn" class="btn">Начать игру</button>
            </div>
        </div>


        <!-- Модальное окно для ввода пароля -->
        <div id="password-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(56, 54, 56, 0.85); z-index: 3000; justify-content: center; align-items: center;">
            <div style="background: #F2F2F2; padding: 30px; border-radius: 25px; text-align: center; max-width: 400px; width: 90%; border: 3px solid #383638; box-shadow: 0 6px 0px rgba(0, 193, 89, 0.3), 0 8px 16px rgba(0, 0, 0, 0.2); box-sizing: border-box;">
                <h2 style="margin-bottom: 15px; font-size: 24px; font-family: 'Days One', sans-serif; color: #00C159; font-weight: 700;">Введите пароль</h2>
                <p style="margin-bottom: 15px; font-size: 14px; color: #383638; font-family: 'Nunito', sans-serif;">
                    Эта комната защищена паролем
                </p>
                <input type="password" id="password-input" placeholder="Пароль" style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 12px; border: 3px solid #383638; background: #FFFFFF; color: #383638; font-size: 16px; text-align: center; font-family: 'Days One', sans-serif; font-weight: 600; letter-spacing: 2px; box-sizing: border-box;" autofocus>
                <div id="password-error" style="color: #ff7674; margin-bottom: 15px; font-size: 13px; display: none; font-family: 'Nunito', sans-serif; font-weight: 600; min-height: 20px;"></div>
                <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; width: 100%;">
                    <button id="password-submit" class="btn" style="background: #00C159; border: 3px solid #383638; color: #FFFFFF; font-weight: 700; padding: 12px 24px; font-size: 16px; flex: 1; min-width: 140px; max-width: 180px; box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Ввод</button>
                    <button id="password-cancel" class="btn secondary" style="background: #F2F2F2; border: 3px solid #383638; color: #383638; padding: 12px 24px; font-size: 16px; flex: 1; min-width: 140px; max-width: 180px; box-sizing: border-box; white-space: nowrap;">Отмена</button>
                </div>
            </div>
        </div>

        <!-- Игровой экран -->
        <div id="game-screen" class="game-screen">
            
            <!-- Вопрос -->
            <div id="question-screen" class="question-screen">
                <div class="question-number">
                    Вопрос <span id="question-num">1</span> из <span id="total-questions">10</span>
                </div>
                <div id="question-text" class="question-text"></div>
                <div id="timer" class="timer">15</div>
                <div class="status" id="question-status">Игроки отвечают...</div>
            </div>

            <!-- Результаты вопроса -->
            <div id="results-screen" class="results-screen" style="display: none;">
                <h2>Результаты вопроса</h2>
                <div id="correct-answer" class="correct-answer"></div>
                <div class="leaderboard">
                    <h3>Таблица лидеров</h3>
                    <div id="leaderboard"></div>
                </div>
                <button id="next-btn" class="btn" disabled>Следующий вопрос</button>
                <div id="next-btn-status" class="status" style="margin-top: 10px; font-size: 14px;"></div>
            </div>

            <!-- Финальные результаты -->
            <div id="final-results" class="final-results" style="display: none;">
                <h1>Игра завершена!</h1>
                <div class="leaderboard">
                    <h2>Финальные результаты</h2>
                    <div id="final-leaderboard"></div>
                </div>
                <button id="restart-btn" class="btn">Новая игра</button>
            </div>
        </div>
    </div>

    <script>
        // Проверка, что страница открыта через сервер
        if (window.location.protocol === 'file:') {
            document.body.innerHTML = `
                <div style="text-align: center; padding: 40px; color: white;">
                    <h1 style="font-size: 48px; margin-bottom: 20px;">⚠️ Ошибка</h1>
                    <p style="font-size: 24px; margin-bottom: 30px;">
                        Страница открыта неправильно!
                    </p>
                    <p style="font-size: 18px; margin-bottom: 30px;">
                        Откройте страницу через сервер:
                    </p>
                    <a href="http://localhost:3000/host.html" 
                       style="display: inline-block; background: white; color: #667eea; 
                              padding: 15px 30px; border-radius: 10px; text-decoration: none; 
                              font-size: 20px; font-weight: bold; margin-top: 20px;">
                        http://localhost:3000/host.html
                    </a>
                    <p style="font-size: 16px; margin-top: 30px; opacity: 0.8;">
                        Убедитесь, что сервер запущен: <code>node server.js</code>
                    </p>
                </div>
            `;
            throw new Error('Страница должна быть открыта через http://localhost:3000/');
        }

        // Ожидание загрузки socket.io
        function waitForSocketIO(callback, maxAttempts = 50) {
            let attempts = 0;
            const checkInterval = setInterval(() => {
                attempts++;
                if (typeof io !== 'undefined') {
                    clearInterval(checkInterval);
                    callback();
                } else if (attempts >= maxAttempts) {
                    clearInterval(checkInterval);
                    console.error('Socket.io не загружен за 5 секунд!');
                    document.body.innerHTML = `
                        <div style="text-align: center; padding: 40px; color: white;">
                            <h1 style="font-size: 48px; margin-bottom: 20px;">❌ Ошибка загрузки</h1>
                            <p style="font-size: 24px; margin-bottom: 30px;">
                                Socket.io не загружен
                            </p>
                            <p style="font-size: 18px; margin-bottom: 30px;">
                                Убедитесь, что сервер запущен и откройте:
                            </p>
                            <a href="http://localhost:3000/host.html" 
                               style="display: inline-block; background: white; color: #667eea; 
                                      padding: 15px 30px; border-radius: 10px; text-decoration: none; 
                                      font-size: 20px; font-weight: bold; margin-top: 20px;">
                                http://localhost:3000/host.html
                            </a>
                            <p style="font-size: 16px; margin-top: 30px; opacity: 0.8;">
                                Запустите сервер: <code>node server.js</code>
                            </p>
                        </div>
                    `;
                }
            }, 100);
        }

        // Инициализация после загрузки socket.io
        waitForSocketIO(() => {
            initApp();
        });

        let socket = null;
        let roomCode = null;
        let currentTimer = null;
        let serverUrl = null;
        let quizId = null;
        
        // Переменные для соло режима

        // Функция для определения цвета квиза
        function getQuizColors(quizId) {
            const quizColors = {
                'gnu': { bg: '#abf67c', text: '#2fb95d', shadow: 'rgba(47, 185, 93, 0.3)' },
                'friends-quiz': { bg: '#abf67c', text: '#2fb95d', shadow: 'rgba(47, 185, 93, 0.3)' }, // Обратная совместимость
                'gnu-multiplayer': { bg: '#abf67c', text: '#2fb95d', shadow: 'rgba(47, 185, 93, 0.3)' } // Обратная совместимость
            };
            return quizColors[quizId] || { bg: '#FFFFFF', text: '#393639', shadow: 'rgba(57, 54, 57, 0.3)' };
        }
        
        // Функция для применения цветов к кнопкам
        function applyQuizColors(colors) {
            const style = document.createElement('style');
            style.id = 'quiz-colors-style';
            style.textContent = `
                .btn:not(.back-button-hub):not(.password-button) {
                    background: ${colors.bg} !important;
                    color: ${colors.text} !important;
                    box-shadow: 0 6px 0px ${colors.shadow}, 0 8px 16px rgba(0, 0, 0, 0.1) !important;
                }
                .btn:not(.back-button-hub):not(.password-button):hover:not(:disabled) {
                    box-shadow: 0 8px 0px ${colors.shadow}, 0 12px 24px rgba(0, 0, 0, 0.15) !important;
                }
            `;
            // Удаляем старый стиль, если есть
            const oldStyle = document.getElementById('quiz-colors-style');
            if (oldStyle) {
                oldStyle.remove();
            }
            document.head.appendChild(style);
        }
        
        function initApp() {
            // Получаем quizId из URL
            const urlParams = new URLSearchParams(window.location.search);
            quizId = urlParams.get('quiz');
            
            // Применяем цвета квиза к кнопкам
            if (quizId) {
                const colors = getQuizColors(quizId);
                applyQuizColors(colors);
            }
            
            // Пароли для разных квизов (поддерживаем как новый ID 'gnu', так и старые)
            const passwords = {
                'gnu': '1234',
                'friends-quiz': '1234', // Обратная совместимость
                'gnu-multiplayer': '1234' // Обратная совместимость
            };
            
            // Ключи localStorage для разных квизов
            const storageKeys = {
                'gnu': 'gnuPasswordVerified',
                'friends-quiz': 'gnuPasswordVerified', // Обратная совместимость
                'gnu-multiplayer': 'gnuPasswordVerified' // Обратная совместимость
            };
            
            // Список квизов, требующих пароль
            const quizzesRequiringPassword = Object.keys(passwords);
            
            // Если quizId не указан, перенаправляем на главную страницу
            if (!quizId) {
                window.location.href = '/index.html';
                return;
            }
            
            socket = io();

            // Получение IP-адреса сервера
            async function getServerUrl() {
                try {
                    const response = await fetch('/api/server-ip');
                    const data = await response.json();
                    serverUrl = data.url;
                    console.log('IP сервера:', serverUrl);
                    return serverUrl;
                } catch (error) {
                    console.error('Ошибка получения IP:', error);
                    // Используем текущий origin как fallback
                    serverUrl = window.location.origin;
                    return serverUrl;
                }
            }

            // Генерация QR-кода через API
            async function generateQRCode(roomCode) {
                // Получаем URL сервера с IP-адресом
                if (!serverUrl) {
                    await getServerUrl();
                }
                
                // Формируем URL для игрока
                const baseUrl = serverUrl || window.location.origin;
                const playerUrl = `${baseUrl}/player.html?room=${roomCode}`;
                console.log('Генерация QR-кода для URL:', playerUrl);
                
                const qrContainer = document.getElementById('qr-container');
                const qrPlaceholder = document.getElementById('qr-placeholder');
                const qrCanvas = document.getElementById('qrcode');
                
                // Показываем ссылку для игроков сразу
                const qrLink = document.getElementById('qr-link');
                const playerLink = document.getElementById('player-link');
                if (qrLink && playerLink) {
                    playerLink.href = playerUrl;
                    playerLink.textContent = playerUrl;
                    qrLink.style.display = 'block';
                }
                
                // Показываем индикатор загрузки
                qrPlaceholder.style.display = 'block';
                qrPlaceholder.innerHTML = 'Генерация QR-кода...';
                qrContainer.style.display = 'none';
                
                // Генерируем QR-код через API
                const apiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(playerUrl)}`;
                const img = document.createElement('img');
                img.src = apiUrl;
                img.alt = 'QR Code';
                img.style.maxWidth = '100%';
                img.style.height = 'auto';
                img.crossOrigin = 'anonymous';
                
                img.onload = function() {
                    try {
                        // Очищаем canvas и рисуем изображение
                        const ctx = qrCanvas.getContext('2d');
                        qrCanvas.width = 250;
                        qrCanvas.height = 250;
                        // Очищаем canvas
                        ctx.clearRect(0, 0, 250, 250);
                        // Рисуем белый фон
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, 250, 250);
                        // Рисуем QR-код
                        ctx.drawImage(img, 0, 0, 250, 250);
                        qrPlaceholder.style.display = 'none';
                        qrContainer.style.display = 'flex';
                        console.log('QR-код успешно сгенерирован через API');
                    } catch (error) {
                        console.error('Ошибка при отрисовке QR-кода:', error);
                        // Если не получилось нарисовать на canvas, просто показываем изображение
                        qrContainer.innerHTML = '';
                        qrContainer.appendChild(img);
                        qrPlaceholder.style.display = 'none';
                        qrContainer.style.display = 'flex';
                    }
                };
                
                img.onerror = function() {
                    console.error('Не удалось загрузить QR-код через API');
                    qrPlaceholder.style.display = 'block';
                    qrPlaceholder.innerHTML = `
                        <div style="text-align: center; padding: 20px;">
                            <strong>QR-код недоступен</strong><br>
                            Используйте ссылку выше<br>
                            <strong>Код: ${roomCode}</strong>
                        </div>
                    `;
                    qrContainer.style.display = 'none';
                };
                
                // Загружаем изображение
                img.style.display = 'none';
                document.body.appendChild(img);
            }

            // Создание комнаты
            async function createRoom(password = null) {
                const roomCodeElement = document.getElementById('room-code');
                const qrPlaceholder = document.getElementById('qr-placeholder');
                
                try {
                    console.log('Попытка создать комнату...');
                    roomCodeElement.textContent = 'Подключение к серверу...';
                    
                    // Сначала получаем IP-адрес сервера
                    await getServerUrl();
                    
                    // Проверяем, пришел ли пользователь со страницы выбора режима
                    const passwordParam = urlParams.get('password');
                    const storageKey = storageKeys[quizId];
                    const passwordVerified = passwordParam === 'verified' || (storageKey && localStorage.getItem(storageKey) === 'true');
                    
                    // Если пароль уже проверен на странице выбора режима, передаем его автоматически
                    const requiredPassword = passwords[quizId];
                    if (requiredPassword && passwordVerified && !password) {
                        password = requiredPassword;
                    }
                    
                    const requestBody = { quizId: quizId };
                    if (password) {
                        requestBody.password = password;
                    }
                    
                    const response = await fetch('/api/create-room', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(requestBody)
                    });
                    
                    if (!response.ok) {
                        let errorData;
                        try {
                            errorData = await response.json();
                        } catch (e) {
                            errorData = { error: `Ошибка сервера: ${response.status} ${response.statusText}` };
                        }
                        
                        if (errorData.requiresPassword) {
                            // Проверяем, пришел ли пользователь со страницы выбора режима
                            const passwordParam = urlParams.get('password');
                            const storageKey = storageKeys[quizId];
                            const passwordVerified = passwordParam === 'verified' || (storageKey && localStorage.getItem(storageKey) === 'true');
                            
                            // Если пароль уже проверен, но сервер все равно требует пароль, пробуем еще раз с паролем
                            const requiredPassword = passwords[quizId];
                            if (passwordVerified && requiredPassword) {
                                createRoom(requiredPassword);
                                return;
                            }
                            
                            // Показываем модальное окно для ввода пароля только если пароль не был проверен
                            showPasswordModal((enteredPassword) => {
                                if (storageKey) {
                                    localStorage.setItem(storageKey, 'true');
                                }
                                createRoom(enteredPassword);
                            });
                            return;
                        }
                        throw new Error(errorData.error || `Ошибка сервера: ${response.status} ${response.statusText}`);
                    }
                    
                    const data = await response.json();
                    console.log('Комната создана:', data);
                    
                    if (!data.roomCode) {
                        throw new Error('Сервер не вернул код комнаты');
                    }
                    
                    roomCode = data.roomCode;
                    
                    // Обновляем отображение кода комнаты
                    roomCodeElement.textContent = roomCode;
                    console.log('Код комнаты установлен:', roomCode);
                    
                    // Показываем IP-адрес для подключения
                    if (serverUrl && serverUrl !== window.location.origin) {
                        const ipInfo = document.createElement('div');
                        ipInfo.className = 'status';
                        ipInfo.style.marginTop = '10px';
                        ipInfo.style.fontSize = '14px';
                        ipInfo.innerHTML = `Подключение: <strong>${serverUrl}</strong>`;
                        roomCodeElement.parentNode.insertBefore(ipInfo, roomCodeElement.nextSibling);
                    }
                    
                    // Генерируем QR-код
                    console.log('Начинаем генерацию QR-кода...');
                    await generateQRCode(roomCode);
                    
                    // Подключаемся к комнате
                    socket.emit('host-join', roomCode);
                } catch (error) {
                    console.error('Ошибка создания комнаты:', error);
                    roomCodeElement.textContent = 'Ошибка подключения';
                    
                    // Показываем подробную ошибку
                    if (qrPlaceholder) {
                        qrPlaceholder.style.display = 'block';
                        qrPlaceholder.innerHTML = `
                            <strong>Ошибка:</strong><br>
                            ${error.message}<br><br>
                            <strong>Убедитесь, что:</strong><br>
                            1. Сервер запущен (npm start)<br>
                            2. Вы открыли страницу через http://localhost:3000/host.html<br>
                            3. Нет проблем с сетью
                        `;
                    }
                }
            }

            // Функция показа модального окна для ввода пароля
            function showPasswordModal(callback) {
                const modal = document.getElementById('password-modal');
                const passwordInput = document.getElementById('password-input');
                const passwordError = document.getElementById('password-error');
                const submitBtn = document.getElementById('password-submit');
                const cancelBtn = document.getElementById('password-cancel');
                
                modal.style.display = 'flex';
                passwordInput.value = '';
                passwordError.style.display = 'none';
                passwordInput.focus();
                
                const handleSubmit = () => {
                    const password = passwordInput.value.trim();
                    if (!password) {
                        passwordError.textContent = 'Введите пароль';
                        passwordError.style.display = 'block';
                        return;
                    }
                    modal.style.display = 'none';
                    callback(password);
                };
                
                const handleCancel = () => {
                    modal.style.display = 'none';
                    window.location.href = '/index.html';
                };
                
                submitBtn.onclick = handleSubmit;
                cancelBtn.onclick = handleCancel;
                
                passwordInput.onkeypress = (e) => {
                    if (e.key === 'Enter') {
                        handleSubmit();
                    }
                };
            }

            // Хранилище данных игроков для HUB
            let playersData = new Map(); // playerId -> {name, answered, ready}
            let gameState = 'lobby'; // lobby, question, results

            // Обновление HUB
            function updateHub() {
                const hubPlayers = document.getElementById('hub-players');
                hubPlayers.innerHTML = '';
                
                playersData.forEach((data, playerId) => {
                    const playerDiv = document.createElement('div');
                    playerDiv.className = 'hub-player';
                    
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'hub-player-name';
                    nameSpan.textContent = data.name;
                    
                    const statusSpan = document.createElement('span');
                    statusSpan.className = 'hub-player-status';
                    
                    if (gameState === 'question') {
                        // Во время вопроса: • если отвечает, ✓ если ответил
                        if (data.answered) {
                            statusSpan.textContent = '✓';
                            statusSpan.className = 'hub-player-status answered';
                        } else {
                            statusSpan.textContent = '•';
                            statusSpan.className = 'hub-player-status answering';
                        }
                    } else if (gameState === 'results') {
                        // После ответа: ✓ если готов, • если нет
                        if (data.ready) {
                            statusSpan.textContent = '✓';
                            statusSpan.className = 'hub-player-status ready';
                        } else {
                            statusSpan.textContent = '•';
                            statusSpan.className = 'hub-player-status waiting';
                        }
                    } else {
                        // В лобби: просто имя
                        statusSpan.style.display = 'none';
                    }
                    
                    playerDiv.appendChild(nameSpan);
                    playerDiv.appendChild(statusSpan);
                    hubPlayers.appendChild(playerDiv);
                });
            }

            // Подключение хоста
            socket.on('host-connected', (data) => {
                console.log('Хост подключен');
                playersData.clear();
                (data.players || []).forEach(player => {
                    playersData.set(player.id, {
                        name: player.name,
                        answered: false,
                        ready: false
                    });
                });
                updateHub();
            });

            // Обновление списка игроков
            socket.on('player-list-updated', (data) => {
                playersData.clear();
                (data.players || []).forEach(player => {
                    playersData.set(player.id, {
                        name: player.name,
                        answered: false,
                        ready: false
                    });
                });
                updateHub();
            });

            // Начало игры
            document.getElementById('start-btn').addEventListener('click', () => {
                if (playersData.size === 0) {
                    alert('Вы добавили всех игроков?');
                    return;
                }
                socket.emit('start-game', roomCode);
            });

            socket.on('game-started', () => {
                document.getElementById('lobby-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'block';
                // Скрываем кнопку "Назад" на экране лобби
                const lobbyBackBtn = document.getElementById('lobby-back-btn');
                if (lobbyBackBtn) {
                    lobbyBackBtn.style.display = 'none';
                }
            });

            // Вопрос
            socket.on('question', (data) => {
                gameState = 'question';
                document.getElementById('question-screen').style.display = 'block';
                document.getElementById('results-screen').style.display = 'none';
                document.getElementById('final-results').style.display = 'none';
                
                document.getElementById('question-num').textContent = data.questionNumber;
                document.getElementById('total-questions').textContent = data.totalQuestions;
                document.getElementById('question-text').textContent = data.question;
                
                // Сбрасываем статусы игроков
                playersData.forEach((playerData) => {
                    playerData.answered = false;
                    playerData.ready = false;
                });
                updateHub();
                
                // Таймер
                let timeLeft = data.time;
                document.getElementById('timer').textContent = timeLeft;
                document.getElementById('question-status').textContent = 'Игроки отвечают...';
                
                if (currentTimer) clearInterval(currentTimer);
                currentTimer = setInterval(() => {
                    timeLeft--;
                    document.getElementById('timer').textContent = timeLeft;
                    if (timeLeft <= 0) {
                        clearInterval(currentTimer);
                    }
                }, 1000);
            });

            // Статус ответов игроков
            socket.on('answer-status', (data) => {
                const questionStatus = document.getElementById('question-status');
                
                // Обновляем статусы в playersData
                data.players.forEach(player => {
                    const playerData = playersData.get(player.id);
                    if (playerData) {
                        playerData.answered = player.answered;
                    }
                });
                updateHub();
                
                if (data.allAnswered) {
                    questionStatus.textContent = 'Все ответили! Переход к результатам...';
                    if (currentTimer) clearInterval(currentTimer);
                } else {
                    questionStatus.textContent = `Игроки отвечают... (${data.answeredCount}/${data.totalPlayers})`;
                }
            });

            // Результаты вопроса
            socket.on('results', (data) => {
                gameState = 'results';
                clearInterval(currentTimer);
                document.getElementById('question-screen').style.display = 'none';
                document.getElementById('results-screen').style.display = 'block';
                
                // Сбрасываем статусы готовности
                playersData.forEach((playerData) => {
                    playerData.ready = false;
                });
                updateHub();
                
                document.getElementById('correct-answer').textContent = 
                    `Правильный ответ: ${data.correctAnswerText}`;
                
                const leaderboard = document.getElementById('leaderboard');
                leaderboard.innerHTML = '';
                data.players.forEach((player, index) => {
                    const item = document.createElement('div');
                    let className = 'leaderboard-item';
                    if (index === 0) className += ' first';
                    else if (index === 1) className += ' second';
                    else if (index === 2) className += ' third';
                    
                    item.className = className;
                    item.style.animationDelay = (index * 0.1) + 's';
                    
                    item.innerHTML = `
                        <span>${index + 1}. ${player.name}</span>
                        <span>${player.score} очков</span>
                    `;
                    leaderboard.appendChild(item);
                });

                // Сбрасываем кнопку следующего вопроса
                const nextBtn = document.getElementById('next-btn');
                const nextBtnStatus = document.getElementById('next-btn-status');
                nextBtn.disabled = true;
                nextBtnStatus.textContent = 'Ожидание готовности всех игроков...';
            });

            // Статус готовности игроков
            socket.on('ready-status', (data) => {
                const nextBtn = document.getElementById('next-btn');
                const nextBtnStatus = document.getElementById('next-btn-status');
                
                // Обновляем статусы готовности в playersData
                data.players.forEach(player => {
                    const playerData = playersData.get(player.id);
                    if (playerData) {
                        playerData.ready = player.ready;
                    }
                });
                updateHub();
                
                if (data.allReady) {
                    nextBtn.disabled = false;
                    nextBtnStatus.textContent = 'Все игроки готовы! Можно переходить к следующему вопросу.';
                } else {
                    nextBtn.disabled = true;
                    nextBtnStatus.textContent = `Ожидание готовности игроков... (${data.readyCount}/${data.totalPlayers})`;
                }
            });

            // Следующий вопрос
            document.getElementById('next-btn').addEventListener('click', () => {
                socket.emit('next-question', roomCode);
            });

            // Финальные результаты
            socket.on('game-finished', (data) => {
            document.getElementById('question-screen').style.display = 'none';
            document.getElementById('results-screen').style.display = 'none';
            document.getElementById('final-results').style.display = 'block';
            
            const leaderboard = document.getElementById('final-leaderboard');
            leaderboard.innerHTML = '';
            const finalMessages = {
                0: '· Чемпион',
                1: '· Второе место',
                2: '· Третье место'
            };
            
            data.results.forEach((player, index) => {
                const item = document.createElement('div');
                let className = 'leaderboard-item';
                if (index === 0) className += ' first';
                else if (index === 1) className += ' second';
                else if (index === 2) className += ' third';
                
                item.className = className;
                item.style.animationDelay = (index * 0.1) + 's';
                
                const message = finalMessages[index] || '';
                item.innerHTML = `
                    <span>${index + 1}. ${player.name} ${message}</span>
                    <span>${player.score} очков</span>
                `;
                leaderboard.appendChild(item);
            });
        });

            // Новая игра
            document.getElementById('restart-btn').addEventListener('click', () => {
                location.reload();
            });

            // Инициализация
            createRoom();
            
        } // конец initApp()
        // Автоматически создаем комнату при загрузке страницы
        createRoom();
    </script>
</body>
</html>
