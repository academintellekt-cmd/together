                const errorMsg = error.message || 'Ошибка сети или сервера';
                addLog(`❌ Ошибка: ${errorMsg}`, 'error');
                console.error('❌ Исключение при сохранении:', error);
            }
        }

        // Сохранить черновик в localStorage
        function saveDraft() {
            const draft = {
                name: document.getElementById('command-name').value,
                description: document.getElementById('command-description').value,
                tags: document.getElementById('command-tags').value,
                channels: { ...currentChannels },
                lm70sNumber: parseInt(document.getElementById('lm70s-number').value) || 1,
                timestamp: new Date().toISOString()
            };
            localStorage.setItem('dmx-command-draft', JSON.stringify(draft));
            addLog('📝 Черновик сохранен', 'success');
        }

        // Загрузить черновик из localStorage
        function loadDraft() {
            try {
                const draftStr = localStorage.getItem('dmx-command-draft');
                if (draftStr) {
                    const draft = JSON.parse(draftStr);
                    document.getElementById('command-name').value = draft.name || '';
                    document.getElementById('command-description').value = draft.description || '';
                    document.getElementById('command-tags').value = draft.tags || '';
                    
                    // Предлагаем восстановить каналы
                    if (confirm('Найден черновик. Восстановить параметры?')) {
                        if (draft.channels) {
                            Object.keys(draft.channels).forEach(ch => {
                                currentChannels[ch] = draft.channels[ch];
                            });
                            renderChannelConfig(true);
                            applyChannelsRealtime();
                        }
                    }
                }
            } catch (error) {
                console.error('Ошибка загрузки черновика:', error);
            }
        }

        // Отобразить команды
        function renderCommands() {
            const container = document.getElementById('commands-list');
            const searchQuery = document.getElementById('command-search').value.toLowerCase();
            
            let filtered = allCommands;
            
            // Поиск
            if (searchQuery) {
                filtered = filtered.filter(cmd => 
                    cmd.name.toLowerCase().includes(searchQuery) ||
                    cmd.description.toLowerCase().includes(searchQuery) ||
                    cmd.tags.some(tag => tag.toLowerCase().includes(searchQuery))
                );
            }
            
            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-state">Команды не найдены</div>';
                return;
            }
            
            container.innerHTML = filtered.map(cmd => {
                const r = cmd.channels['4'] || 0;
                const g = cmd.channels['5'] || 0;
                const b = cmd.channels['6'] || 0;
                const mode = cmd.channels['3'] || 0;
                let modeText = 'ВЫКЛ';
                if (mode >= 9 && mode <= 135) modeText = 'Затемнение';
                else if (mode >= 136 && mode <= 240) modeText = 'Стробоскоп';
                else if (mode >= 241) modeText = 'ВКЛ';
                
                const colorStyle = `rgb(${r}, ${g}, ${b})`;
                
                return `
                    <div class="command-item" data-command-id="${cmd.id}">
                        <div class="command-header">
                            <div class="command-name">${escapeHtml(cmd.name)}</div>
                        </div>
                        <div class="command-preview">
                            <div class="command-color-preview" style="background: ${colorStyle};"></div>
                            <div class="command-info">
                                <span class="command-info-row">Фонарь #${cmd.lm70sNumber}</span>
                                <span class="command-info-row">${modeText}</span>
                                <span class="command-info-row">X: ${cmd.channels['1'] || 0} Y: ${cmd.channels['2'] || 0}</span>
                                <span class="command-info-row">Скорость: ${cmd.channels['8'] || 0}</span>
                            </div>
                        </div>
                        ${cmd.tags.length > 0 ? `
                            <div class="command-tags">
                                ${cmd.tags.map(tag => `<span class="command-tag">${escapeHtml(tag)}</span>`).join('')}
                            </div>
                        ` : ''}
                        <div class="command-actions">
                            <button class="btn btn-success btn-small" onclick="applyCommand('${cmd.id}')" title="Включить">
                                ▶️
                            </button>
                            ${editingCommandId === cmd.id ? `
                                <button class="btn btn-success btn-small" onclick="updateCommand('${cmd.id}')" title="Сохранить изменения">
                                    💾
                                </button>
                            ` : `
                                <button class="btn btn-primary btn-small" onclick="testCommand('${cmd.id}')" title="Тест 2 сек">
                                    🧪
                                </button>
                            `}
                            <button class="btn btn-danger btn-small" onclick="deleteCommand('${cmd.id}')" title="Удалить">
                                🗑️
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Применить команду
        async function applyCommand(commandId, targetLM70SNumber = null) {
            try {
                // Получаем команду для отображения фонарей
                const command = allCommands.find(c => c.id === commandId);
                
                const response = await fetch(`${COMMANDS_API}/${commandId}/apply`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ targetLM70SNumber })
                });

                const data = await response.json();
                
                if (data.success) {
                    // Формируем сообщение о применении
                    if (data.fixtureCount && data.fixtureCount > 1) {
                        addLog(`✅ Команда применена к ${data.fixtureCount} фонарям`, 'success');
                    } else {
                        const fixtureNum = data.targetLM70SNumber || command?.lm70sNumber || 'неизвестно';
                        addLog(`✅ Команда применена к фонарю #${fixtureNum}`, 'success');
                    }
                    
                    // Устанавливаем режим редактирования
                    editingCommandId = commandId;
                    
                    // Загружаем и отображаем фонари команды в эквалайзер
                    if (command) {
                        loadCommandFixtures(command);
                    }
                    
                    // Перерисовываем список команд, чтобы показать кнопку "Сохранить изменения"
                    await loadCommands();
                    
                    // Обновляем интерфейс, если команда применена к текущему фонарю (старая логика)
                    const lm70sNumberInput = document.getElementById('lm70s-number');
                    if (lm70sNumberInput && data.targetLM70SNumber) {
                        if (data.targetLM70SNumber === parseInt(lm70sNumberInput.value)) {
                            loadLM70SChannels(true);
                        }
                    }
                } else {
                    addLog(`❌ Ошибка применения: ${data.message || data.error}`, 'error');
                }
            } catch (error) {
                addLog(`❌ Ошибка: ${error.message}`, 'error');
            }
        }
        
        // Загрузить фонари команды для отображения
        function loadCommandFixtures(command) {
            if (!command) return;
            
            // Очищаем текущие фонари
            fixtures = [];
            nextFixtureId = 1;
            
            if (command.allFixtures && Array.isArray(command.allFixtures) && command.allFixtures.length > 0) {
                // Команда содержит несколько фонарей
                command.allFixtures.forEach(fixtureData => {
                    fixtures.push({
                        id: nextFixtureId++,
                        lm70sNumber: fixtureData.lm70sNumber,
                        startAddress: fixtureData.startAddress,
                        channels: { ...fixtureData.channels }
                    });
                });
            } else {
                // Команда содержит один фонарь
                const channels = {};
                for (let i = 1; i <= 9; i++) {
                    channels[i] = command.channels[i] !== undefined ? command.channels[i] : 0;
                }
                
                fixtures.push({
                    id: nextFixtureId++,
                    lm70sNumber: command.lm70sNumber || 1,
                    startAddress: command.startAddress || 1,
                    channels: channels
                });
            }
            
            // Рендерим фонари
            renderAllFixtures();
            
            // Переключаемся на вкладку конфигуратора каналов
            const channelsTab = document.getElementById('tab-channels');
            if (channelsTab) {
                // Убираем active со всех вкладок
                document.querySelectorAll('.tab-content').forEach(tab => {
                    tab.classList.remove('active');
                });
                // Добавляем active к вкладке каналов
                channelsTab.classList.add('active');
                
                // Обновляем табы
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                const channelsTabBtn = document.querySelector('[onclick*="tab-channels"]');
                if (channelsTabBtn) {
                    channelsTabBtn.classList.add('active');
                }
            }
        }

        // Тест команды (применить на 2 секунды)
        async function testCommand(commandId) {
            const command = allCommands.find(c => c.id === commandId);
            if (!command) return;

            // Сохраняем текущее состояние
            const savedChannels = { ...currentChannels };
            const savedFixtures = JSON.parse(JSON.stringify(fixtures));
            
            // Применяем команду напрямую через API без установки режима редактирования
            try {
                const response = await fetch(`${COMMANDS_API}/${commandId}/apply`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ testMode: true })
                });

                const data = await response.json();
                
                if (data.success) {
                    addLog(`✅ Тест команды "${command.name}" запущен`, 'success');
                } else {
                    addLog(`❌ Ошибка применения: ${data.message || data.error}`, 'error');
                    return;
                }
            } catch (error) {
                addLog(`❌ Ошибка: ${error.message}`, 'error');
                return;
            }
            
            // Через 2 секунды восстанавливаем
            setTimeout(async () => {
                currentChannels = savedChannels;
                fixtures = savedFixtures;
                renderChannelConfig(true);
                renderAllFixtures();
                await applyChannelsRealtime();
                addLog('⏱️ Тест завершен, состояние восстановлено', 'success');
            }, 2000);
        }

        // Сохранить изменения в команду
        async function updateCommand(commandId) {
            try {
                const command = allCommands.find(c => c.id === commandId);
                if (!command) {
                    addLog(`❌ Команда не найдена`, 'error');
                    return;
                }

                // Получаем текущие значения из fixtures
                let updateData = {};
                
                if (fixtures.length === 0) {
                    addLog(`❌ Нет данных для сохранения`, 'error');
                    return;
                }
                
                if (fixtures.length > 1) {
                    // Команда содержит несколько фонарей
                    updateData.allFixtures = fixtures.map(f => ({
                        lm70sNumber: f.lm70sNumber,
                        startAddress: f.startAddress,
                        channels: { ...f.channels }
                    }));
                    updateData.fixtureCount = fixtures.length;
                    
                    // Также обновляем базовые поля для совместимости
                    const firstFixture = fixtures[0];
                    updateData.lm70sNumber = firstFixture.lm70sNumber;
                    updateData.startAddress = firstFixture.startAddress;
                    
                    // Объединяем все каналы в один объект с абсолютными адресами
                    const channels = {};
                    fixtures.forEach(fixture => {
                        for (let i = 1; i <= 9; i++) {
                            const channelValue = fixture.channels[i] !== undefined ? fixture.channels[i] : 0;
                            const absoluteDmxAddress = fixture.startAddress + i - 1;
                            channels[absoluteDmxAddress] = channelValue;
                        }
                    });
                    updateData.channels = channels;
                } else {
                    // Команда содержит один фонарь
                    const firstFixture = fixtures[0];
                    const channels = {};
                    for (let i = 1; i <= 9; i++) {
                        channels[i] = firstFixture.channels[i] !== undefined ? firstFixture.channels[i] : 0;
                    }
                    updateData.channels = channels;
                    updateData.lm70sNumber = firstFixture.lm70sNumber;
                    updateData.startAddress = firstFixture.startAddress;
                }

                console.log(`💾 Обновление команды ${commandId}:`, updateData);

                const response = await fetch(`${COMMANDS_API}/${commandId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updateData)
                });

                const responseText = await response.text();
                
                if (!response.ok) {
                    let errorMessage = `Ошибка ${response.status}: ${response.statusText}`;
                    try {
                        const errorData = JSON.parse(responseText);
                        errorMessage = errorData.message || errorData.error || errorMessage;
                    } catch (e) {
                        if (responseText) {
                            errorMessage = responseText.substring(0, 200);
                        }
                    }
                    addLog(`❌ Ошибка обновления: ${errorMessage}`, 'error');
                    return;
                }

                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    addLog(`❌ Ошибка: Сервер вернул невалидный JSON`, 'error');
                    return;
                }

                if (data.success) {
                    addLog(`✅ Команда "${command.name}" обновлена`, 'success');
                    
                    // Сбрасываем режим редактирования
                    editingCommandId = null;
                    
                    // Перезагружаем список команд
                    await loadCommands();
                } else {
                    const errorMsg = data.message || data.error || 'Неизвестная ошибка';
                    addLog(`❌ Ошибка обновления: ${errorMsg}`, 'error');
                }
            } catch (error) {
                addLog(`❌ Ошибка: ${error.message}`, 'error');
                console.error('❌ Исключение при обновлении команды:', error);
            }
        }

        // Применить к нескольким фонарям
        function applyToMultiple(commandId) {
            applyingCommandId = commandId;
            const container = document.getElementById('lm70s-multi-select');
            container.innerHTML = '';
            
            for (let i = 1; i <= 14; i++) {
                const item = document.createElement('div');
                item.className = 'multi-select-item';
                item.textContent = i;
                item.onclick = function() {
                    this.classList.toggle('selected');
                };
                container.appendChild(item);
            }
            
            document.getElementById('apply-multiple-modal').classList.add('active');
        }

        // Применить к выбранным фонарям
        async function applyToSelectedFixtures() {
            const selected = Array.from(document.querySelectorAll('#lm70s-multi-select .selected'))
                .map(el => parseInt(el.textContent));
            
            if (selected.length === 0) {
                alert('Выберите хотя бы один фонарь');
                return;
            }

            try {
                const response = await fetch(`${COMMANDS_API}/${applyingCommandId}/apply-multiple`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ lm70sNumbers: selected })
                });

                const data = await response.json();
                
                if (data.success) {
                    addLog(`✅ Команда применена к ${selected.length} фонарям`, 'success');
                    closeApplyMultipleModal();
                    await loadCommands();
                } else {
                    addLog(`❌ Ошибка: ${data.message || data.error}`, 'error');
                }
            } catch (error) {
                addLog(`❌ Ошибка: ${error.message}`, 'error');
            }
        }

        // Закрыть модальное окно применения к нескольким
        function closeApplyMultipleModal() {
            document.getElementById('apply-multiple-modal').classList.remove('active');
            applyingCommandId = null;
        }


        // Дублировать команду
        async function duplicateCommand(commandId) {
            const command = allCommands.find(c => c.id === commandId);
            if (!command) return;

            const newName = prompt('Введите новое название для копии:', `${command.name} (копия)`);
            if (!newName) return;

            try {
                const response = await fetch(`${COMMANDS_API}/${commandId}/duplicate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ newName: newName.trim() })
                });

                const data = await response.json();
                
                if (data.success) {
                    addLog(`✅ Команда "${newName}" создана`, 'success');
                    await loadCommands();
                } else {
                    addLog(`❌ Ошибка дублирования: ${data.message || data.error}`, 'error');
                }
            } catch (error) {
                addLog(`❌ Ошибка: ${error.message}`, 'error');
            }
        }

        // Удалить команду
        async function deleteCommand(commandId) {
            const command = allCommands.find(c => c.id === commandId);
            if (!command) return;

            if (!confirm(`Удалить команду "${command.name}"?`)) return;

            try {
                const response = await fetch(`${COMMANDS_API}/${commandId}`, {
                    method: 'DELETE'
                });

                const data = await response.json();
                
                if (data.success) {
                    addLog(`✅ Команда "${command.name}" удалена`, 'success');
                    await loadCommands();
                } else {
                    addLog(`❌ Ошибка удаления: ${data.message || data.error}`, 'error');
                }
            } catch (error) {
                addLog(`❌ Ошибка: ${error.message}`, 'error');
            }
        }

        // Фильтрация команд
        function filterCommands() {
            renderCommands();
        }

        // Установить фильтр (удалено - фильтры больше не используются)
        function setFilter(filter) {
            // Фильтры удалены
            renderCommands();
        }

        // Экспорт команд
        async function exportCommands() {
            try {
                const response = await fetch(`${COMMANDS_API}/export`);
                const data = await response.json();
                
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `dmx-commands-${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
                
                addLog('✅ Команды экспортированы', 'success');
            } catch (error) {
                addLog(`❌ Ошибка экспорта: ${error.message}`, 'error');
            }
        }

        // Импорт команд
        function importCommands() {
            document.getElementById('import-file-input').click();
        }

        // Обработка импорта файла
        async function handleImportFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const importData = JSON.parse(e.target.result);
                    const merge = confirm('Объединить с существующими командами? (Отмена = заменить все)');
                    
                    const response = await fetch(`${COMMANDS_API}/import?merge=${merge}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(importData)
                    });

                    const data = await response.json();
                    
                    if (data.success) {
                        addLog(`✅ Импортировано ${data.imported} команд`, 'success');
                        await loadCommands();
                    } else {
                        addLog(`❌ Ошибка импорта: ${data.message || data.error}`, 'error');
                    }
                } catch (error) {
                    addLog(`❌ Ошибка чтения файла: ${error.message}`, 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // Сброс input
        }

        // Экранирование HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Закрытие модальных окон по клику вне их
        window.onclick = function(event) {
            const applyModal = document.getElementById('apply-multiple-modal');
            if (event.target === applyModal) {
                closeApplyMultipleModal();
            }
        }

        // Горячие клавиши
        document.addEventListener('keydown', function(e) {
            // Ctrl+S для сохранения команды
            if (e.ctrlKey && e.key === 's' && !e.target.matches('input, textarea')) {
                e.preventDefault();
                saveCommand();
            }
            // Escape для закрытия модальных окон
            if (e.key === 'Escape') {
                closeApplyMultipleModal();
            }
        });

    </script>
