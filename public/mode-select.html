<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор режима - Чемпионат ГНУ</title>
    <link rel="stylesheet" href="/styles/brand-style.css">
    <link rel="stylesheet" href="/styles/hub1.css">
    <link rel="stylesheet" href="/styles/hub2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Days+One&family=Handlee&family=Kalam:wght@300;400;700&family=Open+Sans:wght@400;500;600;700&family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;600;700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    <script src="/scripts/hub-common.js"></script>
    <script src="/scripts/hub1.js"></script>
    <script src="/scripts/hub2.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            background: #f2f2f2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0 20px 20px 20px;
            position: relative;
            /* padding-bottom будет обновляться динамически через JavaScript для HUB4/HUB5 */
        }

        /* --- Каркас HUB-зон на странице --- */

        /* Базовый класс для любой HUB-зоны */
        .hub-zone {
            width: 100%;
            box-sizing: border-box;
        }

        /* HUB3 — основная зона контента */
        .hub3 {
            flex: 1 0 auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Внутренний контейнер внутри HUB3 */
        .hub3 > .container {
            margin: 0 auto;
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 2; /* Ниже Hub1 (1001), Hub2 (1000), HUB4/HUB5 (999), но выше парящих элементов (z-index: -1) */
        }

        /* HUB4 и HUB5 — нижние полосы, фиксированные снизу (как HUB1/HUB2 сверху) */
        .hub4,
        .hub5 {
            position: fixed;
            left: 0;
            right: 0;
            background: var(--hub1-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: var(--hub1-padding);
            min-height: auto;
            box-sizing: border-box;
            width: 100%;
            z-index: 999; /* Ниже HUB1 (1001) и HUB2 (1000), но выше парящих элементов (z-index: -1) */
            transition: bottom 0.3s ease;
            will-change: bottom;
        }

        /* HUB5 — самая нижняя полоса (фиксирована внизу) */
        .hub5 {
            bottom: 0;
        }

        /* HUB4 — над HUB5 (bottom будет рассчитываться динамически через JavaScript) */
        .hub4 {
            bottom: auto; /* Устанавливается динамически через JavaScript в hub-common.js */
        }

        /* Парящие элементы */
        body::before {
            content: '';
            position: fixed;
            /* top устанавливается динамически через JavaScript */
            left: -50px;
            width: 200px;
            height: 200px;
            background: #d6fbbf; /* Парящий элемент */
            border-radius: 50% 40% 60% 30%;
            opacity: 0.9;
            z-index: -1; /* Ниже HUB1 (1001), HUB2 (1000), HUB4/HUB5 (999) и контента HUB3 (2), но выше фона */
            animation: wobble 6s ease-in-out infinite;
            pointer-events: none;
        }
        
        body::after {
            content: '';
            position: fixed;
            /* bottom устанавливается динамически через JavaScript */
            right: -80px;
            width: 250px;
            height: 250px;
            background: #fececd; /* Парящий элемент */
            border-radius: 40% 50% 30% 60%;
            opacity: 0.9;
            z-index: -1; /* Ниже HUB1 (1001), HUB2 (1000), HUB4/HUB5 (999) и контента HUB3 (2), но выше фона */
            animation: wobble 8s ease-in-out infinite reverse;
            pointer-events: none;
        }
        
        @keyframes wobble {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(5deg) scale(1.1); }
            50% { transform: rotate(-5deg) scale(0.9); }
            75% { transform: rotate(3deg) scale(1.05); }
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        /* Модальное окно для пароля */
        .password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            backdrop-filter: blur(5px);
        }

        .password-modal {
            background: #FFFFFF;
            border-radius: 24px;
            padding: clamp(24px, 4vw, 36px) clamp(20px, 4vw, 32px);
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 
                0 8px 0px rgba(0, 0, 0, 0.2),
                0 16px 32px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        .password-title {
            font-family: 'Days One', sans-serif;
            font-size: clamp(24px, 5vw, 32px);
            color: #393639;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .password-input {
            width: 100%;
            padding: clamp(14px, 3vw, 18px);
            border: 3px solid #393639;
            border-radius: 12px;
            font-family: 'Days One', sans-serif;
            font-size: clamp(20px, 4vw, 24px);
            text-align: center;
            margin-bottom: clamp(16px, 3vw, 20px);
            box-sizing: border-box;
        }

        .password-input:focus {
            outline: none;
            border-color: #abf67c;
            box-shadow: 0 0 0 4px rgba(168, 224, 99, 0.2);
        }

        .password-buttons {
            display: flex;
            gap: clamp(8px, 2vw, 12px);
            width: 100%;
            box-sizing: border-box;
        }

        .password-button {
            background: #abf67c;
            color: #393639;
            border: none;
            padding: clamp(12px, 2.5vw, 16px) clamp(16px, 3vw, 24px);
            border-radius: 12px;
            font-family: 'Days One', sans-serif;
            font-size: clamp(16px, 3vw, 20px);
            cursor: pointer;
            box-shadow: 0 4px 0px rgba(0, 0, 0, 0.2);
            transition: all 0.2s;
            flex: 1;
            box-sizing: border-box;
            min-width: 0;
        }

        .password-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0px rgba(0, 0, 0, 0.2);
        }

        .password-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px rgba(0, 0, 0, 0.2);
        }

        .password-button.back {
            background: #f2f2f2;
            color: #393639;
        }

        .password-button.back:hover {
            background: #E0E0E0;
        }

        .password-error {
            color: #ff7664;
            font-family: 'Nunito', sans-serif;
            font-size: clamp(14px, 2.5vw, 16px);
            margin-top: 12px;
            min-height: 20px;
            display: none;
        }

        .password-error.show {
            display: block;
        }

        .back-button {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #abf67c;
            color: #393639;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-family: 'Days One', sans-serif;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 0px rgba(0, 0, 0, 0.2);
            transition: all 0.2s;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0px rgba(0, 0, 0, 0.2);
        }

        .back-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px rgba(0, 0, 0, 0.2);
        }

        .title {
            font-family: 'Days One', sans-serif;
            font-size: clamp(32px, 6vw, 48px);
            color: #393639;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .subtitle {
            font-family: 'Caveat', cursive;
            font-size: clamp(24px, 4vw, 32px);
            color: #ff7664;
            margin-bottom: 40px;
            transform: rotate(-1deg);
        }

        .mode-cards {
            display: grid;
            grid-template-columns: 1fr;
            gap: clamp(20px, 4vw, 28px);
            margin-top: clamp(30px, 6vw, 50px);
        }

        .mode-card {
            background: #FFFFFF;
            border-radius: clamp(16px, 3vw, 24px);
            padding: clamp(24px, 5vw, 36px) clamp(20px, 4vw, 32px);
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 
                0 6px 0px rgba(0, 0, 0, 0.15),
                0 8px 16px rgba(0, 0, 0, 0.1);
            border: none;
            text-align: center;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: clamp(180px, 35vw, 240px);
        }

        .mode-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 8px 0px rgba(0, 0, 0, 0.2),
                0 12px 24px rgba(0, 0, 0, 0.15);
        }

        .mode-card:active {
            transform: translateY(-4px) scale(1.01);
        }

        .mode-card.solo {
            background: #abf67c;
        }

        .mode-card.multiplayer {
            background: #FFD500;
        }

        .mode-icon {
            font-size: clamp(48px, 10vw, 72px);
            margin-bottom: clamp(12px, 3vw, 20px);
            line-height: 1;
        }

        .mode-title {
            font-family: 'Days One', sans-serif;
            font-size: clamp(14px, 2.8vw, 18px);
            color: #393639;
            margin-bottom: clamp(8px, 2vw, 14px);
            text-transform: uppercase;
            line-height: 1.2;
            white-space: nowrap;
            width: 100%;
            padding: 0 clamp(10px, 2.5vw, 16px);
            box-sizing: border-box;
        }

        .mode-description {
            font-family: 'Nunito', sans-serif;
            font-size: clamp(14px, 2.8vw, 18px);
            color: #393639;
            opacity: 0.85;
            line-height: 1.4;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
        }

        @media (min-width: 768px) {
            .mode-cards {
                grid-template-columns: 1fr 1fr;
                gap: clamp(24px, 4vw, 32px);
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 clamp(10px, 3vw, 20px);
            }

            .mode-card {
                padding: clamp(20px, 5vw, 28px) clamp(16px, 4vw, 24px);
                min-height: clamp(160px, 40vw, 200px);
            }

            .password-modal {
                padding: clamp(24px, 5vw, 32px) clamp(20px, 4vw, 28px);
            }
        }

        /* Адаптивные стили для HUB4 и HUB5 (соответствуют HUB1) */
        @media (min-width: 1024px) {
            .hub4, .hub5 {
                padding: 15px 40px;
            }
        }

        @media (max-width: 1023px) and (min-width: 769px) {
            .hub4, .hub5 {
                padding: 15px 30px;
            }
        }

        @media (max-width: 768px) {
            .hub4, .hub5 {
                padding: 12px 15px;
            }
        }

        @media (max-width: 480px) {
            .hub4, .hub5 {
                padding: 10px 12px;
            }
        }

        @media (max-width: 360px) {
            .hub4, .hub5 {
                padding: 10px 10px;
            }
        }
    </style>
</head>
<body class="with-hub">
    <!-- Модальное окно для пароля -->
    <div class="password-overlay" id="passwordOverlay">
        <div class="password-modal">
            <h2 class="password-title">Введите пароль</h2>
            <input 
                type="password" 
                class="password-input" 
                id="passwordInput" 
                placeholder="Пароль"
                autocomplete="off"
                autofocus
            >
            <div class="password-buttons">
                <button class="password-button back" onclick="goBack()">Назад</button>
                <button class="password-button" onclick="checkPassword()">Войти</button>
            </div>
            <div class="password-error" id="passwordError">Неверный пароль. Попробуйте снова.</div>
        </div>
    </div>

    <!-- HUB3: основная зона контента -->
    <div class="hub-zone hub3">
        <div class="container" id="mainContainer" style="display: none;">
        <h1 class="title">ЧЕМПИОНАТ ГНУ</h1>
        <p class="subtitle">выбери режим игры</p>
        
        <div class="mode-cards">
            <div class="mode-card solo" onclick="selectMode('solo')">
                <div class="mode-icon">🎯</div>
                <div class="mode-title">Одиночная игра</div>
                <div class="mode-description">
                    Играй один и соревнуйся с другими в рейтинге. 15 вопросов из 150.
                </div>
            </div>
            
            <div class="mode-card multiplayer" onclick="selectMode('multiplayer')">
                <div class="mode-icon">👥</div>
                <div class="mode-title">Мультиплеер</div>
                <div class="mode-description">
                    Создай комнату и играй с друзьями. QR-код для подключения.
                </div>
            </div>
        </div>
        </div>
    </div>

    <!-- HUB4: нижняя полоса (fixed, над HUB5) -->
    <div id="hub4" class="hub-zone hub4">
        <!-- Здесь позже можно разместить вспомогательные статусы, подсказки, маленькие карточки и т.п. -->
    </div>

    <!-- HUB5: самая нижняя полоса (fixed, внизу экрана) -->
    <div id="hub5" class="hub-zone hub5">
        <!-- Здесь позже можно разместить "Правила хаба", ссылки, переключение режимов -->
    </div>

    <script>
        const GNU_PASSWORD = '1234';
        let passwordEntered = false;

        // Инициализация Hub1 и Hub2 после проверки пароля
        function initHubs() {
            // Инициализация Hub1
            Hub1.init({
                showBack: true,
                backUrl: '/index.html'
            });
            
            // Инициализация Hub2
            Hub2.init();
            
            // Обновление позиций
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        HubCommon.updateHub2Position();
                        HubCommon.updateHub4Position();
                        HubCommon.updateContentPadding('.hub3 > .container');
                        HubCommon.updateFloatingElementsPosition();
                        HubCommon.updateBodyPaddingBottom();
                        HubCommon.adaptSubtitleToLogo();
                    });
                });
            });
        }

        // Проверка пароля из localStorage
        if (localStorage.getItem('gnuPasswordEntered') === 'true') {
            passwordEntered = true;
            document.getElementById('passwordOverlay').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'block';
            // Инициализируем Hub если пароль уже введен
            if (typeof Hub1 !== 'undefined' && typeof Hub2 !== 'undefined') {
                initHubs();
            } else {
                setTimeout(initHubs, 100);
            }
        }

        // Обработка Enter в поле пароля
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('passwordError');
            
            if (password === GNU_PASSWORD) {
                passwordEntered = true;
                localStorage.setItem('gnuPasswordEntered', 'true');
                document.getElementById('passwordOverlay').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'block';
                errorDiv.classList.remove('show');
                // Инициализируем Hub после проверки пароля
                if (typeof Hub1 !== 'undefined' && typeof Hub2 !== 'undefined') {
                    initHubs();
                } else {
                    setTimeout(initHubs, 100);
                }
            } else {
                errorDiv.classList.add('show');
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }

        function clearPassword() {
            // Очищаем пароль при возврате на главную страницу
            localStorage.removeItem('gnuPasswordVerified');
            localStorage.removeItem('gnuPasswordEntered');
        }

        function goBack() {
            clearPassword();
            window.location.href = '/index.html';
        }

        function selectMode(mode) {
            // Сохраняем флаг, что пароль уже проверен
            localStorage.setItem('gnuPasswordVerified', 'true');
            
            if (mode === 'solo') {
                // Одиночная игра - открываем solo.html с квизом friends-quiz
                window.location.href = '/solo.html?quiz=friends-quiz&password=verified';
            } else if (mode === 'multiplayer') {
                // Мультиплеер - открываем host.html с квизом gnu-multiplayer
                window.location.href = '/host.html?quiz=gnu-multiplayer&password=verified';
            }
        }
        
        // Обновление при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof HubCommon !== 'undefined' && passwordEntered) {
                HubCommon.updateHub2Position();
                HubCommon.updateHub4Position();
                HubCommon.updateContentPadding('.hub3 > .container');
                HubCommon.updateFloatingElementsPosition();
                HubCommon.updateBodyPaddingBottom();
            }
        });
        
        // Обновление при изменении размера окна
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (typeof HubCommon !== 'undefined') {
                    HubCommon.updateHub2Position();
                    HubCommon.updateHub4Position();
                    HubCommon.updateContentPadding('.hub3 > .container');
                    HubCommon.updateFloatingElementsPosition();
                    HubCommon.updateBodyPaddingBottom();
                }
            }, 100);
        });
    </script>
    
    <!-- Hub1 и Hub2 скрипты -->
    <script src="/scripts/hub-common.js"></script>
    <script src="/scripts/hub1.js"></script>
    <script src="/scripts/hub2.js"></script>
</body>
</html>
