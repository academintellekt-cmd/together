        /* Скрываем Hub2 на этой странице */

            margin: 0 !important;

            grid-template-rows:

            padding-top: 0 !important;

    <script>
        // Проверка, что страница открыта через сервер
        if (window.location.protocol === 'file:') {
            document.body.innerHTML = `
                <div style="text-align: center; padding: 40px; color: white;">
                    <h1 style="font-size: 48px; margin-bottom: 20px;">⚠️ Ошибка</h1>
                    <p style="font-size: 24px; margin-bottom: 30px;">
                        Страница открыта неправильно!
                    </p>
                    <p style="font-size: 18px; margin-bottom: 30px;">
                        Откройте страницу через сервер: http://localhost:3000/chgk-player.html
                    </p>
                </div>
            `;
            throw new Error('Страница должна быть открыта через http://localhost:3000/');
        }

        // Ожидание загрузки socket.io
        function waitForSocketIO(callback, maxAttempts = 50) {
            let attempts = 0;
            const checkInterval = setInterval(() => {
                attempts++;
                if (typeof io !== 'undefined') {
                    clearInterval(checkInterval);
                    callback();
                } else if (attempts >= maxAttempts) {
                    clearInterval(checkInterval);
                    console.error('Socket.io не загружен за 5 секунд!');
                }
            }, 100);
        }

        waitForSocketIO(() => {
            initApp();
        });

        let socket = null;
        let roomCode = null;
        let playerName = null;
        let currentTimer = null;
        let answerSubmitted = false;
        let questionStartTime = null;

        function initApp() {
            // Инициализация Frame1
            Frame1.init({
                showBack: true,
                backUrl: '/index.html',
                showSettings: false
            });

            socket = io();

            // Регистрируем обработчики WebSocket событий
            setupSocketHandlers();

            // Автоматическое заполнение кода комнаты из URL
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam) {
                const roomCodeInput = document.getElementById('room-code');
                if (roomCodeInput) {
                    roomCodeInput.value = roomParam.toUpperCase();
                }
            }

            // Обработчик кнопки подключения
            const connectBtn = document.getElementById('connect-btn');
            const roomCodeInput = document.getElementById('room-code');
            const playerNameInput = document.getElementById('player-name');

            console.log('Элементы найдены:', {
                connectBtn: !!connectBtn,
                roomCodeInput: !!roomCodeInput,
                playerNameInput: !!playerNameInput,
                socket: !!socket
            });

            if (connectBtn) {
                connectBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    console.log('Кнопка подключения нажата');
                    connectToRoom();
                });
            } else {
                console.error('Кнопка подключения не найдена!');
            }

            // Подключение по Enter
            if (roomCodeInput) {
                roomCodeInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        playerNameInput?.focus();
                    }
                });
            }

            if (playerNameInput) {
                playerNameInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        connectToRoom();
                    }
                });
            }
        }

        // Настройка обработчиков WebSocket событий
        function setupSocketHandlers() {
            if (!socket) {
                console.error('Socket не инициализирован для регистрации обработчиков');
                return;
            }

            // WebSocket события
            socket.on('connect', () => {
                console.log('✅ Socket.io подключен, ID:', socket.id);
            });

            socket.on('disconnect', () => {
                console.log('❌ Socket.io отключен');
            });

            socket.on('connect_error', (error) => {
                console.error('❌ Ошибка подключения Socket.io:', error);
                showError('Ошибка подключения к серверу. Проверьте, что сервер запущен.');
            });

            socket.on('intellectual-player-connected', (data) => {
                console.log('✅ Игрок подключен, данные:', data);
                console.log('✅ isReconnection:', data.isReconnection, 'gameState:', data.gameState);
                
                // Если это переподключение и игра уже началась, восстанавливаем состояние
                if (data.isReconnection && data.gameState) {
                    console.log('🔄 Переподключение: восстанавливаем состояние игры', data);
                    
                    // Восстанавливаем счет игрока
                    if (data.playerScore !== undefined) {
                        // Можно отобразить счет, если есть элемент для этого
                        console.log('📊 Восстановлен счет игрока:', data.playerScore);
                    }
                    
                    // Восстанавливаем состояние игры в зависимости от gameState
                    if (data.gameState === 'question' || data.gameState === 'waiting-verification') {
                        // Игра идет, показываем текущий вопрос
                        if (data.currentQuestion) {
                            const question = data.currentQuestion;
                            document.getElementById('connect-screen').style.display = 'none';
                            document.getElementById('waiting-screen').style.display = 'none';
                            document.getElementById('game-screen').style.display = 'block';
                            document.getElementById('question-screen').style.display = 'block';
                            document.getElementById('waiting-next-question-screen').style.display = 'none';
                            document.getElementById('question-result-screen').style.display = 'none';
                            
                            // Инициализируем элементы Frame1
                            initFrame1Elements();
                            
                            document.getElementById('question-text').textContent = question.question;
                            updateQuestionNumber(question.questionNumber, question.totalQuestions);
                            
                            // Если игрок уже ответил, блокируем ввод
                            if (data.hasAnswered) {
                                answerSubmitted = true;
                                const answerInput = document.getElementById('answer-input');
                                answerInput.disabled = true;
                                document.getElementById('submit-btn').disabled = true;
                                document.getElementById('status').textContent = 'Ответ отправлен';
                                document.getElementById('status').classList.add('submitted');
                                
                                // Показываем экран ожидания
                                document.getElementById('question-screen').style.display = 'none';
                                document.getElementById('waiting-next-question-screen').style.display = 'block';
                                hideFrame1Elements();
                            } else {
                                // Игрок еще не ответил, разрешаем ввод
                                answerSubmitted = false;
                                const answerInput = document.getElementById('answer-input');
                                answerInput.value = '';
                                answerInput.disabled = false;
                                document.getElementById('submit-btn').disabled = false;
                                document.getElementById('status').textContent = '';
                                document.getElementById('status').classList.remove('submitted');
                                
                                // Обновляем таймер, если он еще идет
                                if (question.timeElapsed !== undefined && question.time) {
                                    const timeLeft = Math.max(0, question.time - question.timeElapsed);
                                    updateTimer(timeLeft);
                                    
                                    if (timeLeft > 0) {
                                        questionStartTime = Date.now() - (question.timeElapsed * 1000);
                                        
                                        if (currentTimer) {
                                            clearInterval(currentTimer);
                                        }
                                        
                                        currentTimer = setInterval(() => {
                                            const elapsed = Math.floor((Date.now() - questionStartTime) / 1000);
                                            const remaining = Math.max(0, question.time - elapsed);
                                            updateTimer(remaining);
                                            
                                            if (remaining <= 0) {
                                                clearInterval(currentTimer);
                                                answerInput.disabled = true;
                                                document.getElementById('submit-btn').disabled = true;
                                                
                                                if (!answerSubmitted) {
                                                    const answerTime = Date.now() - questionStartTime;
                                                    socket.emit('intellectual-answer', {
                                                        roomCode: roomCode,
                                                        answer: '',
                                                        time: answerTime
                                                    });
                                                    answerSubmitted = true;
                                                    document.getElementById('question-screen').style.display = 'none';
                                                    document.getElementById('waiting-next-question-screen').style.display = 'block';
                                                    hideFrame1Elements();
                                                }
                                                updateFrame1Timer(0, false);
                                            }
                                        }, 1000);
                                    } else {
                                        // Время истекло
                                        answerInput.disabled = true;
                                        document.getElementById('submit-btn').disabled = true;
                                        answerSubmitted = true;
                                        document.getElementById('question-screen').style.display = 'none';
                                        document.getElementById('waiting-next-question-screen').style.display = 'block';
                                        hideFrame1Elements();
                                        updateFrame1Timer(0, false);
                                    }
                                }
                            }
                        }
                    } else if (data.gameState === 'waiting-next-question') {
                        // Ожидание следующего вопроса
                        document.getElementById('connect-screen').style.display = 'none';
                        document.getElementById('waiting-screen').style.display = 'none';
                        document.getElementById('game-screen').style.display = 'block';
                        document.getElementById('question-screen').style.display = 'none';
                        document.getElementById('waiting-next-question-screen').style.display = 'block';
                        document.getElementById('question-result-screen').style.display = 'none';
                        hideFrame1Elements();
                    } else if (data.gameState === 'finished') {
                        // Игра завершена
                        if (data.finalResults) {
                            document.getElementById('connect-screen').style.display = 'none';
                            document.getElementById('waiting-screen').style.display = 'none';
                            document.getElementById('game-screen').style.display = 'block';
                            document.getElementById('question-screen').style.display = 'none';
                            document.getElementById('waiting-next-question-screen').style.display = 'none';
                            document.getElementById('question-result-screen').style.display = 'block';
                            
                            // Показываем финальные результаты
                            const resultsList = document.getElementById('final-results-list');
                            if (resultsList && data.finalResults.results) {
                                resultsList.innerHTML = '';
                                data.finalResults.results.forEach((player, index) => {
                                    const item = document.createElement('div');
                                    item.className = 'result-item';
                                    item.innerHTML = `
                                        <span class="rank">${index + 1}</span>
                                        <span class="name">${player.name}</span>
                                        <span class="score">${player.score}</span>
                                    `;
                                    resultsList.appendChild(item);
                                });
                            }
                            hideFrame1Elements();
                        }
                    }
                } else {
                    // Обычное подключение - показываем экран ожидания
                    document.getElementById('connect-screen').style.display = 'none';
                    document.getElementById('waiting-screen').style.display = 'block';
                    
                    // Скрываем элементы Frame1 при ожидании
                    hideFrame1Elements();
                }
                
                // Восстанавливаем кнопку
                const connectBtn = document.getElementById('connect-btn');
                if (connectBtn) {
                    connectBtn.disabled = false;
                    connectBtn.textContent = 'Подключиться';
                }
            });

            socket.on('error', (data) => {
                console.error('❌ Ошибка от сервера:', data);
                console.error('Тип данных:', typeof data);
                console.error('Содержимое:', JSON.stringify(data, null, 2));
                
                let errorMessage = 'Произошла ошибка при подключении';
                
                try {
                    if (typeof data === 'string') {
                        errorMessage = data;
                    } else if (data && typeof data === 'object') {
                        if (data.message) {
                            errorMessage = data.message;
                        } else if (data.error) {
                            errorMessage = data.error;
                        } else {
                            // Пытаемся извлечь сообщение из объекта
                            const keys = Object.keys(data);
                            if (keys.length > 0) {
                                const firstValue = data[keys[0]];
                                if (typeof firstValue === 'string') {
                                    errorMessage = firstValue;
                                } else {
                                    errorMessage = 'Ошибка: ' + JSON.stringify(data);
                                }
                            } else {
                                errorMessage = 'Неизвестная ошибка. Проверьте код комнаты.';
                            }
                        }
                    }
                } catch (e) {
                    console.error('Ошибка при обработке ошибки:', e);
                    errorMessage = 'Ошибка подключения. Проверьте код комнаты и убедитесь, что хост создал комнату.';
                }
                
                console.error('Текст ошибки для пользователя:', errorMessage);
                showError(errorMessage);
                
                // Восстанавливаем кнопку
                const connectBtn = document.getElementById('connect-btn');
                if (connectBtn) {
                    connectBtn.disabled = false;
                    connectBtn.textContent = 'Подключиться';
                }
            });

            socket.on('intellectual-question-started', (data) => {
                const { question, questionIndex, totalQuestions } = data;
                document.getElementById('waiting-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'block';
                document.getElementById('question-screen').style.display = 'block';
                document.getElementById('waiting-next-question-screen').style.display = 'none';
                document.getElementById('question-result-screen').style.display = 'none';
                
                // Инициализируем элементы Frame1
                initFrame1Elements();
                
                document.getElementById('question-text').textContent = question.question;
                updateQuestionNumber(questionIndex + 1, totalQuestions);
                
                // Сбрасываем состояние
                answerSubmitted = false;
                questionStartTime = Date.now();
                const answerInput = document.getElementById('answer-input');
                answerInput.value = '';
                answerInput.disabled = false;
                document.getElementById('submit-btn').disabled = false;
                document.getElementById('status').textContent = '';
                document.getElementById('status').classList.remove('submitted');
                
                // Запускаем таймер на 10 секунд
                let secondsLeft = 10;
                updateTimer(secondsLeft);
                
                if (currentTimer) {
                    clearInterval(currentTimer);
                }
                
                currentTimer = setInterval(() => {
                    secondsLeft--;
                    updateTimer(secondsLeft);
                    
                    if (secondsLeft <= 0) {
                        clearInterval(currentTimer);
                        answerInput.disabled = true;
                        document.getElementById('submit-btn').disabled = true;
                        
                        // Если время вышло и ответ не отправлен, отправляем пустой ответ
                        if (!answerSubmitted) {
                            const answerTime = Date.now() - questionStartTime;
                            
                            socket.emit('intellectual-answer', {
                                roomCode: roomCode,
                                answer: '', // Пустой ответ
                                time: answerTime
                            });
                            
                            answerSubmitted = true;
                            
                            // Показываем экран ожидания
                            document.getElementById('question-screen').style.display = 'none';
                            document.getElementById('waiting-next-question-screen').style.display = 'block';
                            hideFrame1Elements();
                        }
                        
                        // Обновляем таймер в Frame1 при остановке
                        updateFrame1Timer(0, false);
                    }
                }, 1000);
            });

            socket.on('intellectual-question-ended', () => {
                if (currentTimer) {
                    clearInterval(currentTimer);
                    currentTimer = null;
                }
                
                // Скрываем таймер в Frame1
                hideFrame1Elements();
                
                // Если ответ не отправлен, отправляем пустой ответ
                if (!answerSubmitted) {
                    const answerTime = questionStartTime ? Date.now() - questionStartTime : 0;
                    
                    socket.emit('intellectual-answer', {
                        roomCode: roomCode,
                        answer: '', // Пустой ответ
                        time: answerTime
                    });
                    
                    answerSubmitted = true;
                    
                    // Показываем экран ожидания
                    document.getElementById('question-screen').style.display = 'none';
                    document.getElementById('waiting-next-question-screen').style.display = 'block';
                    document.getElementById('answer-input').disabled = true;
                    document.getElementById('submit-btn').disabled = true;
                }
            });

            socket.on('intellectual-verification-update', (data) => {
                const { verified, score } = data;
                if (verified) {
                    document.getElementById('status').textContent = 
                        `Ответ проверен. Баллы: ${score}`;
                }
            });

            // Результаты вопроса для игрока
            socket.on('intellectual-question-result', (data) => {
                const { question, playerAnswer, correctAnswer, isCorrect, pointsEarned, currentScore } = data;
                
                // Скрываем экран ожидания и вопрос
                document.getElementById('waiting-next-question-screen').style.display = 'none';
                document.getElementById('question-screen').style.display = 'none';
                
                // Скрываем элементы Frame1 при показе результатов
                hideFrame1Elements();
                
                // Показываем экран результатов
                document.getElementById('question-result-screen').style.display = 'block';
                
                // Заполняем данные
                const questionText = question && question.question ? question.question : '';
                document.getElementById('result-question-text').textContent = questionText;
                document.getElementById('result-player-answer').textContent = playerAnswer || '(Нет ответа)';
                document.getElementById('result-correct-answer').textContent = correctAnswer || '(Не указан)';
                document.getElementById('result-points-earned').textContent = pointsEarned || 0;
                document.getElementById('result-total-score').textContent = currentScore || 0;
                
                // Подсвечиваем ответ игрока в зависимости от правильности
                const playerAnswerEl = document.getElementById('result-player-answer');
                if (isCorrect) {
                    playerAnswerEl.classList.add('correct');
                } else {
                    playerAnswerEl.classList.remove('correct');
                }
            });
        }

        // Функция показа ошибки
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            if (errorDiv) {
                errorDiv.textContent = message;
                setTimeout(() => {
                    errorDiv.textContent = '';
                }, 5000);
            } else {
                alert(message);
            }
        }

        // Функция подключения к комнате
        function connectToRoom() {
            console.log('connectToRoom вызвана');
            
            const roomCodeInput = document.getElementById('room-code');
            const playerNameInput = document.getElementById('player-name');
            
            if (!roomCodeInput || !playerNameInput) {
                console.error('Поля ввода не найдены');
                showError('Ошибка: поля ввода не найдены');
                return;
            }
            
            roomCode = roomCodeInput.value.toUpperCase().trim();
            playerName = playerNameInput.value.trim();

            console.log('Код комнаты:', roomCode, 'Имя игрока:', playerName);

            if (!roomCode || !playerName) {
                showError('Заполните все поля');
                return;
            }

            if (!socket) {
                console.error('Socket не инициализирован');
                showError('Ошибка подключения. Перезагрузите страницу.');
                return;
            }

            // Проверяем, подключен ли socket
            if (!socket.connected) {
                console.log('Socket еще не подключен, ждем подключения...');
                showError('Подключение к серверу... Пожалуйста, подождите.');
                
                socket.once('connect', () => {
                    console.log('Socket подключен, повторяем попытку');
                    connectToRoom();
                });
                
                return;
            }

            console.log('Socket подключен:', socket.connected);
            console.log('Отправка события intellectual-player-join:', { roomCode, playerName });
            
            // Показываем индикатор загрузки
            const connectBtn = document.getElementById('connect-btn');
            if (connectBtn) {
                connectBtn.disabled = true;
                connectBtn.textContent = 'Подключение...';
            }
            
            // Подключаемся к комнате
            socket.emit('intellectual-player-join', {
                roomCode: roomCode,
                playerName: playerName
            });
        }

        // Функция для создания элементов в Frame1
        function initFrame1Elements() {
            const frame1 = document.getElementById('frame1');
            if (!frame1) return;
            
            const frame1Content = frame1.querySelector('.frame1-content');
            if (!frame1Content) return;
            
            // Создаем номер вопроса по центру, если его нет
            let questionNumberEl = frame1Content.querySelector('.frame1-question-number');
            if (!questionNumberEl) {
                questionNumberEl = document.createElement('div');
                questionNumberEl.className = 'frame1-question-number';
                frame1Content.appendChild(questionNumberEl);
            }
            
            // Создаем таймер справа, если его нет
            const actionsRight = document.getElementById('frame1-actions-right');
            if (actionsRight) {
                let timerEl = actionsRight.querySelector('.frame1-timer');
                if (!timerEl) {
                    timerEl = document.createElement('div');
                    timerEl.className = 'frame1-timer';
                    timerEl.id = 'frame1-timer';
                    // Добавляем таймер в конец правой группы (чтобы он был самым правым)
                    actionsRight.appendChild(timerEl);
                }
            }
        }
        
        // Функция для обновления номера вопроса в Frame1
        function updateFrame1QuestionNumber(questionNum, totalQuestions) {
            const frame1 = document.getElementById('frame1');
            if (!frame1) return;
            
            const questionNumberEl = frame1.querySelector('.frame1-question-number');
            if (questionNumberEl) {
                questionNumberEl.textContent = `Вопрос ${questionNum} из ${totalQuestions}`;
                questionNumberEl.style.display = 'block';
            }
        }
        
        // Функция для обновления таймера в Frame1
        function updateFrame1Timer(timeLeft, isUrgent = false) {
            const timerEl = document.getElementById('frame1-timer');
            if (timerEl) {
                timerEl.textContent = timeLeft;
                timerEl.style.display = 'block';
                if (isUrgent) {
                    timerEl.classList.add('urgent');
                } else {
                    timerEl.classList.remove('urgent');
                }
            }
        }
        
        // Функция для скрытия элементов Frame1
        function hideFrame1Elements() {
            const frame1 = document.getElementById('frame1');
            if (!frame1) return;
            
            const questionNumberEl = frame1.querySelector('.frame1-question-number');
            const timerEl = document.getElementById('frame1-timer');
            
            if (questionNumberEl) {
                questionNumberEl.style.display = 'none';
            }
            if (timerEl) {
                timerEl.style.display = 'none';
            }
        }

        // Обновление таймера
        function updateTimer(seconds) {
            const timerEl = document.getElementById('timer');
            
            if (timerEl) {
                timerEl.textContent = seconds;
                if (seconds <= 10) {
                    timerEl.classList.add('urgent');
                } else {
                    timerEl.classList.remove('urgent');
                }
            }
            
            // Обновляем таймер в Frame1
            const isUrgent = seconds <= 10;
            updateFrame1Timer(seconds, isUrgent);
        }

        // Обновление номера вопроса в Frame1
        function updateQuestionNumber(current, total) {
            // Обновляем в Frame1
            updateFrame1QuestionNumber(current, total);
        }

        // Отправка ответа
        function submitAnswer() {
            if (answerSubmitted) return;
            
            const answerInput = document.getElementById('answer-input');
            const answer = answerInput.value.trim();
            
            if (!answer) {
                alert('Введите ответ');
                return;
            }

            // Останавливаем таймер
            if (currentTimer) {
                clearInterval(currentTimer);
                currentTimer = null;
            }

            const answerTime = Date.now() - questionStartTime;
            
            socket.emit('intellectual-answer', {
                roomCode: roomCode,
                answer: answer,
                time: answerTime
            });

            answerSubmitted = true;
            answerInput.disabled = true;
            document.getElementById('submit-btn').disabled = true;
            
            // Скрываем экран вопроса и показываем экран ожидания
            document.getElementById('question-screen').style.display = 'none';
            document.getElementById('waiting-next-question-screen').style.display = 'block';
            
            // Скрываем таймер в Frame1
            hideFrame1Elements();
        }



        // Обработчик кнопки отправки
        document.addEventListener('DOMContentLoaded', () => {
            const submitBtn = document.getElementById('submit-btn');
            const answerInput = document.getElementById('answer-input');
            
            if (submitBtn) {
                submitBtn.addEventListener('click', submitAnswer);
            }
            
            if (answerInput) {
                answerInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter' && e.ctrlKey) {
                        submitAnswer();
                    }
                });
            }
        });
    </script>
