<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рейтинг - Квиз для друзей</title>
    <!-- Новая система фреймов -->
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/layout.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="/styles/frame1.css">
    <link rel="stylesheet" href="/styles/frame2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Days+One&family=Handlee&family=Kalam:wght@300;400;700&family=Open+Sans:wght@400;500;600;700&family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;600;700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        /* Специфичные стили для страницы leaderboard */
        .frame-3-content {
            max-width: 800px;
        }

        /* Исправление перекрытия логотипа Frame 2 */
        /* Убираем белый фон и большой padding-bottom у Frame 2 */
        body .site-header .frame-2,
        body .site-header #frame2,
        body .site-header .frame2 {
            padding-bottom: 0 !important; /* Убираем padding-bottom полностью */
            background: transparent !important; /* Делаем фон прозрачным */
            backdrop-filter: none !important; /* Убираем размытие */
            -webkit-backdrop-filter: none !important;
            overflow: visible !important;
            min-height: auto !important;
            height: auto !important;
        }
        
        /* Убираем все плашки и фоны из Frame 2 - только логотип и подпись */
        body .site-header .frame2-content {
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }
        
        /* Убираем все псевдоэлементы */
        body .site-header .frame2-content::before,
        body .site-header .frame2-content::after {
            display: none !important;
            content: none !important;
        }
        
        /* На мобильных - еще меньше отступ */
        @media (max-width: 767px) {
            body .site-header .frame2-content {
                padding-bottom: clamp(10px, 2vh, 25px) !important;
                margin-bottom: clamp(8px, 1.5vh, 15px);
                padding-left: 16px !important;
                padding-right: 16px !important;
            }
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 40px;
            font-family: 'Caveat', cursive;
            color: #354FBA;
            font-size: clamp(24px, 4.5vw, 36px);
            font-weight: 400;
        }


        .leaderboard-list {
            margin: 32px 0;
        }

        .leaderboard-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px 24px;
            margin: 12px 0;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .leaderboard-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(4px);
        }

        .leaderboard-item.first {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.25), rgba(245, 158, 11, 0.25));
            font-weight: 600;
            border: 2px solid rgba(251, 191, 36, 0.5);
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.3);
            position: relative;
            padding-left: 60px;
        }

        .leaderboard-item.first::before {
            content: '🥇';
            position: absolute;
            left: 20px;
            font-size: 32px;
        }

        .leaderboard-item.second {
            background: linear-gradient(135deg, rgba(226, 232, 240, 0.2), rgba(203, 213, 225, 0.2));
            border: 1.5px solid rgba(226, 232, 240, 0.4);
            padding-left: 60px;
            position: relative;
        }

        .leaderboard-item.second::before {
            content: '🥈';
            position: absolute;
            left: 20px;
            font-size: 32px;
        }

        .leaderboard-item.third {
            background: linear-gradient(135deg, rgba(253, 186, 116, 0.2), rgba(251, 146, 60, 0.2));
            border: 1.5px solid rgba(253, 186, 116, 0.4);
            padding-left: 60px;
            position: relative;
        }

        .leaderboard-item.third::before {
            content: '🥉';
            position: absolute;
            left: 20px;
            font-size: 32px;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-start;
            text-align: left;
        }

        .player-name {
            font-weight: 600;
            font-size: 20px;
            text-align: left;
        }

        .player-stats {
            font-size: 14px;
            opacity: 0.8;
            text-align: left;
        }

        .player-score {
            font-size: 32px;
            font-weight: 700;
            color: var(--color-green-alt);
            font-family: 'Days One', sans-serif;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.7;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .back-link {
            text-align: center;
            margin-top: 40px;
        }

        .back-link a {
            color: var(--color-green-alt);
            text-decoration: none;
            font-size: 16px;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
        }

        .back-link a:hover {
            color: var(--color-green);
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 24px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            color: var(--color-dark);
        }

        /* Мобильная адаптация */
        @media (max-width: 767px) {
            .leaderboard-item {
                padding: 16px 16px;
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .leaderboard-item.first,
            .leaderboard-item.second,
            .leaderboard-item.third {
                padding-left: 50px;
            }

            .leaderboard-item.first::before,
            .leaderboard-item.second::before,
            .leaderboard-item.third::before {
                left: 12px;
                font-size: 28px;
            }

            .player-info {
                width: 100%;
            }

            .player-name {
                font-size: clamp(16px, 4vw, 20px);
            }

            .player-stats {
                font-size: clamp(12px, 3vw, 14px);
            }

            .player-score {
                font-size: clamp(24px, 6vw, 32px);
                align-self: flex-end;
                margin-top: 4px;
            }

            .leaderboard-list {
                margin: 24px 0;
            }

            .subtitle {
                margin-bottom: 24px;
                font-size: clamp(20px, 4vw, 28px);
            }

            .empty-state {
                padding: 40px 16px;
            }

            .empty-state-icon {
                font-size: 48px;
            }

            .loading {
                padding: 30px 16px;
                font-size: clamp(18px, 4vw, 24px);
            }
        }

        @media (max-width: 480px) {
            .leaderboard-item {
                padding: 12px 12px;
            }

            .leaderboard-item.first,
            .leaderboard-item.second,
            .leaderboard-item.third {
                padding-left: 45px;
            }

            .leaderboard-item.first::before,
            .leaderboard-item.second::before,
            .leaderboard-item.third::before {
                left: 10px;
                font-size: 24px;
            }

            .player-score {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="site-wrapper">
        <!-- HEADER: Frame 2 -->
        <header class="site-header">
            <!-- Frame 2: Логотип + фраза (создается через Frame2.js) -->
            <div class="frame frame-2" data-frame="logo" id="hub2-container"></div>
        </header>

        <!-- MAIN: Frame 3 -->
        <main class="site-main">
            <section class="frame frame-3" data-frame="content">
                <!-- Контентный слой -->
                <div class="frame-3-content">
                    <h1>🏆 Рейтинг</h1>
                    <p class="subtitle">Лучшие результаты в квизе для друзей</p>

                    <div id="loading" class="loading">Загрузка рейтинга...</div>
                    <div id="error" class="error" style="display: none;"></div>
                    <div id="leaderboard-list" class="leaderboard-list" style="display: none;"></div>
                    <div id="empty-state" class="empty-state" style="display: none;">
                        <div class="empty-state-icon">📊</div>
                        <p>Пока нет результатов</p>
                        <p style="margin-top: 20px; font-size: 16px;">Будьте первым, кто пройдет квиз!</p>
                    </div>
                </div>
            </section>

            <!-- FOOTER: Frame 4 и Frame 5 -->
            <footer class="site-footer">
                <!-- Frame 4: Правила безопасности -->
                <section class="frame frame-4" data-frame="rules" id="hub4">
                    <p>Правила безопасности: Будьте внимательны и соблюдайте правила игры.</p>
                </section>

                <!-- Frame 5: Информация о создателе -->
                <section class="frame frame-5" data-frame="about" id="hub5">
                    <p>© 2024 ВМЕСТЕ. Все права защищены.</p>
                </section>
            </footer>
        </main>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const quizId = urlParams.get('quiz') || 'friends-quiz';
        const password = urlParams.get('password') || '';
        let quizName = null;
        
        // Загружаем информацию о квизе для отображения названия
        async function loadQuizInfo() {
            if (quizId && quizId !== 'friends-quiz') {
                try {
                    const response = await fetch(`/api/quizzes/${quizId}`);
                    if (response.ok) {
                        const quiz = await response.json();
                        quizName = quiz.name;
                        // Обновляем заголовок
                        const subtitle = document.querySelector('.subtitle');
                        if (subtitle) {
                            subtitle.textContent = `Лучшие результаты: ${quizName}`;
                        }
                    }
                } catch (error) {
                    console.error('Ошибка загрузки информации о квизе:', error);
                }
            }
        }
        
        // Определяем URL для кнопки "Назад"
        function getBackUrl() {
            console.log('🔙 getBackUrl вызвана:', { quizId, password });
            
            // Если есть параметры quiz и password, возвращаем ссылку на solo.html
            if (quizId && password) {
                const url = `/solo.html?quiz=${encodeURIComponent(quizId)}&password=${encodeURIComponent(password)}`;
                console.log('🔙 Возвращаем URL с паролем:', url);
                return url;
            } else if (quizId) {
                const url = `/solo.html?quiz=${encodeURIComponent(quizId)}`;
                console.log('🔙 Возвращаем URL без пароля:', url);
                return url;
            }
            // Иначе возвращаем на главную
            console.log('🔙 Возвращаем главную страницу');
            return '/index.html';
        }

        let isInitialLoad = true;

        async function loadLeaderboard(showLoading = true, forceReload = false) {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const list = document.getElementById('leaderboard-list');
            const emptyState = document.getElementById('empty-state');

            if (showLoading) {
                loading.style.display = 'block';
            }
            error.style.display = 'none';
            if (isInitialLoad) {
                list.style.display = 'none';
                emptyState.style.display = 'none';
            }

            try {
                console.log('📊 Загрузка рейтинга для quizId:', quizId);
                
                // Обновляем данные на сервере только при первой загрузке или при принудительном обновлении
                if (isInitialLoad || forceReload) {
                    console.log('📊 Обновление данных на сервере...');
                    try {
                        await fetch('/api/reload-leaderboard');
                    } catch (reloadError) {
                        console.warn('⚠️ Не удалось обновить данные с сервера, используем кэш:', reloadError);
                        // Продолжаем с текущими данными в памяти
                    }
                }
                
                // Затем загружаем обновленные данные с фильтром по quizId
                // Нормализуем quizId для запроса
                let requestQuizId = quizId;
                if (quizId === 'akadem' || quizId === 'академ' || quizId === 'академгородок') {
                    requestQuizId = 'akadem';
                } else if (quizId === 'gazprom' || quizId && (quizId.toLowerCase().includes('газпром') || quizId.toLowerCase().includes('тестирование'))) {
                    requestQuizId = 'gazprom';
                }
                const leaderboardUrl = requestQuizId ? `/api/leaderboard?quizId=${encodeURIComponent(requestQuizId)}` : '/api/leaderboard';
                console.log('📊 Запрос рейтинга по URL:', leaderboardUrl);
                const response = await fetch(leaderboardUrl);
                if (!response.ok) {
                    throw new Error('Ошибка загрузки рейтинга');
                }
                const results = await response.json();
                console.log('📊 Получено результатов:', results.length);
                if (results.length > 0) {
                    console.log('📊 Первые результаты:', results.slice(0, 3));
                }

                loading.style.display = 'none';
                isInitialLoad = false;

                if (results.length === 0) {
                    emptyState.style.display = 'block';
                    list.style.display = 'none';
                    return;
                }

                emptyState.style.display = 'none';
                list.innerHTML = '';
                results.forEach((result, index) => {
                    const item = document.createElement('div');
                    item.className = 'leaderboard-item';
                    
                    if (index === 0) item.classList.add('first');
                    else if (index === 1) item.classList.add('second');
                    else if (index === 2) item.classList.add('third');

                    const playerInfo = document.createElement('div');
                    playerInfo.className = 'player-info';
                    
                    const playerName = document.createElement('div');
                    playerName.className = 'player-name';
                    playerName.textContent = result.playerName;
                    
                    const playerStats = document.createElement('div');
                    playerStats.className = 'player-stats';
                    
                    // Форматируем время
                    let timeText = '';
                    if (result.timeSpent > 0) {
                        const minutes = Math.floor(result.timeSpent / 60);
                        const seconds = result.timeSpent % 60;
                        if (minutes > 0) {
                            timeText = `${minutes}м ${seconds}с`;
                        } else {
                            timeText = `${seconds}с`;
                        }
                    } else {
                        timeText = 'время не записано';
                    }
                    
                    playerStats.textContent = `${result.correctAnswers}/${result.totalQuestions} правильных • ${timeText}`;
                    
                    playerInfo.appendChild(playerName);
                    playerInfo.appendChild(playerStats);

                    const playerScore = document.createElement('div');
                    playerScore.className = 'player-score';
                    playerScore.textContent = result.score;

                    item.appendChild(playerInfo);
                    item.appendChild(playerScore);
                    list.appendChild(item);
                });

                list.style.display = 'block';
            } catch (error) {
                console.error('Ошибка:', error);
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = 'Не удалось загрузить рейтинг. Убедитесь, что сервер запущен.';
            }
        }

        // Функция для обновления рейтинга (вызывается при нажатии на кнопку)
        function refreshLeaderboard() {
            console.log('🔄 Принудительное обновление рейтинга...');
            loadLeaderboard(true, true); // Показываем loading и принудительно обновляем данные
        }

        // Инициализация Frame1 и Frame2
        function initHubs() {
            // Определяем URL для кнопки "Назад"
            const backUrl = getBackUrl();
            
            // Инициализация Frame1 (Frame 1)
            if (typeof Frame1 !== 'undefined') {
                Frame1.init({
                    showBack: true,
                    backUrl: backUrl
                });
                
                // Добавляем кнопку "Обновить" справа в Frame 1
                setTimeout(() => {
                    const actionsRight = document.getElementById('frame1-actions-right');
                    if (actionsRight) {
                        // Проверяем, нет ли уже кнопки обновления
                        let refreshButton = document.getElementById('frame1-refresh-button');
                        if (!refreshButton) {
                            refreshButton = document.createElement('button');
                            refreshButton.id = 'frame1-refresh-button';
                            refreshButton.className = 'frame1-button';
                            refreshButton.textContent = 'Обновить';
                            refreshButton.type = 'button'; // Чтобы не было submit формы
                            refreshButton.style.cursor = 'pointer';
                            refreshButton.style.border = 'none'; // Убираем стандартную границу кнопки
                            refreshButton.style.background = 'transparent'; // Прозрачный фон, стили применятся через класс
                            refreshButton.addEventListener('click', (e) => {
                                e.preventDefault();
                                refreshLeaderboard();
                            });
                            actionsRight.appendChild(refreshButton);
                        }
                    }
                }, 100);
            }
            
            // Инициализация Frame2 (Frame 2)
            if (typeof Frame2 !== 'undefined') {
                Frame2.init();
            }
        }
        
        // Инициализация Frame1 и Frame2 после загрузки
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(initHubs, 200);
        });

        // Загружаем информацию о квизе и рейтинг при загрузке страницы
        loadQuizInfo().then(() => {
            loadLeaderboard(true);
        });
        
        // Обновление при изменении размера окна
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (typeof FrameCommon !== 'undefined') {
                    FrameCommon.updateFrame2Position();
                    FrameCommon.adaptSubtitleToLogo();
                }
            }, 100);
        });
    </script>
    
    <!-- Frame1 и Frame2 скрипты -->
    <!-- Конфигурация видимости фреймов -->
    <script>
        window.pageLayoutConfig = {
            showFrame1: true,
            showFrame2: true,
            showFrame4: true,
            showFrame5: true
        };
    </script>
    
    <!-- Layout Manager -->
    <script src="/scripts/layout.js"></script>
    <script src="/scripts/frame-common.js"></script>
    <script src="/scripts/frame1.js"></script>
    <script src="/scripts/frame2.js"></script>
</body>
</html>
