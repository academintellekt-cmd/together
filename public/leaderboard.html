<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рейтинг - Квиз для друзей</title>
    <link rel="stylesheet" href="/styles/brand-style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Days+One&display=swap" rel="stylesheet">
    <style>
        .container {
            max-width: 800px;
            position: relative;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
        }

        @media (min-width: 1024px) {
            .back-button {
                top: 20px;
                left: 40px;
            }
        }

        @media (max-width: 1023px) and (min-width: 769px) {
            .back-button {
                top: 15px;
                left: 30px;
            }
        }

        @media (max-width: 768px) {
            .back-button {
                top: 12px;
                left: 20px;
            }
        }

        @media (max-width: 480px) {
            .back-button {
                top: 10px;
                left: 15px;
            }
        }

        .back-button-hub {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(245, 245, 245, 0.85);
            border: 2px solid #393639;
            border-radius: 12px;
            color: #393639;
            text-decoration: none;
            font-family: 'Days One', sans-serif;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.3s;
            box-shadow: 
                0 2px 0px rgba(0, 0, 0, 0.2),
                0 4px 8px rgba(0, 0, 0, 0.1);
            white-space: nowrap;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        
        .back-button-hub:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 0px rgba(0, 0, 0, 0.3),
                0 8px 16px rgba(0, 0, 0, 0.15);
            background: rgba(245, 245, 245, 0.6);
        }
        
        .back-button-hub:active {
            transform: translateY(0px);
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            margin-top: 60px;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 40px;
            font-family: 'Caveat', cursive;
            color: #354FBA;
            font-size: clamp(24px, 4.5vw, 36px);
            font-weight: 400;
        }

        .leaderboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .refresh-btn {
            padding: 10px 20px;
            font-size: 16px;
        }

        .leaderboard-list {
            margin: 32px 0;
        }

        .leaderboard-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px 24px;
            margin: 12px 0;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .leaderboard-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(4px);
        }

        .leaderboard-item.first {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.25), rgba(245, 158, 11, 0.25));
            font-weight: 600;
            border: 2px solid rgba(251, 191, 36, 0.5);
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.3);
            position: relative;
            padding-left: 60px;
        }

        .leaderboard-item.first::before {
            content: '🥇';
            position: absolute;
            left: 20px;
            font-size: 32px;
        }

        .leaderboard-item.second {
            background: linear-gradient(135deg, rgba(226, 232, 240, 0.2), rgba(203, 213, 225, 0.2));
            border: 1.5px solid rgba(226, 232, 240, 0.4);
            padding-left: 60px;
            position: relative;
        }

        .leaderboard-item.second::before {
            content: '🥈';
            position: absolute;
            left: 20px;
            font-size: 32px;
        }

        .leaderboard-item.third {
            background: linear-gradient(135deg, rgba(253, 186, 116, 0.2), rgba(251, 146, 60, 0.2));
            border: 1.5px solid rgba(253, 186, 116, 0.4);
            padding-left: 60px;
            position: relative;
        }

        .leaderboard-item.third::before {
            content: '🥉';
            position: absolute;
            left: 20px;
            font-size: 32px;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-start;
            text-align: left;
        }

        .player-name {
            font-weight: 600;
            font-size: 20px;
            text-align: left;
        }

        .player-stats {
            font-size: 14px;
            opacity: 0.8;
            text-align: left;
        }

        .player-score {
            font-size: 32px;
            font-weight: 700;
            color: var(--color-green-alt);
            font-family: 'Days One', sans-serif;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.7;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .back-link {
            text-align: center;
            margin-top: 40px;
        }

        .back-link a {
            color: var(--color-green-alt);
            text-decoration: none;
            font-size: 16px;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
        }

        .back-link a:hover {
            color: var(--color-green);
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 24px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            color: var(--color-dark);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Кнопка назад -->
        <div class="back-button">
            <a href="#" id="back-link" class="back-button-hub">
                ← Назад
            </a>
        </div>
        
        <h1>🏆 Рейтинг</h1>
        <p class="subtitle">Лучшие результаты в квизе для друзей</p>

        <div class="leaderboard-header">
            <div></div>
            <button class="btn refresh-btn" id="refresh-btn">🔄 Обновить</button>
        </div>

        <div id="loading" class="loading">Загрузка рейтинга...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="leaderboard-list" class="leaderboard-list" style="display: none;"></div>
        <div id="empty-state" class="empty-state" style="display: none;">
            <div class="empty-state-icon">📊</div>
            <p>Пока нет результатов</p>
            <p style="margin-top: 20px; font-size: 16px;">Будьте первым, кто пройдет квиз!</p>
        </div>

    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const quizId = urlParams.get('quiz') || 'friends-quiz';
        const password = urlParams.get('password') || '';
        
        // Определяем URL для кнопки "Назад"
        function getBackUrl() {
            // Если есть параметры quiz и password, возвращаем ссылку на solo.html
            if (quizId && password) {
                return `/solo.html?quiz=${quizId}&password=${password}`;
            } else if (quizId) {
                return `/solo.html?quiz=${quizId}`;
            }
            // Иначе возвращаем на главную
            return '/index.html';
        }

        async function loadLeaderboard() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const list = document.getElementById('leaderboard-list');
            const emptyState = document.getElementById('empty-state');

            loading.style.display = 'block';
            error.style.display = 'none';
            list.style.display = 'none';
            emptyState.style.display = 'none';

            try {
                // Сначала обновляем данные на сервере
                await fetch('/api/reload-leaderboard');
                
                // Затем загружаем обновленные данные
                const response = await fetch(`/api/leaderboard`);
                if (!response.ok) {
                    throw new Error('Ошибка загрузки рейтинга');
                }
                const results = await response.json();

                loading.style.display = 'none';

                if (results.length === 0) {
                    emptyState.style.display = 'block';
                    return;
                }

                list.innerHTML = '';
                results.forEach((result, index) => {
                    const item = document.createElement('div');
                    item.className = 'leaderboard-item';
                    
                    if (index === 0) item.classList.add('first');
                    else if (index === 1) item.classList.add('second');
                    else if (index === 2) item.classList.add('third');

                    const playerInfo = document.createElement('div');
                    playerInfo.className = 'player-info';
                    
                    const playerName = document.createElement('div');
                    playerName.className = 'player-name';
                    playerName.textContent = result.playerName;
                    
                    const playerStats = document.createElement('div');
                    playerStats.className = 'player-stats';
                    
                    // Форматируем время
                    let timeText = '';
                    if (result.timeSpent > 0) {
                        const minutes = Math.floor(result.timeSpent / 60);
                        const seconds = result.timeSpent % 60;
                        if (minutes > 0) {
                            timeText = `${minutes}м ${seconds}с`;
                        } else {
                            timeText = `${seconds}с`;
                        }
                    } else {
                        timeText = 'время не записано';
                    }
                    
                    playerStats.textContent = `${result.correctAnswers}/${result.totalQuestions} правильных • ${timeText}`;
                    
                    playerInfo.appendChild(playerName);
                    playerInfo.appendChild(playerStats);

                    const playerScore = document.createElement('div');
                    playerScore.className = 'player-score';
                    playerScore.textContent = result.score;

                    item.appendChild(playerInfo);
                    item.appendChild(playerScore);
                    list.appendChild(item);
                });

                list.style.display = 'block';
            } catch (error) {
                console.error('Ошибка:', error);
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = 'Не удалось загрузить рейтинг. Убедитесь, что сервер запущен.';
            }
        }

        document.getElementById('refresh-btn').addEventListener('click', loadLeaderboard);

        // Применяем цвет выбранного персонажа к кнопке "Назад" и устанавливаем правильную ссылку
        document.addEventListener('DOMContentLoaded', function() {
            const savedColor = localStorage.getItem('selectedCharacterColor');
            const backLink = document.getElementById('back-link');
            
            if (backLink) {
                // Устанавливаем правильную ссылку для кнопки "Назад"
                backLink.href = getBackUrl();
            }
            
            if (savedColor) {
                // Применяем цвет ко всем кнопкам "Назад"
                const backButtons = document.querySelectorAll('.back-button-hub');
                backButtons.forEach(button => {
                    button.style.background = savedColor;
                });
            }
        });

        // Загружаем рейтинг при загрузке страницы
        loadLeaderboard();
    </script>
</body>
</html>
