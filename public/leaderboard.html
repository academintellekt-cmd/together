<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рейтинг - Квиз для друзей</title>
    <!-- Новая система фреймов -->
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/layout.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="/styles/hub1.css">
    <link rel="stylesheet" href="/styles/hub2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Days+One&family=Handlee&family=Kalam:wght@300;400;700&family=Open+Sans:wght@400;500;600;700&family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;600;700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        /* Специфичные стили для страницы leaderboard */
        .frame-3-content {
            max-width: 800px;
        }


        h1 {
            text-align: center;
            margin-bottom: 20px;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 40px;
            font-family: 'Caveat', cursive;
            color: #354FBA;
            font-size: clamp(24px, 4.5vw, 36px);
            font-weight: 400;
        }


        .leaderboard-list {
            margin: 32px 0;
        }

        .leaderboard-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px 24px;
            margin: 12px 0;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .leaderboard-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(4px);
        }

        .leaderboard-item.first {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.25), rgba(245, 158, 11, 0.25));
            font-weight: 600;
            border: 2px solid rgba(251, 191, 36, 0.5);
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.3);
            position: relative;
            padding-left: 60px;
        }

        .leaderboard-item.first::before {
            content: '🥇';
            position: absolute;
            left: 20px;
            font-size: 32px;
        }

        .leaderboard-item.second {
            background: linear-gradient(135deg, rgba(226, 232, 240, 0.2), rgba(203, 213, 225, 0.2));
            border: 1.5px solid rgba(226, 232, 240, 0.4);
            padding-left: 60px;
            position: relative;
        }

        .leaderboard-item.second::before {
            content: '🥈';
            position: absolute;
            left: 20px;
            font-size: 32px;
        }

        .leaderboard-item.third {
            background: linear-gradient(135deg, rgba(253, 186, 116, 0.2), rgba(251, 146, 60, 0.2));
            border: 1.5px solid rgba(253, 186, 116, 0.4);
            padding-left: 60px;
            position: relative;
        }

        .leaderboard-item.third::before {
            content: '🥉';
            position: absolute;
            left: 20px;
            font-size: 32px;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-start;
            text-align: left;
        }

        .player-name {
            font-weight: 600;
            font-size: 20px;
            text-align: left;
        }

        .player-stats {
            font-size: 14px;
            opacity: 0.8;
            text-align: left;
        }

        .player-score {
            font-size: 32px;
            font-weight: 700;
            color: var(--color-green-alt);
            font-family: 'Days One', sans-serif;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.7;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .back-link {
            text-align: center;
            margin-top: 40px;
        }

        .back-link a {
            color: var(--color-green-alt);
            text-decoration: none;
            font-size: 16px;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
        }

        .back-link a:hover {
            color: var(--color-green);
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 24px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            color: var(--color-dark);
        }
    </style>
</head>
<body>
    <div class="site-wrapper">
        <!-- HEADER: Frame 2 -->
        <header class="site-header">
            <!-- Frame 2: Логотип + фраза (создается через Hub2.js) -->
            <div class="frame frame-2" data-frame="logo" id="hub2-container"></div>
        </header>

        <!-- MAIN: Frame 3 -->
        <main class="site-main">
            <section class="frame frame-3" data-frame="content">
                <!-- Контентный слой -->
                <div class="frame-3-content">
                    <h1>🏆 Рейтинг</h1>
                    <p class="subtitle">Лучшие результаты в квизе для друзей</p>

                    <div id="loading" class="loading">Загрузка рейтинга...</div>
                    <div id="error" class="error" style="display: none;"></div>
                    <div id="leaderboard-list" class="leaderboard-list" style="display: none;"></div>
                    <div id="empty-state" class="empty-state" style="display: none;">
                        <div class="empty-state-icon">📊</div>
                        <p>Пока нет результатов</p>
                        <p style="margin-top: 20px; font-size: 16px;">Будьте первым, кто пройдет квиз!</p>
                    </div>
                </div>
            </section>

            <!-- FOOTER: Frame 4 и Frame 5 -->
            <footer class="site-footer">
                <!-- Frame 4: Правила безопасности -->
                <section class="frame frame-4" data-frame="rules" id="hub4">
                    <p>Правила безопасности: Будьте внимательны и соблюдайте правила игры.</p>
                </section>

                <!-- Frame 5: Информация о создателе -->
                <section class="frame frame-5" data-frame="about" id="hub5">
                    <p>© 2024 ВМЕСТЕ. Все права защищены.</p>
                </section>
            </footer>
        </main>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const quizId = urlParams.get('quiz') || 'friends-quiz';
        const password = urlParams.get('password') || '';
        let quizName = null;
        
        // Загружаем информацию о квизе для отображения названия
        async function loadQuizInfo() {
            if (quizId && quizId !== 'friends-quiz') {
                try {
                    const response = await fetch(`/api/quizzes/${quizId}`);
                    if (response.ok) {
                        const quiz = await response.json();
                        quizName = quiz.name;
                        // Обновляем заголовок
                        const subtitle = document.querySelector('.subtitle');
                        if (subtitle) {
                            subtitle.textContent = `Лучшие результаты: ${quizName}`;
                        }
                    }
                } catch (error) {
                    console.error('Ошибка загрузки информации о квизе:', error);
                }
            }
        }
        
        // Определяем URL для кнопки "Назад"
        function getBackUrl() {
            console.log('🔙 getBackUrl вызвана:', { quizId, password });
            
            // Если есть параметры quiz и password, возвращаем ссылку на solo.html
            if (quizId && password) {
                const url = `/solo.html?quiz=${encodeURIComponent(quizId)}&password=${encodeURIComponent(password)}`;
                console.log('🔙 Возвращаем URL с паролем:', url);
                return url;
            } else if (quizId) {
                const url = `/solo.html?quiz=${encodeURIComponent(quizId)}`;
                console.log('🔙 Возвращаем URL без пароля:', url);
                return url;
            }
            // Иначе возвращаем на главную
            console.log('🔙 Возвращаем главную страницу');
            return '/index.html';
        }

        async function loadLeaderboard() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const list = document.getElementById('leaderboard-list');
            const emptyState = document.getElementById('empty-state');

            loading.style.display = 'block';
            error.style.display = 'none';
            list.style.display = 'none';
            emptyState.style.display = 'none';

            try {
                console.log('📊 Загрузка рейтинга для quizId:', quizId);
                
                // Сначала обновляем данные на сервере
                console.log('📊 Обновление данных на сервере...');
                await fetch('/api/reload-leaderboard');
                
                // Затем загружаем обновленные данные с фильтром по quizId
                const leaderboardUrl = quizId ? `/api/leaderboard?quizId=${encodeURIComponent(quizId)}` : '/api/leaderboard';
                console.log('📊 Запрос рейтинга по URL:', leaderboardUrl);
                const response = await fetch(leaderboardUrl);
                if (!response.ok) {
                    throw new Error('Ошибка загрузки рейтинга');
                }
                const results = await response.json();
                console.log('📊 Получено результатов:', results.length);
                console.log('📊 Первые результаты:', results.slice(0, 3));

                loading.style.display = 'none';

                if (results.length === 0) {
                    emptyState.style.display = 'block';
                    return;
                }

                list.innerHTML = '';
                results.forEach((result, index) => {
                    const item = document.createElement('div');
                    item.className = 'leaderboard-item';
                    
                    if (index === 0) item.classList.add('first');
                    else if (index === 1) item.classList.add('second');
                    else if (index === 2) item.classList.add('third');

                    const playerInfo = document.createElement('div');
                    playerInfo.className = 'player-info';
                    
                    const playerName = document.createElement('div');
                    playerName.className = 'player-name';
                    playerName.textContent = result.playerName;
                    
                    const playerStats = document.createElement('div');
                    playerStats.className = 'player-stats';
                    
                    // Форматируем время
                    let timeText = '';
                    if (result.timeSpent > 0) {
                        const minutes = Math.floor(result.timeSpent / 60);
                        const seconds = result.timeSpent % 60;
                        if (minutes > 0) {
                            timeText = `${minutes}м ${seconds}с`;
                        } else {
                            timeText = `${seconds}с`;
                        }
                    } else {
                        timeText = 'время не записано';
                    }
                    
                    playerStats.textContent = `${result.correctAnswers}/${result.totalQuestions} правильных • ${timeText}`;
                    
                    playerInfo.appendChild(playerName);
                    playerInfo.appendChild(playerStats);

                    const playerScore = document.createElement('div');
                    playerScore.className = 'player-score';
                    playerScore.textContent = result.score;

                    item.appendChild(playerInfo);
                    item.appendChild(playerScore);
                    list.appendChild(item);
                });

                list.style.display = 'block';
            } catch (error) {
                console.error('Ошибка:', error);
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = 'Не удалось загрузить рейтинг. Убедитесь, что сервер запущен.';
            }
        }

        // Инициализация Hub1 и Hub2
        function initHubs() {
            // Определяем URL для кнопки "Назад"
            const backUrl = getBackUrl();
            
            // Инициализация Hub1 (Frame 1)
            if (typeof Hub1 !== 'undefined') {
                Hub1.init({
                    showBack: true,
                    backUrl: backUrl
                });
            }
            
            // Инициализация Hub2 (Frame 2)
            if (typeof Hub2 !== 'undefined') {
                Hub2.init();
            }
        }
        
        // Инициализация Hub1 и Hub2 после загрузки
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(initHubs, 200);
        });

        // Загружаем информацию о квизе и рейтинг при загрузке страницы
        loadQuizInfo().then(() => {
            loadLeaderboard();
        });
        
        // Обновление при изменении размера окна
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (typeof HubCommon !== 'undefined') {
                    HubCommon.updateHub2Position();
                    HubCommon.adaptSubtitleToLogo();
                }
            }, 100);
        });
    </script>
    
    <!-- Hub1 и Hub2 скрипты -->
    <!-- Конфигурация видимости фреймов -->
    <script>
        window.pageLayoutConfig = {
            showFrame1: true,
            showFrame2: true,
            showFrame4: true,
            showFrame5: true
        };
    </script>
    
    <!-- Layout Manager -->
    <script src="/scripts/layout.js"></script>
    <script src="/scripts/hub-common.js"></script>
    <script src="/scripts/hub1.js"></script>
    <script src="/scripts/hub2.js"></script>
</body>
</html>
