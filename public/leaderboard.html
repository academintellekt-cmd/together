<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рейтинг - Квиз для друзей</title>
    <link rel="stylesheet" href="/styles/brand-style.css">
    <link rel="stylesheet" href="/styles/hub1.css">
    <link rel="stylesheet" href="/styles/hub2.css">
    <link rel="stylesheet" href="/styles/hub-layout.css">
    <link rel="stylesheet" href="/styles/hub-layout-system.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Days+One&family=Handlee&family=Kalam:wght@300;400;700&family=Open+Sans:wght@400;500;600;700&family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;600;700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            background: #f2f2f2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0 20px 20px 20px;
            position: relative;
            /* padding-bottom будет обновляться динамически через JavaScript для HUB4/HUB5 */
        }

        /* --- Каркас HUB-зон на странице --- */

        /* Базовый класс для любой HUB-зоны */
        .hub-zone {
            width: 100%;
            box-sizing: border-box;
        }

        /* HUB3 — основная зона контента */
        .hub3 {
            flex: 1 0 auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* Внутренний контейнер внутри HUB3 */
        .hub3 > .container {
            margin: 0 auto;
            max-width: 800px;
            width: 100%;
            text-align: center;
            position: relative;
            padding: clamp(20px, 6vw, 40px) clamp(16px, 4vw, 24px); /* Адаптивные отступы от краев экрана, как в gnu-quiz.html */
            box-sizing: border-box;
            z-index: 2; /* Ниже Hub1 (1001), Hub2 (1000), HUB4/HUB5 (999), но выше парящих элементов (z-index: -1) */
        }

        /* HUB4 и HUB5 — нижние полосы, фиксированные снизу (как HUB1/HUB2 сверху) */
        .hub4,
        .hub5 {
            position: fixed;
            left: 0;
            right: 0;
            background: var(--hub1-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: var(--hub1-padding);
            min-height: auto;
            box-sizing: border-box;
            width: 100%;
            z-index: 999; /* Ниже HUB1 (1001) и HUB2 (1000), но выше парящих элементов (z-index: -1) */
            transition: bottom 0.3s ease;
            will-change: bottom;
        }

        /* HUB5 — самая нижняя полоса (фиксирована внизу) */
        .hub5 {
            bottom: 0;
        }

        /* HUB4 — над HUB5 (bottom будет рассчитываться динамически через JavaScript) */
        .hub4 {
            bottom: auto; /* Устанавливается динамически через JavaScript в hub-common.js */
        }

        /* Парящие элементы */
        body::before {
            content: '';
            position: fixed;
            /* top устанавливается динамически через JavaScript */
            left: -50px;
            width: 200px;
            height: 200px;
            background: #d6fbbf; /* Парящий элемент */
            border-radius: 50% 40% 60% 30%;
            opacity: 0.9;
            z-index: -1; /* Ниже HUB1 (1001), HUB2 (1000), HUB4/HUB5 (999) и контента HUB3 (2), но выше фона */
            animation: wobble 6s ease-in-out infinite;
            pointer-events: none;
        }
        
        body::after {
            content: '';
            position: fixed;
            /* bottom устанавливается динамически через JavaScript */
            right: -80px;
            width: 250px;
            height: 250px;
            background: #fececd; /* Парящий элемент */
            border-radius: 40% 50% 30% 60%;
            opacity: 0.9;
            z-index: -1; /* Ниже HUB1 (1001), HUB2 (1000), HUB4/HUB5 (999) и контента HUB3 (2), но выше фона */
            animation: wobble 8s ease-in-out infinite reverse;
            pointer-events: none;
        }
        
        @keyframes wobble {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(5deg) scale(1.1); }
            50% { transform: rotate(-5deg) scale(0.9); }
            75% { transform: rotate(3deg) scale(1.05); }
        }

        .container {
            max-width: 800px;
            position: relative;
        }


        h1 {
            text-align: center;
            margin-bottom: 20px;
            margin-top: 0;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 40px;
            font-family: 'Caveat', cursive;
            color: #354FBA;
            font-size: clamp(24px, 4.5vw, 36px);
            font-weight: 400;
        }


        .leaderboard-list {
            margin: 32px 0;
        }

        .leaderboard-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px 24px;
            margin: 12px 0;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .leaderboard-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(4px);
        }

        .leaderboard-item.first {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.25), rgba(245, 158, 11, 0.25));
            font-weight: 600;
            border: 2px solid rgba(251, 191, 36, 0.5);
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.3);
            position: relative;
            padding-left: 60px;
        }

        .leaderboard-item.first::before {
            content: '🥇';
            position: absolute;
            left: 20px;
            font-size: 32px;
        }

        .leaderboard-item.second {
            background: linear-gradient(135deg, rgba(226, 232, 240, 0.2), rgba(203, 213, 225, 0.2));
            border: 1.5px solid rgba(226, 232, 240, 0.4);
            padding-left: 60px;
            position: relative;
        }

        .leaderboard-item.second::before {
            content: '🥈';
            position: absolute;
            left: 20px;
            font-size: 32px;
        }

        .leaderboard-item.third {
            background: linear-gradient(135deg, rgba(253, 186, 116, 0.2), rgba(251, 146, 60, 0.2));
            border: 1.5px solid rgba(253, 186, 116, 0.4);
            padding-left: 60px;
            position: relative;
        }

        .leaderboard-item.third::before {
            content: '🥉';
            position: absolute;
            left: 20px;
            font-size: 32px;
        }

        .player-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: flex-start;
            text-align: left;
        }

        .player-name {
            font-weight: 600;
            font-size: 20px;
            text-align: left;
        }

        .player-stats {
            font-size: 14px;
            opacity: 0.8;
            text-align: left;
        }

        .player-score {
            font-size: 32px;
            font-weight: 700;
            color: var(--color-green-alt);
            font-family: 'Days One', sans-serif;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.7;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .back-link {
            text-align: center;
            margin-top: 40px;
        }

        .back-link a {
            color: var(--color-green-alt);
            text-decoration: none;
            font-size: 16px;
            font-family: 'Nunito', sans-serif;
            font-weight: 600;
        }

        .back-link a:hover {
            color: var(--color-green);
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 24px;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            color: var(--color-dark);
        }
    </style>
</head>
<body class="with-hub">
    <!-- HUB3: основная зона контента -->
    <div class="hub-zone hub3">
        <div class="container">
            <h1>🏆 Рейтинг</h1>
            <p class="subtitle">Лучшие результаты в квизе для друзей</p>

            <div id="loading" class="loading">Загрузка рейтинга...</div>
            <div id="error" class="error" style="display: none;"></div>
            <div id="leaderboard-list" class="leaderboard-list" style="display: none;"></div>
            <div id="empty-state" class="empty-state" style="display: none;">
                <div class="empty-state-icon">📊</div>
                <p>Пока нет результатов</p>
                <p style="margin-top: 20px; font-size: 16px;">Будьте первым, кто пройдет квиз!</p>
            </div>
        </div>
    </div>

    <!-- HUB4: нижняя полоса (fixed, над HUB5) -->
    <div id="hub4" class="hub-zone hub4">
        <!-- Здесь позже можно разместить вспомогательные статусы, подсказки, маленькие карточки и т.п. -->
    </div>

    <!-- HUB5: самая нижняя полоса (fixed, внизу экрана) -->
    <div id="hub5" class="hub-zone hub5">
        <!-- Здесь позже можно разместить "Правила хаба", ссылки, переключение режимов -->
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const quizId = urlParams.get('quiz') || 'friends-quiz';
        const password = urlParams.get('password') || '';
        let quizName = null;
        
        // Загружаем информацию о квизе для отображения названия
        async function loadQuizInfo() {
            if (quizId && quizId !== 'friends-quiz') {
                try {
                    const response = await fetch(`/api/quizzes/${quizId}`);
                    if (response.ok) {
                        const quiz = await response.json();
                        quizName = quiz.name;
                        // Обновляем заголовок
                        const subtitle = document.querySelector('.subtitle');
                        if (subtitle) {
                            subtitle.textContent = `Лучшие результаты: ${quizName}`;
                        }
                    }
                } catch (error) {
                    console.error('Ошибка загрузки информации о квизе:', error);
                }
            }
        }
        
        // Определяем URL для кнопки "Назад"
        function getBackUrl() {
            console.log('🔙 getBackUrl вызвана:', { quizId, password });
            
            // Если есть параметры quiz и password, возвращаем ссылку на solo.html
            if (quizId && password) {
                const url = `/solo.html?quiz=${encodeURIComponent(quizId)}&password=${encodeURIComponent(password)}`;
                console.log('🔙 Возвращаем URL с паролем:', url);
                return url;
            } else if (quizId) {
                const url = `/solo.html?quiz=${encodeURIComponent(quizId)}`;
                console.log('🔙 Возвращаем URL без пароля:', url);
                return url;
            }
            // Иначе возвращаем на главную
            console.log('🔙 Возвращаем главную страницу');
            return '/index.html';
        }

        async function loadLeaderboard() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const list = document.getElementById('leaderboard-list');
            const emptyState = document.getElementById('empty-state');

            loading.style.display = 'block';
            error.style.display = 'none';
            list.style.display = 'none';
            emptyState.style.display = 'none';

            try {
                console.log('📊 Загрузка рейтинга для quizId:', quizId);
                
                // Сначала обновляем данные на сервере
                console.log('📊 Обновление данных на сервере...');
                await fetch('/api/reload-leaderboard');
                
                // Затем загружаем обновленные данные с фильтром по quizId
                const leaderboardUrl = quizId ? `/api/leaderboard?quizId=${encodeURIComponent(quizId)}` : '/api/leaderboard';
                console.log('📊 Запрос рейтинга по URL:', leaderboardUrl);
                const response = await fetch(leaderboardUrl);
                if (!response.ok) {
                    throw new Error('Ошибка загрузки рейтинга');
                }
                const results = await response.json();
                console.log('📊 Получено результатов:', results.length);
                console.log('📊 Первые результаты:', results.slice(0, 3));

                loading.style.display = 'none';

                if (results.length === 0) {
                    emptyState.style.display = 'block';
                    return;
                }

                list.innerHTML = '';
                results.forEach((result, index) => {
                    const item = document.createElement('div');
                    item.className = 'leaderboard-item';
                    
                    if (index === 0) item.classList.add('first');
                    else if (index === 1) item.classList.add('second');
                    else if (index === 2) item.classList.add('third');

                    const playerInfo = document.createElement('div');
                    playerInfo.className = 'player-info';
                    
                    const playerName = document.createElement('div');
                    playerName.className = 'player-name';
                    playerName.textContent = result.playerName;
                    
                    const playerStats = document.createElement('div');
                    playerStats.className = 'player-stats';
                    
                    // Форматируем время
                    let timeText = '';
                    if (result.timeSpent > 0) {
                        const minutes = Math.floor(result.timeSpent / 60);
                        const seconds = result.timeSpent % 60;
                        if (minutes > 0) {
                            timeText = `${minutes}м ${seconds}с`;
                        } else {
                            timeText = `${seconds}с`;
                        }
                    } else {
                        timeText = 'время не записано';
                    }
                    
                    playerStats.textContent = `${result.correctAnswers}/${result.totalQuestions} правильных • ${timeText}`;
                    
                    playerInfo.appendChild(playerName);
                    playerInfo.appendChild(playerStats);

                    const playerScore = document.createElement('div');
                    playerScore.className = 'player-score';
                    playerScore.textContent = result.score;

                    item.appendChild(playerInfo);
                    item.appendChild(playerScore);
                    list.appendChild(item);
                });

                list.style.display = 'block';
            } catch (error) {
                console.error('Ошибка:', error);
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = 'Не удалось загрузить рейтинг. Убедитесь, что сервер запущен.';
            }
        }

        // Инициализация Hub1
        function initHubs() {
            // Определяем URL для кнопки "Назад"
            const backUrl = getBackUrl();
            
            // Инициализация Hub1
            Hub1.init({
                showBack: true,
                backUrl: backUrl
            });
            
            // Обновление позиций (HUB2 не используется на этой странице)
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        // Позиционирование теперь управляется через CSS Grid
                        
                        
                        
                        
                    });
                });
            });
        }
        
        // Инициализация Hub1 после загрузки
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(initHubs, 100);
            });
        } else {
            setTimeout(initHubs, 100);
        }

        // Загружаем информацию о квизе и рейтинг при загрузке страницы
        loadQuizInfo().then(() => {
            loadLeaderboard();
        });
        
        // Обновление при изменении размера окна
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (typeof HubCommon !== 'undefined') {
                    // Позиционирование теперь управляется через CSS Grid
                    
                    
                    
                    
                }
            }, 100);
        });
    </script>
    
    <!-- Hub1 и Hub2 скрипты -->
    <script src="/scripts/hub-common.js"></script>
    <script src="/scripts/hub1.js"></script>
    <script src="/scripts/hub2.js"></script>
</body>
</html>
