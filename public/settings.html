<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки - ВМЕСТЕ</title>
    <!-- Новая система фреймов -->
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/layout.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="/styles/quiz-card.css">
    <link rel="stylesheet" href="/styles/frame1.css">
    <link rel="stylesheet" href="/styles/frame2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Days+One&family=Handlee&family=Kalam:wght@300;400;700&family=Open+Sans:wght@400;500;600;700&family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;600;700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    <!-- Конфигурация видимости фреймов -->
    <script>
        window.pageLayoutConfig = {
            showFrame1: true,
            showFrame2: true,
            showFrame4: true,
            showFrame5: true
        };
    </script>
    
    <!-- Layout Manager -->
    <script src="/scripts/layout.js"></script>
    <script src="/scripts/frame-common.js"></script>
    <script src="/scripts/frame1.js"></script>
    <script src="/scripts/frame2.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Специфичные стили для страницы настроек */
        .frame-3-content {
            max-width: 800px;
        }
        
        /* Симметричные отступы для всех элементов на мобильных */
        @media (max-width: 767px) {
            /* Frame 3 - симметричные отступы слева и справа (уже заданы в layout.css, но переопределяем для гарантии) */
            body .site-wrapper .frame-3,
            body .site-wrapper .frame3,
            body .site-main .frame-3,
            body .site-main .frame3 {
                padding-left: clamp(16px, 4vw, 24px) !important;
                padding-right: clamp(16px, 4vw, 24px) !important;
                padding-top: clamp(60px, 10vh, 100px) !important;
                padding-bottom: var(--spacing-m) !important;
            }
            
            /* Frame 3 контент - убираем боковые отступы, они уже у frame-3 */
            body .site-wrapper .frame-3-content,
            body .site-main .frame-3-content,
            body .frame-3-content#mainContainer {
                padding-left: 0 !important;
                padding-right: 0 !important;
                padding-top: 30px !important;
                padding-bottom: 30px !important;
                max-width: 800px !important;
                margin: 0 auto !important;
                width: 100% !important;
            }
            
            /* Заголовок настроек - симметричные отступы */
            body .settings-title {
                padding-left: 0 !important;
                padding-right: 0 !important;
                margin-left: 0 !important;
                margin-right: 0 !important;
            }
            
            /* Сетка настроек - симметричные отступы */
            body .settings-grid {
                padding-left: 0 !important;
                padding-right: 0 !important;
                margin-left: 0 !important;
                margin-right: 0 !important;
                width: 100% !important;
            }
        }

        .settings-title {
            font-family: 'Days One', sans-serif;
            font-size: clamp(32px, 6vw, 48px);
            color: var(--color-dark);
            margin-bottom: clamp(20px, 4vw, 30px);
            text-align: center;
            font-weight: 700;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: clamp(20px, 4vw, 28px);
            margin: 0 auto;
            margin-top: clamp(20px, 6vw, 40px); /* Отступ сверху */
            max-width: 800px;
            width: 100%;
            padding: 0 clamp(16px, 4vw, 24px); /* Отступы от краев экрана */
            align-items: center; /* Выравнивание по центру вертикально */
            align-content: center; /* Выравнивание содержимого по центру вертикально */
            justify-items: center; /* Выравнивание по центру горизонтально */
        }

        @media (min-width: 768px) {
            .settings-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: clamp(24px, 4vw, 32px);
            }
        }

        /* Используем универсальные классы из quiz-card.css */
        /* Здесь только специфичные стили для карточек настроек */

        /* Специальные стили для карточек настроек при наведении */
        /* Базовые hover эффекты уже определены в quiz-card.css */
        /* Здесь только специфичные изменения цвета при наведении */
        
        .settings-card:first-child:hover {
            background: rgba(171, 246, 124, 0.9) !important;
        }

        .settings-card:last-child:hover {
            background: rgba(246, 138, 124, 0.9) !important;
        }

        /* Цвет текста для карточек настроек */
        .settings-card .quiz-title,
        .settings-card .quiz-description {
            color: #373639;
        }

        /* Убираем подчеркивание у ссылок-карточек */
        .settings-card,
        .settings-card:hover,
        .settings-card:visited,
        .settings-card:active {
            text-decoration: none;
        }

        .settings-card * {
            text-decoration: none;
        }

        /* Модальное окно для пароля */
        .password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .password-modal {
            background: #FFFFFF;
            border-radius: 24px;
            padding: clamp(24px, 4vw, 36px) clamp(20px, 4vw, 32px);
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 
                0 8px 0px rgba(0, 0, 0, 0.2),
                0 16px 32px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        .password-title {
            font-family: 'Days One', sans-serif;
            font-size: clamp(24px, 5vw, 32px);
            color: #393639;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .password-input {
            width: 100%;
            padding: clamp(14px, 3vw, 18px);
            border: 3px solid #393639;
            border-radius: 12px;
            font-family: 'Days One', sans-serif;
            font-size: clamp(20px, 4vw, 24px);
            text-align: center;
            margin-bottom: clamp(16px, 3vw, 20px);
            box-sizing: border-box;
        }

        .password-input:focus {
            outline: none;
            border-color: #abf67c;
            box-shadow: 0 0 0 4px rgba(168, 224, 99, 0.2);
        }

        .password-buttons {
            display: flex;
            gap: clamp(8px, 2vw, 12px);
            width: 100%;
            box-sizing: border-box;
        }

        .password-button {
            background: #abf67c;
            color: #2fb95d;
            border: none;
            padding: clamp(12px, 2.5vw, 16px) clamp(16px, 3vw, 24px);
            border-radius: 12px;
            font-family: 'Days One', sans-serif;
            font-size: clamp(16px, 3vw, 20px);
            cursor: pointer;
            box-shadow: 0 4px 0px rgba(47, 185, 93, 0.3), 0 6px 12px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
            flex: 1;
            box-sizing: border-box;
            min-width: 0;
        }

        .password-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0px rgba(47, 185, 93, 0.4), 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .password-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px rgba(0, 0, 0, 0.2);
        }

        .password-button.back {
            background: #f2f2f2;
            color: #393639;
        }

        .password-button.back:hover {
            background: #E0E0E0;
        }

        .password-error {
            color: #ff7664;
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(14px, 2.5vw, 16px);
            margin-top: 12px;
            min-height: 20px;
            display: none;
        }

        .password-error.show {
            display: block;
        }

        /* Исправление перекрытия логотипа Frame 2 */
        /* Убираем белый фон у site-wrapper и site-header */
        body .site-wrapper {
            background: transparent !important; /* Прозрачный фон у site-wrapper */
        }
        
        body .site-header {
            background: transparent !important; /* Прозрачный фон у site-header */
        }
        
        /* Убираем белый фон и большой padding-bottom у Frame 2 */
        body .site-header .frame-2,
        body .site-header #frame2,
        body .site-header .frame2,
        body .site-header #hub2-container {
            padding-bottom: 0 !important; /* Убираем padding-bottom полностью */
            background: transparent !important; /* Делаем фон прозрачным */
            backdrop-filter: none !important; /* Убираем размытие */
            -webkit-backdrop-filter: none !important;
            overflow: visible !important;
            min-height: auto !important;
            height: auto !important;
            box-shadow: none !important;
        }
        
        /* Убираем все плашки и фоны из Frame 2 - только логотип и подпись */
        body .site-header .frame2-content {
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
        }
        
        /* Убираем все псевдоэлементы */
        body .site-header .frame2-content::before,
        body .site-header .frame2-content::after {
            display: none !important;
            content: none !important;
        }
        
        /* На мобильных - еще меньше отступ */
        @media (max-width: 767px) {
            body .site-header .frame2-content {
                padding-bottom: clamp(10px, 2vh, 25px) !important;
                margin-bottom: clamp(8px, 1.5vh, 15px);
                padding-left: 16px !important;
                padding-right: 16px !important;
            }
        }
        
        /* Исправление позиционирования кнопок Frame1 на мобильных */
        @media (max-width: 767px) {
            /* Выравниваем кнопки Frame1 по краям Frame 3 */
            /* Frame 3 имеет padding-left и padding-right: clamp(16px, 4vw, 24px) */
            
            body .site-header .frame-1,
            body .site-header #frame1,
            body .site-header .frame1 {
                padding-left: clamp(16px, 4vw, 24px) !important; /* Те же отступы, что у Frame 3 */
                padding-right: clamp(16px, 4vw, 24px) !important;
                padding-top: var(--spacing-s) !important;
                padding-bottom: var(--spacing-s) !important;
                width: 100% !important;
                box-sizing: border-box !important;
            }
            
            /* Контент Frame1 - убираем все внутренние отступы */
            body .site-header .frame1-content {
                padding-left: 0 !important;
                padding-right: 0 !important;
                margin-left: 0 !important;
                margin-right: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                box-sizing: border-box !important;
            }
            
            /* Контейнер кнопок - растягиваем на всю ширину и выравниваем по краям */
            body .site-header .frame1-actions {
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                box-sizing: border-box !important;
                justify-content: space-between !important;
                gap: 4px !important; /* Минимальный gap */
            }
            
            /* Левая группа кнопок */
            body .site-header .frame1-actions-left {
                flex: 0 1 auto !important;
                max-width: none !important;
                min-width: 0 !important;
                gap: 4px !important;
            }
            
            /* Правая группа кнопок - выравниваем по правому краю */
            body .site-header .frame1-actions-right {
                flex: 0 1 auto !important;
                max-width: none !important;
                min-width: 0 !important;
                gap: 4px !important;
                margin-left: auto !important; /* Выравниваем по правому краю */
            }
            
            /* Кнопки - увеличиваем размер, но остаемся в пределах границ */
            body .site-header .frame1-button {
                flex-shrink: 1 !important;
                min-width: 0 !important;
                padding: 10px 14px !important; /* Увеличенный padding */
                font-size: 13px !important; /* Увеличенный размер шрифта */
                white-space: normal !important;
                word-wrap: break-word !important;
                overflow-wrap: break-word !important;
                max-width: 100% !important;
            }
        }
    </style>
</head>
<body>
    <!-- Модальное окно для пароля -->
    <div class="password-overlay" id="passwordOverlay">
        <div class="password-modal">
            <h2 class="password-title">Введите пароль</h2>
            <input 
                type="password" 
                class="password-input" 
                id="passwordInput" 
                placeholder="Пароль"
                autocomplete="off"
                autofocus
            >
            <div class="password-buttons">
                <button class="password-button back" onclick="goBack()">Назад</button>
                <button class="password-button" onclick="checkPassword()">Войти</button>
            </div>
            <div class="password-error" id="passwordError">Неверный пароль. Попробуйте снова.</div>
        </div>
    </div>

    <div class="site-wrapper">
        <!-- MAIN: Frame 3 -->
        <main class="site-main">
            <section class="frame frame-3" data-frame="content">
                <!-- Контентный слой -->
                <div class="frame-3-content" id="mainContainer" style="display: none;">
                    <h1 class="settings-title">⚙️ Настройки</h1>
                    <div class="settings-grid">
                        <a href="/joystick-test/joystick.html" class="quiz-card settings-card" style="background: #abf67c; box-shadow: 0 6px 0px rgba(47, 185, 93, 0.3), 0 8px 16px rgba(47, 185, 93, 0.1);">
                            <div class="quiz-card-content">
                                <span class="quiz-icon">🎮</span>
                                <div class="quiz-title">Джойстик</div>
                                <div class="quiz-description">Настройка джойстика и геймпада для управления игрой</div>
                            </div>
                        </a>
                        <a href="/dmx-showmaker.html" class="quiz-card settings-card" style="background: #f68a7c; box-shadow: 0 6px 0px rgba(250, 87, 52, 0.3), 0 8px 16px rgba(250, 87, 52, 0.1);">
                            <div class="quiz-card-content">
                                <span class="quiz-icon">💡</span>
                                <div class="quiz-title">DMX Освещение</div>
                                <div class="quiz-description">Управление DMX фонарями и сценическим освещением</div>
                            </div>
                        </a>
                    </div>
                </div>
            </section>

            <!-- FOOTER: Frame 4 и Frame 5 -->
            <footer class="site-footer">
                <!-- Frame 4: Правила безопасности -->
                <section class="frame frame-4" data-frame="rules" id="hub4">
                    <p>Правила безопасности: Будьте внимательны и соблюдайте правила игры.</p>
                </section>

                <!-- Frame 5: Информация о создателе -->
                <section class="frame frame-5" data-frame="about" id="hub5">
                    <p>© 2024 ВМЕСТЕ. Все права защищены.</p>
                </section>
            </footer>
        </main>
    </div>

    <script>
        // Пароль для страницы настроек
        const SETTINGS_PASSWORD = '1234';
        const SETTINGS_STORAGE_KEY = 'settingsPasswordEntered';
        let passwordEntered = false;

        // Проверка пароля из localStorage
        if (localStorage.getItem(SETTINGS_STORAGE_KEY) === 'true') {
            passwordEntered = true;
            document.getElementById('passwordOverlay').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'block';
            // Инициализируем Frame1
            if (typeof Frame1 !== 'undefined') {
                initHubs();
            } else {
                // Ждем загрузки скриптов
                setTimeout(initHubs, 100);
            }
        }

        // Обработка Enter в поле пароля
        function setupPasswordInput() {
            const passwordInput = document.getElementById('passwordInput');
            if (passwordInput) {
                passwordInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        checkPassword();
                    }
                });
            }
        }

        // Настраиваем обработчик при загрузке
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', setupPasswordInput);
        } else {
            setupPasswordInput();
        }

        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('passwordError');
            
            if (password === SETTINGS_PASSWORD) {
                passwordEntered = true;
                localStorage.setItem(SETTINGS_STORAGE_KEY, 'true');
                document.getElementById('passwordOverlay').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'block';
                errorDiv.classList.remove('show');
                // Инициализируем Frame1 после небольшой задержки для отрисовки контента
                setTimeout(() => {
                    if (typeof Frame1 !== 'undefined') {
                        initHubs();
                    } else {
                        // Ждем загрузки скриптов
                        setTimeout(initHubs, 100);
                    }
                }, 100);
            } else {
                errorDiv.classList.add('show');
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }

        function clearPassword() {
            localStorage.removeItem(SETTINGS_STORAGE_KEY);
        }

        function goBack() {
            clearPassword();
            window.location.href = '/index.html';
        }

        // Инициализация Frame1 и Frame2
        function initHubs() {
            try {
                if (typeof Frame1 === 'undefined' || typeof Frame2 === 'undefined' || typeof FrameCommon === 'undefined') {
                    console.warn('Hub скрипты еще не загружены, повторная попытка через 100мс...');
                    setTimeout(initHubs, 100);
                    return;
                }
                
                console.log('Инициализация Frame1 и Frame2...');
                
                // Инициализация Frame1 с кнопкой "Назад"
                Frame1.init({
                    showBack: true,
                    backUrl: '/index.html'
                });
                
                // Инициализация Frame2
                Frame2.init();
                
                // Применяем исправления для Frame 2 после создания
                setTimeout(() => {
                    const frame2 = document.getElementById('frame2');
                    const frame2Container = document.getElementById('hub2-container');
                    const frame2Content = document.querySelector('.frame2-content');
                    
                    if (frame2) {
                        frame2.style.background = 'transparent';
                        frame2.style.backdropFilter = 'none';
                        frame2.style.webkitBackdropFilter = 'none';
                        frame2.style.paddingBottom = '0';
                    }
                    if (frame2Container) {
                        frame2Container.style.background = 'transparent';
                        frame2Container.style.backdropFilter = 'none';
                        frame2Container.style.webkitBackdropFilter = 'none';
                    }
                    if (frame2Content) {
                        frame2Content.style.background = 'transparent';
                        frame2Content.style.backdropFilter = 'none';
                        frame2Content.style.webkitBackdropFilter = 'none';
                    }
                }, 100);
                
                // Обновление позиций - ждем полной отрисовки
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            // Обновляем позицию Frame2 относительно Frame1
                            FrameCommon.updateFrame2Position();
                            FrameCommon.adaptSubtitleToLogo();
                            console.log('Frame1 и Frame2 успешно инициализированы');
                        });
                    });
                });
            } catch (error) {
                console.error('Ошибка при инициализации Hub:', error);
            }
        }

        // Инициализация Hub только если пароль уже введен
        if (passwordEntered) {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => {
                    setTimeout(initHubs, 200);
                });
            } else {
                setTimeout(initHubs, 200);
            }
        }
        
        // Обновление при изменении размера окна
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (typeof FrameCommon !== 'undefined' && passwordEntered) {
                    FrameCommon.updateFrame2Position();
                    FrameCommon.adaptSubtitleToLogo();
                }
            }, 100);
        });
    </script>
</body>
</html>
