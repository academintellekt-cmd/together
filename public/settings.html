<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки - ВМЕСТЕ</title>
    <link rel="stylesheet" href="/styles/brand-style.css">
    <link rel="stylesheet" href="/styles/quiz-card.css">
    <link rel="stylesheet" href="/styles/hub-layout.css">
    <link rel="stylesheet" href="/styles/hub1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Days+One&family=Handlee&family=Kalam:wght@300;400;700&family=Open+Sans:wght@400;500;600;700&family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;600;700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    <script src="/scripts/hub-common.js"></script>
    <script src="/scripts/hub1.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            background: var(--color-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0 20px 20px 20px;
            position: relative;
        }

        /* HUB3 - основная зона контента */
        .hub3 {
            flex: 1 0 auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            width: 100%;
        }

        .hub3 > .container {
            margin: 0 auto;
            max-width: 1200px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 2;
            /* padding-top будет устанавливаться динамически через HubCommon.updateContentPadding() */
        }

        .settings-title {
            font-family: 'Days One', sans-serif;
            font-size: clamp(32px, 6vw, 48px);
            color: var(--color-dark);
            margin-bottom: clamp(20px, 4vw, 30px);
            text-align: center;
            font-weight: 700;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: clamp(20px, 4vw, 28px);
            margin: 0 auto;
            margin-top: clamp(20px, 6vw, 40px); /* Отступ сверху */
            max-width: 800px;
            width: 100%;
            padding: 0 clamp(16px, 4vw, 24px); /* Отступы от краев экрана */
            align-items: center; /* Выравнивание по центру вертикально */
            align-content: center; /* Выравнивание содержимого по центру вертикально */
            justify-items: center; /* Выравнивание по центру горизонтально */
        }

        @media (min-width: 768px) {
            .settings-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: clamp(24px, 4vw, 32px);
            }
        }

        /* Используем универсальные классы из quiz-card.css */
        /* Здесь только специфичные стили для карточек настроек */
        
        .settings-card {
            /* Используем класс quiz-card из quiz-card.css */
        }

        /* Специальные стили для карточек настроек при наведении */
        /* Базовые hover эффекты уже определены в quiz-card.css */
        /* Здесь только специфичные изменения цвета при наведении */
        
        .settings-card:first-child:hover {
            background: rgba(171, 246, 124, 0.9) !important;
        }

        .settings-card:last-child:hover {
            background: rgba(246, 138, 124, 0.9) !important;
        }

        /* Цвет текста для карточек настроек */
        .settings-card .quiz-title,
        .settings-card .quiz-description {
            color: #373639;
        }

        /* Убираем подчеркивание у ссылок-карточек */
        .settings-card,
        .settings-card:hover,
        .settings-card:visited,
        .settings-card:active {
            text-decoration: none;
        }

        .settings-card * {
            text-decoration: none;
        }

        /* Модальное окно для пароля */
        .password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .password-modal {
            background: #FFFFFF;
            border-radius: 24px;
            padding: clamp(24px, 4vw, 36px) clamp(20px, 4vw, 32px);
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 
                0 8px 0px rgba(0, 0, 0, 0.2),
                0 16px 32px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        .password-title {
            font-family: 'Days One', sans-serif;
            font-size: clamp(24px, 5vw, 32px);
            color: #393639;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .password-input {
            width: 100%;
            padding: clamp(14px, 3vw, 18px);
            border: 3px solid #393639;
            border-radius: 12px;
            font-family: 'Days One', sans-serif;
            font-size: clamp(20px, 4vw, 24px);
            text-align: center;
            margin-bottom: clamp(16px, 3vw, 20px);
            box-sizing: border-box;
        }

        .password-input:focus {
            outline: none;
            border-color: #abf67c;
            box-shadow: 0 0 0 4px rgba(168, 224, 99, 0.2);
        }

        .password-buttons {
            display: flex;
            gap: clamp(8px, 2vw, 12px);
            width: 100%;
            box-sizing: border-box;
        }

        .password-button {
            background: #abf67c;
            color: #2fb95d;
            border: none;
            padding: clamp(12px, 2.5vw, 16px) clamp(16px, 3vw, 24px);
            border-radius: 12px;
            font-family: 'Days One', sans-serif;
            font-size: clamp(16px, 3vw, 20px);
            cursor: pointer;
            box-shadow: 0 4px 0px rgba(47, 185, 93, 0.3), 0 6px 12px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
            flex: 1;
            box-sizing: border-box;
            min-width: 0;
        }

        .password-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0px rgba(47, 185, 93, 0.4), 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .password-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px rgba(0, 0, 0, 0.2);
        }

        .password-button.back {
            background: #f2f2f2;
            color: #393639;
        }

        .password-button.back:hover {
            background: #E0E0E0;
        }

        .password-error {
            color: #ff7664;
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(14px, 2.5vw, 16px);
            margin-top: 12px;
            min-height: 20px;
            display: none;
        }

        .password-error.show {
            display: block;
        }
    </style>
</head>
<body class="with-hub">
    <!-- Модальное окно для пароля -->
    <div class="password-overlay" id="passwordOverlay">
        <div class="password-modal">
            <h2 class="password-title">Введите пароль</h2>
            <input 
                type="password" 
                class="password-input" 
                id="passwordInput" 
                placeholder="Пароль"
                autocomplete="off"
                autofocus
            >
            <div class="password-buttons">
                <button class="password-button back" onclick="goBack()">Назад</button>
                <button class="password-button" onclick="checkPassword()">Войти</button>
            </div>
            <div class="password-error" id="passwordError">Неверный пароль. Попробуйте снова.</div>
        </div>
    </div>

    <!-- HUB3: основная зона контента -->
    <div class="hub-zone hub3">
        <div class="container" id="mainContainer" style="display: none;">
            <h1 class="settings-title">⚙️ Настройки</h1>
            <div class="settings-grid">
                <a href="/joystick-test/joystick.html" class="quiz-card settings-card" style="background: #abf67c; box-shadow: 0 6px 0px rgba(47, 185, 93, 0.3), 0 8px 16px rgba(47, 185, 93, 0.1);">
                    <div class="quiz-card-content">
                        <span class="quiz-icon">🎮</span>
                        <div class="quiz-title">Джойстик</div>
                        <div class="quiz-description">Настройка джойстика и геймпада для управления игрой</div>
                    </div>
                </a>
                <a href="/dmx-control.html" class="quiz-card settings-card" style="background: #f68a7c; box-shadow: 0 6px 0px rgba(250, 87, 52, 0.3), 0 8px 16px rgba(250, 87, 52, 0.1);">
                    <div class="quiz-card-content">
                        <span class="quiz-icon">💡</span>
                        <div class="quiz-title">DMX Освещение</div>
                        <div class="quiz-description">Управление DMX фонарями и сценическим освещением</div>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <!-- HUB4 и HUB5 для нижних полос -->
    <div id="hub4" class="hub-zone hub4"></div>
    <div id="hub5" class="hub-zone hub5"></div>

    <script>
        // Пароль для страницы настроек
        const SETTINGS_PASSWORD = '1234';
        const SETTINGS_STORAGE_KEY = 'settingsPasswordEntered';
        let passwordEntered = false;

        // Проверка пароля из localStorage
        if (localStorage.getItem(SETTINGS_STORAGE_KEY) === 'true') {
            passwordEntered = true;
            document.getElementById('passwordOverlay').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'block';
            // Инициализируем Hub1
            if (typeof Hub1 !== 'undefined') {
                initHubs();
            } else {
                // Ждем загрузки скриптов
                setTimeout(initHubs, 100);
            }
        }

        // Обработка Enter в поле пароля
        function setupPasswordInput() {
            const passwordInput = document.getElementById('passwordInput');
            if (passwordInput) {
                passwordInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        checkPassword();
                    }
                });
            }
        }

        // Настраиваем обработчик при загрузке
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', setupPasswordInput);
        } else {
            setupPasswordInput();
        }

        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('passwordError');
            
            if (password === SETTINGS_PASSWORD) {
                passwordEntered = true;
                localStorage.setItem(SETTINGS_STORAGE_KEY, 'true');
                document.getElementById('passwordOverlay').style.display = 'none';
                document.getElementById('mainContainer').style.display = 'block';
                errorDiv.classList.remove('show');
                // Инициализируем Hub1 после небольшой задержки для отрисовки контента
                setTimeout(() => {
                    if (typeof Hub1 !== 'undefined') {
                        initHubs();
                    } else {
                        // Ждем загрузки скриптов
                        setTimeout(initHubs, 100);
                    }
                }, 100);
            } else {
                errorDiv.classList.add('show');
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }

        function clearPassword() {
            localStorage.removeItem(SETTINGS_STORAGE_KEY);
        }

        function goBack() {
            clearPassword();
            window.location.href = '/index.html';
        }

        // Инициализация Hub1
        function initHubs() {
            try {
                if (typeof Hub1 === 'undefined' || typeof HubCommon === 'undefined') {
                    console.warn('Hub скрипты еще не загружены, повторная попытка через 100мс...');
                    setTimeout(initHubs, 100);
                    return;
                }
                
                console.log('Инициализация Hub1...');
                
                // Инициализация Hub1 с кнопкой "Назад"
                Hub1.init({
                    showBack: true,
                    backUrl: '/index.html'
                });
                
                // Обновление позиций - ждем полной отрисовки Hub1
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            // Небольшая задержка для гарантии правильного расчета высоты Hub1
                            setTimeout(() => {
                                HubCommon.updateHub4Position();
                                HubCommon.updateContentPadding('.hub3 > .container');
                                HubCommon.updateFloatingElementsPosition();
                                HubCommon.updateBodyPaddingBottom();
                                
                                console.log('Hub1 успешно инициализирован');
                            }, 50);
                        });
                    });
                });
            } catch (error) {
                console.error('Ошибка при инициализации Hub:', error);
            }
        }

        // Инициализация Hub только если пароль уже введен
        if (passwordEntered) {
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => {
                    setTimeout(initHubs, 200);
                });
            } else {
                setTimeout(initHubs, 200);
            }
        }
        
        // Обновление при изменении размера окна
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (typeof HubCommon !== 'undefined' && passwordEntered) {
                    HubCommon._positionInitialized = false;
                    HubCommon._lastCorrectMarginTop = null;
                    
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            HubCommon.updateHub4Position();
                            HubCommon.updateContentPadding('.hub3 > .container');
                            HubCommon.updateFloatingElementsPosition();
                            HubCommon.updateBodyPaddingBottom();
                        });
                    });
                }
            }, 100);
        });
    </script>
</body>
</html>
