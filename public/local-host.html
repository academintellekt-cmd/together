<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/styles/aspect-ratio.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="/styles/quiz-card.css">
    <link rel="stylesheet" href="/styles/frame1.css">
    <link rel="stylesheet" href="/styles/frame2.css">

    <script>
        window.pageLayoutConfig = {
            showFrame1: true,
            showFrame2: true,
            showFrame4: true,
            showFrame5: true
        };
    </script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/scripts/layout.js"></script>
    <script src="/scripts/frame-common.js"></script>
    <script src="/scripts/frame1.js"></script>
    <script src="/scripts/frame2.js"></script>
    <style>
        /* Уменьшаем отступы Frame2 и Frame3 для этой страницы */
        .frame2 {
            padding-bottom: clamp(10px, 2vh, 20px) !important;
        }
        
        .frame-3 {
            padding-top: clamp(20px, 3vh, 40px) !important;
        }
        
        .local-host-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 20px 20px;
        }
        
        .section-title {
            font-family: 'Days One', sans-serif;
            font-size: clamp(24px, 4vw, 32px);
            color: #393639;
            margin-bottom: 15px;
            margin-top: 0;
            text-align: center;
        }
        
        /* Стили для станций во Frame2 - три состояния */
        /* 1. Серая - не подключено */
        #frame2 .frame2-player-icon.disconnected {
            background: #999 !important;
            border-color: #999 !important;
            color: #FFFFFF !important;
            opacity: 0.6;
            cursor: not-allowed !important;
        }
        
        /* 2. Бледно-зеленая - подключена, но не выбрана */
        #frame2 .frame2-player-icon.waiting {
            background: #a8e6cf !important;
            border-color: #a8e6cf !important;
            color: #393639 !important;
            cursor: pointer !important;
            pointer-events: auto !important;
            position: relative !important;
            z-index: 100 !important; /* Высокий z-index для кликабельности */
            min-height: 36px !important; /* Минимальная высота */
        }
        
        /* 3. Ярко-зеленая - выбрана */
        #frame2 .frame2-player-icon.ready {
            background: #00C159 !important;
            border-color: #00C159 !important;
            color: #FFFFFF !important;
            cursor: pointer !important;
            pointer-events: auto !important;
            position: relative !important;
            z-index: 100 !important; /* Высокий z-index для кликабельности */
            min-height: 36px !important; /* Минимальная высота */
        }
        
        /* Контейнер игроков должен быть кликабельным */
        #frame2 .frame2-players-container {
            position: relative !important;
            z-index: 100 !important;
            pointer-events: auto !important;
            min-height: 50px !important;
            isolation: isolate !important; /* Создаем новый stacking context */
        }
        
        /* Убеждаемся, что logo-section не перекрывает игроков */
        #frame2 .frame2-logo-section {
            pointer-events: none !important;
            z-index: 1 !important;
        }
        
        /* Когда logo-section скрыт, полностью убираем его из потока */
        #frame2 .frame2-logo-section[style*="display: none"] {
            display: none !important;
            pointer-events: none !important;
            z-index: -1 !important;
            position: absolute !important;
            visibility: hidden !important;
            height: 0 !important;
            width: 0 !important;
            min-height: 0 !important;
            max-height: 0 !important;
            overflow: hidden !important;
            margin: 0 !important;
            padding: 0 !important;
        }
        
        /* Все дочерние элементы скрытого logo-section также не должны блокировать клики */
        #frame2 .frame2-logo-section[style*="display: none"] * {
            pointer-events: none !important;
        }
        
        /* Убеждаемся, что frame2-content не блокирует клики */
        #frame2 .frame2-content {
            pointer-events: auto !important;
            position: relative !important;
            isolation: isolate !important; /* Создаем новый stacking context */
        }
        
        /* Убеждаемся, что logo-section не перекрывает контейнер игроков */
        #frame2 .frame2-content > .frame2-logo-section {
            z-index: 1 !important;
        }
        
        #frame2 .frame2-content > .frame2-players-container {
            z-index: 100 !important;
        }
        
        /* Убеждаемся, что Frame2 не блокирует клики и находится выше Frame3 */
        #frame2 {
            pointer-events: auto !important;
            z-index: 1003 !important; /* Выше Frame3 (1002) */
            position: relative !important;
        }
        
        /* Убеждаемся, что Frame2-content находится выше Frame3 */
        #frame2 .frame2-content {
            z-index: 1003 !important; /* Выше Frame3 (1002) */
        }
        
        /* Убеждаемся, что Frame1 не перекрывает иконки игроков */
        #frame1 {
            pointer-events: auto !important;
        }
        
        /* Убеждаемся, что Frame1 не блокирует клики по иконкам игроков */
        #frame1 ~ #frame2 {
            pointer-events: auto !important;
        }
        
        /* Убеждаемся, что Frame3 не перекрывает Frame2 */
        .frame-3,
        .frame3 {
            z-index: 1002 !important; /* Ниже Frame2 (1003) */
            pointer-events: auto !important;
        }
        
        /* Убеждаемся, что site-main не перекрывает Frame2 */
        .site-main {
            z-index: 1 !important; /* Ниже Frame2 */
            pointer-events: auto !important;
        }
        
        /* Убеждаемся, что site-wrapper не перекрывает Frame2 */
        .site-wrapper {
            z-index: 1 !important; /* Ниже Frame2 */
            pointer-events: auto !important;
        }
        
        /* Убеждаемся, что иконки игроков находятся выше других элементов */
        #frame2 .frame2-players-container .frame2-player-icon {
            position: relative !important;
            z-index: 1004 !important; /* Выше всего контента */
            pointer-events: auto !important;
            isolation: isolate !important; /* Создаем новый stacking context */
            height: auto !important;
            min-height: 36px !important;
            line-height: 1.2 !important;
        }
        
        /* Убеждаемся, что иконки игроков имеют полную кликабельную область */
        #frame2 .frame2-player-icon {
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            height: auto !important;
            line-height: 1.2 !important;
        }
        
        /* Убеждаемся, что текст внутри иконки не блокирует клики */
        #frame2 .frame2-player-icon * {
            pointer-events: none !important;
        }
        
        /* Hover эффект только для активных станций */
        #frame2 .frame2-player-icon.waiting:hover,
        #frame2 .frame2-player-icon.ready:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 0px rgba(0, 0, 0, 0.3),
                0 8px 16px rgba(0, 0, 0, 0.15);
        }
        
        .quizzes-section {
            margin-top: 0;
        }
        
        .quizzes-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        
        @media (max-width: 1200px) {
            .quizzes-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        
        @media (max-width: 768px) {
            .quizzes-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 480px) {
            .quizzes-grid {
                grid-template-columns: 1fr;
            }

        .quiz-card {
            cursor: pointer;
            min-height: 180px !important;
            padding: 12px 14px !important;
        }
        
        .quiz-card-content {
            padding-top: 8px !important;
        }
        
        .quiz-icon {

            margin-bottom: 6px !important;
            width: clamp(28px, 6vw, 40px) !important;

        .quiz-title {

        }

            box-shadow: 0 6px 0px rgba(0, 193, 89, 0.4), 0 8px 16px rgba(0, 193, 89, 0.2) !important;
        }

            gap: 20px;
            justify-content: center;
            margin-top: 30px;

        .action-button {

        .action-button.primary:hover:not(:disabled) {

        .action-button.danger:hover:not(:disabled) {

        }
        
        .control-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;

        }
        
        .control-button {
            display: flex;
            align-items: center;

        }

        .control-button:disabled {

<body>

    <script>
        let socket = null;
        let selectedQuizId = null;
        let stations = [];
        let quizzes = [];
        let currentRoomCode = null;
        let currentQuizName = null;
        let currentQuestionNumber = null;
        let currentQuestionTime = null;
        let questionTimer = null; // Таймер для отсчета времени
        let timeRemaining = 0; // Оставшееся время в секундах
        let questionStartTime = null; // Время начала вопроса
        let hostWindow = null; // Окно host.html
        let selectedStations = new Set(); // Выбранные станции для участия в игре
        let apiRouteAvailable = true; // Флаг доступности API роута /api/local/stations/command
        let gameFinished = false; // Флаг завершения игры

        // Инициализация
        async function init() {
            // Ждем загрузки скриптов
            if (typeof Frame1 === 'undefined' || typeof Frame2 === 'undefined' || typeof io === 'undefined') {
                setTimeout(init, 100);
                return;
            }

            try {
                Frame1.init({
                    showBack: true,
                    backUrl: '/index.html'
                });
                Frame2.init({ showLogo: false, showSubtitle: false });
            } catch (error) {
                console.warn('Ошибка инициализации Frame:', error);
            }
            
            // Инициализируем обработчик кликов по игрокам на document (самый надежный способ)
            document.addEventListener('click', function(e) {
                // Временное логирование для отладки
                if (e.target.closest('#frame2')) {
                    console.log('🖱️ Клик в области Frame2:', e.target, e.target.className);
                }
                
                // Проверяем, кликнули ли по иконке игрока
                const icon = e.target.closest('.frame2-player-icon');
                if (!icon) {
                    if (e.target.closest('#frame2')) {
                        console.log('⚠️ Клик в Frame2, но не по иконке игрока');
                    }
                    return;
                }
                
                console.log('✅ Найдена иконка игрока:', icon.id, icon.className);
                
                const playerId = icon.id;
                if (!playerId || !playerId.startsWith('frame2-player-station-')) {
                    console.log('⚠️ ID иконки не соответствует формату:', playerId);
                    return;
                }
                
                const match = playerId.match(/frame2-player-station-(\d+)/);
                if (!match) {
                    console.log('⚠️ Не удалось извлечь номер из ID:', playerId);
                    return;
                }
                
                const stationNumber = parseInt(match[1]);
                console.log('🔍 Номер станции:', stationNumber);
                
                const station = stations.find(s => s.stationNumber === stationNumber);
                const isReady = station && station.connected && station.socketId;
                
                console.log('📊 Станция найдена:', !!station, 'isReady:', isReady);
                
                if (!isReady) {
                    console.log('⚠️ Станция не готова, клик игнорируется');
                    return;
                }
                
                e.stopPropagation();
                e.preventDefault();
                
                const currentlySelected = selectedStations.has(stationNumber);
                console.log(`✅ Вызываем toggleStation для игрока ${stationNumber}, текущее состояние: ${currentlySelected}`);
                toggleStation(stationNumber, !currentlySelected);
            }, true);
            
            console.log('✅ Обработчик кликов по игрокам добавлен на document');

            // Подключаемся к серверу
            socket = io();
            
            socket.on('connect', () => {
                loadStations();
                socket.emit('local-host-connect');
                // Инициализируем обработчики событий socket
                initSocketEventHandlers();
                // Проверяем доступность API роута
                checkApiRouteAvailability();
                });

            // Обновление списка станций через Socket.io (в реальном времени)
            socket.on('local-stations-updated', (data) => {
                stations = data.stations || [];
                updateStationsDisplay();
            });

            // Инициализируем обработчики кнопок сразу (не зависит от socket)
            initButtonHandlers();
            
            await loadStations();
            await loadQuizzes();
            
            // Инициализируем состояние кнопки запуска
            updateStartButtonState();
        }

        // Загрузка списка станций
        async function loadStations() {
            try {
                const response = await fetch('/api/local/stations');
                if (!response.ok) {
                    console.error('❌ Ошибка HTTP при загрузке станций:', response.status);
                    return;
                }
                const data = await response.json();
                stations = data.stations || [];
                updateStationsDisplay();
            } catch (error) {
                console.error('Ошибка загрузки станций:', error);
            }
        }

        
        // Обновление отображения станций во Frame2
        function updateStationsDisplay() {
            if (typeof Frame2 === 'undefined') {
                setTimeout(() => updateStationsDisplay(), 100);
                return;
            }

            // Очищаем всех игроков из Frame2
            Frame2.clearPlayers();

            // Добавляем станции как иконки игроков во Frame2
            for (let i = 1; i <= 8; i++) {
                const station = stations.find(s => s.stationNumber === i);
                const isReady = station && station.connected && station.socketId;
                const isSelected = selectedStations.has(i);
                
                // Определяем статус для отображения (три состояния)
                let status = 'disconnected'; // Серая - не подключено
                if (isReady) {
                    status = isSelected ? 'ready' : 'waiting'; // Ярко-зеленая или бледно-зеленая
                }
                
                // Создаем текст для иконки: номер игрока
                const stationText = `Игрок ${i}`;
                const stationId = `station-${i}`;
                
                // Добавляем иконку станции во Frame2
                Frame2.addPlayerIcon(stationId, stationText, status);
            }
            
            // Устанавливаем стили для кликабельных иконок
            setTimeout(() => {
                for (let i = 1; i <= 8; i++) {
                    const station = stations.find(s => s.stationNumber === i);
                    const isReady = station && station.connected && station.socketId;
                    const stationId = `station-${i}`;
                    const iconId = `frame2-player-${stationId}`;
                    const icon = document.getElementById(iconId);
                    
                    if (icon) {
                        if (isReady) {
                            icon.style.cursor = 'pointer';
                            icon.style.pointerEvents = 'auto';
                        } else {
                            icon.style.cursor = 'not-allowed';
                            icon.style.pointerEvents = 'none';
                        }
                    }
                }
            }, 200);
            
            // Обновляем состояние кнопки запуска
            updateStartButtonState();
        }
        
        // Переключение выбора станции
        window.toggleStation = function(stationNumber, isSelected) {
            const station = stations.find(s => s.stationNumber === stationNumber);
            const isReady = station && station.connected && station.socketId;
            
            // Можно выбирать только подключенные станции
            if (!isReady) {
                return;
            }
            
            if (isSelected) {
                selectedStations.add(stationNumber);
            } else {
                selectedStations.delete(stationNumber);
            }
            
            // Обновляем статус иконки во Frame2
            if (typeof Frame2 !== 'undefined') {
                const status = isSelected ? 'ready' : 'waiting';
                Frame2.updatePlayerStatus(`station-${stationNumber}`, status);
            }
            
            // Явно обновляем состояние кнопки после изменения выбора
            updateStartButtonState();
        };
        
        // Обновить состояние кнопки запуска
        function updateStartButtonState() {
            const startBtn = document.getElementById('startQuizBtn');
            if (startBtn) {
                const hasSelectedStations = selectedStations.size > 0;
                const hasQuiz = selectedQuizId !== null;
                const shouldEnable = hasSelectedStations && hasQuiz;
                
                startBtn.disabled = !shouldEnable;
            }
        }
        
        

        // Загрузка квизов
        async function loadQuizzes() {
            try {
                const response = await fetch('/api/quizzes');
                if (!response.ok) throw new Error('Ошибка загрузки квизов');
                
                quizzes = await response.json();
                displayQuizzes();

        // Отображение квизов
        function displayQuizzes() {
            const grid = document.getElementById('quizzesGrid');
            grid.innerHTML = '';

            quizzes.forEach(quiz => {
                const card = document.createElement('div');
                card.className = 'quiz-card';
                card.dataset.quizId = quiz.id;
                
                card.innerHTML = `
                    <div class="quiz-card-content">
                        <span class="quiz-icon">${quiz.icon || '📝'}</span>
                        <div class="quiz-title">${quiz.name}</div>

        // Выбор квиза
        function selectQuiz(quizId) {
            selectedQuizId = quizId;
            
            // Обновляем визуальное выделение
            document.querySelectorAll('.quiz-card').forEach(card => {
                card.classList.remove('selected-quiz');
            });
            document.querySelector(`[data-quiz-id="${quizId}"]`)?.classList.add('selected-quiz');
            
            // Обновляем состояние кнопки запуска

        // Запуск квиза на всех станциях
        async function startQuiz() {
            if (!selectedQuizId) {
                alert('Выберите квиз');
                return;
            }

            if (selectedStations.size === 0) {
                alert('Выберите хотя бы одну станцию для участия в игре');
                return;
            }
            
            const selectedStationsList = stations.filter(s => s.connected && selectedStations.has(s.stationNumber));
            if (selectedStationsList.length === 0) {
                alert('Выбранные станции не подключены');
                return;
            }

            try {
                // Создаем комнату
                const response = await fetch('/api/create-room', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        quizId: selectedQuizId,
                        mode: 'local'
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Ошибка создания комнаты');
                }

                const data = await response.json();
                const roomCode = data.roomCode;
                currentRoomCode = roomCode;
                currentQuizName = quizzes.find(q => q.id === selectedQuizId)?.name || selectedQuizId;

                // Сначала подключаемся к комнате как хост для управления
                socket.emit('host-join', roomCode);
                
                // Ждем подтверждения подключения к комнате перед запуском квиза
                const onHostConnected = () => {
                    
                    // Отправляем команду только выбранным станциям открыть квиз
                    socket.emit('local-start-quiz', {
                        roomCode: roomCode,
                        quizId: selectedQuizId,
                        stationNumbers: Array.from(selectedStations)
                    });

                    // Открываем две страницы:
                    // 1. Страница отображения (host.html) - вопросы, результаты, рейтинг
                    hostWindow = window.open(`/host.html?quiz=${selectedQuizId}&room=${roomCode}`, '_blank');
                    
                    // 2. Страница управления (local-host-control.html) - управление игрой
                    const controlWindow = window.open(`/local-host-control.html?room=${roomCode}&quiz=${selectedQuizId}`, '_blank');
                    
                    // Показываем панель управления
                    showControlPanel();
                    
                    // Показываем кнопку завершения квиза
                    const endQuizBtn = document.getElementById('endQuizBtn');
                    if (endQuizBtn) endQuizBtn.style.display = 'inline-block';
                    
                    // Удаляем обработчик после использования
                    socket.off('host-connected', onHostConnected);
                };
                
                // Подписываемся на событие подключения хоста
                socket.on('host-connected', onHostConnected);
            } catch (error) {
                console.error('Ошибка запуска квиза:', error);
                alert('Ошибка запуска квиза: ' + error.message);
            }
        }

        // Показать панель управления
        function showControlPanel() {
            const panel = document.getElementById('controlPanel');
            const roomInfo = document.getElementById('currentRoomInfo');
            const roomCodeEl = document.getElementById('currentRoomCode');
            const quizNameEl = document.getElementById('currentQuizName');
            const questionNumberEl = document.getElementById('currentQuestionNumber');
            const questionTimeEl = document.getElementById('currentQuestionTime');
            
            if (panel) {
                panel.style.display = 'block';
                
                // Убеждаемся, что все кнопки активны
                const buttons = panel.querySelectorAll('button');
                buttons.forEach(btn => {
                    if (btn.disabled) {
                        btn.disabled = false;
                    }
                });
            }
            
            if (currentRoomCode) {
                if (roomInfo) roomInfo.style.display = 'block';
                if (roomCodeEl) roomCodeEl.textContent = currentRoomCode;
                if (quizNameEl) quizNameEl.textContent = currentQuizName || '-';
                if (questionNumberEl) questionNumberEl.textContent = currentQuestionNumber || '-';
                if (questionTimeEl) questionTimeEl.textContent = currentQuestionTime || '-';
            }
        }
        
        // Обновление информации о вопросе
        function updateQuestionInfo(questionNumber, totalQuestions, timeLimit) {
            currentQuestionNumber = questionNumber ? `${questionNumber} / ${totalQuestions || '?'}` : null;
            
            const questionNumberEl = document.getElementById('currentQuestionNumber');
            if (questionNumberEl) questionNumberEl.textContent = currentQuestionNumber || '-';
            
            // Запускаем таймер обратного отсчета
            if (timeLimit && timeLimit > 0) {
                timeRemaining = timeLimit;
                questionStartTime = Date.now();
                startQuestionTimer();
            } else {
                stopQuestionTimer();
                const questionTimeEl = document.getElementById('currentQuestionTime');
                if (questionTimeEl) questionTimeEl.textContent = '-';
            }
        }
        
        // Запуск таймера обратного отсчета
        function startQuestionTimer() {
            stopQuestionTimer(); // Останавливаем предыдущий таймер, если есть
            
            const questionTimeEl = document.getElementById('currentQuestionTime');
            if (!questionTimeEl) return;
            
            questionTimer = setInterval(() => {
                if (questionStartTime && timeRemaining > 0) {
                    const elapsed = Math.floor((Date.now() - questionStartTime) / 1000);
                    const remaining = Math.max(0, timeRemaining - elapsed);
                    
                    if (questionTimeEl) {
                        questionTimeEl.textContent = `${remaining} сек`;
                    }
                    
                    if (remaining <= 0) {
                        stopQuestionTimer();
                        if (questionTimeEl) questionTimeEl.textContent = '0 сек';
                    }
                }
            }, 100); // Обновляем каждые 100мс для плавности
        }
        
        // Остановка таймера
        function stopQuestionTimer() {
            if (questionTimer) {
                clearInterval(questionTimer);
                questionTimer = null;
            }
        }
        
        // Очистка информации о вопросе
        function clearQuestionInfo() {
            currentQuestionNumber = null;
            currentQuestionTime = null;
            timeRemaining = 0;
            questionStartTime = null;
            
            stopQuestionTimer();
            
            const questionNumberEl = document.getElementById('currentQuestionNumber');
            const questionTimeEl = document.getElementById('currentQuestionTime');
            
            if (questionNumberEl) questionNumberEl.textContent = '-';
            if (questionTimeEl) questionTimeEl.textContent = '-';
        }

        // Проверка доступности API роута при загрузке
        async function checkApiRouteAvailability() {
            try {
                const baseUrl = window.location.origin;
                const apiUrl = `${baseUrl}/api/local/stations/command`;
                
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        stationNumbers: [],
                        command: 'test',
                        params: {}
                    })
                });
                
                if (response.status === 404) {
                    apiRouteAvailable = false;
                    // Роут недоступен - это нормально, используем только Socket.io
                } else {
                    apiRouteAvailable = true;
                }
            } catch (error) {
                // При ошибке сети считаем роут недоступным - это нормально
                apiRouteAvailable = false;
            }
        }
        
        // Отправка команды станциям
        async function sendStationCommand(command, params, stationNumbers) {
            // Если роут недоступен, не пытаемся отправлять команды
            if (!apiRouteAvailable) {
                return;
            }
            
            if (!socket || !socket.connected) {
                return;
            }
            
            try {
                // Определяем базовый URL
                const baseUrl = window.location.origin;
                const apiUrl = `${baseUrl}/api/local/stations/command`;
                
                // Отправляем команду через HTTP API
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        stationNumbers: stationNumbers || null, // null = все станции
                        command: command,
                        params: params || {}
                    })
                });
                
                // Проверяем статус ответа
                if (!response.ok) {
                    if (response.status === 404) {
                        // Роут недоступен - помечаем это и больше не пытаемся использовать его
                        apiRouteAvailable = false;
                        return;
                    }
                    // Для других ошибок просто игнорируем
                    return;
                }
                
                const data = await response.json();
                
                if (!data.success) {
                    // Тихая ошибка - не выводим в консоль
                    return;
                }
            } catch (error) {
                // Тихая ошибка - не выводим в консоль
                // Роут может быть временно недоступен
                return;
            }
        }

            socket.emit('local-game-control', { action: 'skip-answers', roomCode: currentRoomCode });
        }
        
        // Пропустить ожидание готовности
        function skipReady() {

        // Инициализация обработчиков кнопок (не зависит от socket)
        function initButtonHandlers() {
            // Основные кнопки действий
            const startBtn = document.getElementById('startQuizBtn');
            const endQuizBtn = document.getElementById('endQuizBtn');
            const restartStationsBtn = document.getElementById('restartStationsBtn');
            
            // Кнопки управления в панели управления
            const skipAnswersBtn = document.getElementById('skipAnswersBtn');
            const skipReadyBtn = document.getElementById('skipReadyBtn');
            const nextQuestionBtn = document.getElementById('nextQuestionBtn');
            const endGameBtn = document.getElementById('endGameBtn');
            
            // Модальное окно завершения квиза
            const endQuizModal = document.getElementById('endQuizModal');
            const confirmEndQuizBtn = document.getElementById('confirmEndQuizBtn');
            const cancelEndQuizBtn = document.getElementById('cancelEndQuizBtn');
            
            // Обработчики основных действий
            if (startBtn) {
                startBtn.addEventListener('click', () => {
                    startQuiz();
                });
            }
            
            // Кнопка завершения квиза (в основном блоке)
            if (endQuizBtn) {
                endQuizBtn.addEventListener('click', () => {
                    showEndQuizModal();
                });
            }
            
            // Кнопка перезапуска станций
            if (restartStationsBtn) {
                restartStationsBtn.addEventListener('click', () => {
                    restartStations();
                });
            }
            
            // Модальное окно завершения квиза
            if (confirmEndQuizBtn) {
                confirmEndQuizBtn.addEventListener('click', () => {
                    confirmEndQuiz();
                });
            }
            
            if (cancelEndQuizBtn) {
                cancelEndQuizBtn.addEventListener('click', () => {
                    hideEndQuizModal();
                });
            }
            
            // Закрытие модального окна при клике вне его
            if (endQuizModal) {
                endQuizModal.addEventListener('click', (e) => {
                    if (e.target === endQuizModal) {
                        hideEndQuizModal();
                    }
                });
            }
            
            // Обработчики управления в панели управления
            if (skipAnswersBtn) {
                skipAnswersBtn.addEventListener('click', () => {
                    skipAnswers();
                });
            }
            
            if (skipReadyBtn) {
                skipReadyBtn.addEventListener('click', () => {
                    skipReady();
                });
            }
            
            if (nextQuestionBtn) {
                nextQuestionBtn.addEventListener('click', () => {
                    nextQuestion();
                });
            }
            
            if (endGameBtn) {
                endGameBtn.addEventListener('click', () => {
                    showEndQuizModal();
                });
            }
        }

        // Подтверждение завершения квиза
        function confirmEndQuiz() {

            if (!currentRoomCode) {

            // Очищаем информацию о вопросе

        // Перезапуск станций (возврат в режим ожидания)
        function restartStations() {
            if (!socket || !socket.connected) {
                alert('Не подключен к серверу');
                return;
            }
            
            // Используем выбранные станции или все станции из списка
            let stationNumbers = [];
            
            if (selectedStations.size > 0) {
                // Используем выбранные станции
                stationNumbers = Array.from(selectedStations);
            } else {
                // Используем все станции из списка (не только подключенные)
                stationNumbers = stations.map(s => s.stationNumber).filter(num => num);
            }
            
            if (stationNumbers.length === 0) {
                // Если нет выбранных станций, используем все возможные (1-8)
                stationNumbers = [1, 2, 3, 4, 5, 6, 7, 8];
            }
            
            // Отправляем команду навигации на station.html для всех станций
            // Используем local-end-quiz-and-reset для правильного сброса состояния
            socket.emit('local-end-quiz-and-reset', {
                stationNumbers: stationNumbers,
                roomCode: currentRoomCode,
                clearRoom: true,
                returnToWaiting: true
            });
            
            // Также отправляем команду навигации напрямую для надежности
            socket.emit('local-station-command', {
                stationNumbers: stationNumbers,
                command: 'navigate',
                params: {
                    page: 'waiting' // Это переведет станции на station.html
                }
            });
            
            // Сбрасываем флаг завершения игры
            gameFinished = false;
            
            // Скрываем кнопку перезапуска
            const restartStationsBtn = document.getElementById('restartStationsBtn');
            if (restartStationsBtn) restartStationsBtn.style.display = 'none';
            
            // Очищаем комнату
            currentRoomCode = null;
            currentQuizName = null;
            
            // Скрываем панель управления
            const controlPanel = document.getElementById('controlPanel');
            if (controlPanel) controlPanel.style.display = 'none';
        }
        
        // Инициализация обработчиков событий socket
        function initSocketEventHandlers() {
            if (!socket) return;
            
            // Получаем элементы кнопок для обновления состояния
            const skipAnswersBtn = document.getElementById('skipAnswersBtn');
            const skipReadyBtn = document.getElementById('skipReadyBtn');
            const nextQuestionBtn = document.getElementById('nextQuestionBtn');
            const endGameBtn = document.getElementById('endGameBtn');
            
            // Слушаем события от хоста для обновления состояния кнопок
            socket.on('game-started', () => {
                if (skipAnswersBtn) skipAnswersBtn.disabled = false;
                gameFinished = false;
            });
            
            socket.on('question', (questionData) => {
                if (skipAnswersBtn) skipAnswersBtn.disabled = false;
                if (skipReadyBtn) skipReadyBtn.disabled = true;
                if (nextQuestionBtn) nextQuestionBtn.disabled = true;
                
                // Обновляем информацию о вопросе
                if (questionData) {
                    updateQuestionInfo(questionData.questionNumber, questionData.totalQuestions, questionData.time);
                }
            });
            
            socket.on('results', () => {
                if (skipAnswersBtn) skipAnswersBtn.disabled = true;
                if (skipReadyBtn) skipReadyBtn.disabled = false;
                if (nextQuestionBtn) nextQuestionBtn.disabled = false;
                
                // Останавливаем таймер времени, но оставляем номер вопроса
                stopQuestionTimer();
                const questionTimeEl = document.getElementById('currentQuestionTime');
                if (questionTimeEl) questionTimeEl.textContent = '-';
            });
            
            socket.on('game-finished', () => {
                if (skipAnswersBtn) skipAnswersBtn.disabled = true;
                if (skipReadyBtn) skipReadyBtn.disabled = true;
                if (nextQuestionBtn) nextQuestionBtn.disabled = true;
                if (endGameBtn) endGameBtn.disabled = true;
                
                // Очищаем информацию о вопросе
                clearQuestionInfo();
                
                // Помечаем игру как завершенную
                gameFinished = true;
                
                // Скрываем кнопку завершения квиза
                const endQuizBtn = document.getElementById('endQuizBtn');
                if (endQuizBtn) endQuizBtn.style.display = 'none';
                if (endGameBtn) endGameBtn.style.display = 'none';
                
                // Показываем кнопку перезапуска станций
                const restartStationsBtn = document.getElementById('restartStationsBtn');
                if (restartStationsBtn) restartStationsBtn.style.display = 'inline-block';
            });
        }
        
        // Запуск при загрузке страницы
        function waitForSocketIO() {
            if (typeof io === 'undefined') {
                setTimeout(waitForSocketIO, 100);
                return;
            }
            
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => {
                    setTimeout(init, 200);
                });
            } else {
                setTimeout(init, 200);
            }
        }
        
        waitForSocketIO();
    </script>
    <script src="/scripts/frame5-copyright.js"></script>
</body>
</html>
