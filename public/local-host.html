<body>

    <script>
        let socket = null;
        let selectedQuizId = null;
        let stations = [];
        let quizzes = [];
        let currentRoomCode = null;
        let currentQuizName = null;
        let hostWindow = null; // Окно host.html
        let selectedStations = new Set(); // Выбранные станции для участия в игре

        // Инициализация
        async function init() {
            // Ждем загрузки скриптов
            if (typeof Frame1 === 'undefined' || typeof Frame2 === 'undefined' || typeof io === 'undefined') {
                setTimeout(init, 100);
                return;
            }

            try {
                Frame1.init({
                    showBack: true,
                    backUrl: '/index.html'
                });
                Frame2.init();
            } catch (error) {
                console.warn('Ошибка инициализации Frame:', error);
            }

            // Подключаемся к серверу
            socket = io();
            
            socket.on('connect', () => {
                console.log('Подключен к серверу');
                socket.emit('local-host-connect');
                // Инициализируем обработчики событий socket
                initSocketEventHandlers();
                
                });

            // Обновление списка станций
            socket.on('local-stations-updated', (data) => {
                stations = data.stations || [];
                updateStationsDisplay();
            });

            // Инициализируем обработчики кнопок сразу (не зависит от socket)
            initButtonHandlers();
            
            
            // Загружаем данные
            await loadStations();
            await loadQuizzes();
            
            // Инициализируем состояние кнопки запуска
            updateStartButtonState();
            
            // Обновляем список станций каждые 2 секунды
            setInterval(loadStations, 2000);
        }

        // Загрузка списка станций
        async function loadStations() {
            try {
                const response = await fetch('/api/local/stations');
                const data = await response.json();
                stations = data.stations || [];
                updateStationsDisplay();
            } catch (error) {
                console.error('Ошибка загрузки станций:', error);
            }
        }

        // Обновление отображения станций
        function updateStationsDisplay() {
            const grid = document.getElementById('stationsGrid');
            if (!grid) return;
            grid.innerHTML = '';

            // Создаем карточки для всех возможных станций (1-9)
            for (let i = 1; i <= 9; i++) {
                const station = stations.find(s => s.stationNumber === i);
                const isConnected = station && station.connected;
                const isSelected = selectedStations.has(i);
                
                const card = document.createElement('div');
                card.className = `station-card ${isConnected ? 'connected' : 'disconnected'} ${isSelected ? 'selected' : ''}`;
                card.dataset.stationNumber = i;
                
                const checkboxId = `station-checkbox-${i}`;
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'station-checkbox';
                checkbox.id = checkboxId;
                checkbox.checked = isSelected;
                checkbox.disabled = !isConnected;
                checkbox.addEventListener('change', function() {
                    toggleStation(i, this.checked);
                });
                
                card.appendChild(checkbox);
                
                const numberDiv = document.createElement('div');
                numberDiv.className = 'station-number';
                numberDiv.textContent = `Станция ${i}`;

        // Добавить станцию вручную
        window.addManualStation = async function() {
            const ip = document.getElementById('manualStationIP').value.trim();
            const stationNumber = parseInt(document.getElementById('manualStationNumber').value);
            
            if (!ip) {
                alert('Введите IP адрес станции');
                return;
            }
            
            if (!stationNumber || stationNumber < 1 || stationNumber > 9) {
                alert('Введите номер станции от 1 до 9');
                return;
            }
            
            // Проверяем формат IP
            const ipPattern = /^192\.168\.1\.(2[1-9]|29)$/;
            if (!ipPattern.test(ip)) {
                alert('IP адрес должен быть в формате 192.168.1.21-29');
                return;
            }
            
            try {
                const response = await fetch('/api/local/register-station', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ip: ip,
                        stationNumber: stationNumber
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    console.log('Станция добавлена:', data.station);
                    // Обновляем список станций
                    await loadStations();
                    // Скрываем форму
                    hideAddStationForm();
                    // Очищаем поля
                    document.getElementById('manualStationIP').value = '';
                    document.getElementById('manualStationNumber').value = '';
                } else {
                    alert('Ошибка добавления станции: ' + (data.error || 'Неизвестная ошибка'));
                }
            } catch (error) {
                console.error('Ошибка добавления станции:', error);
                alert('Ошибка добавления станции: ' + error.message);
            }
        };

        // Запуск квиза на всех станциях
        async function startQuiz() {
            if (!selectedQuizId) {
                alert('Выберите квиз');
                return;
            }

            if (selectedStations.size === 0) {
                alert('Выберите хотя бы одну станцию для участия в игре');
                return;
            }
            
            const selectedStationsList = stations.filter(s => s.connected && selectedStations.has(s.stationNumber));
            if (selectedStationsList.length === 0) {
                alert('Выбранные станции не подключены');
                return;
            }

            try {
                // Создаем комнату
                const response = await fetch('/api/create-room', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        quizId: selectedQuizId,
                        mode: 'local'
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Ошибка создания комнаты');
                }

                const data = await response.json();
                const roomCode = data.roomCode;
                currentRoomCode = roomCode;
                currentQuizName = quizzes.find(q => q.id === selectedQuizId)?.name || selectedQuizId;

                // Отправляем команду только выбранным станциям открыть квиз
                socket.emit('local-start-quiz', {
                    roomCode: roomCode,
                    quizId: selectedQuizId,
                    stationNumbers: Array.from(selectedStations)
                });

                // Открываем две страницы:
                // 1. Страница отображения (host.html) - вопросы, результаты, рейтинг
                hostWindow = window.open(`/host.html?quiz=${selectedQuizId}&room=${roomCode}`, '_blank');
                
                // 2. Страница управления (local-host-control.html) - управление игрой
                const controlWindow = window.open(`/local-host-control.html?room=${roomCode}&quiz=${selectedQuizId}`, '_blank');
                
                // Показываем панель управления
                showControlPanel();
                
                // Показываем кнопку завершения и сброса
                const endQuizAndResetBtn = document.getElementById('endQuizAndResetBtn');
                if (endQuizAndResetBtn) endQuizAndResetBtn.style.display = 'inline-block';
                
                // Подключаемся к комнате как хост для управления
                socket.emit('host-join', roomCode);
            } catch (error) {
                console.error('Ошибка запуска квиза:', error);
                alert('Ошибка запуска квиза: ' + error.message);
            }
        }

        // Отправка команды станциям
        async function sendStationCommand(command, params, stationNumbers) {
            if (!socket || !socket.connected) {
                console.warn('⚠️ Socket не подключен, команда не отправлена');
                return;
            }
            
            try {
                // Определяем базовый URL
                const baseUrl = window.location.origin;
                const apiUrl = `${baseUrl}/api/local/stations/command`;
                
                // Отправляем команду через HTTP API
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        stationNumbers: stationNumbers || null, // null = все станции
                        command: command,
                        params: params || {}
                    })
                });
                
                // Проверяем статус ответа
                if (!response.ok) {
                    if (response.status === 404) {
                        console.error(`❌ Роут /api/local/stations/command не найден (404). Локальный режим может быть недоступен.`);
                        console.error(`   Проверьте, что сервер запущен с поддержкой локального режима.`);
                        return;
                    }
                    const errorText = await response.text();
                    console.error(`❌ Ошибка HTTP ${response.status} при отправке команды "${command}":`, errorText);
                    return;
                }
                
                const data = await response.json();
                
                if (data.success) {
                    // Команда успешно отправлена
                } else {
                    console.error(`❌ Ошибка отправки команды "${command}":`, data.error);
                }
            } catch (error) {
                console.error(`❌ Ошибка отправки команды "${command}":`, error);
                if (error.message && error.message.includes('JSON')) {
                    console.error(`   Возможно, сервер вернул HTML вместо JSON. Проверьте, что роут зарегистрирован.`);
                }
            }
        }

            if (selectedStationsList.length > 0) {
                sendStationCommand('execute-action', {
                    action: 'showResults'
                }, selectedStationsList);
            }
            
        }
        
        // Следующий вопрос
        function nextQuestion() {
            
            if (!currentRoomCode) {
                alert('Комната не создана. Сначала запустите квиз.');
                return;
            }
            if (!socket || !socket.connected) {
                alert('Не подключен к серверу');
                return;
            }
            socket.emit('local-game-control', { action: 'next-question', roomCode: currentRoomCode });
            
            // Также отправляем команду на выбранные станции
            const selectedStationsList = Array.from(selectedStations);
            if (selectedStationsList.length > 0) {
                sendStationCommand('execute-action', {
                    action: 'nextQuestion'
                }, selectedStationsList);
            }
            
        }
        
        // Завершить игру
        function endGame() {
            
            if (!currentRoomCode) {
                alert('Комната не создана. Сначала запустите квиз.');
                return;
            }
            if (!socket || !socket.connected) {
                alert('Не подключен к серверу');
                return;
            }
            if (confirm('Вы уверены, что хотите завершить игру?')) {
                socket.emit('local-game-control', { action: 'end-game', roomCode: currentRoomCode });
                
                // Также отправляем команду на выбранные станции - вернуть в режим ожидания
                const selectedStationsList = Array.from(selectedStations);
                if (selectedStationsList.length > 0) {
                    sendStationCommand('navigate', { page: 'waiting' }, selectedStationsList);
                }
            }
        }
        
        // ========== НОВЫЕ ФУНКЦИИ УПРАВЛЕНИЯ ==========
        
        // Завершить квиз и начать новый
        function endQuizAndReset() {
            if (!socket || !socket.connected) {
                alert('Не подключен к серверу. Пожалуйста, подождите подключения.');
                return;
            }
            
            const selectedStationsList = Array.from(selectedStations);
            if (selectedStationsList.length === 0) {
                alert('Выберите станции для сброса');
                return;
            }
            
            if (confirm(`Вы уверены, что хотите завершить текущий квиз и начать новый?\nВсе регистрации игроков будут сброшены.\nСтанции: ${selectedStationsList.join(', ')}`)) {
                socket.emit('local-end-quiz-and-reset', {
                    stationNumbers: selectedStationsList,
                    roomCode: currentRoomCode,
                    clearRoom: true,
                    returnToWaiting: true
                });
                
                // Очищаем текущую комнату
                currentRoomCode = null;
                currentQuizName = null;
                
                // Скрываем панель управления
                const controlPanel = document.getElementById('controlPanel');
                const endQuizAndResetBtn = document.getElementById('endQuizAndResetBtn');
                
                if (controlPanel) controlPanel.style.display = 'none';
                if (endQuizAndResetBtn) endQuizAndResetBtn.style.display = 'none';
                
                console.log('Завершение квиза и сброс для нового запуска');
            }
        }
        
        // Завершить квиз на станциях (вернуть их на начальную страницу local-station.html)
        function endQuizOnStations() {
            if (!socket || !socket.connected) {
                alert('Не подключен к серверу. Пожалуйста, подождите подключения.');
                return;
            }
            
            const connectedStations = stations.filter(s => s.connected);
            if (connectedStations.length === 0) {
                alert('Нет подключенных станций');
                return;
            }
            
            if (confirm(`Вы уверены, что хотите завершить квиз на всех станциях (${connectedStations.length} станций)?\nВсе станции вернутся на начальную страницу подключения.`)) {
                socket.emit('local-end-quiz-on-stations', {
                    stationNumbers: connectedStations.map(s => s.stationNumber)
                });
                console.log('Завершение квиза на станциях');
            }
        }
        
        // Инициализация обработчиков кнопок (не зависит от socket)
        function initButtonHandlers() {
            
            
            // Обработчики кнопок
            const startBtn = document.getElementById('startQuizBtn');
            const refreshBtn = document.getElementById('refreshStationsBtn');
            const skipAnswersBtn = document.getElementById('skipAnswersBtn');
            const skipReadyBtn = document.getElementById('skipReadyBtn');
            const showResultsBtn = document.getElementById('showResultsBtn');
            const nextQuestionBtn = document.getElementById('nextQuestionBtn');
            const endGameBtn = document.getElementById('endGameBtn');
            const endGameOnStationsBtn = document.getElementById('endGameOnStationsBtn');
            
            
            
            if (startBtn) {
                startBtn.addEventListener('click', () => {
                    
                    startQuiz();
                });
            }
            if (refreshBtn) {
                refreshBtn.addEventListener('click', () => {
                    
                    refreshStations();
                });
            }
            
            const endQuizOnStationsBtn = document.getElementById('endQuizOnStationsBtn');
            if (endQuizOnStationsBtn) {
                endQuizOnStationsBtn.addEventListener('click', () => {
                    
                    endQuizOnStations();
                });
            }
            
            // Обработчики выбора станций
            const selectAllBtn = document.getElementById('selectAllStationsBtn');
            const deselectAllBtn = document.getElementById('deselectAllStationsBtn');
            const addStationBtn = document.getElementById('addStationBtn');
            if (selectAllBtn) {
                selectAllBtn.addEventListener('click', () => {
                    
                    selectAllStations();
                });
            }
            if (deselectAllBtn) {
                deselectAllBtn.addEventListener('click', () => {
                    
                    deselectAllStations();
                });
            }
            if (addStationBtn) {
                addStationBtn.addEventListener('click', () => {
                    
                    showAddStationForm();
                });
            }
            
            if (skipAnswersBtn) {
                skipAnswersBtn.addEventListener('click', () => {
                    
                    skipAnswers();
                });
            }
            if (skipReadyBtn) {
                skipReadyBtn.addEventListener('click', () => {
                    
                    skipReady();
                });
            }
            if (showResultsBtn) {
                showResultsBtn.addEventListener('click', () => {
                    
                    showResults();
                });
            }
            if (nextQuestionBtn) {
                nextQuestionBtn.addEventListener('click', () => {
                    
                    nextQuestion();
                });
            }
            if (endGameBtn) {
                endGameBtn.addEventListener('click', () => {
                    
                    endGame();
                });
            }
            
            
        }
        
        // Инициализация обработчиков событий socket
        function initSocketEventHandlers() {
            if (!socket) return;
            
            // Получаем элементы кнопок для обновления состояния
            const skipAnswersBtn = document.getElementById('skipAnswersBtn');
            const skipReadyBtn = document.getElementById('skipReadyBtn');
            const showResultsBtn = document.getElementById('showResultsBtn');
            const nextQuestionBtn = document.getElementById('nextQuestionBtn');
            const endGameBtn = document.getElementById('endGameBtn');
            
            // Слушаем события от хоста для обновления состояния кнопок
            socket.on('game-started', () => {
                if (skipAnswersBtn) skipAnswersBtn.disabled = false;
                if (showResultsBtn) showResultsBtn.disabled = false;
            });
            
            socket.on('question', () => {
                if (skipAnswersBtn) skipAnswersBtn.disabled = false;
                if (showResultsBtn) showResultsBtn.disabled = false;
                if (skipReadyBtn) skipReadyBtn.disabled = true;
                if (nextQuestionBtn) nextQuestionBtn.disabled = true;
            });
            
            socket.on('results', () => {
                if (skipAnswersBtn) skipAnswersBtn.disabled = true;
                if (showResultsBtn) showResultsBtn.disabled = true;
                if (skipReadyBtn) skipReadyBtn.disabled = false;
                if (nextQuestionBtn) nextQuestionBtn.disabled = false;
            });
            
            socket.on('game-finished', () => {
                if (skipAnswersBtn) skipAnswersBtn.disabled = true;
                if (skipReadyBtn) skipReadyBtn.disabled = true;
                if (showResultsBtn) showResultsBtn.disabled = true;
                if (nextQuestionBtn) nextQuestionBtn.disabled = true;
                if (endGameBtn) endGameBtn.disabled = true;
            });
        }
        
        // Запуск при загрузке страницы
        function waitForSocketIO() {
            if (typeof io === 'undefined') {
                setTimeout(waitForSocketIO, 100);
                return;
            }
            
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => {
                    setTimeout(init, 200);
                });
            } else {
                setTimeout(init, 200);
            }
        }
        
        waitForSocketIO();
    </script>
    <script src="/scripts/frame5-copyright.js"></script>
