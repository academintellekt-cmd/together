<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Локальный режим - Ведущий</title>
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/layout.css">
    <link rel="stylesheet" href="/styles/aspect-ratio.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="/styles/quiz-card.css">
    <link rel="stylesheet" href="/styles/frame1.css">
    <link rel="stylesheet" href="/styles/frame2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Days+One&family=Handlee&family=Kalam:wght@300;400;700&family=Open+Sans:wght@400;500;600;700&family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;600;700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    <script>
        window.pageLayoutConfig = {
            showFrame1: true,
            showFrame2: true,
            showFrame4: true,
            showFrame5: true
        };
    </script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/scripts/layout.js"></script>
    <script src="/scripts/frame-common.js"></script>
    <script src="/scripts/frame1.js"></script>
    <script src="/scripts/frame2.js"></script>
    <style>
        .local-host-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .stations-section {
            margin-bottom: 40px;
        }
        
        .section-title {
            font-family: 'Days One', sans-serif;
            font-size: clamp(24px, 4vw, 32px);
            color: #393639;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .stations-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .station-card {
            background: #FFFFFF;
            border: 3px solid #393639;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 0px rgba(0, 0, 0, 0.15), 0 6px 12px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        
        .station-card.connected {
            background: #d6fbbf;
            border-color: #00C159;
        }
        
        .station-card.disconnected {
            background: #f2f2f2;
            opacity: 0.6;
        }
        
        .station-card.selected {
            border-color: #4A90E2;
            border-width: 4px;
            box-shadow: 0 6px 0px rgba(74, 144, 226, 0.4), 0 8px 16px rgba(74, 144, 226, 0.2);
        }
        
        .station-checkbox {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: #00C159;
        }
        
        .station-number {
            font-family: 'Days One', sans-serif;
            font-size: clamp(20px, 3vw, 28px);
            color: #393639;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .station-status {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(12px, 2vw, 14px);
            color: #666;
        }
        
        .station-actions {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .station-action-btn {
            padding: 6px 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: 11px;
            font-weight: 600;
            border: 2px solid #393639;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            background: #FFFFFF;
            color: #393639;
        }
        
        .station-action-btn:hover {
            background: #00C159;
            color: #FFFFFF;
            transform: translateY(-1px);
        }
        
        .station-action-btn.danger:hover {
            background: #ff7664;
        }
        
        .station-action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .quizzes-section {
            margin-top: 40px;
        }
        
        .quizzes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .quiz-card {
            cursor: pointer;
        }
        
        .selected-quiz {
            border: 4px solid #00C159 !important;
            box-shadow: 0 6px 0px rgba(0, 193, 89, 0.4), 0 8px 16px rgba(0, 193, 89, 0.2) !important;
        }
        
        .action-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }
        
        .action-button {
            padding: 15px 30px;
            font-family: 'Days One', sans-serif;
            font-size: clamp(18px, 3vw, 24px);
            border: 3px solid #393639;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 0px rgba(0, 0, 0, 0.15), 0 6px 12px rgba(0, 0, 0, 0.1);
        }
        
        .action-button.primary {
            background: #00C159;
            color: #FFFFFF;
        }
        
        .action-button.primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 0px rgba(0, 193, 89, 0.4), 0 8px 16px rgba(0, 193, 89, 0.2);
        }
        
        .action-button.danger {
            background: #ff7664;
            color: #FFFFFF;
        }
        
        .action-button.danger:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 0px rgba(255, 118, 100, 0.4), 0 8px 16px rgba(255, 118, 100, 0.2);
        }
        
        .action-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .control-panel {
            margin-top: 40px;
            padding: 20px;
            background: #F2F2F2;
            border: 3px solid #393639;
            border-radius: 12px;
            box-shadow: 0 4px 0px rgba(0, 0, 0, 0.15), 0 6px 12px rgba(0, 0, 0, 0.1);
        }
        
        .control-panel-title {
            font-family: 'Days One', sans-serif;
            font-size: clamp(20px, 3vw, 24px);
            color: #393639;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .control-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .control-button {
            padding: 12px 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(14px, 2vw, 16px);
            font-weight: 600;
            border: 2px solid #393639;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 0px rgba(0, 0, 0, 0.15), 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        .control-button.refresh {
            background: #4A90E2;
            color: #FFFFFF;
        }
        
        .control-button.refresh:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 0px rgba(74, 144, 226, 0.4), 0 6px 12px rgba(74, 144, 226, 0.2);
        }
        
        .control-button.skip {
            background: #FFA500;
            color: #FFFFFF;
        }
        
        .control-button.skip:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 0px rgba(255, 165, 0, 0.4), 0 6px 12px rgba(255, 165, 0, 0.2);
        }
        
        .control-button.danger {
            background: #ff7664;
            color: #FFFFFF;
        }
        
        .control-button.danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 0px rgba(255, 118, 100, 0.4), 0 6px 12px rgba(255, 118, 100, 0.2);
        }
        
        .control-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .current-room-info {
            text-align: center;
            margin-bottom: 15px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            color: #666;
        }
        
        .current-room-info strong {
            color: #393639;
            font-weight: 700;
        }
        
        .station-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        
        .station-control-button {
            padding: 8px 12px;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 600;
            border: 2px solid #393639;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            background: #FFFFFF;
            color: #393639;
        }
        
        .station-control-button:hover {
            background: #00C159;
            color: #FFFFFF;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="site-wrapper">
        <main class="site-main">
            <section class="frame frame-3" data-frame="content">
                <div class="frame-3-content">
                    <div class="local-host-container">
                        <h1 class="section-title">🏠 Локальный режим - Ведущий</h1>
                        
                        <div class="stations-section">
                            <h2 class="section-title">Станции игроков</h2>
                            <div style="text-align: center; margin-bottom: 15px;">
                                <button class="control-button refresh" id="selectAllStationsBtn" style="padding: 8px 16px; font-size: 14px;">
                                    ✅ Выбрать все
                                </button>
                                <button class="control-button refresh" id="deselectAllStationsBtn" style="padding: 8px 16px; font-size: 14px; margin-left: 10px;">
                                    ❌ Снять выбор
                                </button>
                                <button class="control-button refresh" id="addStationBtn" style="padding: 8px 16px; font-size: 14px; margin-left: 10px;">
                                    ➕ Добавить станцию вручную
                                </button>
                            </div>
                            <div class="stations-grid" id="stationsGrid">
                                <!-- Станции будут добавлены через JavaScript -->
                            </div>
                        </div>
                        
                        <div class="quizzes-section">
                            <h2 class="section-title">Выберите квиз</h2>
                            <div class="quizzes-grid" id="quizzesGrid">
                                <div style="text-align: center; padding: 40px;">Загрузка квизов...</div>
                            </div>
                        </div>
                        
                        <div class="action-buttons">
                            <button class="action-button primary" id="startQuizBtn" disabled>
                                Запустить квиз на выбранных станциях
                            </button>
                            <button class="action-button danger" id="endQuizOnStationsBtn">
                                🛑 Завершить квиз на станциях
                            </button>
                            <button class="action-button danger" id="endQuizAndResetBtn" style="display: none;">
                                🔄 Завершить квиз и начать новый
                            </button>
                        </div>
                        
                        <!-- Объединенная панель управления -->
                        <div class="control-panel" id="controlPanel" style="display: none;">
                            <h2 class="control-panel-title">🎮 Панель управления</h2>
                            
                            <div class="current-room-info" id="currentRoomInfo" style="display: none;">
                                Текущая комната: <strong id="currentRoomCode">-</strong> | 
                                Квиз: <strong id="currentQuizName">-</strong>
                            </div>
                            
                            <!-- Управление игрой -->
                            <h3 style="font-family: 'Days One', sans-serif; font-size: 20px; color: #393639; margin-top: 20px; margin-bottom: 15px; text-align: center;">
                                🎮 Управление игрой
                            </h3>
                            <div class="control-buttons">
                                <button class="control-button refresh" id="refreshStationsBtn">

                                    ⏭️ Пропустить ожидание ответов

                                <button class="control-button skip" id="skipReadyBtn">
                                    ⏭️ Пропустить ожидание готовности

                                    📊 Показать результаты
                                </button>
                                <button class="control-button skip" id="nextQuestionBtn">
                                    ➡️ Следующий вопрос
                                </button>
                                <button class="control-button danger" id="endGameBtn">
                                    🏁 Завершить игру
                                </button>
                            </div>
                            
                            <!-- Управление игроками -->
                            <h3 style="font-family: 'Days One', sans-serif; font-size: 20px; color: #393639; margin-top: 30px; margin-bottom: 15px; text-align: center; border-top: 2px solid #393639; padding-top: 20px;">
                                👥 Управление игроками
                                </h3>
                            <div class="control-buttons">
                                <button class="control-button primary" id="forcePlayerReadyBtn">
                                    ✅ Нажать "Готов" за всех игроков
                                    </button>
                                
                                <div style="display: flex; gap: 10px; align-items: center; justify-content: center;">
                                    <button class="control-button primary" id="forceSelectAnswerBtn">
                                        🎯 Выбрать ответ за всех
                                    </button>
                                    <select id="answerSelect" style="padding: 10px; border: 2px solid #393639; border-radius: 8px; font-family: 'Montserrat', sans-serif; font-size: 16px;">
                                        <option value="0">А</option>
                                        <option value="1">Б</option>
                                        <option value="2">В</option>
                                        <option value="3">Г</option>
                                    </select>
                            </div>

                                <button class="control-button primary" id="forceConnectBtn">
                                    🔌 Подключить всех к комнате

                                <button class="control-button danger" id="forceDisconnectBtn">

                        </div>
                    </div>

            <footer class="site-footer">
                <section class="frame frame-4" data-frame="rules" id="hub4"></section>
                <section class="frame frame-5" data-frame="about" id="hub5">

                </section>
            </footer>
        </main>
    </div>

    <script>
        let socket = null;
        let selectedQuizId = null;
        let stations = [];
        let quizzes = [];
        let currentRoomCode = null;
        let currentQuizName = null;
        let hostWindow = null; // Окно host.html
        let selectedStations = new Set(); // Выбранные станции для участия в игре

        // Инициализация
        async function init() {
            // Ждем загрузки скриптов
            if (typeof Frame1 === 'undefined' || typeof Frame2 === 'undefined' || typeof io === 'undefined') {
                setTimeout(init, 100);
                return;
            }

            try {
                Frame1.init({
                    showBack: true,
                    backUrl: '/index.html'
                });
                Frame2.init();
            } catch (error) {
                console.warn('Ошибка инициализации Frame:', error);
            }

            // Подключаемся к серверу
            socket = io();
            
            socket.on('connect', () => {
                console.log('Подключен к серверу');
                socket.emit('local-host-connect');
                // Инициализируем обработчики событий socket
                initSocketEventHandlers();
            });

            // Обновление списка станций
            socket.on('local-stations-updated', (data) => {
                stations = data.stations || [];
                updateStationsDisplay();
            });

            // Инициализируем обработчики кнопок сразу (не зависит от socket)
            initButtonHandlers();
            
            
            // Загружаем данные
            await loadStations();
            await loadQuizzes();
            
            // Инициализируем состояние кнопки запуска
            updateStartButtonState();
            
            // Обновляем список станций каждые 2 секунды
            setInterval(loadStations, 2000);
        }

        // Загрузка списка станций
        async function loadStations() {
            try {
                const response = await fetch('/api/local/stations');
                const data = await response.json();
                stations = data.stations || [];
                updateStationsDisplay();
            } catch (error) {
                console.error('Ошибка загрузки станций:', error);
            }
        }

        // Обновление отображения станций
        function updateStationsDisplay() {
            const grid = document.getElementById('stationsGrid');
            if (!grid) return;
            grid.innerHTML = '';

            // Создаем карточки для всех возможных станций (1-9)
            for (let i = 1; i <= 9; i++) {
                const station = stations.find(s => s.stationNumber === i);
                const isConnected = station && station.connected;
                const isSelected = selectedStations.has(i);
                
                const card = document.createElement('div');
                card.className = `station-card ${isConnected ? 'connected' : 'disconnected'} ${isSelected ? 'selected' : ''}`;
                card.dataset.stationNumber = i;
                
                const checkboxId = `station-checkbox-${i}`;
                
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'station-checkbox';
                checkbox.id = checkboxId;
                checkbox.checked = isSelected;
                checkbox.disabled = !isConnected;
                checkbox.addEventListener('change', function() {
                    toggleStation(i, this.checked);
                });
                
                card.appendChild(checkbox);
                
                const numberDiv = document.createElement('div');
                numberDiv.className = 'station-number';
                numberDiv.textContent = `Станция ${i}`;
                card.appendChild(numberDiv);
                
                const statusDiv = document.createElement('div');
                statusDiv.className = 'station-status';
                statusDiv.textContent = isConnected ? 'Подключена' : 'Не подключена';
                card.appendChild(statusDiv);
                
                if (station && station.ip) {
                    const ipDiv = document.createElement('div');
                    ipDiv.className = 'station-status';
                    ipDiv.style.cssText = 'font-size: 10px; margin-top: 5px;';
                    ipDiv.textContent = station.ip;
                    card.appendChild(ipDiv);
                }
                
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'station-actions';
                
                if (isConnected) {
                    const openBtn = document.createElement('button');
                    openBtn.className = 'station-action-btn';
                    openBtn.textContent = '🌐 Открыть';
                    openBtn.title = 'Открыть страницу станции';
                    openBtn.onclick = () => openStationPage(i);
                    actionsDiv.appendChild(openBtn);
                    
                    const reloadBtn = document.createElement('button');
                    reloadBtn.className = 'station-action-btn';
                    reloadBtn.textContent = '🔄 Перезагрузить';
                    reloadBtn.title = 'Перезагрузить страницу станции';
                    reloadBtn.onclick = () => reloadStationPage(i);
                    actionsDiv.appendChild(reloadBtn);
                    
                    const closeBtn = document.createElement('button');
                    closeBtn.className = 'station-action-btn danger';
                    closeBtn.textContent = '❌ Закрыть';
                    closeBtn.title = 'Закрыть страницу станции';
                    closeBtn.onclick = () => closeStationPage(i);
                    actionsDiv.appendChild(closeBtn);
                } else {
                    const disabledBtn = document.createElement('button');
                    disabledBtn.className = 'station-action-btn';
                    disabledBtn.disabled = true;
                    disabledBtn.textContent = 'Не подключена';
                    actionsDiv.appendChild(disabledBtn);
                }
                
                card.appendChild(actionsDiv);
                
                grid.appendChild(card);
            }
            
            // Обновляем состояние кнопки запуска
            updateStartButtonState();
        }
        
        // Переключение выбора станции
        window.toggleStation = function(stationNumber, isSelected) {
            console.log(`Переключение станции ${stationNumber}: ${isSelected}`);
            if (isSelected) {
                selectedStations.add(stationNumber);
            } else {
                selectedStations.delete(stationNumber);
            }
            console.log(`Выбранные станции:`, Array.from(selectedStations));
            updateStationsDisplay();
            // Явно обновляем состояние кнопки после изменения выбора
            updateStartButtonState();
        };
        
        // Выбрать все станции
        function selectAllStations() {
            stations.forEach(station => {
                if (station.connected) {
                    selectedStations.add(station.stationNumber);
                }
            });
            console.log(`Выбраны все станции:`, Array.from(selectedStations));
            updateStationsDisplay();
            updateStartButtonState();
        }
        
        // Снять выбор со всех станций
        function deselectAllStations() {
            selectedStations.clear();
            console.log('Выбор со всех станций снят');
            updateStationsDisplay();
            updateStartButtonState();
        }
        
        // Обновить состояние кнопки запуска
        function updateStartButtonState() {
            const startBtn = document.getElementById('startQuizBtn');
            if (startBtn) {
                const hasSelectedStations = selectedStations.size > 0;
                const hasQuiz = selectedQuizId !== null;
                const shouldEnable = hasSelectedStations && hasQuiz;
                console.log(`Обновление кнопки запуска: выбранных станций=${selectedStations.size}, квиз=${hasQuiz ? selectedQuizId : 'не выбран'}, должна быть активна=${shouldEnable}`);
                startBtn.disabled = !shouldEnable;
            }
        }
        
        // Открыть страницу станции
        window.openStationPage = function(stationNumber) {
            const station = stations.find(s => s.stationNumber === stationNumber);
            if (station && station.ip) {
                const url = `http://${station.ip}:3000/local-station.html`;
                window.open(url, `station-${stationNumber}`, 'width=1920,height=1080');
                console.log(`Открыта страница станции ${stationNumber}: ${url}`);
            }
        };
        
        // Перезагрузить страницу станции
        window.reloadStationPage = function(stationNumber) {
            const station = stations.find(s => s.stationNumber === stationNumber);
            if (station && station.socketId && socket) {
                socket.emit('local-station-reload-page', { stationNumber, socketId: station.socketId });
                console.log(`Перезагрузка страницы станции ${stationNumber}`);
            }
        };
        
        // Закрыть страницу станции
        window.closeStationPage = function(stationNumber) {
            const station = stations.find(s => s.stationNumber === stationNumber);
            if (station && station.socketId && socket) {
                socket.emit('local-station-close-page', { stationNumber, socketId: station.socketId });
                console.log(`Закрытие страницы станции ${stationNumber}`);
            }
        };
        
        // Показать форму добавления станции вручную
        function showAddStationForm() {
            const stationsSection = document.querySelector('.stations-section');
            let form = document.getElementById('manualStationForm');
            
            if (form) {
                form.style.display = form.style.display === 'none' ? 'block' : 'none';
                return;
            }
            
            form = document.createElement('div');
            form.id = 'manualStationForm';
            form.className = 'manual-station-form';
            form.innerHTML = `
                <h3>Добавить станцию вручную</h3>
                <input type="text" id="manualStationIP" placeholder="IP адрес (например: 192.168.1.21)" pattern="^192\.168\.1\.(2[1-9]|29)$">
                <input type="number" id="manualStationNumber" placeholder="Номер станции (1-9)" min="1" max="9">
                <div class="form-buttons">
                    <button class="btn-primary" onclick="addManualStation()">Добавить</button>

        // Скрыть форму добавления станции
        function hideAddStationForm() {
            const form = document.getElementById('manualStationForm');
            if (form) {
                form.style.display = 'none';
            }
        }
        
        // Добавить станцию вручную
        window.addManualStation = async function() {
            const ip = document.getElementById('manualStationIP').value.trim();
            const stationNumber = parseInt(document.getElementById('manualStationNumber').value);
            
            if (!ip) {
                alert('Введите IP адрес станции');
                return;
            }
            
            if (!stationNumber || stationNumber < 1 || stationNumber > 9) {
                alert('Введите номер станции от 1 до 9');
                return;
            }
            
            // Проверяем формат IP
            const ipPattern = /^192\.168\.1\.(2[1-9]|29)$/;
            if (!ipPattern.test(ip)) {
                alert('IP адрес должен быть в формате 192.168.1.21-29');
                return;
            }
            
            try {
                const response = await fetch('/api/local/register-station', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        ip: ip,
                        stationNumber: stationNumber
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    console.log('Станция добавлена:', data.station);
                    // Обновляем список станций
                    await loadStations();
                    // Скрываем форму
                    hideAddStationForm();
                    // Очищаем поля
                    document.getElementById('manualStationIP').value = '';
                    document.getElementById('manualStationNumber').value = '';
                } else {
                    alert('Ошибка добавления станции: ' + (data.error || 'Неизвестная ошибка'));
                }
            } catch (error) {
                console.error('Ошибка добавления станции:', error);
                alert('Ошибка добавления станции: ' + error.message);
            }
        };

        // Загрузка квизов
        async function loadQuizzes() {
            try {
                const response = await fetch('/api/quizzes');
                if (!response.ok) throw new Error('Ошибка загрузки квизов');
                
                quizzes = await response.json();
                displayQuizzes();
            } catch (error) {
                console.error('Ошибка загрузки квизов:', error);
                document.getElementById('quizzesGrid').innerHTML = 
                    '<div style="text-align: center; padding: 40px; color: #ff7664;">Ошибка загрузки квизов</div>';
            }
        }

        // Отображение квизов
        function displayQuizzes() {
            const grid = document.getElementById('quizzesGrid');
            grid.innerHTML = '';

            quizzes.forEach(quiz => {
                const card = document.createElement('div');
                card.className = 'quiz-card';
                card.dataset.quizId = quiz.id;
                
                card.innerHTML = `
                    <div class="quiz-card-content">
                        <span class="quiz-icon">${quiz.icon || '📝'}</span>
                        <div class="quiz-title">${quiz.name}</div>
                        <div class="quiz-description">${quiz.description || ''}</div>
                    </div>
                `;
                
                card.addEventListener('click', () => selectQuiz(quiz.id));
                grid.appendChild(card);
            });
        }

        // Выбор квиза
        function selectQuiz(quizId) {
            selectedQuizId = quizId;
            
            // Обновляем визуальное выделение
            document.querySelectorAll('.quiz-card').forEach(card => {
                card.classList.remove('selected-quiz');
            });
            document.querySelector(`[data-quiz-id="${quizId}"]`)?.classList.add('selected-quiz');
            
            // Обновляем состояние кнопки запуска
            updateStartButtonState();

        // Запуск квиза на всех станциях
        async function startQuiz() {
            if (!selectedQuizId) {
                alert('Выберите квиз');
                return;
            }

            if (selectedStations.size === 0) {
                alert('Выберите хотя бы одну станцию для участия в игре');
                return;
            }
            
            const selectedStationsList = stations.filter(s => s.connected && selectedStations.has(s.stationNumber));
            if (selectedStationsList.length === 0) {
                alert('Выбранные станции не подключены');
                return;
            }

            try {
                // Создаем комнату
                const response = await fetch('/api/create-room', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        quizId: selectedQuizId,
                        mode: 'local'
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Ошибка создания комнаты');
                }

                const data = await response.json();
                const roomCode = data.roomCode;
                currentRoomCode = roomCode;
                currentQuizName = quizzes.find(q => q.id === selectedQuizId)?.name || selectedQuizId;

                // Отправляем команду только выбранным станциям открыть квиз
                socket.emit('local-start-quiz', {
                    roomCode: roomCode,
                    quizId: selectedQuizId,
                    stationNumbers: Array.from(selectedStations)
                });

                // Открываем две страницы:
                // 1. Страница отображения (host.html) - вопросы, результаты, рейтинг
                hostWindow = window.open(`/host.html?quiz=${selectedQuizId}&room=${roomCode}`, '_blank');
                
                // 2. Страница управления (local-host-control.html) - управление игрой
                const controlWindow = window.open(`/local-host-control.html?room=${roomCode}&quiz=${selectedQuizId}`, '_blank');
                
                // Показываем панель управления
                showControlPanel();
                
                // Показываем кнопку завершения и сброса
                const endQuizAndResetBtn = document.getElementById('endQuizAndResetBtn');
                if (endQuizAndResetBtn) endQuizAndResetBtn.style.display = 'inline-block';
                
                // Подключаемся к комнате как хост для управления
                socket.emit('host-join', roomCode);
            } catch (error) {
                console.error('Ошибка запуска квиза:', error);
                alert('Ошибка запуска квиза: ' + error.message);
            }
        }

        // Инициализация обработчиков событий socket
        function initSocketEventHandlers() {
            if (!socket) return;
            
            // Получаем элементы кнопок для обновления состояния
            const skipAnswersBtn = document.getElementById('skipAnswersBtn');
            const skipReadyBtn = document.getElementById('skipReadyBtn');
            const showResultsBtn = document.getElementById('showResultsBtn');
            const nextQuestionBtn = document.getElementById('nextQuestionBtn');
            const endGameBtn = document.getElementById('endGameBtn');
            
            // Слушаем события от хоста для обновления состояния кнопок
            socket.on('game-started', () => {
                if (skipAnswersBtn) skipAnswersBtn.disabled = false;
                if (showResultsBtn) showResultsBtn.disabled = false;
            });
            
            socket.on('question', () => {
                if (skipAnswersBtn) skipAnswersBtn.disabled = false;
                if (showResultsBtn) showResultsBtn.disabled = false;
                if (skipReadyBtn) skipReadyBtn.disabled = true;
                if (nextQuestionBtn) nextQuestionBtn.disabled = true;
            });
            
            socket.on('results', () => {
                if (skipAnswersBtn) skipAnswersBtn.disabled = true;
                if (showResultsBtn) showResultsBtn.disabled = true;
                if (skipReadyBtn) skipReadyBtn.disabled = false;
                if (nextQuestionBtn) nextQuestionBtn.disabled = false;
            });
            
            socket.on('game-finished', () => {
                if (skipAnswersBtn) skipAnswersBtn.disabled = true;
                if (skipReadyBtn) skipReadyBtn.disabled = true;
                if (showResultsBtn) showResultsBtn.disabled = true;
                if (nextQuestionBtn) nextQuestionBtn.disabled = true;
                if (endGameBtn) endGameBtn.disabled = true;
            });
        }
        
        // Запуск при загрузке страницы
        function waitForSocketIO() {
            if (typeof io === 'undefined') {
                setTimeout(waitForSocketIO, 100);
                return;
            }
            
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => {
                    setTimeout(init, 200);
                });
            } else {
                setTimeout(init, 200);
            }
        }
        
        waitForSocketIO();
    </script>
    <script src="/scripts/frame5-copyright.js"></script>
</body>
</html>
