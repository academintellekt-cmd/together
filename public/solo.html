<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Квиз - Соло режим</title>
    <link rel="stylesheet" href="/styles/brand-style.css">
    <link rel="stylesheet" href="/styles/hub1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Days+One&family=Handlee&family=Kalam:wght@300;400;700&family=Open+Sans:wght@400;500;600;700&family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;600;700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            background: #f2f2f2;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 0 20px 20px 20px;
            position: relative;
        }
        
        /* Парящие элементы */
        body::before {
            content: '';
            position: fixed;
            /* top устанавливается динамически через JavaScript */
            left: -50px;
            width: 200px;
            height: 200px;
            background: #d6fbbf; /* Парящий элемент */
            border-radius: 50% 40% 60% 30%;
            opacity: 0.9;
            z-index: -1;
            animation: wobble 6s ease-in-out infinite;
            pointer-events: none;
        }
        
        body::after {
            content: '';
            position: fixed;
            bottom: -80px;
            right: -80px;
            width: 250px;
            height: 250px;
            background: #fececd; /* Парящий элемент */
            border-radius: 40% 50% 30% 60%;
            opacity: 0.9;
            z-index: -1;
            animation: wobble 8s ease-in-out infinite reverse;
            pointer-events: none;
        }
        
        @keyframes wobble {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(5deg) scale(1.1); }
            50% { transform: rotate(-5deg) scale(0.9); }
            75% { transform: rotate(3deg) scale(1.05); }
        }

        /* Контент страницы */
        .container {
            position: relative;
            z-index: 1;
        }


        .name-input-screen {
            text-align: center;
        }

        .name-input-screen h1 {
            display: inline-block;
            margin: 0 auto;
        }

        .name-input-screen .subtitle {
            color: #354FBA;
            font-family: 'Caveat', cursive;
            font-size: clamp(24px, 4.5vw, 36px);
            margin-bottom: 20px;
        }

        .name-input-screen .input-group {
            display: inline-block;
            width: fit-content;
            max-width: 100%;
        }

        .name-input-screen .input-group input {
            width: 100%;
            min-width: 200px;
            max-width: 100%;
            box-sizing: border-box;
        }

        .game-screen {
            display: none;
        }

        .question-screen {
            text-align: center;
        }

        .question-number {
            display: none; /* Перенесено в HUB */
        }

        .question-text {
            font-size: 28px;
            margin: 32px 0;
            line-height: 1.4;
            font-family: 'Days One', sans-serif;
            color: var(--color-dark);
        }

        .options {
            margin: 30px 0;
        }

        .answer-feedback {
            text-align: center;
            margin: 24px 0;
            font-size: 28px;
            font-weight: 600;
            min-height: 40px;
            font-family: 'Days One', sans-serif;
        }

        .answer-feedback.correct {
            color: #2FB95D;
        }

        .answer-feedback.incorrect {
            color: #FA5734;
        }

        .answer-feedback .correct-answer {
            color: #2FB95D;
            display: block;
            margin-top: 8px;
        }

        .option-btn.correct {
            background: rgba(47, 185, 93, 0.35);
            border-color: #2FB95D;
            box-shadow: 
                0 4px 0px rgba(47, 185, 93, 0.4),
                0 8px 16px rgba(47, 185, 93, 0.25);
        }

        .option-btn.incorrect {
            background: rgba(250, 87, 52, 0.35);
            border-color: #FA5734 !important;
            border-width: 3px;
            box-shadow: 
                0 4px 0px rgba(250, 87, 52, 0.4),
                0 8px 16px rgba(250, 87, 52, 0.25);
        }

        .results-screen {
            text-align: center;
            display: none;
            padding-top: 0;
        }

        .results-screen h1 {
            margin-top: 0;
            margin-bottom: 20px;
        }

        .score-display {
            font-size: 72px;
            font-weight: 700;
            margin: 20px 0;
            color: var(--color-green-alt);
            font-family: 'Days One', sans-serif;
        }

        .stats {
            margin: 20px 0;
        }

        .stat-item {
            background: rgba(245, 245, 245, 0.85);
            padding: 16px 20px;
            margin: 12px 0;
            border-radius: 12px;
            font-size: 18px;
            display: flex;
            justify-content: space-between;
            border: 3px solid var(--color-black);
            box-shadow: 
                0 4px 0px rgba(0, 0, 0, 0.2),
                0 6px 12px rgba(0, 0, 0, 0.1);
            font-family: 'Days One', sans-serif;
        }

        /* Модальное окно для пароля */
        .password-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(56, 54, 56, 0.85);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }

        .password-modal-content {
            background: #F2F2F2;
            padding: 30px;
            border-radius: 25px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 3px solid #383638;
            box-shadow: 0 6px 0px rgba(0, 193, 89, 0.3), 0 8px 16px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
        }

        .password-modal h2 {
            margin-bottom: 15px;
            font-size: 24px;
            font-family: 'Days One', sans-serif;
            color: #00C159;
            font-weight: 700;
        }

        .password-modal p {
            margin-bottom: 15px;
            font-size: 14px;
            color: #383638;
            font-family: 'Montserrat', sans-serif;
        }

        .password-modal input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 12px;
            border: 3px solid #383638;
            background: #FFFFFF;
            color: #383638;
            font-size: 16px;
            text-align: center;
            font-family: 'Days One', sans-serif;
            font-weight: 600;
            letter-spacing: 2px;
            box-sizing: border-box;
        }

        .password-error {
            color: #ff7674;
            margin-bottom: 15px;
            font-size: 13px;
            display: none;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            min-height: 20px;
        }

        .password-modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .password-modal-buttons button {
            flex: 1;
            min-width: 140px;
            max-width: 180px;
            padding: 12px 24px;
            font-size: 16px;
            box-sizing: border-box;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .link-to-leaderboard {
            margin-top: 32px;
        }

        .link-to-leaderboard a {
            color: var(--color-green-alt);
            text-decoration: none;
            font-size: 16px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
        }

        /* Стиль для неактивной кнопки в HUB1 */
        .hub1-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Стили для кнопок в модальном окне начала игры */
        #solo-start-game-confirm {
            background: #00C159 !important;
            color: #FFFFFF !important;
            border-color: #383638 !important;
        }

        #solo-start-game-confirm:hover {
            background: #00a049 !important;
            color: #FFFFFF !important;
        }

        #solo-start-game-cancel {
            background: #ff7664 !important;
            color: #FFFFFF !important;
            border-color: #383638 !important;
        }

        #solo-start-game-cancel:hover {
            background: #ff5a45 !important;
            color: #FFFFFF !important;
        }
    </style>
</head>
<body>
    <!-- Модальное окно для ввода пароля -->
    <div id="password-modal" class="password-modal">
        <div class="password-modal-content">
            <h2>Введите пароль</h2>
            <p>Эта игра защищена паролем</p>
            <input type="password" id="password-input" placeholder="Пароль" autofocus>
            <div id="password-error" class="password-error"></div>
            <div class="password-modal-buttons">
                <button id="password-submit" class="btn" style="background: #00C159; border: 3px solid #383638; color: #FFFFFF; font-weight: 700; padding: 12px 24px; font-size: 16px;">Ввод</button>
                <button id="password-cancel" class="btn secondary" style="background: #F2F2F2; border: 3px solid #383638; color: #383638; padding: 12px 24px; font-size: 16px;">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно для подтверждения начала игры -->
    <div id="solo-start-game-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(56, 54, 56, 0.85); z-index: 10000; justify-content: center; align-items: center;">
        <div style="background: #F2F2F2; padding: 30px; border-radius: 25px; text-align: center; max-width: 400px; width: 90%; border: 3px solid #383638; box-shadow: 0 6px 0px rgba(0, 193, 89, 0.3), 0 8px 16px rgba(0, 0, 0, 0.2); box-sizing: border-box; position: relative; z-index: 10001;">
            <h2 style="margin-bottom: 15px; font-size: 24px; font-family: 'Days One', sans-serif; color: #00C159; font-weight: 700;">Готовы начать?</h2>
            <p style="margin-bottom: 20px; font-size: 14px; color: #383638; font-family: 'Nunito', sans-serif;">
                Проверьте, что вы ввели правильное имя и готовы к игре
            </p>
            <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; width: 100%;">
                <button id="solo-start-game-confirm" class="hub1-button" style="background: #00C159 !important; color: #FFFFFF !important; border-color: #383638 !important; flex: 1; min-width: 140px; max-width: 180px; box-sizing: border-box; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Начать игру</button>
                <button id="solo-start-game-cancel" class="hub1-button" style="background: #ff7664 !important; color: #FFFFFF !important; border-color: #383638 !important; flex: 1; min-width: 140px; max-width: 180px; box-sizing: border-box; white-space: nowrap;">Назад</button>
            </div>
        </div>
    </div>

    <div class="container">
        
        <!-- Экран ввода имени -->
        <div id="name-input-screen" class="name-input-screen">
            <h1>🎮 Чемпионат ГНУ</h1>
            <p class="subtitle">придумай псевдоним</p>
            <div class="input-group">
                <input type="text" id="player-name" placeholder="называйте меня..." maxlength="20" autocomplete="off">
            </div>
        </div>

        <!-- Экран игры -->
        <div id="game-screen" class="game-screen">
            <!-- Экран вопроса -->
            <div id="question-screen" class="question-screen">
                <div class="question-text" id="question-text"></div>
                <div class="options" id="options"></div>
                <div class="answer-feedback" id="answer-feedback"></div>
            </div>

            <!-- Экран результатов -->
            <div id="results-screen" class="results-screen">
                <h1>🎉 Игра завершена!</h1>
                <div class="score-display" id="final-score">0</div>
                <div class="stats">
                    <div class="stat-item">
                        <span>Правильных ответов:</span>
                        <span id="correct-count">0</span>
                    </div>
                    <div class="stat-item">
                        <span>Всего вопросов:</span>
                        <span id="total-count">0</span>
                    </div>
                    <div class="stat-item">
                        <span>Время:</span>
                        <span id="time-spent">0 сек</span>
                    </div>
                </div>
                <button class="btn full-width" id="play-again-btn">Играть снова</button>
                <a href="#" id="leaderboard-link-2" class="btn full-width" style="margin-top: 16px; background: rgba(0, 193, 89, 0.85); color: white; text-decoration: none; display: inline-block; text-align: center;">
                    📊 Посмотреть рейтинг
                </a>
            </div>
        </div>
    </div>

    <script>
        let quiz = null;
        let currentQuestion = 0;
        let score = 0;
        let correctAnswers = 0;
        let startTime = null;
        let timerInterval = null;
        let timeLeft = 0;
        let questionStartTime = null; // Время начала текущего вопроса
        let playerName = '';
        
        // Поддержка джойстика
        let gamepad = null;
        let joystickConfig = null;
        let gamepadUpdateInterval = null;
        let hasAnswered = false; // Флаг для отслеживания ответа в текущем вопросе
        
        // Загрузка конфигурации джойстика
        function loadJoystickConfig() {
            const saved = localStorage.getItem('joystickConfig');
            if (saved) {
                try {
                    joystickConfig = JSON.parse(saved);
                    console.log('✅ Конфигурация джойстика загружена:', joystickConfig);
                } catch (e) {
                    console.error('Ошибка загрузки конфигурации джойстика:', e);
                    joystickConfig = null;
                }
            } else {
                joystickConfig = null;
            }
        }
        
        // Получение джойстика
        function getGamepad() {
            const gamepads = navigator.getGamepads();
            for (let i = 0; i < gamepads.length; i++) {
                if (gamepads[i]) {
                    return gamepads[i];
                }
            }
            return null;
        }
        
        // Обработка нажатий кнопок джойстика
        function handleGamepadInput() {
            if (!gamepad || !joystickConfig || !joystickConfig.buttons) return;
            
            // Проверяем нажатые кнопки
            const buttons = joystickConfig.buttons;
            for (const [command, buttonIndex] of Object.entries(buttons)) {
                // Проверяем, что кнопка нажата
                if (gamepad.buttons[buttonIndex] && gamepad.buttons[buttonIndex].pressed) {
                    // Обработка ответов - только на экране вопроса
                    const questionScreen = document.getElementById('question-screen');
                    if (questionScreen && questionScreen.style.display !== 'none' && !hasAnswered) {
                        // Извлекаем номер кнопки из названия (например, "Кнопка 1" -> 1)
                        const match = command.match(/Кнопка (\d+)/);
                        if (match) {
                            const answerIndex = parseInt(match[1]) - 1; // Кнопка 1 = ответ 0, Кнопка 2 = ответ 1 и т.д.
                            
                            // Проверяем, что такой вариант ответа существует
                            const options = document.querySelectorAll('.option-btn');
                            if (answerIndex >= 0 && answerIndex < options.length) {
                                console.log(`🎮 Джойстик: ${command} -> Ответ ${answerIndex + 1}`);
                                selectAnswer(answerIndex);
                                return; // Обработали нажатие, выходим
                            }
                        }
                    }
                }
            }
        }
        
        // Обновление состояния джойстика
        function updateGamepad() {
            gamepad = getGamepad();
            if (gamepad) {
                handleGamepadInput();
            }
        }
        
        // Инициализация джойстика
        function initJoystick() {
            loadJoystickConfig();
            if (joystickConfig && joystickConfig.buttons) {
                // Запускаем обновление джойстика
                gamepadUpdateInterval = setInterval(updateGamepad, 50); // Проверяем каждые 50мс
                
                // Обработчики подключения/отключения
                window.addEventListener('gamepadconnected', (e) => {
                    console.log('🎮 Джойстик подключен:', e.gamepad.id);
                    gamepad = e.gamepad;
                });
                
                window.addEventListener('gamepaddisconnected', (e) => {
                    console.log('🎮 Джойстик отключен:', e.gamepad.id);
                    gamepad = null;
                });
            }
        }

        // Получение ID квиза из URL
        const urlParams = new URLSearchParams(window.location.search);
        const quizId = urlParams.get('quiz') || 'gnu';
        const passwordParam = urlParams.get('password');
        
        // Пароли для разных квизов (поддерживаем как новый ID 'gnu', так и старые)
        const passwords = {
            'gnu': '1234',
            'friends-quiz': '1234' // Обратная совместимость
        };
        
        const requiredPassword = passwords[quizId] || null;
        
        // Проверяем, пришел ли пользователь с страницы выбора режима (пароль уже проверен)
        const storageKeys = {
            'gnu': 'gnuPasswordVerified',
            'friends-quiz': 'gnuPasswordVerified' // Обратная совместимость
        };
        
        const storageKey = storageKeys[quizId];
        let passwordVerified = passwordParam === 'verified' || (storageKey && localStorage.getItem(storageKey) === 'true');

        // Функция показа модального окна для ввода пароля
        function showPasswordModal(callback) {
            const modal = document.getElementById('password-modal');
            const passwordInput = document.getElementById('password-input');
            const passwordError = document.getElementById('password-error');
            const submitBtn = document.getElementById('password-submit');
            const cancelBtn = document.getElementById('password-cancel');
            
            modal.style.display = 'flex';
            passwordInput.value = '';
            passwordError.style.display = 'none';
            passwordInput.focus();
            
            const handleSubmit = () => {
                const password = passwordInput.value.trim();
                if (!password) {
                    passwordError.textContent = 'Введите пароль';
                    passwordError.style.display = 'block';
                    return;
                }
                if (password !== requiredPassword) {
                    passwordError.textContent = 'Неверный пароль';
                    passwordError.style.display = 'block';
                    return;
                }
                modal.style.display = 'none';
                passwordVerified = true;
                callback();
            };
            
            const handleCancel = () => {
                modal.style.display = 'none';
                window.location.href = '/gnu-quiz.html';
            };
            
            submitBtn.onclick = handleSubmit;
            cancelBtn.onclick = handleCancel;
            
            passwordInput.onkeypress = (e) => {
                if (e.key === 'Enter') {
                    handleSubmit();
                }
            };
        }

        // Загрузка квиза
        async function loadQuiz() {
            try {
                const response = await fetch(`/api/quizzes/${quizId}`);
                if (!response.ok) {
                    throw new Error('Квиз не найден');
                }
                quiz = await response.json();
                // Обновляем ссылки на рейтинг после загрузки квиза
                updateLeaderboardLinks();
            } catch (error) {
                console.error('Ошибка загрузки квиза:', error);
                alert('Не удалось загрузить квиз');
            }
        }

        // Проверка пароля для квизов, требующих пароль
        async function checkPasswordAndLoad() {
            // Если квиз требует пароль и пароль еще не проверен, показываем модальное окно
            // Но если пользователь пришел со страницы выбора режима, пароль уже проверен
            if (requiredPassword && !passwordVerified) {
                showPasswordModal(async () => {
                    // Сохраняем флаг проверки пароля
                    if (storageKey) {
                        localStorage.setItem(storageKey, 'true');
                    }
                    // После ввода правильного пароля загружаем квиз
                    await loadQuiz();
                });
            } else {
                // Для других квизов просто загружаем
                await loadQuiz();
            }
            
            // Устанавливаем ссылки на рейтинг с параметрами
            updateLeaderboardLinks();
        }
        
        // Функция для обновления ссылок на рейтинг
        function updateLeaderboardLinks() {
            let leaderboardUrl = '/leaderboard.html';
            if (quizId) {
                leaderboardUrl += `?quiz=${quizId}`;
                if (passwordParam === 'verified' || passwordVerified) {
                    leaderboardUrl += '&password=verified';
                }
            }
            
            const hub1LeaderboardBtn = document.getElementById('hub1-leaderboard-btn');
            const link2 = document.getElementById('leaderboard-link-2');
            if (hub1LeaderboardBtn) hub1LeaderboardBtn.href = leaderboardUrl;
            if (link2) link2.href = leaderboardUrl;
        }

        // Enter для начала игры
        document.getElementById('player-name').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const hub1StartBtn = document.getElementById('hub1-start-btn');
                if (hub1StartBtn) {
                    hub1StartBtn.click();
                }
            }
        });

        function startGame() {
            // Проверяем, что квиз загружен
            if (!quiz || !quiz.questions || quiz.questions.length === 0) {
                console.error('Квиз не загружен');
                alert('Ошибка: квиз не загружен. Пожалуйста, обновите страницу.');
                return;
            }
            
            document.getElementById('name-input-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('results-screen').style.display = 'none';
            
            // Показываем экран вопроса
            const questionScreen = document.getElementById('question-screen');
            if (questionScreen) {
                questionScreen.style.display = 'block';
            }
            
            // Скрываем кнопки в Hub1 во время игры
            const hub1StartBtn = document.getElementById('hub1-start-btn');
            const hub1LeaderboardBtn = document.getElementById('hub1-leaderboard-btn');
            if (hub1StartBtn) hub1StartBtn.style.display = 'none';
            if (hub1LeaderboardBtn) hub1LeaderboardBtn.style.display = 'none';
            
            // Показываем информацию об игре в Hub1
            const hub1QuestionNumber = document.querySelector('.hub1-question-number');
            const hub1Timer = document.querySelector('.hub1-timer');
            if (hub1QuestionNumber) {
                hub1QuestionNumber.style.display = 'block';
            }
            if (hub1Timer) {
                hub1Timer.style.display = 'block';
            }
            
            currentQuestion = 0;
            score = 0;
            correctAnswers = 0;
            startTime = Date.now();
            
            showQuestion();
        }

        function showQuestion() {
            // Проверяем, что квиз загружен
            if (!quiz || !quiz.questions || quiz.questions.length === 0) {
                console.error('Квиз не загружен в showQuestion');
                return;
            }
            
            if (currentQuestion >= quiz.questions.length) {
                endGame();
                return;
            }

            // Убеждаемся, что экран вопроса виден
            const questionScreen = document.getElementById('question-screen');
            if (questionScreen) {
                questionScreen.style.display = 'block';
            }

            const question = quiz.questions[currentQuestion];
            
            // Обновляем номер вопроса в Hub1 по центру
            const hub1QuestionNumber = document.querySelector('.hub1-question-number');
            if (hub1QuestionNumber) {
                hub1QuestionNumber.textContent = `Вопрос ${currentQuestion + 1} из ${quiz.questions.length}`;
            }
            
            document.getElementById('question-text').textContent = question.question;
            document.getElementById('answer-feedback').textContent = '';
            document.getElementById('answer-feedback').className = 'answer-feedback';
            
            // Сбрасываем флаг ответа для нового вопроса
            hasAnswered = false;

            // Очистка предыдущих вариантов
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';

            // Создание кнопок вариантов
            question.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.addEventListener('click', () => selectAnswer(index));
                optionsDiv.appendChild(btn);
            });

            // Сохраняем время начала вопроса для точного расчета времени ответа
            questionStartTime = Date.now();
            
            // Таймер в Hub1
            timeLeft = question.time;
            const hub1Timer = document.querySelector('.hub1-timer');
            if (hub1Timer) {
                hub1Timer.textContent = timeLeft;
                hub1Timer.classList.remove('urgent');
            }

            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                if (hub1Timer) {
                    hub1Timer.textContent = timeLeft;
                    
                    if (timeLeft <= 5) {
                        hub1Timer.classList.add('urgent');
                    } else {
                        hub1Timer.classList.remove('urgent');
                    }
                }
                
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    // Автоматически выбираем неправильный ответ (время вышло)
                    selectAnswer(-1);
                }
            }, 1000);
        }

        function selectAnswer(answerIndex) {
            // Предотвращаем повторный ответ
            if (hasAnswered) return;
            hasAnswered = true;
            
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }

            const question = quiz.questions[currentQuestion];
            const options = document.querySelectorAll('.option-btn');
            
            // Отключаем все кнопки
            options.forEach(btn => btn.disabled = true);

            const isCorrect = answerIndex === question.correct;
            
            // Точное время ответа в миллисекундах (используем Date.now() вместо timeLeft для точности)
            const answerTimeMs = questionStartTime ? (Date.now() - questionStartTime) : 0;
            const answerTimeSeconds = answerTimeMs / 1000; // Конвертируем в секунды

            if (isCorrect) {
                // Правильный ответ
                options[answerIndex].classList.add('correct');
                document.getElementById('answer-feedback').textContent = '✅ Правильно!';
                document.getElementById('answer-feedback').className = 'answer-feedback correct';
                
                // Начисление очков
                // Бонус = (время вопроса - время ответа) в миллисекундах
                // Чем быстрее ответил, тем больше бонус
                const timeBonus = Math.max(0, question.time * 1000 - answerTimeMs);
                const points = 100 + Math.floor(timeBonus / 100);
                score += points;
                correctAnswers++;
            } else {
                // Неправильный ответ
                if (answerIndex >= 0) {
                    options[answerIndex].classList.add('incorrect');
                }
                options[question.correct].classList.add('correct');
                const answerFeedback = document.getElementById('answer-feedback');
                answerFeedback.className = 'answer-feedback incorrect';
                answerFeedback.innerHTML = 
                    `❌ Неправильно!<br><span class="correct-answer">${question.options[question.correct]}</span>`;
            }

            // Переход к следующему вопросу через 0.75 секунды
            setTimeout(() => {
                currentQuestion++;
                showQuestion();
            }, 750);
        }

        async function endGame() {
            const timeSpent = Math.floor((Date.now() - startTime) / 1000);
            
            // Скрываем информацию об игре в Hub1
            const hub1QuestionNumber = document.querySelector('.hub1-question-number');
            const hub1Timer = document.querySelector('.hub1-timer');
            if (hub1QuestionNumber) {
                hub1QuestionNumber.style.display = 'none';
            }
            if (hub1Timer) {
                hub1Timer.style.display = 'none';
            }
            
            // Кнопки остаются скрытыми на экране результатов
            const hub1StartBtn = document.getElementById('hub1-start-btn');
            const hub1LeaderboardBtn = document.getElementById('hub1-leaderboard-btn');
            if (hub1StartBtn) hub1StartBtn.style.display = 'none';
            if (hub1LeaderboardBtn) hub1LeaderboardBtn.style.display = 'none';
            
            document.getElementById('question-screen').style.display = 'none';
            document.getElementById('results-screen').style.display = 'block';
            
            document.getElementById('final-score').textContent = score;
            document.getElementById('correct-count').textContent = `${correctAnswers} из ${quiz.questions.length}`;
            document.getElementById('total-count').textContent = quiz.questions.length;
            document.getElementById('time-spent').textContent = `${timeSpent} сек`;

            // Сохранение результата в рейтинг
            try {
                await fetch('/api/leaderboard', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        playerName: playerName,
                        quizId: quizId,
                        score: score,
                        correctAnswers: correctAnswers,
                        totalQuestions: quiz.questions.length,
                        timeSpent: timeSpent
                    })
                });
            } catch (error) {
                console.error('Ошибка сохранения результата:', error);
            }
        }

        // Кнопка "Играть снова"
        document.getElementById('play-again-btn').addEventListener('click', async () => {
            // Сбрасываем все переменные игры
            currentQuestion = 0;
            score = 0;
            correctAnswers = 0;
            startTime = null;
            questionStartTime = null;
            timeLeft = 0;
            
            // Останавливаем таймер, если он запущен
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            
            // Скрываем экраны игры и результатов
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('results-screen').style.display = 'none';
            
            // Показываем экран ввода имени
            document.getElementById('name-input-screen').style.display = 'block';
            
            // Показываем кнопки в Hub1 на экране ввода имени
            const hub1StartBtn = document.getElementById('hub1-start-btn');
            const hub1LeaderboardBtn = document.getElementById('hub1-leaderboard-btn');
            if (hub1StartBtn) hub1StartBtn.style.display = '';
            if (hub1LeaderboardBtn) hub1LeaderboardBtn.style.display = '';
            
            // Перезагружаем квиз с сервера, чтобы получить новые перемешанные вопросы
            await loadQuiz();
            
            // Очищаем обратную связь
            const answerFeedback = document.getElementById('answer-feedback');
            if (answerFeedback) {
                answerFeedback.textContent = '';
                answerFeedback.className = 'answer-feedback';
            }
            
            // Очищаем варианты ответов
            const optionsDiv = document.getElementById('options');
            if (optionsDiv) {
                optionsDiv.innerHTML = '';
            }
            
            // Скрываем экран результатов
            const resultsScreen = document.getElementById('results-screen');
            if (resultsScreen) {
                resultsScreen.style.display = 'none';
            }
            
            // Если имя уже есть, сразу запускаем игру заново
            if (playerName && playerName.trim()) {
                // Убеждаемся, что квиз загружен перед запуском
                if (quiz && quiz.questions && quiz.questions.length > 0) {
                    // Сбрасываем счетчик вопроса перед запуском
                    currentQuestion = 0;
                    startGame();
                } else {
                    // Если квиз не загружен, показываем экран ввода имени
                    document.getElementById('name-input-screen').style.display = 'block';
                    document.getElementById('game-screen').style.display = 'none';
                    
                    // Показываем кнопки в Hub1
                    const hub1StartBtn = document.getElementById('hub1-start-btn');
                    const hub1LeaderboardBtn = document.getElementById('hub1-leaderboard-btn');
                    if (hub1StartBtn) hub1StartBtn.style.display = '';
                    if (hub1LeaderboardBtn) hub1LeaderboardBtn.style.display = '';
                    
                    // Скрываем информацию об игре в Hub1
                    const hub1QuestionNumber = document.querySelector('.hub1-question-number');
                    const hub1Timer = document.querySelector('.hub1-timer');
                    if (hub1QuestionNumber) {
                        hub1QuestionNumber.style.display = 'none';
                    }
                    if (hub1Timer) {
                        hub1Timer.style.display = 'none';
                    }
                }
            } else {
                // Если имени нет, показываем экран ввода имени
                document.getElementById('name-input-screen').style.display = 'block';
                document.getElementById('game-screen').style.display = 'none';
                
                // Показываем кнопки в Hub1
                const hub1StartBtn = document.getElementById('hub1-start-btn');
                const hub1LeaderboardBtn = document.getElementById('hub1-leaderboard-btn');
                if (hub1StartBtn) hub1StartBtn.style.display = '';
                if (hub1LeaderboardBtn) hub1LeaderboardBtn.style.display = '';
                
                // Скрываем информацию об игре в Hub1
                const hub1QuestionNumber = document.querySelector('.hub1-question-number');
                const hub1Timer = document.querySelector('.hub1-timer');
                if (hub1QuestionNumber) {
                    hub1QuestionNumber.style.display = 'none';
                }
                if (hub1Timer) {
                    hub1Timer.style.display = 'none';
                }
            }
        });

        // Загрузка квиза при загрузке страницы
        // Проверяем пароль и загружаем квиз
        checkPasswordAndLoad();
        // Инициализация Hub1
        function initHubs() {
            // Инициализация Hub1
            Hub1.init({
                showBack: true,
                backUrl: '/gnu-quiz.html'
            });
            
            // Создаем элементы для номера вопроса и таймера в Hub1
            const hub1Content = document.querySelector('.hub1-content');
            if (hub1Content) {
                // Номер вопроса по центру
                let hub1QuestionNumber = document.querySelector('.hub1-question-number');
                if (!hub1QuestionNumber) {
                    hub1QuestionNumber = document.createElement('div');
                    hub1QuestionNumber.className = 'hub1-question-number';
                    hub1QuestionNumber.style.display = 'none';
                    hub1Content.appendChild(hub1QuestionNumber);
                }
                
                // Таймер справа
                let hub1Timer = document.querySelector('.hub1-timer');
                if (!hub1Timer) {
                    hub1Timer = document.createElement('div');
                    hub1Timer.className = 'hub1-timer';
                    hub1Timer.style.display = 'none';
                    const hub1ActionsRight = document.getElementById('hub1-actions-right');
                    if (hub1ActionsRight) {
                        hub1ActionsRight.appendChild(hub1Timer);
                    }
                }
            }
            
            // Добавляем кнопку "Начать игру" в Hub1 справа
            const hub1ActionsRight = document.getElementById('hub1-actions-right');
            if (hub1ActionsRight) {
                // Кнопка "Начать игру"
                let startButton = document.getElementById('hub1-start-btn');
                if (!startButton) {
                    startButton = document.createElement('button');
                    startButton.id = 'hub1-start-btn';
                    startButton.className = 'hub1-button';
                    startButton.textContent = 'Начать игру';
                    hub1ActionsRight.appendChild(startButton);
                }
                
                // Кнопка "Рейтинг"
                let leaderboardButton = document.getElementById('hub1-leaderboard-btn');
                if (!leaderboardButton) {
                    leaderboardButton = document.createElement('a');
                    leaderboardButton.id = 'hub1-leaderboard-btn';
                    leaderboardButton.className = 'hub1-button';
                    leaderboardButton.textContent = 'Рейтинг';
                    leaderboardButton.href = '#';
                    // Покраска в зеленый цвет из брендбука
                    leaderboardButton.style.background = '#2fb95d';
                    leaderboardButton.style.color = '#FFFFFF';
                    hub1ActionsRight.appendChild(leaderboardButton);
                }
                
                // Функция показа модального окна для подтверждения начала игры
                function showStartGameModal() {
                    playerName = document.getElementById('player-name').value.trim();
                    const modal = document.getElementById('solo-start-game-modal');
                    const modalTitle = modal.querySelector('h2');
                    const modalText = modal.querySelector('p');
                    const confirmBtn = document.getElementById('solo-start-game-confirm');
                    
                    if (!playerName) {
                        // Если имя не введено, показываем модальное окно с предупреждением
                        if (modalTitle) {
                            modalTitle.textContent = 'Введите ваше имя';
                        }
                        if (modalText) {
                            modalText.textContent = 'Пожалуйста, введите имя перед началом игры';
                        }
                        if (confirmBtn) {
                            confirmBtn.textContent = 'Понятно';
                            confirmBtn.onclick = () => {
                                modal.style.display = 'none';
                                // Фокусируемся на поле ввода имени
                                const playerNameInput = document.getElementById('player-name');
                                if (playerNameInput) {
                                    playerNameInput.focus();
                                }
                            };
                        }
                    } else {
                        // Если имя введено, показываем обычное модальное окно подтверждения
                        if (modalTitle) {
                            modalTitle.textContent = 'Готовы начать?';
                        }
                        if (modalText) {
                            modalText.textContent = 'Проверьте, что вы ввели правильное имя и готовы к игре';
                        }
                        if (confirmBtn) {
                            confirmBtn.textContent = 'Начать игру';
                            confirmBtn.onclick = () => {
                                modal.style.display = 'none';
                                startGame();
                            };
                        }
                    }
                    
                    if (modal) {
                        modal.style.display = 'flex';
                    }
                }
                
                // Инициализация модального окна для подтверждения начала игры
                function initStartGameModal() {
                    const modal = document.getElementById('solo-start-game-modal');
                    const cancelBtn = document.getElementById('solo-start-game-cancel');
                    
                    // Обработчик для кнопки "Назад" (всегда одинаковый)
                    if (cancelBtn) {
                        cancelBtn.addEventListener('click', () => {
                            if (modal) {
                                modal.style.display = 'none';
                            }
                        });
                    }
                    
                    // Закрытие модального окна при клике вне его области
                    if (modal) {
                        modal.addEventListener('click', (e) => {
                            if (e.target === modal) {
                                modal.style.display = 'none';
                            }
                        });
                    }
                }
                
                // Обработчик для кнопки "Начать игру"
                startButton.addEventListener('click', showStartGameModal);
                
                // Инициализируем модальное окно
                initStartGameModal();
                
                // Обработчик для кнопки "Рейтинг"
                leaderboardButton.addEventListener('click', (e) => {
                    e.preventDefault();
                    const leaderboardUrl = leaderboardButton.href;
                    if (leaderboardUrl && leaderboardUrl !== '#') {
                        window.location.href = leaderboardUrl;
                    }
                });
            }
            
            // Обновление позиций (только Hub1, без Hub2)
            HubCommon.updateHub2Position();
            HubCommon.updateContentPadding();
            HubCommon.updateFloatingElementsPosition();
            
            // Обновляем ссылку на рейтинг после создания кнопок
            updateLeaderboardLinks();
            
            // Ограничиваем ширину поля ввода шириной заголовка
            const nameInputScreen = document.getElementById('name-input-screen');
            if (nameInputScreen) {
                const h1 = nameInputScreen.querySelector('h1');
                const inputGroup = nameInputScreen.querySelector('.input-group');
                if (h1 && inputGroup) {
                    const h1Width = h1.offsetWidth;
                    inputGroup.style.maxWidth = h1Width + 'px';
                }
            }
        }
        
        // Обновление при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof HubCommon !== 'undefined') {
                HubCommon.updateHub2Position();
                HubCommon.updateContentPadding();
                HubCommon.updateFloatingElementsPosition();
            }
        });
        
        // Обновление при изменении размера окна
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (typeof HubCommon !== 'undefined') {
                    HubCommon.updateHub2Position();
                    HubCommon.updateContentPadding();
                    HubCommon.updateFloatingElementsPosition();
                }
                // Обновляем ширину поля ввода при изменении размера окна
                const nameInputScreen = document.getElementById('name-input-screen');
                if (nameInputScreen) {
                    const h1 = nameInputScreen.querySelector('h1');
                    const inputGroup = nameInputScreen.querySelector('.input-group');
                    if (h1 && inputGroup) {
                        const h1Width = h1.offsetWidth;
                        inputGroup.style.maxWidth = h1Width + 'px';
                    }
                }
            }, 100);
        });
        
        // Инициализация джойстика при загрузке страницы
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initJoystick);
        } else {
            initJoystick();
        }
    </script>
    
    <!-- Hub1 скрипты -->
    <script src="/scripts/hub-common.js"></script>
    <script src="/scripts/hub1.js"></script>
    <script>
        // Инициализация Hub1 после загрузки
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(initHubs, 100);
            });
        } else {
            setTimeout(initHubs, 100);
        }
    </script>
