<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Квиз - Игрок</title>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <!-- Экран подключения -->
        <div id="connect-screen">
            <h1>Присоединиться к игре</h1>
            <div class="input-group">
                <label for="room-code">Код комнаты</label>
                <input type="text" id="room-code" maxlength="4" placeholder="Например: ABCD">
            </div>
            <div class="input-group">
                <label for="player-name">Ваше имя</label>
                <input type="text" id="player-name" maxlength="20" placeholder="Ваше имя">
            </div>
            <button id="connect-btn" class="btn primary-action">Подключиться</button>
            <div id="error-message"></div>
        </div>

        <!-- Экран ожидания -->
        <div id="waiting-screen" class="waiting-screen">
            <h1>Ожидание начала игры...</h1>
            <div class="status" style="margin: 20px 0;">
                <div id="waiting-room-code" style="font-size: 18px; color: var(--color-orange); margin-bottom: 10px;"></div>
                <div>Вы подключены к комнате</div>
                <div class="secondary-info" style="margin-top: 16px;">Ожидайте начала игры от ведущего</div>
            </div>
            <div class="loading-spinner" style="margin: 30px auto; width: 50px; height: 50px; border: 4px solid rgba(229, 91, 24, 0.3); border-top-color: var(--color-orange); border-radius: 50%; animation: spin 1s linear infinite;"></div>
        </div>

        <!-- Игровой экран -->
        <div id="game-screen" class="game-screen">
            <!-- Вопрос -->
            <div id="question-screen" class="question-screen">
                <div class="question-number">
                    Вопрос <span id="question-num">1</span> из <span id="total-questions">10</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <div id="question-text" class="question-text"></div>
                <div class="timer-container">
                    <div class="timer-ring" id="timer-ring"></div>
                    <div id="timer" class="timer">15</div>
                </div>
                <div class="options" id="options"></div>
                <div id="answer-feedback" class="answer-feedback"></div>
            </div>

            <!-- Результаты вопроса -->
            <div id="results-screen" class="results-screen">
                <h2>Результаты вопроса</h2>
                <div id="correct-answer" class="correct-answer" style="display: none;"></div>
                <div class="score">Ваш счет: <span id="player-score">0</span></div>
                <div class="leaderboard">
                    <h3>Таблица лидеров</h3>
                    <div id="leaderboard"></div>
                </div>
                <div id="ready-status" class="status secondary-info" style="margin: 20px 0;">Ожидание следующего вопроса...</div>
                <button id="ready-btn" class="btn primary-action" style="display: none;">Готов к следующему вопросу</button>
            </div>

            <!-- Финальные результаты -->
            <div id="final-results" class="results-screen">
                <h1 style="font-size: 48px; margin-bottom: 40px;">Игра завершена!</h1>
                <div class="score" style="font-size: 42px;">Ваш финальный счет: <span id="final-score" style="font-size: 52px;">0</span></div>
                <div class="leaderboard">
                    <h2>Финальные результаты</h2>
                    <div id="final-leaderboard"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let roomCode = null;
        let playerName = null;
        let currentTimer = null;
        let hasAnswered = false;

        // Функция показа ошибки
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            if (errorDiv) {
                errorDiv.innerHTML = `<div class="error">${message}</div>`;
                setTimeout(() => {
                    errorDiv.innerHTML = '';
                }, 5000);
            } else {
                console.error('Ошибка:', message);
            }
        }

        // Автоматическое заполнение кода комнаты из URL
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam) {
                document.getElementById('room-code').value = roomParam.toUpperCase();
            }
        });

        // Подключение к комнате
        document.getElementById('connect-btn').addEventListener('click', () => {
            roomCode = document.getElementById('room-code').value.toUpperCase().trim();
            playerName = document.getElementById('player-name').value.trim();

            if (!roomCode || !playerName) {
                showError('Заполните все поля');
                return;
            }

            socket.emit('player-join', { roomCode, playerName });
        });

        socket.on('player-connected', (data) => {
            console.log('Игрок подключен, ID:', data.playerId);
            document.getElementById('connect-screen').style.display = 'none';
            document.getElementById('waiting-screen').style.display = 'block';
            // Показываем код комнаты на экране ожидания
            const waitingRoomCode = document.getElementById('waiting-room-code');
            if (waitingRoomCode) {
                waitingRoomCode.textContent = `Код комнаты: ${roomCode}`;
            }
        });

        socket.on('error', (data) => {
            showError(data.message);
        });

        // Начало игры
        socket.on('game-started', () => {
            document.getElementById('waiting-screen').style.display = 'none';
            const gameScreen = document.getElementById('game-screen');
            gameScreen.style.display = 'block';
            gameScreen.style.animation = 'fadeIn 0.5s ease-in';
            
            // Скрываем все внутренние экраны при начале игры
            document.getElementById('question-screen').style.display = 'none';
            document.getElementById('results-screen').style.display = 'none';
            document.getElementById('final-results').style.display = 'none';
            
            hasAnswered = false;
        });

        // Вопрос
        socket.on('question', (data) => {
            // Если мы еще на экране подключения, переключаемся
            if (document.getElementById('connect-screen').style.display !== 'none') {
                document.getElementById('connect-screen').style.display = 'none';
                document.getElementById('waiting-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'block';
            }
            
            // Скрываем кнопку готовности при новом вопросе
            isReady = false;
            const readyBtn = document.getElementById('ready-btn');
            const readyStatus = document.getElementById('ready-status');
            readyBtn.style.display = 'none';
            readyStatus.textContent = '';
            
            // ВАЖНО: ВСЕГДА сбрасываем флаг ответа при получении нового вопроса
            hasAnswered = false;
            
            document.getElementById('question-screen').style.display = 'block';
            document.getElementById('results-screen').style.display = 'none';
            document.getElementById('final-results').style.display = 'none';
            document.getElementById('answer-feedback').textContent = '';
            document.getElementById('answer-feedback').style.display = 'none';
            
            const questionNum = data.questionNumber;
            const totalQuestions = data.totalQuestions;
            
            document.getElementById('question-num').textContent = questionNum;
            document.getElementById('total-questions').textContent = totalQuestions;
            document.getElementById('question-text').textContent = data.question;
            
            // Обновляем прогресс-бар
            const progress = (questionNum / totalQuestions) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';
            
            // Варианты ответов - ВСЕГДА создаем активные кнопки
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            data.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.disabled = false;
                    btn.onclick = () => selectAnswer(index);
                optionsDiv.appendChild(btn);
            });

            // Таймер с улучшенной визуализацией
            let timeLeft = data.timeLeft !== undefined ? data.timeLeft : data.time;
            const timerElement = document.getElementById('timer');
            const timerRing = document.getElementById('timer-ring');
            timerElement.textContent = timeLeft;
            timerElement.classList.remove('urgent');
            
            if (currentTimer) clearInterval(currentTimer);
            let timerStopped = false;
            
            currentTimer = setInterval(() => {
                if (timerStopped) {
                    clearInterval(currentTimer);
                    return;
                }
                
                timeLeft--;
                timerElement.textContent = timeLeft;
                
                // Визуальные эффекты при малом времени
                if (timeLeft <= 5) {
                    timerElement.classList.add('urgent');
                }
                
                // Анимация кольца таймера
                const progress = (timeLeft / data.time) * 100;
                timerRing.style.borderTopColor = timeLeft <= 5 ? 'var(--color-orange)' : 'var(--color-green)';
                
                if (timeLeft <= 0) {
                    clearInterval(currentTimer);
                    disableOptions();
                    timerElement.textContent = '0';
                }
            }, 1000);
            
            // Сохраняем функцию остановки таймера
            window.stopTimer = function() {
                timerStopped = true;
                if (currentTimer) {
                    clearInterval(currentTimer);
                    currentTimer = null;
                }
            };
        });

        // Статус ответов (для остановки таймера когда все ответили)
        socket.on('answer-status', (data) => {
            if (data.allAnswered && !hasAnswered) {
                // Все ответили, останавливаем таймер
                if (window.stopTimer) {
                    window.stopTimer();
                }
            }
        });

        function selectAnswer(answerIndex) {
            if (hasAnswered) return;
            hasAnswered = true;
            
            // Останавливаем таймер для этого игрока
            if (window.stopTimer) {
                window.stopTimer();
            }
            
            socket.emit('answer', { roomCode, answerIndex });
            
            // Визуальная обратная связь
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach((btn, index) => {
                btn.disabled = true;
                if (index === answerIndex) {
                    btn.classList.add('selected');
                }
            });
            
            disableOptions();
        }

        function disableOptions() {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);
        }

        // Ответ получен
        socket.on('answer-received', (data) => {
            hasAnswered = true;
            
            // Останавливаем таймер
            if (window.stopTimer) {
                window.stopTimer();
            }
            if (currentTimer) {
                clearInterval(currentTimer);
                currentTimer = null;
            }
            
            const feedback = document.getElementById('answer-feedback');
            const messages = {
                correct: ['Отлично!', 'Правильно!', 'Верно!', 'Супер!', 'Молодец!'],
                incorrect: ['Неправильно', 'Неверно', 'Упс...', 'Попробуй еще']
            };
            
            if (data.isCorrect) {
                const message = messages.correct[Math.floor(Math.random() * messages.correct.length)];
                feedback.textContent = message;
                feedback.className = 'answer-feedback correct';
            } else {
                const message = messages.incorrect[Math.floor(Math.random() * messages.incorrect.length)];
                feedback.textContent = message;
                feedback.className = 'answer-feedback incorrect';
            }
            
            // Блокируем все кнопки после ответа
            disableOptions();
            
            // Показываем обратную связь сразу
            feedback.style.display = 'flex';
            
            // Подсвечиваем выбранный ответ
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach((btn, index) => {
                if (btn.classList.contains('selected')) {
                    if (data.isCorrect) {
                        btn.classList.add('correct');
                    } else {
                        btn.classList.add('incorrect');
                    }
                }
            });
        });

        let isReady = false;

            // Результаты вопроса
        socket.on('results', (data) => {
            clearInterval(currentTimer);
            isReady = false;
            
            document.getElementById('question-screen').style.display = 'none';
            document.getElementById('results-screen').style.display = 'block';
            
            // Показать правильный ответ
            const correctAnswerDiv = document.getElementById('correct-answer');
            if (correctAnswerDiv && data.correctAnswerText) {
                correctAnswerDiv.textContent = `Правильный ответ: ${data.correctAnswerText}`;
                correctAnswerDiv.style.display = 'block';
            }
            
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach((btn, index) => {
                if (index === data.correctAnswer) {
                    btn.classList.add('correct');
                } else {
                    btn.classList.remove('selected');
                }
            });

            // Обновить счет
            const player = data.players.find(p => p.name === playerName);
            if (player) {
                document.getElementById('player-score').textContent = player.score;
            }

            // Таблица лидеров с анимациями
            const leaderboard = document.getElementById('leaderboard');
            leaderboard.innerHTML = '';
            data.players.forEach((player, index) => {
                const item = document.createElement('div');
                let className = 'leaderboard-item';
                if (index === 0) className += ' first';
                else if (index === 1) className += ' second';
                else if (index === 2) className += ' third';
                
                item.className = className;
                item.style.animationDelay = (index * 0.1) + 's';
                
                item.innerHTML = `
                    <span>${index + 1}. ${player.name}</span>
                    <span>${player.score} очков</span>
                `;
                leaderboard.appendChild(item);
            });

            // Показываем кнопку готовности
            const readyBtn = document.getElementById('ready-btn');
            const readyStatus = document.getElementById('ready-status');
            readyBtn.style.display = 'block';
            readyBtn.disabled = false;
            readyBtn.textContent = 'Готов к следующему вопросу';
            readyStatus.textContent = 'Нажмите кнопку, когда будете готовы к следующему вопросу';
        });

        // Кнопка готовности
        const readyBtn = document.getElementById('ready-btn');
        readyBtn.addEventListener('click', () => {
            if (isReady) return;
            isReady = true;
            socket.emit('player-ready', roomCode);
            readyBtn.disabled = true;
            readyBtn.textContent = 'Готов! Ожидание других игроков...';
            const readyStatus = document.getElementById('ready-status');
            readyStatus.textContent = 'Вы готовы! Ожидание других игроков...';
        });

        // Статус готовности
        socket.on('ready-status', (data) => {
            if (isReady && document.getElementById('results-screen').style.display !== 'none') {
                const readyBtn = document.getElementById('ready-btn');
                const readyStatus = document.getElementById('ready-status');
                readyBtn.disabled = true;
                readyBtn.textContent = 'Готов! Ожидание других игроков...';
                readyStatus.textContent = `Вы готовы! Ожидание других игроков... (${data.readyCount}/${data.totalPlayers})`;
            }
        });

        // Финальные результаты
        socket.on('game-finished', (data) => {
            document.getElementById('question-screen').style.display = 'none';
            document.getElementById('results-screen').style.display = 'none';
            document.getElementById('final-results').style.display = 'block';
            
            const player = data.results.find(p => p.name === playerName);
            if (player) {
                document.getElementById('final-score').textContent = player.score;
            }

            const leaderboard = document.getElementById('final-leaderboard');
            leaderboard.innerHTML = '';
            const finalMessages = {
                0: 'Чемпион!',
                1: 'Второе место!',
                2: 'Третье место!'
            };
            
            data.results.forEach((player, index) => {
                const item = document.createElement('div');
                let className = 'leaderboard-item';
                if (index === 0) className += ' first';
                else if (index === 1) className += ' second';
                else if (index === 2) className += ' third';
                
                item.className = className;
                item.style.animationDelay = (index * 0.1) + 's';
                
                const message = finalMessages[index] || '';
                item.innerHTML = `
                    <span>${index + 1}. ${player.name} ${message}</span>
                    <span>${player.score} очков</span>
                `;
                leaderboard.appendChild(item);
            });
        });
    </script>
</body>
</html>
