<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Квиз - Игрок</title>
    <link rel="stylesheet" href="/styles/brand-style.css">
    <link rel="stylesheet" href="/styles/hub-layout.css">
    <link rel="stylesheet" href="/styles/hub1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Days+One&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script src="/scripts/hub-common.js"></script>
    <script src="/scripts/hub1.js"></script>
    <style>
        /* Специфичные стили для страницы игрока */
        .hub3 > .container {
            max-width: 500px; /* Переопределяем для страницы игрока */
        }
        .back-button {
            display: none; /* Скрываем старую кнопку, используем Hub1 */
        }

        .back-button-hub {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(245, 245, 245, 0.85);
            border: 2px solid #393639;
            border-radius: 12px;
            color: #393639;
            text-decoration: none;
            font-family: 'Days One', sans-serif;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.3s;
            box-shadow: 
                0 2px 0px rgba(0, 0, 0, 0.2),
                0 4px 8px rgba(0, 0, 0, 0.1);
            white-space: nowrap;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        
        .back-button-hub:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 0px rgba(0, 0, 0, 0.3),
                0 8px 16px rgba(0, 0, 0, 0.15);
            background: rgba(245, 245, 245, 0.6);
        }
        
        .back-button-hub:active {
            transform: translateY(0px);
        }

        @media (min-width: 1024px) {
            .back-button {
                top: 20px;
                left: 40px;
            }
        }

        @media (max-width: 1023px) and (min-width: 769px) {
            .back-button {
                top: 15px;
                left: 30px;
            }
        }

        @media (max-width: 768px) {
            .back-button {
                top: 12px;
                left: 20px;
            }
        }

        @media (max-width: 480px) {
            .back-button {
                top: 10px;
                left: 15px;
            }
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        input {
            text-align: center;
            text-transform: uppercase;
        }

        .btn {
            width: 100%;
            margin: 10px 0;
        }

        .waiting-screen {
            text-align: center;
            display: none;
        }

        .game-screen {
            display: none;
        }

        .question-screen {
            text-align: center;
            display: none; /* Скрыт по умолчанию, показывается только при получении реального вопроса */
        }

        .question-number {
            font-size: 18px;
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .question-text {
            font-size: 24px;
            margin: 30px 0;
            line-height: 1.4;
            animation: fadeIn 0.5s ease-in;
            font-family: 'Days One', sans-serif;
            color: var(--color-dark);
        }

        .timer-container {
            display: inline-block;
            margin: 16px 0;
        }

        .options {
            margin: 30px 0;
        }

        .results-screen {
            text-align: center;
            display: none;
            padding: 30px 20px;
        }
        
        .results-screen h2 {
            font-family: 'Days One', sans-serif;
            font-size: 32px;
            color: #393639;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .correct-answer {
            background: linear-gradient(135deg, rgba(0, 193, 89, 0.15) 0%, rgba(0, 193, 89, 0.25) 100%);
            border: 3px solid #00C159;
            padding: 25px 30px;
            border-radius: 16px;
            margin: 25px auto;
            max-width: 600px;
            font-size: 22px;
            font-family: 'Days One', sans-serif;
            color: #393639;
            box-shadow: 
                0 4px 0px rgba(0, 193, 89, 0.4),
                0 8px 16px rgba(0, 193, 89, 0.2);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .leaderboard {
            background: rgba(245, 245, 245, 0.9);
            border: 3px solid #393639;
            border-radius: 16px;
            padding: 25px;
            margin: 30px auto;
            max-width: 600px;
            box-shadow: 
                0 4px 0px rgba(57, 54, 57, 0.3),
                0 8px 16px rgba(0, 0, 0, 0.1);
        }
        
        .leaderboard h3 {
            font-family: 'Days One', sans-serif;
            font-size: 24px;
            color: #393639;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            margin: 10px 0;
            background: #FFFFFF;
            border: 2px solid #393639;
            border-radius: 12px;
            font-family: 'Days One', sans-serif;
            box-shadow: 
                0 2px 0px rgba(0, 0, 0, 0.2),
                0 4px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
        }
        
        .leaderboard-item:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 4px 0px rgba(0, 0, 0, 0.3),
                0 6px 12px rgba(0, 0, 0, 0.15);
        }
        
        .leaderboard-item .player-name {
            font-size: 18px;
            font-weight: 700;
            color: #393639;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .leaderboard-item .player-score {
            font-size: 20px;
            font-weight: 700;
            color: #00C159;
            text-transform: uppercase;
        }

        .score {
            font-size: 28px;
            font-weight: 700;
            margin: 25px 0;
            font-family: 'Days One', sans-serif;
            color: #393639;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .ready-btn {
            background: rgba(245, 245, 245, 0.85);
            color: var(--color-dark);
            border: none;
            padding: 14px 32px;
            font-size: 17px;
            font-weight: 500;
            font-family: 'Days One', sans-serif;
            border-radius: 12px;
            cursor: pointer;
            margin: 25px auto;
            display: block;
            width: 100%;
            max-width: 600px;
            text-align: center;
            box-shadow: 
                0 4px 0px rgba(0, 0, 0, 0.2),
                0 6px 12px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            position: relative;
        }
        
        .ready-btn:hover:not(:disabled) {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 8px 0px rgba(0, 0, 0, 0.4),
                0 12px 24px rgba(0, 0, 0, 0.15);
            background: rgba(245, 245, 245, 0.6);
        }
        
        .ready-btn:active:not(:disabled) {
            transform: translateY(-4px) scale(0.98);
        }
        
        /* Красная кнопка по умолчанию (waiting) */
        .ready-btn {
            background: #ff7664;
            color: #FFFFFF;
        }
        
        .ready-btn:hover:not(:disabled) {
            background: #ff7664;
        }
        
        /* Зеленая кнопка после нажатия (ready) - салатовый и темно-зеленый как кнопка "Следующий вопрос" */
        .ready-btn.ready {
            background: #abf67c; /* салатовый */
            color: #2fb95d; /* темно-зеленый текст */
            border: 3px solid #2fb95d; /* темно-зеленая граница */
        }
        
        .ready-btn.ready:hover:not(:disabled) {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 8px 0px rgba(47, 185, 93, 0.4),
                0 12px 24px rgba(47, 185, 93, 0.2);
            background: #abf67c;
        }
        
        .ready-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }
        
        .ready-status {
            font-family: 'Nunito', sans-serif;
            font-size: 16px;
            color: #393639;
            font-weight: 600;
            padding: 10px;
            background: rgba(245, 245, 245, 0.8);
            border-radius: 8px;
            text-align: center;
        }
        
        .final-results {
            text-align: center;
            padding: 30px 20px;
        }
        
        .final-results h1 {
            font-family: 'Days One', sans-serif;
            font-size: 42px;
            color: #393639;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .final-results h2 {
            font-family: 'Days One', sans-serif;
            font-size: 28px;
            color: #393639;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .final-results .leaderboard {
            background: rgba(245, 245, 245, 0.9);
            border: 3px solid #393639;
            border-radius: 16px;
            padding: 25px;
            margin: 30px auto;
            max-width: 600px;
            box-shadow: 
                0 4px 0px rgba(57, 54, 57, 0.3),
                0 8px 16px rgba(0, 0, 0, 0.1);
        }
        
        /* Скрываем Hub2 на этой странице */
        #hub2 {
            display: none !important;
            height: 0 !important;
            min-height: 0 !important;
            padding: 0 !important;
            margin: 0 !important;
            overflow: hidden !important;
            visibility: hidden !important;
        }
        
        /* Когда Hub2 скрыт, Hub3 занимает его место в grid */
        body.with-hub {
            grid-template-rows: 
                minmax(10vh, auto)  /* Hub1 - минимум 10% экрана */
                auto;               /* Hub3 занимает место Hub2 */
        }
        
        .hub3 {
            grid-row: 2; /* Занимает место Hub2 */
            margin-top: 0 !important;
            padding-top: 0 !important;
        }
        
        /* Убираем лишние отступы у контейнера hub3 */
        .hub3 > .container {
            margin-top: 0 !important;
            padding-top: clamp(16px, 5vw, 40px) !important; /* Оставляем только верхний отступ для контента */
        }
        
        /* Парящие элементы - позиционируются относительно viewport */
        body.with-hub::before {
            content: '' !important;
            position: fixed !important;
            top: 10vh !important; /* После Hub1 (без Hub2) */
            left: -50px !important;
            width: 200px !important;
            height: 200px !important;
            background: #d6fbbf !important;
            border-radius: 50% 40% 60% 30% !important;
            opacity: 0.9 !important;
            z-index: -1 !important;
            animation: wobble 6s ease-in-out infinite !important;
            pointer-events: none !important;
        }
        
        body.with-hub::after {
            content: '' !important;
            position: fixed !important;
            bottom: 20vh !important; /* Примерно выше Hub4+Hub5 */
            right: -80px !important;
            width: 250px !important;
            height: 250px !important;
            background: #fececd !important;
            border-radius: 40% 50% 30% 60% !important;
            opacity: 0.9 !important;
            z-index: -1 !important;
            animation: wobble 8s ease-in-out infinite reverse !important;
            pointer-events: none !important;
        }
        
        /* Анимация wobble для парящих элементов */
        @keyframes wobble {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(5deg) scale(1.1); }
            50% { transform: rotate(-5deg) scale(0.9); }
            75% { transform: rotate(3deg) scale(1.05); }
        }
        
        /* Адаптивность для разных экранов */
        @media (min-width: 1024px) {
            body.with-hub {
                grid-template-rows: 
                    minmax(10vh, auto)
                    auto;
            }
        }
        
        @media (max-width: 1023px) and (min-width: 769px) {
            body.with-hub {
                grid-template-rows: 
                    minmax(10vh, auto)
                    auto;
            }
        }
        
        @media (max-width: 768px) {
            body.with-hub {
                grid-template-rows: 
                    minmax(10vh, auto)
                    auto;
            }
            
            body.with-hub::before {
                top: clamp(10vh, 12vw, 12vh) !important;
                width: clamp(150px, 30vw, 200px) !important;
                height: clamp(150px, 30vw, 200px) !important;
            }
            
            body.with-hub::after {
                bottom: clamp(15vh, 20vw, 20vh) !important;
                width: clamp(180px, 35vw, 250px) !important;
                height: clamp(180px, 35vw, 250px) !important;
            }
        }
        
        @media (max-width: 480px) {
            body.with-hub {
                grid-template-rows: 
                    minmax(10vh, auto)
                    auto;
            }
            
            body.with-hub::before {
                top: clamp(10vh, 12vw, 12vh) !important;
                width: clamp(120px, 25vw, 180px) !important;
                height: clamp(120px, 25vw, 180px) !important;
                left: clamp(-40px, -8vw, -50px) !important;
            }
            
            body.with-hub::after {
                bottom: clamp(12vh, 18vw, 18vh) !important;
                width: clamp(150px, 30vw, 220px) !important;
                height: clamp(150px, 30vw, 220px) !important;
                right: clamp(-60px, -12vw, -80px) !important;
            }
        }

    </style>
</head>
<body class="with-hub">
    <!-- HUB3: основная зона контента -->
    <div class="hub-zone hub3">
        <div class="container">
        <!-- Кнопка назад -->
        <div class="back-button">
            <a href="/index.html" class="back-button-hub">
                ← Назад
            </a>
        </div>
        
        <!-- Экран подключения -->
        <div id="connect-screen">
            <h1>Присоединиться к игре</h1>
            <div class="input-group">
                <label for="room-code">Код комнаты</label>
                <input type="text" id="room-code" maxlength="4" placeholder="Введите код">
            </div>
            <div class="input-group">
                <label for="player-name">Ваше имя</label>
                <input type="text" id="player-name" maxlength="20" placeholder="Введите имя">
            </div>
            <button id="connect-btn" class="btn">Подключиться</button>
            <div id="error-message"></div>
        </div>

        <!-- Экран ожидания -->
        <div id="waiting-screen" class="waiting-screen">
            <h1>Ожидание начала игры...</h1>
            <div class="status">Вы подключены к комнате</div>
        </div>

        <!-- Игровой экран -->
        <div id="game-screen" class="game-screen">
            <!-- Вопрос -->
            <div id="question-screen" class="question-screen">
                <div class="question-number">
                    Вопрос <span id="question-num">1</span> из <span id="total-questions">10</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <div id="question-text" class="question-text"></div>
                <div class="timer-container">
                    <div id="timer" class="timer">15</div>
                </div>
                <div class="options" id="options"></div>
                <div id="answer-feedback" class="answer-feedback"></div>
            </div>

            <!-- Результаты вопроса -->
            <div id="results-screen" class="results-screen">
                <h2>Результаты вопроса</h2>
                <div id="correct-answer-display" class="correct-answer"></div>
                <div class="score">
                    Ваш счет: <span id="player-score">0</span>
                    <span id="points-added" style="font-size: 16px; margin-left: 10px; opacity: 0.8;"></span>
                </div>
                <button id="ready-btn" class="ready-btn" style="display: none;">Готов к следующему вопросу</button>
                <div id="ready-status" class="ready-status" style="display: none; margin-top: 15px;">Ожидание других игроков...</div>
            </div>

            <!-- Финальные результаты -->
            <div id="final-results" class="results-screen">
                <h1>Игра завершена!</h1>
                <div class="score">Ваш финальный счет: <span id="final-score">0</span></div>
                <div class="leaderboard">
                    <h2>Финальные результаты</h2>
                    <div id="final-leaderboard"></div>
                </div>
            </div>
        </div>
        </div>
    </div>

    <!-- HUB4: нижняя полоса (fixed, над HUB5) -->
    <div id="hub4" class="hub-zone hub4">
        <!-- Здесь позже можно разместить вспомогательные статусы, подсказки, маленькие карточки и т.п. -->
    </div>

    <!-- HUB5: самая нижняя полоса (fixed, внизу экрана) -->
    <div id="hub5" class="hub-zone hub5">
        <!-- Здесь позже можно разместить "Правила хаба", ссылки, переключение режимов -->
    </div>

    <script>
        const socket = io();
        let roomCode = null;
        let playerName = null;
        let currentTimer = null;
        let hasAnswered = false;
        
        // Поддержка джойстика
        let gamepad = null;
        let joystickConfig = null;
        let gamepadUpdateInterval = null;
        
        // Загрузка конфигурации джойстика
        function loadJoystickConfig() {
            console.log('📥 Загрузка конфигурации джойстика из localStorage...');
            const saved = localStorage.getItem('joystickConfig');
            
            if (!saved) {
                console.warn('⚠️ Конфигурация джойстика не найдена в localStorage');
                joystickConfig = null;
                return false;
            }
            
            try {
                const parsed = JSON.parse(saved);
                console.log('📄 Данные из localStorage:', saved);
                
                // Проверяем, что конфигурация валидна и содержит кнопки
                if (parsed && typeof parsed === 'object') {
                    joystickConfig = {
                        buttons: parsed.buttons || {},
                        axes: parsed.axes || {}
                    };
                    
                    console.log('🔍 Распарсенная конфигурация:', joystickConfig);
                    console.log('🔍 Кнопки в конфигурации:', Object.keys(joystickConfig.buttons));
                    
                    // Проверяем наличие кнопок для ответов (Кнопка 1-4)
                    const answerButtons = ['Кнопка 1', 'Кнопка 2', 'Кнопка 3', 'Кнопка 4'];
                    const hasAnswerButtons = answerButtons.some(
                        btn => joystickConfig.buttons[btn] !== undefined
                    );
                    
                    const configuredButtons = answerButtons.filter(
                        btn => joystickConfig.buttons[btn] !== undefined
                    );
                    
                    if (hasAnswerButtons) {
                        console.log('✅ Конфигурация джойстика успешно загружена');
                        console.log('📋 Настроенные кнопки для ответов:', configuredButtons);
                        configuredButtons.forEach(btn => {
                            console.log(`   - ${btn} -> физическая кнопка ${joystickConfig.buttons[btn]}`);
                        });
                        return true;
                    } else {
                        console.warn('⚠️ Конфигурация загружена, но не найдены кнопки для ответов (Кнопка 1-4)');
                        console.warn('📋 Доступные кнопки в конфигурации:', Object.keys(joystickConfig.buttons));
                        joystickConfig = null;
                        return false;
                    }
                } else {
                    console.warn('⚠️ Неверный формат конфигурации джойстика:', typeof parsed);
                    joystickConfig = null;
                    return false;
                }
            } catch (e) {
                console.error('❌ Ошибка парсинга конфигурации джойстика:', e);
                console.error('📄 Сырые данные:', saved);
                joystickConfig = null;
                return false;
            }
        }
        
        // Получение джойстика
        function getGamepad() {
            const gamepads = navigator.getGamepads();
            for (let i = 0; i < gamepads.length; i++) {
                if (gamepads[i]) {
                    return gamepads[i];
                }
            }
            return null;
        }
        
        // Подсветка кнопки при нажатии физической кнопки
        function highlightOptionByGamepad(buttonIndex) {
            const buttons = document.querySelectorAll('.option-btn');
            if (buttons[buttonIndex] && !buttons[buttonIndex].disabled) {
                buttons[buttonIndex].classList.add('gamepad-highlight');
                setTimeout(() => {
                    buttons[buttonIndex].classList.remove('gamepad-highlight');
                }, 300);
            }
        }
        
        // Флаг для предотвращения множественных срабатываний
        let lastPressedButton = null;
        let lastPressedTime = 0;
        
        // Обработка нажатий кнопок джойстика
        function handleGamepadInput() {
            if (!gamepad) {
                return;
            }
            
            if (!joystickConfig || !joystickConfig.buttons) {
                return;
            }
            
            // Обработка ответов - только на экране вопроса
            const questionScreen = document.getElementById('question-screen');
            if (!questionScreen || questionScreen.style.display === 'none' || hasAnswered) {
                return;
            }
            
            // Проверяем нажатые кнопки
            const buttons = joystickConfig.buttons;
            const currentTime = Date.now();
            
            for (const [command, buttonIndex] of Object.entries(buttons)) {
                // Проверяем, что кнопка нажата
                if (gamepad.buttons[buttonIndex] && gamepad.buttons[buttonIndex].pressed) {
                    // Защита от множественных срабатываний (минимум 300мс между нажатиями)
                    const buttonKey = `${command}-${buttonIndex}`;
                    if (lastPressedButton === buttonKey && (currentTime - lastPressedTime) < 300) {
                        continue;
                    }
                    
                    // Извлекаем номер кнопки из названия (например, "Кнопка 1" -> 1)
                    const match = command.match(/Кнопка (\d+)/);
                    if (match) {
                        const answerIndex = parseInt(match[1]) - 1; // Кнопка 1 = ответ 0, Кнопка 2 = ответ 1 и т.д.
                        
                        // Проверяем, что такой вариант ответа существует
                        const options = document.querySelectorAll('.option-btn');
                        if (answerIndex >= 0 && answerIndex < options.length) {
                            lastPressedButton = buttonKey;
                            lastPressedTime = currentTime;
                            
                            // Подсвечиваем кнопку перед выбором ответа
                            highlightOptionByGamepad(answerIndex);
                            console.log(`🎮 Джойстик: ${command} (кнопка ${buttonIndex}) -> Ответ ${answerIndex + 1} (${options[answerIndex].querySelector('.option-text')?.textContent || 'неизвестно'})`);
                            
                            // Небольшая задержка для визуального эффекта
                            setTimeout(() => {
                                selectAnswer(answerIndex);
                            }, 100);
                            return; // Обработали нажатие, выходим
                        } else {
                            console.warn(`⚠️ Джойстик: Ответ ${answerIndex + 1} не существует (всего вариантов: ${options.length})`);
                        }
                    }
                }
            }
            
            // Сбрасываем флаг, если ни одна кнопка не нажата
            let anyButtonPressed = false;
            for (const [command, buttonIndex] of Object.entries(buttons)) {
                if (gamepad.buttons[buttonIndex] && gamepad.buttons[buttonIndex].pressed) {
                    anyButtonPressed = true;
                    break;
                }
            }
            if (!anyButtonPressed) {
                lastPressedButton = null;
            }
        }
        
        // Запуск проверки джойстика
        function startGamepadCheck() {
            // Всегда перезагружаем конфигурацию перед запуском (на случай изменений)
            const configLoaded = loadJoystickConfig();
            
            if (gamepadUpdateInterval) {
                clearInterval(gamepadUpdateInterval);
            }
            
            // Получаем джойстик
            gamepad = getGamepad();
            
            if (!gamepad) {
                console.warn('⚠️ Джойстик не подключен');
                return;
            }
            
            if (configLoaded && joystickConfig && joystickConfig.buttons) {
                const buttonCount = Object.keys(joystickConfig.buttons).filter(k => k.startsWith('Кнопка')).length;
                console.log(`🎮 Запуск проверки джойстика. Настроено кнопок: ${buttonCount}`);
                console.log('📋 Конфигурация:', joystickConfig);
                gamepadUpdateInterval = setInterval(updateGamepad, 50);
            } else {
                console.warn('⚠️ Конфигурация джойстика не найдена или неполная. Джойстик не будет работать.');
                console.warn('💡 Настройте джойстик: /joystick-test/joystick.html');
            }
        }
        
        // Остановка проверки джойстика
        function stopGamepadCheck() {
            if (gamepadUpdateInterval) {
                clearInterval(gamepadUpdateInterval);
                gamepadUpdateInterval = null;
            }
        }
        
        // Обновление состояния джойстика
        function updateGamepad() {
            // Обновляем ссылку на джойстик каждый раз
            const currentGamepad = getGamepad();
            if (currentGamepad) {
                gamepad = currentGamepad;
                handleGamepadInput();
            }
        }
        
        // Инициализация джойстика
        function initJoystick() {
            console.log('🔧 Инициализация джойстика...');
            
            // Загружаем конфигурацию при инициализации
            const configLoaded = loadJoystickConfig();
            
            // Проверяем, подключен ли джойстик уже при загрузке страницы
            const initialGamepad = getGamepad();
            if (initialGamepad) {
                console.log('🎮 Джойстик уже подключен при загрузке:', initialGamepad.id);
                gamepad = initialGamepad;
                
                // Если конфигурация загружена, сразу запускаем проверку
                if (configLoaded && joystickConfig && joystickConfig.buttons) {
                    console.log('✅ Конфигурация найдена, запускаем проверку джойстика');
                    startGamepadCheck();
                }
            }
            
            // Обработчики подключения/отключения (всегда добавляем)
            window.addEventListener('gamepadconnected', (e) => {
                console.log('🎮 Джойстик подключен:', e.gamepad.id);
                gamepad = e.gamepad;
                
                // Перезагружаем конфигурацию на случай, если она изменилась
                const reloaded = loadJoystickConfig();
                
                // Если есть конфигурация, запускаем проверку
                if (reloaded && joystickConfig && joystickConfig.buttons) {
                    console.log('✅ Конфигурация загружена, запускаем проверку джойстика');
                    startGamepadCheck();
                } else {
                    console.warn('⚠️ Конфигурация не найдена при подключении джойстика');
                }
            });
            
            window.addEventListener('gamepaddisconnected', (e) => {
                console.log('🎮 Джойстик отключен:', e.gamepad.id);
                gamepad = null;
                stopGamepadCheck();
            });
            
            // Выводим информацию о конфигурации
            if (configLoaded && joystickConfig && joystickConfig.buttons) {
                const buttonCount = Object.keys(joystickConfig.buttons).filter(k => k.startsWith('Кнопка')).length;
                const configuredButtons = Object.keys(joystickConfig.buttons)
                    .filter(k => k.startsWith('Кнопка'))
                    .map(k => `${k} -> кнопка ${joystickConfig.buttons[k]}`)
                    .join(', ');
                console.log(`✅ Конфигурация джойстика загружена (${buttonCount} кнопок):`, configuredButtons);
                console.log('📋 Полная конфигурация:', JSON.stringify(joystickConfig, null, 2));
            } else {
                console.warn('⚠️ Конфигурация джойстика не найдена или неполная.');
                console.warn('💡 Настройте джойстик: откройте /joystick-test/joystick.html и назначьте кнопки 1-4 для ответов А-Г');
            }
        }

        // Функция показа ошибки
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            if (errorDiv) {
                errorDiv.innerHTML = `<div class="error">${message}</div>`;
                setTimeout(() => {
                    errorDiv.innerHTML = '';
                }, 5000);
            } else {
                console.error('Ошибка:', message);
            }
        }

        // Автоматическое заполнение кода комнаты из URL
        // Применяем цвет выбранного персонажа к кнопке "Назад"
        document.addEventListener('DOMContentLoaded', function() {
            const savedColor = localStorage.getItem('selectedCharacterColor');
            if (savedColor) {
                // Применяем цвет ко всем кнопкам "Назад"
                const backButtons = document.querySelectorAll('.back-button-hub');
                backButtons.forEach(button => {
                    button.style.background = savedColor;
                });
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam) {
                const roomCodeInput = document.getElementById('room-code');
                if (roomCodeInput) {
                    roomCodeInput.value = roomParam.toUpperCase();
                }
            }
        });

        // Функция подключения к комнате
        function connectToRoom() {
            roomCode = document.getElementById('room-code').value.toUpperCase().trim();
            playerName = document.getElementById('player-name').value.trim();

            if (!roomCode || !playerName) {
                showError('Заполните все поля');
                return;
            }

            console.log('Подключение к комнате:', roomCode, 'Игрок:', playerName);
            // Подключаемся без пароля - пароль не требуется для игроков
            socket.emit('player-join', { roomCode, playerName });
        }


        // Подключение к комнате
        document.getElementById('connect-btn').addEventListener('click', connectToRoom);
        
        // Автоматическое подключение, если код комнаты уже есть в URL
        socket.on('connect', () => {
            console.log('Socket.io подключен');
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam) {
                // Даем время на заполнение формы
                setTimeout(() => {
                    const roomCodeInput = document.getElementById('room-code');
                    const playerNameInput = document.getElementById('player-name');
                    if (roomCodeInput && roomCodeInput.value && playerNameInput && playerNameInput.value) {
                        // Если имя уже введено, подключаемся автоматически
                        connectToRoom();
                    }
                }, 100);
            }
        });

        socket.on('player-connected', (data) => {
            console.log('✅ Игрок подключен, ID:', data.playerId);
            document.getElementById('connect-screen').style.display = 'none';
            document.getElementById('waiting-screen').style.display = 'block';
            
            // Скрываем кнопку "Назад" после подключения
            const backButton = document.querySelector('.back-button');
            if (backButton) {
                backButton.style.display = 'none';
            }
        });

        socket.on('error', (data) => {
            // Не показываем модальное окно для пароля - подключаемся без пароля
            showError(data.message);
        });

        // Начало игры
        socket.on('game-started', () => {
            document.getElementById('waiting-screen').style.display = 'none';
            const gameScreen = document.getElementById('game-screen');
            gameScreen.style.display = 'block';
            gameScreen.style.animation = 'fadeIn 0.5s ease-in';
            hasAnswered = false;
            
            // Скрываем все экраны до получения реального вопроса
            document.getElementById('question-screen').style.display = 'none';
            document.getElementById('results-screen').style.display = 'none';
            document.getElementById('final-results').style.display = 'none';
            
            // Скрываем кнопку "Назад" во время игры
            const backButton = document.querySelector('.back-button');
            if (backButton) {
                backButton.style.display = 'none';
            }
            
            // Инициализируем счет при начале игры
            window.previousPlayerScore = 0;
            const scoreElement = document.getElementById('player-score');
            if (scoreElement) {
                scoreElement.textContent = '0';
            }
        });

        // Вопрос
        socket.on('question', (data) => {
            // Если мы еще на экране подключения, переключаемся
            if (document.getElementById('connect-screen').style.display !== 'none') {
                document.getElementById('connect-screen').style.display = 'none';
                document.getElementById('waiting-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'block';
            }
            
            // Скрываем кнопку готовности при новом вопросе
            isReady = false;
            const readyBtn = document.getElementById('ready-btn');
            const readyStatus = document.getElementById('ready-status');
            readyBtn.style.display = 'none';
            readyStatus.textContent = '';
            
            // ВАЖНО: ВСЕГДА сбрасываем флаг ответа при получении нового вопроса
            hasAnswered = false;
            
            document.getElementById('question-screen').style.display = 'block';
            document.getElementById('results-screen').style.display = 'none';
            document.getElementById('final-results').style.display = 'none';
            document.getElementById('answer-feedback').textContent = '';
            document.getElementById('answer-feedback').style.display = 'none';
            
            // Сохраняем текущий счет перед новым вопросом
            const currentScoreElement = document.getElementById('player-score');
            if (currentScoreElement) {
                window.previousPlayerScore = parseInt(currentScoreElement.textContent) || 0;
            }
            
            const questionNum = data.questionNumber;
            const totalQuestions = data.totalQuestions;
            
            document.getElementById('question-num').textContent = questionNum;
            document.getElementById('total-questions').textContent = totalQuestions;
            document.getElementById('question-text').textContent = data.question;
            
            // Обновляем прогресс-бар
            const progress = (questionNum / totalQuestions) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';
            
            // Отображение изображения вопроса
            let imageContainer = document.getElementById('question-image-container');
            if (data.image) {
                if (!imageContainer) {
                    imageContainer = document.createElement('div');
                    imageContainer.className = 'question-image-container';
                    imageContainer.id = 'question-image-container';
                    const questionText = document.getElementById('question-text');
                    questionText.parentNode.insertBefore(imageContainer, questionText.nextSibling);
                }
                const img = document.createElement('img');
                img.className = 'question-image';
                const questionsDir = data.questionsDir || 'gnu';
                img.src = `/data/media/questions/${questionsDir}/${data.image}`;
                img.alt = 'Question image';
                imageContainer.innerHTML = '';
                imageContainer.appendChild(img);
            } else if (imageContainer) {
                imageContainer.innerHTML = '';
            }

            // Варианты ответов - ВСЕГДА создаем активные кнопки с метками А/Б/В/Г
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            const optionLabels = ['А', 'Б', 'В', 'Г'];
            const optionClasses = ['option-a', 'option-b', 'option-c', 'option-d'];
            
            data.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = `option-btn ${optionClasses[index]}`;
                btn.innerHTML = `
                    <span class="option-label">${optionLabels[index]}</span>
                    <span class="option-text">${option}</span>
                `;
                btn.dataset.optionIndex = index;
                btn.disabled = false;
                btn.onclick = () => selectAnswer(index);
                optionsDiv.appendChild(btn);
            });
            
            // Запускаем проверку джойстика для нового вопроса
            startGamepadCheck();

            // Таймер
            let timeLeft = data.timeLeft !== undefined ? data.timeLeft : data.time;
            const timerElement = document.getElementById('timer');
            timerElement.textContent = timeLeft;
            timerElement.classList.remove('urgent');
            
            if (currentTimer) clearInterval(currentTimer);
            let timerStopped = false;
            
            currentTimer = setInterval(() => {
                if (timerStopped) {
                    clearInterval(currentTimer);
                    return;
                }
                
                timeLeft--;
                timerElement.textContent = timeLeft;
                
                // Визуальные эффекты при малом времени
                if (timeLeft <= 5) {
                    timerElement.classList.add('urgent');
                }
                
                if (timeLeft <= 0) {
                    clearInterval(currentTimer);
                    disableOptions();
                    timerElement.textContent = '0';
                }
            }, 1000);
            
            // Сохраняем функцию остановки таймера
            window.stopTimer = function() {
                timerStopped = true;
                if (currentTimer) {
                    clearInterval(currentTimer);
                    currentTimer = null;
                }
            };
        });

        // Статус ответов (для остановки таймера когда все ответили)
        socket.on('answer-status', (data) => {
            if (data.allAnswered && !hasAnswered) {
                // Все ответили, останавливаем таймер
                if (window.stopTimer) {
                    window.stopTimer();
                }
            }
        });

        function selectAnswer(answerIndex) {
            // Останавливаем проверку джойстика
            stopGamepadCheck();
            if (hasAnswered) return;
            hasAnswered = true;
            
            // Останавливаем таймер для этого игрока
            if (window.stopTimer) {
                window.stopTimer();
            }
            
            socket.emit('answer', { roomCode, answerIndex });
            
            // Визуальная обратная связь
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach((btn, index) => {
                btn.disabled = true;
                if (index === answerIndex) {
                    btn.classList.add('selected');
                }
            });
            
            disableOptions();
        }

        function disableOptions() {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);
        }

        // Ответ получен
        socket.on('answer-received', (data) => {
            hasAnswered = true;
            
            // Останавливаем таймер
            if (window.stopTimer) {
                window.stopTimer();
            }
            if (currentTimer) {
                clearInterval(currentTimer);
                currentTimer = null;
            }
            
            const feedback = document.getElementById('answer-feedback');
            
            // Просто цветовая индикация без текста
            if (data.isCorrect) {
                feedback.textContent = '';
                feedback.className = 'answer-feedback correct';
            } else {
                feedback.textContent = '';
                feedback.className = 'answer-feedback incorrect';
            }
            
            // Сохраняем данные для экрана результатов
            window.lastAnswerData = {
                isCorrect: data.isCorrect,
                points: data.points || 0,
                newScore: data.newScore || 0
            };
            
            // Блокируем все кнопки после ответа
            disableOptions();
            
            // Показываем обратную связь сразу
            feedback.style.display = 'flex';
            
            // Подсвечиваем выбранный ответ
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach((btn, index) => {
                if (btn.classList.contains('selected')) {
                    if (data.isCorrect) {
                        btn.classList.add('correct');
                    } else {
                        btn.classList.add('incorrect');
                    }
                }
            });
        });

        let isReady = false;

        // Результаты вопроса
        socket.on('results', (data) => {
            clearInterval(currentTimer);
            isReady = false;
            
            document.getElementById('question-screen').style.display = 'none';
            document.getElementById('results-screen').style.display = 'block';
            
            // Показываем правильный ответ
            const correctAnswerDisplay = document.getElementById('correct-answer-display');
            if (data.correctAnswerText) {
                correctAnswerDisplay.textContent = `Правильный ответ: ${data.correctAnswerText}`;
                correctAnswerDisplay.style.display = 'block';
            } else {
                correctAnswerDisplay.style.display = 'none';
            }
            
            // Показать правильный ответ на кнопках
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach((btn, index) => {
                if (index === data.correctAnswer) {
                    btn.classList.add('correct');
                } else {
                    btn.classList.remove('selected');
                }
            });

            // Обновить счет с прибавленными баллами
            const player = data.players.find(p => p.name === playerName);
            if (player) {
                const previousScore = window.previousPlayerScore || 0;
                const newScore = player.score;
                const pointsEarned = newScore - previousScore;
                
                document.getElementById('player-score').textContent = newScore;
                
                // Показываем прибавленные баллы за этот раунд
                const pointsAdded = document.getElementById('points-added');
                if (pointsEarned > 0) {
                    pointsAdded.textContent = `(+${pointsEarned})`;
                    pointsAdded.style.color = '#00C159';
                    pointsAdded.style.fontWeight = '600';
                } else {
                    pointsAdded.textContent = `(+0)`;
                    pointsAdded.style.color = '#666';
                }
                
                // Сохраняем текущий счет для следующего раунда
                window.previousPlayerScore = newScore;
            }

            // Показываем кнопку готовности (красная по умолчанию)
            const readyBtn = document.getElementById('ready-btn');
            const readyStatus = document.getElementById('ready-status');
            readyBtn.style.display = 'block';
            readyBtn.disabled = false;
            readyBtn.classList.remove('ready'); // Убираем класс ready, чтобы кнопка была красной
            readyBtn.textContent = 'Готов к следующему вопросу?';
            readyStatus.style.display = 'none';
            isReady = false; // Сбрасываем флаг готовности
        });

        // Кнопка готовности
        const readyBtn = document.getElementById('ready-btn');
        readyBtn.addEventListener('click', () => {
            if (isReady) return;
            isReady = true;
            socket.emit('player-ready', roomCode);
            readyBtn.disabled = true;
            readyBtn.classList.add('ready'); // Делаем кнопку зеленой
            readyBtn.textContent = 'Готов! Ожидание игроков...';
            const readyStatus = document.getElementById('ready-status');
            readyStatus.style.display = 'block';
            readyStatus.textContent = 'Ожидание игроков...';
        });

        // Статус готовности
        socket.on('ready-status', (data) => {
            if (isReady && document.getElementById('results-screen').style.display !== 'none') {
                const readyBtn = document.getElementById('ready-btn');
                const readyStatus = document.getElementById('ready-status');
                readyBtn.disabled = true;
                readyBtn.classList.add('ready'); // Убеждаемся, что кнопка зеленая
                readyBtn.textContent = 'Готов! Ожидание игроков...';
                readyStatus.style.display = 'block';
                readyStatus.textContent = `Ожидание игроков... (${data.readyCount}/${data.totalPlayers})`;
            }
        });

        // Финальные результаты
        socket.on('game-finished', (data) => {
            document.getElementById('question-screen').style.display = 'none';
            document.getElementById('results-screen').style.display = 'none';
            document.getElementById('final-results').style.display = 'block';
            
            const player = data.results.find(p => p.name === playerName);
            if (player) {
                document.getElementById('final-score').textContent = player.score;
            }

            const leaderboard = document.getElementById('final-leaderboard');
            leaderboard.innerHTML = '';
            const finalMessages = {
                0: '· Чемпион',
                1: '· Второе место',
                2: '· Третье место'
            };
            
            data.results.forEach((player, index) => {
                const item = document.createElement('div');
                item.className = 'leaderboard-item';
                item.style.animationDelay = (index * 0.1) + 's';
                
                const message = finalMessages[index] || '';
                const playerNameSpan = document.createElement('span');
                playerNameSpan.className = 'player-name';
                playerNameSpan.textContent = `${index + 1}. ${player.name} ${message}`;
                
                const playerScoreSpan = document.createElement('span');
                playerScoreSpan.className = 'player-score';
                playerScoreSpan.textContent = `${player.score} очков`;
                
                item.appendChild(playerNameSpan);
                item.appendChild(playerScoreSpan);
                leaderboard.appendChild(item);
            });
        });
        
        // Инициализация джойстика при загрузке страницы
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initJoystick);
        } else {
            initJoystick();
        }
        
        // Инициализация Hub1
        function initHubs() {
            Hub1.init({
                showBack: true,
                backUrl: '/index.html'
            });
            
            // Обновление позиций (hub2 скрыт, не обновляем его позицию)
            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        // Hub2 скрыт, не обновляем его позицию
                        HubCommon.updateHub4Position();
                        HubCommon.updateContentPadding('.hub3 > .container');
                        HubCommon.updateFloatingElementsPosition();
                        HubCommon.updateBodyPaddingBottom();
                    });
                });
            });
        }
        
        // Инициализация Hub1 после загрузки
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(initHubs, 200);
            });
        } else {
            setTimeout(initHubs, 200);
        }
        
        // Обновление при изменении размера окна
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (typeof HubCommon !== 'undefined') {
                    // Hub2 скрыт, не обновляем его позицию
                    HubCommon.updateHub4Position();
                    HubCommon.updateContentPadding('.hub3 > .container');
                    HubCommon.updateFloatingElementsPosition();
                    HubCommon.updateBodyPaddingBottom();
                }
            }, 100);
        });
    </script>
    
    <!-- Hub1 скрипты -->
    <script src="/scripts/hub-common.js"></script>
    <script src="/scripts/hub1.js"></script>
</body>
