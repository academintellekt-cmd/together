<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Квиз - Игрок</title>
    <link rel="stylesheet" href="/styles/common.css">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        /* Специфичные стили для страницы игрока */
        .container {
            max-width: 500px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        input {
            text-align: center;
            text-transform: uppercase;
        }

        .btn {
            width: 100%;
            margin: 10px 0;
        }

        .waiting-screen {
            text-align: center;
            display: none;
        }

        .game-screen {
            display: none;
        }

        .question-screen {
            text-align: center;
        }

        .question-number {
            font-size: 18px;
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .question-text {
            font-size: 24px;
            margin: 30px 0;
            line-height: 1.4;
            animation: fadeIn 0.5s ease-in;
        }

        .timer-container {
            display: inline-block;
            margin: 16px 0;
        }

        .timer {
            /* Стили из common.css */
        }

        .options {
            margin: 30px 0;
        }

        .results-screen {
            text-align: center;
            display: none;
        }

        .score {
            font-size: 32px;
            font-weight: bold;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Экран подключения -->
        <div id="connect-screen">
            <h1>Присоединиться к игре</h1>
            <div class="input-group">
                <label for="room-code">Код комнаты</label>
                <input type="text" id="room-code" maxlength="4" placeholder="Введите код">
            </div>
            <div class="input-group">
                <label for="player-name">Ваше имя</label>
                <input type="text" id="player-name" maxlength="20" placeholder="Введите имя">
            </div>
            <button id="connect-btn" class="btn">Подключиться</button>
            <div id="error-message"></div>
        </div>

        <!-- Экран ожидания -->
        <div id="waiting-screen" class="waiting-screen">
            <h1>Ожидание начала игры...</h1>
            <div class="status">Вы подключены к комнате</div>
        </div>

        <!-- Игровой экран -->
        <div id="game-screen" class="game-screen">
            <!-- Вопрос -->
            <div id="question-screen" class="question-screen">
                <div class="question-number">
                    Вопрос <span id="question-num">1</span> из <span id="total-questions">10</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar" id="progress-bar"></div>
                </div>
                <div id="question-text" class="question-text"></div>
                <div class="timer-container">
                    <div id="timer" class="timer">15</div>
                </div>
                <div class="options" id="options"></div>
                <div id="answer-feedback" class="answer-feedback"></div>
            </div>

            <!-- Результаты вопроса -->
            <div id="results-screen" class="results-screen">
                <h2>Результаты вопроса</h2>
                <div id="correct-answer-display" class="correct-answer" style="margin: 20px 0; font-size: 18px; padding: 15px; background: rgba(255, 255, 255, 0.1); border-radius: 12px;"></div>
                <div class="score">
                    Ваш счет: <span id="player-score">0</span>
                    <span id="points-added" style="font-size: 16px; margin-left: 10px; opacity: 0.8;"></span>
                </div>
                <div class="leaderboard">
                    <h3>Таблица лидеров</h3>
                    <div id="leaderboard"></div>
                </div>
                <div id="ready-status" class="status" style="margin: 20px 0;">Ожидание следующего вопроса...</div>
                <button id="ready-btn" class="btn" style="display: none;">Готов к следующему вопросу</button>
            </div>

            <!-- Финальные результаты -->
            <div id="final-results" class="results-screen">
                <h1>Игра завершена!</h1>
                <div class="score">Ваш финальный счет: <span id="final-score">0</span></div>
                <div class="leaderboard">
                    <h2>Финальные результаты</h2>
                    <div id="final-leaderboard"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let roomCode = null;
        let playerName = null;
        let currentTimer = null;
        let hasAnswered = false;

        // Функция показа ошибки
        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            if (errorDiv) {
                errorDiv.innerHTML = `<div class="error">${message}</div>`;
                setTimeout(() => {
                    errorDiv.innerHTML = '';
                }, 5000);
            } else {
                console.error('Ошибка:', message);
            }
        }

        // Автоматическое заполнение кода комнаты из URL
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam) {
                const roomCodeInput = document.getElementById('room-code');
                if (roomCodeInput) {
                    roomCodeInput.value = roomParam.toUpperCase();
                }
            }
        });

        // Функция подключения к комнате
        function connectToRoom() {
            roomCode = document.getElementById('room-code').value.toUpperCase().trim();
            playerName = document.getElementById('player-name').value.trim();

            if (!roomCode || !playerName) {
                showError('Заполните все поля');
                return;
            }

            console.log('Подключение к комнате:', roomCode, 'Игрок:', playerName);
            socket.emit('player-join', { roomCode, playerName });
        }

        // Подключение к комнате
        document.getElementById('connect-btn').addEventListener('click', connectToRoom);
        
        // Автоматическое подключение, если код комнаты уже есть в URL
        socket.on('connect', () => {
            console.log('Socket.io подключен');
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            if (roomParam) {
                // Даем время на заполнение формы
                setTimeout(() => {
                    const roomCodeInput = document.getElementById('room-code');
                    const playerNameInput = document.getElementById('player-name');
                    if (roomCodeInput && roomCodeInput.value && playerNameInput && playerNameInput.value) {
                        // Если имя уже введено, подключаемся автоматически
                        connectToRoom();
                    }
                }, 100);
            }
        });

        socket.on('player-connected', (data) => {
            console.log('✅ Игрок подключен, ID:', data.playerId);
            document.getElementById('connect-screen').style.display = 'none';
            document.getElementById('waiting-screen').style.display = 'block';
        });

        socket.on('error', (data) => {
            showError(data.message);
        });

        // Начало игры
        socket.on('game-started', () => {
            document.getElementById('waiting-screen').style.display = 'none';
            const gameScreen = document.getElementById('game-screen');
            gameScreen.style.display = 'block';
            gameScreen.style.animation = 'fadeIn 0.5s ease-in';
            hasAnswered = false;
            // Инициализируем счет при начале игры
            window.previousPlayerScore = 0;
            const scoreElement = document.getElementById('player-score');
            if (scoreElement) {
                scoreElement.textContent = '0';
            }
        });

        // Вопрос
        socket.on('question', (data) => {
            // Если мы еще на экране подключения, переключаемся
            if (document.getElementById('connect-screen').style.display !== 'none') {
                document.getElementById('connect-screen').style.display = 'none';
                document.getElementById('waiting-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'block';
            }
            
            // Скрываем кнопку готовности при новом вопросе
            isReady = false;
            const readyBtn = document.getElementById('ready-btn');
            const readyStatus = document.getElementById('ready-status');
            readyBtn.style.display = 'none';
            readyStatus.textContent = '';
            
            // ВАЖНО: ВСЕГДА сбрасываем флаг ответа при получении нового вопроса
            hasAnswered = false;
            
            document.getElementById('question-screen').style.display = 'block';
            document.getElementById('results-screen').style.display = 'none';
            document.getElementById('final-results').style.display = 'none';
            document.getElementById('answer-feedback').textContent = '';
            document.getElementById('answer-feedback').style.display = 'none';
            
            // Сохраняем текущий счет перед новым вопросом
            const currentScoreElement = document.getElementById('player-score');
            if (currentScoreElement) {
                window.previousPlayerScore = parseInt(currentScoreElement.textContent) || 0;
            }
            
            const questionNum = data.questionNumber;
            const totalQuestions = data.totalQuestions;
            
            document.getElementById('question-num').textContent = questionNum;
            document.getElementById('total-questions').textContent = totalQuestions;
            document.getElementById('question-text').textContent = data.question;
            
            // Обновляем прогресс-бар
            const progress = (questionNum / totalQuestions) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';
            
            // Варианты ответов - ВСЕГДА создаем активные кнопки
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            data.options.forEach((option, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.disabled = false;
                btn.onclick = () => selectAnswer(index);
                optionsDiv.appendChild(btn);
            });

            // Таймер
            let timeLeft = data.timeLeft !== undefined ? data.timeLeft : data.time;
            const timerElement = document.getElementById('timer');
            timerElement.textContent = timeLeft;
            timerElement.classList.remove('urgent');
            
            if (currentTimer) clearInterval(currentTimer);
            let timerStopped = false;
            
            currentTimer = setInterval(() => {
                if (timerStopped) {
                    clearInterval(currentTimer);
                    return;
                }
                
                timeLeft--;
                timerElement.textContent = timeLeft;
                
                // Визуальные эффекты при малом времени
                if (timeLeft <= 5) {
                    timerElement.classList.add('urgent');
                }
                
                if (timeLeft <= 0) {
                    clearInterval(currentTimer);
                    disableOptions();
                    timerElement.textContent = '0';
                }
            }, 1000);
            
            // Сохраняем функцию остановки таймера
            window.stopTimer = function() {
                timerStopped = true;
                if (currentTimer) {
                    clearInterval(currentTimer);
                    currentTimer = null;
                }
            };
        });

        // Статус ответов (для остановки таймера когда все ответили)
        socket.on('answer-status', (data) => {
            if (data.allAnswered && !hasAnswered) {
                // Все ответили, останавливаем таймер
                if (window.stopTimer) {
                    window.stopTimer();
                }
            }
        });

        function selectAnswer(answerIndex) {
            if (hasAnswered) return;
            hasAnswered = true;
            
            // Останавливаем таймер для этого игрока
            if (window.stopTimer) {
                window.stopTimer();
            }
            
            socket.emit('answer', { roomCode, answerIndex });
            
            // Визуальная обратная связь
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach((btn, index) => {
                btn.disabled = true;
                if (index === answerIndex) {
                    btn.classList.add('selected');
                }
            });
            
            disableOptions();
        }

        function disableOptions() {
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);
        }

        // Ответ получен
        socket.on('answer-received', (data) => {
            hasAnswered = true;
            
            // Останавливаем таймер
            if (window.stopTimer) {
                window.stopTimer();
            }
            if (currentTimer) {
                clearInterval(currentTimer);
                currentTimer = null;
            }
            
            const feedback = document.getElementById('answer-feedback');
            
            // Просто цветовая индикация без текста
            if (data.isCorrect) {
                feedback.textContent = '';
                feedback.className = 'answer-feedback correct';
            } else {
                feedback.textContent = '';
                feedback.className = 'answer-feedback incorrect';
            }
            
            // Сохраняем данные для экрана результатов
            window.lastAnswerData = {
                isCorrect: data.isCorrect,
                points: data.points || 0,
                newScore: data.newScore || 0
            };
            
            // Блокируем все кнопки после ответа
            disableOptions();
            
            // Показываем обратную связь сразу
            feedback.style.display = 'flex';
            
            // Подсвечиваем выбранный ответ
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach((btn, index) => {
                if (btn.classList.contains('selected')) {
                    if (data.isCorrect) {
                        btn.classList.add('correct');
                    } else {
                        btn.classList.add('incorrect');
                    }
                }
            });
        });

        let isReady = false;

        // Результаты вопроса
        socket.on('results', (data) => {
            clearInterval(currentTimer);
            isReady = false;
            
            document.getElementById('question-screen').style.display = 'none';
            document.getElementById('results-screen').style.display = 'block';
            
            // Показываем правильный ответ
            const correctAnswerDisplay = document.getElementById('correct-answer-display');
            if (data.correctAnswerText) {
                correctAnswerDisplay.textContent = `Правильный ответ: ${data.correctAnswerText}`;
                correctAnswerDisplay.style.display = 'block';
            } else {
                correctAnswerDisplay.style.display = 'none';
            }
            
            // Показать правильный ответ на кнопках
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach((btn, index) => {
                if (index === data.correctAnswer) {
                    btn.classList.add('correct');
                } else {
                    btn.classList.remove('selected');
                }
            });

            // Обновить счет с прибавленными баллами
            const player = data.players.find(p => p.name === playerName);
            if (player) {
                const previousScore = window.previousPlayerScore || 0;
                const newScore = player.score;
                const pointsEarned = newScore - previousScore;
                
                document.getElementById('player-score').textContent = newScore;
                
                // Показываем прибавленные баллы за этот раунд
                const pointsAdded = document.getElementById('points-added');
                if (pointsEarned > 0) {
                    pointsAdded.textContent = `(+${pointsEarned})`;
                    pointsAdded.style.color = 'var(--success)';
                    pointsAdded.style.fontWeight = '600';
                } else {
                    pointsAdded.textContent = `(+0)`;
                    pointsAdded.style.color = 'var(--gray-400)';
                }
                
                // Сохраняем текущий счет для следующего раунда
                window.previousPlayerScore = newScore;
            }

            // Таблица лидеров с прибавленными баллами
            const leaderboard = document.getElementById('leaderboard');
            leaderboard.innerHTML = '';
            data.players.forEach((player, index) => {
                const item = document.createElement('div');
                let className = 'leaderboard-item';
                if (index === 0) className += ' first';
                else if (index === 1) className += ' second';
                else if (index === 2) className += ' third';
                
                item.className = className;
                item.style.animationDelay = (index * 0.1) + 's';
                
                // Находим прибавленные баллы для этого игрока
                let pointsDisplay = '';
                if (player.name === playerName) {
                    // Вычисляем прибавленные очки из разницы счетов
                    const previousScore = window.previousPlayerScore || 0;
                    const pointsEarned = player.score - previousScore;
                    // Показываем "+X" только если ответ был правильный
                    if (pointsEarned > 0 && window.lastAnswerData && window.lastAnswerData.isCorrect) {
                        pointsDisplay = ` <span style="color: var(--success); font-weight: 600;">(+${pointsEarned})</span>`;
                    }
                    // Если ответ неправильный - ничего не показываем
                    // Сохраняем текущий счет для следующего раунда
                    window.previousPlayerScore = player.score;
                }
                
                item.innerHTML = `
                    <span>${index + 1}. ${player.name}</span>
                    <span>${player.score} очков${pointsDisplay}</span>
                `;
                leaderboard.appendChild(item);
            });

            // Показываем кнопку готовности
            const readyBtn = document.getElementById('ready-btn');
            const readyStatus = document.getElementById('ready-status');
            readyBtn.style.display = 'block';
            readyBtn.disabled = false;
            readyBtn.textContent = 'Готов к следующему вопросу';
            readyStatus.textContent = 'Нажмите кнопку, когда будете готовы к следующему вопросу';
        });

        // Кнопка готовности
        const readyBtn = document.getElementById('ready-btn');
        readyBtn.addEventListener('click', () => {
            if (isReady) return;
            isReady = true;
            socket.emit('player-ready', roomCode);
            readyBtn.disabled = true;
            readyBtn.textContent = '✅ Готов! Ожидание других игроков...';
            const readyStatus = document.getElementById('ready-status');
            readyStatus.textContent = 'Вы готовы! Ожидание других игроков...';
        });

        // Статус готовности
        socket.on('ready-status', (data) => {
            if (isReady && document.getElementById('results-screen').style.display !== 'none') {
                const readyBtn = document.getElementById('ready-btn');
                const readyStatus = document.getElementById('ready-status');
                readyBtn.disabled = true;
                readyBtn.textContent = 'Готов! Ожидание других игроков...';
                readyStatus.textContent = `Вы готовы! Ожидание других игроков... (${data.readyCount}/${data.totalPlayers})`;
            }
        });

        // Финальные результаты
        socket.on('game-finished', (data) => {
            document.getElementById('question-screen').style.display = 'none';
            document.getElementById('results-screen').style.display = 'none';
            document.getElementById('final-results').style.display = 'block';
            
            const player = data.results.find(p => p.name === playerName);
            if (player) {
                document.getElementById('final-score').textContent = player.score;
            }

            const leaderboard = document.getElementById('final-leaderboard');
            leaderboard.innerHTML = '';
            const finalMessages = {
                0: '· Чемпион',
                1: '· Второе место',
                2: '· Третье место'
            };
            
            data.results.forEach((player, index) => {
                const item = document.createElement('div');
                let className = 'leaderboard-item';
                if (index === 0) className += ' first';
                else if (index === 1) className += ' second';
                else if (index === 2) className += ' third';
                
                item.className = className;
                item.style.animationDelay = (index * 0.1) + 's';
                
                const message = finalMessages[index] || '';
                item.innerHTML = `
                    <span>${index + 1}. ${player.name} ${message}</span>
                    <span>${player.score} очков</span>
                `;
                leaderboard.appendChild(item);
            });
        });
    </script>
</body>
</html>
