<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чемпионат ГНУ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Days+One&family=Handlee&family=Kalam:wght@300;400;700&family=Open+Sans:wght@400;500;600;700&family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;600;700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            background: #f2f2f2;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 0 20px 20px 20px;
            position: relative;
        }
        
        /* Парящие элементы */
        body::before {
            content: '';
            position: fixed;
            /* top устанавливается динамически через JavaScript */
            left: -50px;
            width: 200px;
            height: 200px;
            background: #d6fbbf; /* Парящий элемент */
            border-radius: 50% 40% 60% 30%;
            opacity: 0.9;
            z-index: -1;
            animation: wobble 6s ease-in-out infinite;
            pointer-events: none;
        }
        
        body::after {
            content: '';
            position: fixed;
            bottom: -80px;
            right: -80px;
            width: 250px;
            height: 250px;
            background: #fececd; /* Парящий элемент */
            border-radius: 40% 50% 30% 60%;
            opacity: 0.9;
            z-index: -1;
            animation: wobble 8s ease-in-out infinite reverse;
            pointer-events: none;
        }
        
        @keyframes wobble {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(5deg) scale(1.1); }
            50% { transform: rotate(-5deg) scale(0.9); }
            75% { transform: rotate(3deg) scale(1.05); }
        }

        /* HUB стили */
        .hub {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #f2f2f2; /* Цвет основного фона сайта */
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            z-index: 1000;
            border-bottom: none;
            box-shadow: none;
        }

        .hub-content {
            max-width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 15px;
            position: relative;
        }

        /* Секция с логотипом и фразой */
        .hub-logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            left: 50%;
            top: 40px;
            transform: translateX(-50%);
            gap: 5px;
            pointer-events: none;
        }
        
        .hub-logo-section * {
            pointer-events: auto;
        }

        .hub-logo-section .logo {
            max-width: 100%;
            height: auto;
            max-height: 150px;
            width: auto;
            transform: rotate(-2deg);
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }

        .hub-logo-section .subtitle {
            font-family: 'Caveat', cursive;
            font-size: 24px;
            color: #393639;
            margin: 0;
            font-weight: 400;
            line-height: 1.2;
            white-space: nowrap;
        }

        .hub-actions {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            flex-shrink: 0;
            align-self: flex-start;
        }

        .back-button-hub {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(245, 245, 245, 0.85);
            border: 2px solid #393639;
            border-radius: 12px;
            color: #393639;
            text-decoration: none;
            font-family: 'Days One', sans-serif;
            font-size: 14px;
            font-weight: 700;
            transition: all 0.3s;
            box-shadow: 
                0 2px 0px rgba(0, 0, 0, 0.2),
                0 4px 8px rgba(0, 0, 0, 0.1);
            white-space: nowrap;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .back-button-hub:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 0px rgba(0, 0, 0, 0.3),
                0 8px 16px rgba(0, 0, 0, 0.15);
            background: rgba(245, 245, 245, 0.6);
        }
        
        .back-button-hub:active {
            transform: translateY(0px);
        }

        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            /* padding-top устанавливается динамически через JavaScript */
            position: relative;
            margin-top: 0;
            margin-left: auto;
            margin-right: auto;
        }

        /* Модальное окно для пароля */
        .password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .password-modal {
            background: #FFFFFF;
            border-radius: 24px;
            padding: clamp(24px, 4vw, 36px) clamp(20px, 4vw, 32px);
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 
                0 8px 0px rgba(0, 0, 0, 0.2),
                0 16px 32px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        .password-title {
            font-family: 'Days One', sans-serif;
            font-size: clamp(24px, 5vw, 32px);
            color: #393639;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .password-input {
            width: 100%;
            padding: clamp(14px, 3vw, 18px);
            border: 3px solid #393639;
            border-radius: 12px;
            font-family: 'Days One', sans-serif;
            font-size: clamp(20px, 4vw, 24px);
            text-align: center;
            margin-bottom: clamp(16px, 3vw, 20px);
            box-sizing: border-box;
        }

        .password-input:focus {
            outline: none;
            border-color: #abf67c;
            box-shadow: 0 0 0 4px rgba(168, 224, 99, 0.2);
        }

        .password-buttons {
            display: flex;
            gap: clamp(8px, 2vw, 12px);
            width: 100%;
            box-sizing: border-box;
        }

        .password-button {
            background: #abf67c;
            color: #2fb95d;
            border: none;
            padding: clamp(12px, 2.5vw, 16px) clamp(16px, 3vw, 24px);
            border-radius: 12px;
            font-family: 'Days One', sans-serif;
            font-size: clamp(16px, 3vw, 20px);
            cursor: pointer;
            box-shadow: 0 4px 0px rgba(47, 185, 93, 0.3), 0 6px 12px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
            flex: 1;
            box-sizing: border-box;
            min-width: 0;
        }

        .password-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0px rgba(47, 185, 93, 0.4), 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .password-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px rgba(0, 0, 0, 0.2);
        }

        .password-button.back {
            background: #f2f2f2;
            color: #393639;
        }

        .password-button.back:hover {
            background: #E0E0E0;
        }

        .password-error {
            color: #ff7664;
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(14px, 2.5vw, 16px);
            margin-top: 12px;
            min-height: 20px;
            display: none;
        }

        .password-error.show {
            display: block;
        }

        .title {
            font-family: 'Days One', sans-serif;
            font-size: clamp(32px, 6vw, 48px);
            color: #393639;
            margin-top: 40px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .subtitle {
            font-family: 'Caveat', cursive;
            font-size: clamp(24px, 4.5vw, 36px);
            color: #354fba;
            margin-bottom: 40px;
            transform: rotate(-1deg);
        }

        .mode-cards {
            display: grid;
            grid-template-columns: 1fr;
            gap: clamp(20px, 4vw, 28px);
            margin-top: clamp(20px, 6vw, 40px); /* Опущено ниже */
        }

        .mode-card {
            background: #FFFFFF;
            border-radius: clamp(12px, 2.5vw, 18px);
            padding: clamp(18px, 4vw, 28px) clamp(16px, 3.5vw, 24px);
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 
                0 6px 0px rgba(0, 0, 0, 0.15),
                0 8px 16px rgba(0, 0, 0, 0.1);
            border: none;
            text-align: center;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: clamp(140px, 28vw, 180px);
        }

        .mode-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 
                0 8px 0px rgba(0, 0, 0, 0.2),
                0 12px 24px rgba(0, 0, 0, 0.15);
        }

        .mode-card:active {
            transform: translateY(-4px) scale(1.01);
        }

        .mode-card.solo {
            background: #ABF67C;
            color: #373639;
        }

        .mode-card.multiplayer {
            background: #F68A7C;
            color: #373639;
        }

        .mode-icon {
            font-size: clamp(36px, 8vw, 56px);
            margin-bottom: clamp(10px, 2.5vw, 16px);
            line-height: 1;
            width: clamp(36px, 8vw, 56px);
            height: clamp(56px, 10vw, 72px); /* Фиксированная высота для выравнивания заголовков */
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .mode-icon svg {
            width: 100%;
            height: 100%;
        }

        .mode-title {
            font-family: 'Days One', sans-serif;
            font-size: clamp(12px, 2.4vw, 16px);
            color: #393639;
            margin-bottom: clamp(6px, 1.5vw, 12px);
            margin-top: 0;
            text-transform: uppercase;
            line-height: 1.2;
            white-space: nowrap;
            width: 100%;
            padding: 0 clamp(8px, 2vw, 14px);
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .mode-description {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(12px, 2.4vw, 16px);
            color: #393639;
            opacity: 0.85;
            line-height: 1.4;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
        }

        @media (min-width: 768px) {
            .mode-cards {
                grid-template-columns: 1fr 1fr;
                gap: clamp(24px, 4vw, 32px);
                margin-top: clamp(20px, 6vw, 40px); /* Опущено ниже для широкой версии */
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 0 clamp(10px, 3vw, 20px);
            }

            .mode-card {
                padding: clamp(16px, 4vw, 24px) clamp(14px, 3.5vw, 20px);
                min-height: clamp(130px, 35vw, 160px);
            }

            .password-modal {
                padding: clamp(24px, 5vw, 32px) clamp(20px, 4vw, 28px);
            }
        }

        /* Адаптивная ширина HUB */
        @media (min-width: 1024px) {
            .hub {
                padding: 20px 40px;
            }
            
            .hub-content {
                max-width: 1400px;
                margin: 0 auto;
                justify-content: flex-start;
                position: relative;
            }
            
            .hub-logo-section {
                position: absolute;
                left: 50%;
                top: 40px;
                transform: translateX(-50%);
                display: flex;
                justify-content: center;
                align-items: center;
            }
            
            .hub-logo-section .logo {
                max-height: 150px;
            }
            
            .hub-logo-section .subtitle {
                font-size: 28px;
            }
            
            .hub-actions {
                order: 1;
                flex-shrink: 0;
            }
        }

        @media (max-width: 1023px) and (min-width: 769px) {
            .hub {
                padding: 15px 30px;
            }
            
            .hub-content {
                max-width: 100%;
            }
            
            .hub-logo-section {
                position: absolute;
                left: 50%;
                top: 30px;
                transform: translateX(-50%);
            }
            
            .hub-logo-section .logo {
                max-height: 120px;
            }
            
            .hub-logo-section .subtitle {
                font-size: 22px;
            }
            
            .hub-actions {
                order: 1;
                flex-shrink: 0;
            }
        }

        @media (max-width: 768px) {
            .hub {
                padding: 12px 20px;
            }
            
            .hub-content {
                max-width: 100%;
                justify-content: center;
            }
            
            .hub-logo-section {
                position: static;
                transform: none;
                flex: 1 1 100%;
                order: 1;
                width: 100%;
            }
            
            .hub-logo-section .logo {
                max-height: 80px;
            }
            
            .hub-logo-section .subtitle {
                font-size: 18px;
            }
            
            .hub-actions {
                order: 2;
                margin: 10px 0 0 0;
            }
        }

        @media (max-width: 480px) {
            .hub {
                padding: 10px 15px;
            }
            
            .hub-logo-section .logo {
                max-height: 60px;
            }
            
            .hub-logo-section .subtitle {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Модальное окно для пароля -->
    <div class="password-overlay" id="passwordOverlay">
        <div class="password-modal">
            <h2 class="password-title">Введите пароль</h2>
            <input 
                type="password" 
                class="password-input" 
                id="passwordInput" 
                placeholder="Пароль"
                autocomplete="off"
                autofocus
            >
            <div class="password-buttons">
                <button class="password-button back" onclick="goBack()">Назад</button>
                <button class="password-button" onclick="checkPassword()">Войти</button>
            </div>
            <div class="password-error" id="passwordError">Неверный пароль. Попробуйте снова.</div>
        </div>
    </div>

    <!-- HUB блок -->
    <div class="hub" id="hub" style="display: none;">
        <div class="hub-content">
            <div class="hub-actions">
                <a href="/index.html" class="back-button-hub">← Назад</a>
            </div>
            <div class="hub-logo-section">
                <img src="/images/logo.png" alt="ВМЕСТЕ" class="logo">
            </div>
        </div>
    </div>
    
    <div class="container" id="mainContainer" style="display: none;">
        <h1 class="title">ЧЕМПИОНАТ ГНУ</h1>
        <p class="subtitle">выбери режим игры</p>
        
        <div class="mode-cards">
            <div class="mode-card solo" onclick="selectMode('solo')">
                <div class="mode-icon">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="transform: scale(0.7); transform-origin: center;">
                        <!-- Один человечек - уменьшен для соответствия высоте трех -->
                        <circle cx="50" cy="35" r="15" fill="#000" stroke="#000" stroke-width="2"/>
                        <path d="M 50 50 Q 50 70 50 85" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
                        <path d="M 50 60 L 30 75" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
                        <path d="M 50 60 L 70 75" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
                        <path d="M 50 85 L 35 100" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
                        <path d="M 50 85 L 65 100" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="mode-title">Одиночная игра</div>
                <div class="mode-description">
                    Играй один и соревнуйся с другими в рейтинге.<br>15 вопросов из 150.
                </div>
            </div>
            
            <div class="mode-card multiplayer" onclick="selectMode('multiplayer')">
                <div class="mode-icon">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="transform: scale(0.9); transform-origin: center;">
                        <!-- Три человечка - уменьшены на 10% -->
                        <!-- Первый (слева) -->
                        <circle cx="25" cy="30" r="10" fill="#000" stroke="#000" stroke-width="2"/>
                        <path d="M 25 40 Q 25 55 25 70" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
                        <path d="M 25 50 L 12 62" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
                        <path d="M 25 50 L 38 62" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
                        <path d="M 25 70 L 15 85" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
                        <path d="M 25 70 L 35 85" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
                        <!-- Второй (центр) -->
                        <circle cx="50" cy="35" r="12" fill="#000" stroke="#000" stroke-width="2"/>
                        <path d="M 50 47 Q 50 62 50 77" stroke="#000" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                        <path d="M 50 57 L 35 70" stroke="#000" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                        <path d="M 50 57 L 65 70" stroke="#000" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                        <path d="M 50 77 L 37 92" stroke="#000" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                        <path d="M 50 77 L 63 92" stroke="#000" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                        <!-- Третий (справа) -->
                        <circle cx="75" cy="30" r="10" fill="#000" stroke="#000" stroke-width="2"/>
                        <path d="M 75 40 Q 75 55 75 70" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
                        <path d="M 75 50 L 62 62" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
                        <path d="M 75 50 L 88 62" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
                        <path d="M 75 70 L 65 85" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
                        <path d="M 75 70 L 85 85" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="mode-title">Мультиплеер</div>
                <div class="mode-description">
                    Создай комнату и играй с друзьями.<br>QR-код для подключения.
                </div>
            </div>
        </div>
    </div>

    <script>
        // Используем новый ID 'gnu', но поддерживаем старые для обратной совместимости
        const QUIZ_ID = 'gnu';
        const QUIZ_PASSWORD = '1234';
        const STORAGE_KEY = 'gnuPasswordEntered';
        const VERIFIED_KEY = 'gnuPasswordVerified';
        let passwordEntered = false;

        // Функция для обновления позиции парящих элементов и отступа контейнера относительно высоты HUB
        function updateFloatingElementsPosition() {
            const hub = document.getElementById('hub');
            const container = document.querySelector('.container');
            
            if (hub && hub.style.display !== 'none') {
                const hubHeight = hub.offsetHeight;
                // Устанавливаем top для парящего элемента: высота HUB + отступ
                const floatingTop = hubHeight + 20;
                
                // Устанавливаем отступ контейнера: высота HUB + дополнительный отступ
                // Для широкой версии (>= 1024px) увеличиваем отступ, чтобы контент не перекрывался логотипом
                // Для узкой версии (<= 768px) уменьшаем отступ и используем отрицательный margin-top
                if (container) {
                    const isWideScreen = window.innerWidth >= 1024;
                    const isNarrowScreen = window.innerWidth <= 768;
                    let additionalPadding;
                    if (isWideScreen) {
                        additionalPadding = 120;
                        container.style.marginTop = '0';
                    } else if (isNarrowScreen) {
                        // Для узких экранов используем отрицательный margin-top, чтобы поднять контент выше
                        additionalPadding = 0;
                        container.style.marginTop = '-15px'; // Поднимаем контент выше, но чуть ниже
                    } else {
                        additionalPadding = 40;
                        container.style.marginTop = '0';
                    }
                    const paddingTop = hubHeight + additionalPadding;
                    container.style.paddingTop = paddingTop + 'px';
                }
                
                // Создаем или обновляем стиль для парящего элемента
                let style = document.getElementById('dynamic-floating-position');
                if (!style) {
                    style = document.createElement('style');
                    style.id = 'dynamic-floating-position';
                    document.head.appendChild(style);
                }
                style.textContent = `
                    body::before {
                        top: ${floatingTop}px !important;
                    }
                `;
            }
        }

        // Проверка пароля из localStorage
        if (localStorage.getItem(STORAGE_KEY) === 'true') {
            passwordEntered = true;
            document.getElementById('passwordOverlay').style.display = 'none';
            document.getElementById('hub').style.display = 'block';
            document.getElementById('mainContainer').style.display = 'block';
            // Обновляем позицию парящих элементов и отступ контейнера после отображения hub
            setTimeout(updateFloatingElementsPosition, 100);
        }

        // Обработка Enter в поле пароля
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('passwordError');
            
            if (password === QUIZ_PASSWORD) {
                passwordEntered = true;
                localStorage.setItem(STORAGE_KEY, 'true');
                document.getElementById('passwordOverlay').style.display = 'none';
                document.getElementById('hub').style.display = 'block';
                document.getElementById('mainContainer').style.display = 'block';
                errorDiv.classList.remove('show');
                // Обновляем позицию парящих элементов после отображения hub
                setTimeout(updateFloatingElementsPosition, 100);
            } else {
                errorDiv.classList.add('show');
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }

        function clearPassword() {
            localStorage.removeItem(VERIFIED_KEY);
            localStorage.removeItem(STORAGE_KEY);
        }

        function goBack() {
            clearPassword();
            window.location.href = '/index.html';
        }

        function selectMode(mode) {
            // Сохраняем флаг, что пароль уже проверен
            localStorage.setItem(VERIFIED_KEY, 'true');
            
            if (mode === 'solo') {
                // Для соло режима используем ID квиза напрямую
                window.location.href = `/solo.html?quiz=${QUIZ_ID}&password=verified`;
            } else if (mode === 'multiplayer') {
                // Для мультиплеера также используем ID квиза (сервер сам определит режим)
                window.location.href = `/host.html?quiz=${QUIZ_ID}&password=verified`;
            }
        }
        // Применяем цвет выбранного персонажа к кнопке "Назад"
        document.addEventListener('DOMContentLoaded', function() {
            const savedColor = localStorage.getItem('selectedCharacterColor');
            if (savedColor) {
                const backButton = document.querySelector('.back-button-hub');
                if (backButton) {
                    backButton.style.background = savedColor;
                }
            }
            
            // Обновляем позицию парящих элементов и отступ контейнера после загрузки
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => {
                    setTimeout(updateFloatingElementsPosition, 300);
                });
            } else {
                setTimeout(updateFloatingElementsPosition, 300);
            }
        });
        
        // Обновляем позицию при изменении размера окна
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(updateFloatingElementsPosition, 100);
        });
    </script>
</body>
</html>
