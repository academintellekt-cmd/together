<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квиз-Questions - Счетная комиссия</title>
    <!-- Новая система фреймов -->
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/layout.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="/styles/frame1.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Days+One&family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- Конфигурация видимости фреймов -->
    <script>
        window.pageLayoutConfig = {
            showFrame1: true,
            showFrame2: false,
            showFrame4: true,
            showFrame5: true
        };
    </script>
    
    <script src="/socket.io/socket.io.js"></script>
    <!-- Layout Manager -->
    <script src="/scripts/layout.js"></script>
    <script src="/scripts/frame-common.js"></script>
    <script src="/scripts/frame1.js"></script>
    <style>
        /* Специфичные стили для страницы комиссии */
        .hub3 > .container {
            max-width: 900px;
        }

        .waiting-screen {
            text-align: center;
            display: none;
            padding-top: 40px;
        }

        .waiting-screen h1 {
            font-family: 'Days One', sans-serif;
            font-size: 28px;
            color: #393639;
            margin-bottom: 20px;
        }

        .question-info {
            background: rgba(245, 245, 245, 0.9);
            border: 3px solid #393639;
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            box-shadow: 
                0 4px 0px rgba(0, 0, 0, 0.2),
                0 8px 16px rgba(0, 0, 0, 0.1);
        }

        .question-info h2 {
            font-family: 'Days One', sans-serif;
            font-size: 24px;
            color: #393639;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .question-text {
            font-size: 20px;
            font-family: 'Montserrat', sans-serif;
            color: #393639;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .correct-answer {
            font-size: 18px;
            font-family: 'Montserrat', sans-serif;
            color: #00C159;
            font-weight: 700;
            padding: 10px;
            background: rgba(0, 193, 89, 0.1);
            border-radius: 8px;
            margin-top: 10px;
        }

        .answers-list {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 10px;
            max-height: calc(100vh - 300px);
            overflow-y: auto;
        }

        @media (max-width: 768px) {
            .answers-list {
                grid-template-columns: 1fr;
            }
        }

        .answer-item {
            background: #FFFFFF;
            border: 2px solid #393639;
            border-radius: 10px;
            padding: 12px 16px;
            margin: 8px 0;
            box-shadow: 
                0 1px 0px rgba(0, 0, 0, 0.15),
                0 2px 4px rgba(0, 0, 0, 0.08);
            transition: all 0.2s;
        }

        .answer-item:hover {
            transform: translateY(-1px);
            box-shadow: 
                0 2px 0px rgba(0, 0, 0, 0.2),
                0 4px 8px rgba(0, 0, 0, 0.12);
        }

        .answer-item.verified {
            border-color: #00C159;
            background: rgba(0, 193, 89, 0.05);
        }

        .answer-item.verified.incorrect {
            border-color: #ff7664;
            background: rgba(255, 118, 100, 0.05);
        }

        .answer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .player-name {
            font-family: 'Days One', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #393639;
            text-transform: uppercase;
        }

        .answer-time {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            color: #666;
        }

        .answer-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            color: #393639;
            line-height: 1.4;
            margin-bottom: 10px;
            padding: 8px;
            background: rgba(245, 245, 245, 0.5);
            border-radius: 6px;
            min-height: 40px;
        }

        .answer-text:empty::before,
        .answer-text:has-text("")::before {
            content: '(Нет ответа)';
            color: #999;
            font-style: italic;
        }

        .answer-text {
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            line-clamp: 3;
            -webkit-box-orient: vertical;
            word-break: break-word;
        }

        .verification-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .verification-btn {
            padding: 8px 16px;
            font-family: 'Days One', sans-serif;
            font-size: 14px;
            font-weight: 700;
            border: 2px solid #393639;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .verification-btn.correct {
            background: #abf67c;
            color: #2fb95d;
            border-color: #2fb95d;
        }

        .verification-btn.correct:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 4px 0px rgba(47, 185, 93, 0.3),
                0 6px 12px rgba(47, 185, 93, 0.2);
        }

        .verification-btn.incorrect {
            background: #ff7664;
            color: #FFFFFF;
            border-color: #ff7664;
        }

        .verification-btn.incorrect:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 4px 0px rgba(255, 118, 100, 0.3),
                0 6px 12px rgba(255, 118, 100, 0.2);
        }

        .verification-btn.revoke {
            background: rgba(245, 245, 245, 0.9);
            color: #393639;
            border-color: #393639;
        }

        .verification-btn.revoke:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 4px 0px rgba(0, 0, 0, 0.2),
                0 6px 12px rgba(0, 0, 0, 0.1);
        }

        .score-input {
            width: 100px;
            padding: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            border: 2px solid #393639;
            border-radius: 8px;
            text-align: center;
        }

        .verification-status {
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            color: #00C159;
            font-weight: 700;
            margin-top: 6px;
        }

        .verification-status.revoked {
            color: #ff7664;
        }

        .status-bar {
            background: rgba(245, 245, 245, 0.9);
            border: 3px solid #393639;
            border-radius: 16px;
            padding: 15px;
            margin: 20px 0;
            text-align: center;
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            color: #393639;
            font-weight: 600;
        }

        .next-question-btn {
            width: 100%;
            max-width: 400px;
            margin: 30px auto;
            padding: 15px 30px;
            font-family: 'Days One', sans-serif;
            font-size: 20px;
            font-weight: 700;
            background: #abf67c;
            border: 3px solid #2fb95d;
            border-radius: 12px;
            color: #2fb95d;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 
                0 4px 0px rgba(47, 185, 93, 0.3),
                0 8px 16px rgba(47, 185, 93, 0.1);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: none;
        }

        .next-question-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 0px rgba(47, 185, 93, 0.4),
                0 10px 20px rgba(47, 185, 93, 0.2);
        }

        .next-question-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .show-leaderboard-btn {
            width: 100%;
            max-width: 400px;
            margin: 30px auto;
            padding: 15px 30px;
            font-family: 'Days One', sans-serif;
            font-size: 20px;
            font-weight: 700;
            background: #abf67c;
            border: 3px solid #2fb95d;
            border-radius: 12px;
            color: #2fb95d;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 
                0 4px 0px rgba(47, 185, 93, 0.3),
                0 8px 16px rgba(47, 185, 93, 0.1);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: none;
        }

        .show-leaderboard-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 
                0 6px 0px rgba(47, 185, 93, 0.4),
                0 10px 20px rgba(47, 185, 93, 0.2);
        }

        .show-leaderboard-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <!-- HUB3: основная зона контента -->
    <div class="hub-zone hub3">
        <div class="container">
            <!-- Экран ожидания -->
            <div id="waiting-screen" class="waiting-screen">
                <h1>Счетная комиссия</h1>
                <div class="status" id="waiting-status">Подключение к комнате...</div>
                <div style="margin-top: 30px; padding: 20px; background: rgba(245, 245, 245, 0.9); border: 3px solid #393639; border-radius: 16px; max-width: 500px; margin-left: auto; margin-right: auto;">
                    <p style="font-family: 'Montserrat', sans-serif; font-size: 16px; color: #393639; line-height: 1.6;">
                        Ожидание начала игры...<br>
                        После начала игры здесь будут отображаться ответы игроков для проверки.
                    </p>
                </div>
            </div>

            <!-- Экран проверки -->
            <div id="verification-screen" style="display: none;">
                <!-- Информация о вопросе -->
                <div class="question-info">
                    <h2>Вопрос <span id="question-number">1</span></h2>
                    <div id="question-text" class="question-text"></div>
                    <div class="correct-answer">
                        Правильный ответ: <span id="correct-answer"></span>
                    </div>
                </div>

                <!-- Статус проверки -->
                <div class="status-bar">
                    Проверено: <span id="verified-count">0</span> из <span id="total-answers">0</span>
                </div>

                <!-- Список ответов -->
                <div class="answers-list" id="answers-list"></div>

                <!-- Кнопка "Таблица результатов" -->
                <button id="show-leaderboard-btn" class="show-leaderboard-btn" onclick="showLeaderboard()">
                    Таблица результатов
                </button>

                <!-- Кнопка "Следующий вопрос" -->
                <button id="next-question-btn" class="next-question-btn" onclick="nextQuestion()" style="display: none;">
                    Следующий вопрос
                </button>
            </div>
        </div>
    </div>

    <!-- FOOTER: Frame 4 и Frame 5 -->
    <footer class="site-footer">
        <!-- Frame 4: Правила безопасности -->
        <section class="frame frame-4" data-frame="rules" id="hub4">
            <p>Правила безопасности: Будьте внимательны и соблюдайте правила игры.</p>
        </section>

        <!-- Frame 5: Информация о создателе -->
        <section class="frame frame-5" data-frame="about" id="hub5">
            <p>© 2024 ВМЕСТЕ. Все права защищены.</p>
        </section>
    </footer>

    <script>
        // Проверка, что страница открыта через сервер
        if (window.location.protocol === 'file:') {
            document.body.innerHTML = `
                <div style="text-align: center; padding: 40px; color: white;">
                    <h1 style="font-size: 48px; margin-bottom: 20px;">⚠️ Ошибка</h1>
                    <p style="font-size: 24px; margin-bottom: 30px;">
                        Страница открыта неправильно!
                    </p>
                    <p style="font-size: 18px; margin-bottom: 30px;">
                        Откройте страницу через сервер: http://localhost:3000/quiz-questions-commission.html
                    </p>
                </div>
            `;
            throw new Error('Страница должна быть открыта через http://localhost:3000/');
        }

        // Ожидание загрузки socket.io
        function waitForSocketIO(callback, maxAttempts = 50) {
            let attempts = 0;
            const checkInterval = setInterval(() => {
                attempts++;
                if (typeof io !== 'undefined') {
                    clearInterval(checkInterval);
                    callback();
                } else if (attempts >= maxAttempts) {
                    clearInterval(checkInterval);
                    console.error('Socket.io не загружен за 5 секунд!');
                }
            }, 100);
        }

        waitForSocketIO(() => {
            initApp();
        });

        let socket = null;
        let roomCode = null;
        let currentQuestionIndex = null;
        let currentQuestion = null;
        let answers = [];

        function initApp() {
            // Инициализация Frame1
            Frame1.init({
                showBack: true,
                backUrl: '/index.html',
                showSettings: false
            });

            // Получаем код комнаты из URL
            const urlParams = new URLSearchParams(window.location.search);
            roomCode = urlParams.get('room');
            
            if (!roomCode) {
                alert('Код комнаты не указан');
                window.location.href = '/index.html';
                return;
            }

            socket = io();

            // Регистрируем обработчики событий ПЕРЕД подключением
            setupSocketHandlers();

            // Подключаемся к комнате как комиссия
            socket.emit('intellectual-commission-join', {
                roomCode: roomCode
            });
        }

        // Настройка обработчиков WebSocket событий
        function setupSocketHandlers() {
            // WebSocket события
            socket.on('intellectual-commission-connected', (data) => {
                console.log('✅ Комиссия подключена:', data);
                const waitingScreen = document.getElementById('waiting-screen');
                const waitingStatus = document.getElementById('waiting-status');
                if (waitingScreen) {
                    waitingScreen.style.display = 'block';
                }
                if (waitingStatus) {
                    waitingStatus.textContent = `Подключено к комнате ${roomCode}. Ожидание начала проверки...`;
                }
            });

            socket.on('intellectual-question-started', (data) => {
                console.log('❓ Вопрос начат:', data);
                const { question, questionIndex } = data;
                currentQuestionIndex = questionIndex;
                currentQuestion = question;
                
                const waitingScreen = document.getElementById('waiting-screen');
                const verificationScreen = document.getElementById('verification-screen');
                const nextQuestionBtn = document.getElementById('next-question-btn');
                const showLeaderboardBtn = document.getElementById('show-leaderboard-btn');
                
                if (waitingScreen) {
                    waitingScreen.style.display = 'none';
                }
                if (verificationScreen) {
                    verificationScreen.style.display = 'block';
                }
                if (nextQuestionBtn) {
                    nextQuestionBtn.style.display = 'none';
                    nextQuestionBtn.disabled = false;
                }
                if (showLeaderboardBtn) {
                    showLeaderboardBtn.style.display = 'none';
                    showLeaderboardBtn.disabled = false;
                    showLeaderboardBtn.textContent = 'Таблица результатов';
                }
                
                // Загружаем ответы с небольшой задержкой, чтобы дать время игрокам отправить ответы
                setTimeout(() => {
                    loadAnswers();
                }, 1000);
            });

            socket.on('intellectual-new-answer', () => {
                console.log('📝 Получен новый ответ, обновляем список...');
                // Обновляем список ответов при получении нового ответа
                if (currentQuestionIndex !== null) {
                    loadAnswers();
                }
            });

            socket.on('intellectual-verification-complete', (data) => {
                console.log('✅ Все ответы проверены:', data);
                // Сохраняем данные игроков для использования
                window.verifiedPlayers = data.players || [];
                
                // Показываем кнопку "Таблица результатов"
                const showLeaderboardBtn = document.getElementById('show-leaderboard-btn');
                if (showLeaderboardBtn) {
                    showLeaderboardBtn.style.display = 'block';
                    showLeaderboardBtn.disabled = false;
                }
            });

            socket.on('error', (data) => {
                console.error('❌ Ошибка:', data.message || data);
                alert(data.message || 'Произошла ошибка');
            });
        }

        // Функция для показа таблицы лидеров на хосте
        window.showLeaderboard = function() {
            if (!roomCode) {
                alert('Код комнаты не указан');
                return;
            }
            
            const showLeaderboardBtn = document.getElementById('show-leaderboard-btn');
            if (showLeaderboardBtn) {
                showLeaderboardBtn.disabled = true;
                showLeaderboardBtn.textContent = 'Таблица отображается...';
            }
            
            // Отправляем событие на сервер для показа таблицы на хосте
            socket.emit('intellectual-show-leaderboard', {
                roomCode: roomCode,
                players: window.verifiedPlayers || []
            });
            
            // После отправки показываем кнопку "Следующий вопрос"
            setTimeout(() => {
                const nextQuestionBtn = document.getElementById('next-question-btn');
                if (nextQuestionBtn) {
                    nextQuestionBtn.style.display = 'block';
                    nextQuestionBtn.disabled = false;
                }
                if (showLeaderboardBtn) {
                    showLeaderboardBtn.style.display = 'none';
                }
            }, 500);
        }

        // Функция для перехода к следующему вопросу
        window.nextQuestion = function() {
            if (!roomCode) {
                alert('Код комнаты не указан');
                return;
            }
            
            const nextQuestionBtn = document.getElementById('next-question-btn');
            if (nextQuestionBtn) {
                nextQuestionBtn.disabled = true;
                nextQuestionBtn.textContent = 'Переход к следующему вопросу...';
            }
            
            socket.emit('intellectual-next-question', roomCode);
        }

        // Расчет баллов на основе времени ответа
        function calculateScore(answerTime) {
            const maxScore = 1000;
            const questionTime = 60000; // 1 минута
            const score = Math.max(0, Math.floor(maxScore * (1 - answerTime / questionTime)));
            return score;
        }

        // Проверка ответа (глобальная функция для onclick)
        window.verifyAnswer = async function(playerId, isCorrect) {
            const answer = answers.find(a => a.playerId === playerId);
            if (!answer) return;

            const score = isCorrect ? calculateScore(answer.time) : 0;

            try {
                const response = await fetch('/api/quiz-questions/verify-answer', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        roomCode: roomCode,
                        questionIndex: currentQuestionIndex,
                        playerId: playerId,
                        isCorrect: isCorrect,
                        score: score
                    })
                });

                if (response.ok) {
                    answer.verified = true;
                    answer.verification = {
                        isCorrect: isCorrect,
                        score: score,
                        verifiedAt: Date.now()
                    };
                    updateAnswersList();
                    socket.emit('intellectual-verification-updated', {
                        roomCode: roomCode,
                        questionIndex: currentQuestionIndex
                    });
                }
            } catch (error) {
                console.error('Ошибка проверки ответа:', error);
                alert('Ошибка при проверке ответа');
            }
        }

        // Отмена проверки (глобальная функция для onclick)
        window.revokeVerification = async function(playerId) {
            try {
                const response = await fetch('/api/quiz-questions/revoke-verification', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        roomCode: roomCode,
                        questionIndex: currentQuestionIndex,
                        playerId: playerId
                    })
                });

                if (response.ok) {
                    const answer = answers.find(a => a.playerId === playerId);
                    if (answer) {
                        answer.verified = false;
                        answer.verification = null;
                        updateAnswersList();
                        socket.emit('intellectual-verification-updated', {
                            roomCode: roomCode,
                            questionIndex: currentQuestionIndex
                        });
                    }
                }
            } catch (error) {
                console.error('Ошибка отмены проверки:', error);
                alert('Ошибка при отмене проверки');
            }
        }

        // Обновление списка ответов
        function updateAnswersList() {
            const answersListEl = document.getElementById('answers-list');
            const verifiedCountEl = document.getElementById('verified-count');
            
            if (!answersListEl) return;

            const verifiedCount = answers.filter(a => a.verified).length;
            if (verifiedCountEl) {
                verifiedCountEl.textContent = verifiedCount;
            }

            answersListEl.innerHTML = answers.map(answer => {
                const verification = answer.verification;
                const verified = !!verification;
                const isCorrect = verification?.isCorrect;
                const score = verification?.score || 0;
                const answerText = answer.answer || '(Нет ответа)';
                const answerDisplay = answerText.length > 100 ? answerText.substring(0, 100) + '...' : answerText;

                return `
                    <div class="answer-item ${verified ? (isCorrect ? 'verified' : 'verified incorrect') : ''}">
                        <div class="answer-header">
                            <span class="player-name">${answer.playerName}</span>
                            <span class="answer-time">${Math.round(answer.time / 1000)}с</span>
                        </div>
                        <div class="answer-text" title="${answerText}">${answerDisplay}</div>
                        ${verified ? `
                            <div class="verification-status ${!isCorrect ? 'revoked' : ''}">
                                ${isCorrect ? `✓ Правильно (${score})` : '✗ Неправильно'}
                            </div>
                            <div class="verification-controls">
                                <button class="verification-btn revoke" onclick="revokeVerification('${answer.playerId}')">
                                    Отменить
                                </button>
                            </div>
                        ` : `
                            <div class="verification-controls">
                                <button class="verification-btn correct" onclick="verifyAnswer('${answer.playerId}', true)">
                                    ✓
                                </button>
                                <button class="verification-btn incorrect" onclick="verifyAnswer('${answer.playerId}', false)">
                                    ✗
                                </button>
                            </div>
                        `}
                    </div>
                `;
            }).join('');
        }

        // Загрузка ответов для текущего вопроса
        async function loadAnswers() {
            try {
                console.log(`📥 Загрузка ответов для комнаты ${roomCode}, вопроса ${currentQuestionIndex}`);
                const response = await fetch(`/api/quiz-questions/answers/${roomCode}/${currentQuestionIndex}`);
                if (!response.ok) {
                    throw new Error(`Ошибка загрузки ответов: ${response.status} ${response.statusText}`);
                }

                const data = await response.json();
                console.log('📋 Получены данные:', data);
                
                currentQuestion = data.question;
                answers = data.answers || [];

                console.log(`✅ Загружено ${answers.length} ответов`);

                const questionNumberEl = document.getElementById('question-number');
                const questionTextEl = document.getElementById('question-text');
                const correctAnswerEl = document.getElementById('correct-answer');
                const totalAnswersEl = document.getElementById('total-answers');

                if (questionNumberEl) {
                    questionNumberEl.textContent = currentQuestionIndex + 1;
                }
                if (questionTextEl && currentQuestion) {
                    questionTextEl.textContent = currentQuestion.question;
                }
                if (correctAnswerEl && currentQuestion) {
                    correctAnswerEl.textContent = currentQuestion.answer || 'Не указан';
                }
                if (totalAnswersEl) {
                    totalAnswersEl.textContent = answers.length;
                }

                updateAnswersList();
            } catch (error) {
                console.error('❌ Ошибка загрузки ответов:', error);
                const answersListEl = document.getElementById('answers-list');
                if (answersListEl) {
                    answersListEl.innerHTML = `<div style="padding: 20px; text-align: center; color: #ff7664;">Ошибка загрузки ответов: ${error.message}</div>`;
                }
            }
        }
    </script>
    
    <!-- Layout Manager -->
    <script src="/scripts/layout.js"></script>
    <script src="/scripts/frame-common.js"></script>
</body>
</html>
