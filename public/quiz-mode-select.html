<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор режима</title>
    <!-- Новая система фреймов -->
    <link rel="stylesheet" href="/styles/base.css">
    <link rel="stylesheet" href="/styles/layout.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="/styles/quiz-card.css">
    <link rel="stylesheet" href="/styles/frame1.css">
    <link rel="stylesheet" href="/styles/frame2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Days+One&family=Handlee&family=Kalam:wght@300;400;700&family=Open+Sans:wght@400;500;600;700&family=Montserrat:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&family=Poppins:wght@400;600;700;800;900&family=Permanent+Marker&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Модальное окно для пароля */
        .password-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .password-modal {
            background: #FFFFFF;
            border-radius: 24px;
            padding: clamp(24px, 4vw, 36px) clamp(20px, 4vw, 32px);
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 
                0 8px 0px rgba(0, 0, 0, 0.2),
                0 16px 32px rgba(0, 0, 0, 0.3);
            box-sizing: border-box;
        }

        .password-title {
            font-family: 'Days One', sans-serif;
            font-size: clamp(24px, 5vw, 32px);
            color: #393639;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .password-input {
            width: 100%;
            padding: clamp(14px, 3vw, 18px);
            border: 3px solid #393639;
            border-radius: 12px;
            font-family: 'Days One', sans-serif;
            font-size: clamp(20px, 4vw, 24px);
            text-align: center;
            margin-bottom: clamp(16px, 3vw, 20px);
            box-sizing: border-box;
        }

        .password-input:focus {
            outline: none;
            border-color: #abf67c;
            box-shadow: 0 0 0 4px rgba(168, 224, 99, 0.2);
        }

        .password-buttons {
            display: flex;
            gap: clamp(8px, 2vw, 12px);
            width: 100%;
            box-sizing: border-box;
        }

        .password-button {
            background: #abf67c;
            color: #2fb95d;
            border: none;
            padding: clamp(12px, 2.5vw, 16px) clamp(16px, 3vw, 24px);
            border-radius: 12px;
            font-family: 'Days One', sans-serif;
            font-size: clamp(16px, 3vw, 20px);
            cursor: pointer;
            box-shadow: 0 4px 0px rgba(47, 185, 93, 0.3), 0 6px 12px rgba(0, 0, 0, 0.1);
            transition: all 0.2s;
            flex: 1;
            box-sizing: border-box;
            min-width: 0;
        }

        .password-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0px rgba(47, 185, 93, 0.4), 0 8px 16px rgba(0, 0, 0, 0.15);
        }

        .password-button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0px rgba(0, 0, 0, 0.2);
        }

        .password-button.back {
            background: #f2f2f2;
            color: #393639;
        }

        .password-button.back:hover {
            background: #E0E0E0;
        }

        .password-error {
            color: #ff7664;
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(14px, 2.5vw, 16px);
            margin-top: 12px;
            min-height: 20px;
            display: none;
        }

        .password-error.show {
            display: block;
        }

        .title {
            font-family: 'Days One', sans-serif;
            font-size: clamp(32px, 6vw, 48px);
            color: #393639;
            /* Увеличенный отступ сверху для расстояния от Frame2 (фраза) - соответствует отступам Frame2/Frame3 */
            margin-top: clamp(20px, 3vh, 40px); /* Отступ внутри контейнера, основной отступ у контейнера */
            margin-bottom: 10px;
            text-transform: uppercase;
            text-align: center;
            width: 100%;
        }

        /* Стили для subtitle внутри контента (НЕ для Frame2) */
        #content .subtitle,
        .container .subtitle {
            font-family: 'Caveat', cursive;
            font-size: clamp(24px, 4.5vw, 36px);
            color: #354fba;
            margin-bottom: 40px;
            transform: rotate(-1deg);
            text-align: center;
            width: 100%;
        }
        
        /* Исключаем фразу в Frame2 из локальных стилей - она должна использовать стили из frame2.css */
        .frame2-logo-section .subtitle,
        .frame2 .subtitle,
        .frame-2 .subtitle,
        #frame2 .subtitle {
            /* Все стили применяются из frame2.css - не переопределяем здесь */
            font-size: clamp(20px, 3vw, 40px) !important; /* Маленький размер как в frame2.css */
            color: #393639 !important; /* Цвет как в frame2.css */
            margin: 0 !important;
            margin-bottom: 0 !important;
            margin-top: 0 !important;
            padding: 0 !important;
            transform: none !important; /* Убираем поворот */
            font-weight: 400 !important;
            line-height: 1.2 !important;
            white-space: nowrap !important;
        }

        #content {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            text-align: center;
        }

        .mode-cards {
            display: grid;
            grid-template-columns: 1fr;
            gap: clamp(20px, 4vw, 28px);
            margin: 0 auto;
            margin-top: clamp(20px, 6vw, 40px);
            max-width: 800px;
            width: 100%;
            padding: 0 clamp(16px, 4vw, 24px);
        }

        .mode-card.solo {
            background: #ABF67C;
            box-shadow: 
                0 6px 0px rgba(47, 185, 93, 0.3),
                0 8px 16px rgba(47, 185, 93, 0.1);
        }

        .mode-card.solo:hover {
            background: rgba(171, 246, 124, 0.9);
        }

        .mode-card.multiplayer {
            background: #F68A7C;
            box-shadow: 
                0 6px 0px rgba(250, 87, 52, 0.3),
                0 8px 16px rgba(250, 87, 52, 0.1);
        }

        .mode-card.multiplayer:hover {
            background: rgba(246, 138, 124, 0.9);
        }

        .mode-card .quiz-title,
        .mode-card .quiz-description,
        .mode-card .quiz-subtitle {
            color: #373639;
        }

        .mode-card .quiz-icon {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mode-card .quiz-icon svg {
            width: 100%;
            height: 100%;
        }

        .mode-card .quiz-description {
            margin-bottom: clamp(8px, 2vw, 12px);
        }

        .quiz-info-highlight {
            font-family: 'Caveat', cursive;
            font-size: clamp(20px, 3.5vw, 28px);
            color: #354fba;
            margin-top: clamp(12px, 2.5vw, 16px);
            font-weight: 400;
            line-height: 1.2;
            text-align: center;
            flex-shrink: 0;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            color: #393639;
        }

        .error {
            text-align: center;
            padding: 40px;
            font-family: 'Montserrat', sans-serif;
            font-size: 18px;
            color: #ff7664;
        }

        @media (min-width: 768px) {
            .mode-cards {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        /* Скрываем Frame2 на этой странице */
        #hub2 {
            display: none !important;
        }
        
        /* Когда Frame2 скрыт, Frame3 занимает его место в grid */
        body.with-hub {
            grid-template-rows: 
                auto                /* Frame1 - фиксированная высота */
                auto;               /* Frame3 занимает место Frame2 */
        }
        
        .hub3 {
            grid-row: 2; /* Занимает место Frame2 */
        }
        
        /* Убеждаемся, что контейнер имеет достаточный отступ сверху для расстояния от Frame2 */
        /* Отступ должен соответствовать отступам между Frame2 и Frame3 из layout.css */
        .hub3 .container {
            padding-top: clamp(80px, 10vh, 130px) !important; /* Увеличенный отступ сверху для расстояния от Frame2 (фраза) */
        }
        
        /* Парящие элементы перемещены в Frame3 через hub-layout.css */
        
        @media (max-width: 1023px) and (min-width: 769px) {
            body.with-hub {
                grid-template-rows: 
                    minmax(10vh, auto)
                    auto;
            }
        }
        
        @media (max-width: 768px) {
            body.with-hub {
                grid-template-rows: 
                    minmax(10vh, auto)
                    auto;
            }
            
            body.with-hub::before {
                top: clamp(10vh, 12vw, 12vh) !important;
                width: clamp(150px, 30vw, 200px) !important;
                height: clamp(150px, 30vw, 200px) !important;
            }
            
            body.with-hub::after {
                bottom: clamp(15vh, 20vw, 20vh) !important;
                width: clamp(180px, 35vw, 250px) !important;
                height: clamp(180px, 35vw, 250px) !important;
            }
        }
        
        @media (max-width: 480px) {
            body.with-hub {
                grid-template-rows: 
                    minmax(10vh, auto)
                    auto;
            }
            
            body.with-hub::before {
                top: clamp(10vh, 12vw, 12vh) !important;
                width: clamp(120px, 25vw, 180px) !important;
                height: clamp(120px, 25vw, 180px) !important;
                left: clamp(-40px, -8vw, -50px) !important;
            }
            
            body.with-hub::after {
                bottom: clamp(12vh, 18vw, 18vh) !important;
                width: clamp(150px, 30vw, 220px) !important;
                height: clamp(150px, 30vw, 220px) !important;
                right: clamp(-60px, -12vw, -80px) !important;
            }
        }
    </style>
</head>
<body class="with-hub">
    <!-- Модальное окно для пароля -->
    <div class="password-overlay" id="passwordOverlay" style="display: none;">
        <div class="password-modal">
            <h2 class="password-title">Введите пароль</h2>
            <input 
                type="password" 
                class="password-input" 
                id="passwordInput" 
                placeholder="Пароль"
                autocomplete="off"
                autofocus
            >
            <div class="password-buttons">
                <button class="password-button back" onclick="goBack()">Назад</button>
                <button class="password-button" onclick="checkPassword()">Войти</button>
            </div>
            <div class="password-error" id="passwordError">Неверный пароль. Попробуйте снова.</div>
        </div>
    </div>

    <!-- HUB3: основная зона контента -->
    <div class="hub-zone hub3">
        <div class="container" id="mainContainer" style="display: none;">
            <div id="loading" class="loading">Загрузка...</div>
            <div id="error" class="error" style="display: none;"></div>
            <div id="content" style="display: none;">
                <h1 class="title" id="quizTitle">КВИЗ</h1>
                <p class="subtitle" id="quizSubtitle">выбери режим игры</p>
                
                <div class="mode-cards" id="modeCards">
                    <!-- Карточки режимов будут добавлены динамически -->
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER: Frame 4 и Frame 5 -->
    <footer class="site-footer">
        <!-- Frame 4: Правила безопасности -->
        <section class="frame frame-4" data-frame="rules" id="frame4">
            <p>Правила безопасности: Будьте внимательны и соблюдайте правила игры.</p>
        </section>

        <!-- Frame 5: Информация о создателе -->
        <section class="frame frame-5" data-frame="about" id="frame5">
            <p>© 2024 ВМЕСТЕ. Все права защищены.</p>
        </section>
    </footer>

    <script>
        // Получаем ID квиза из URL
        const urlParams = new URLSearchParams(window.location.search);
        const QUIZ_ID = urlParams.get('quiz');
        let quizConfig = null;
        let passwordEntered = false;

        // Загружаем информацию о квизе
        async function loadQuizConfig() {
            if (!QUIZ_ID) {
                showError('ID квиза не указан');
                return;
            }

            try {
                const response = await fetch(`/api/quizzes/${QUIZ_ID}`);
                if (!response.ok) {
                    throw new Error('Квиз не найден');
                }
                quizConfig = await response.json();
                
                // Проверяем, требуется ли пароль
                if (quizConfig.passwordRequired && quizConfig.password) {
                    const storageKey = `quiz_${QUIZ_ID}_password`;
                    if (localStorage.getItem(storageKey) !== 'true') {
                        document.getElementById('passwordOverlay').style.display = 'flex';
                        return;
                    }
                }

                // Показываем контент
                displayQuiz();
            } catch (error) {
                console.error('Ошибка загрузки квиза:', error);
                showError('Не удалось загрузить квиз. Убедитесь, что сервер запущен.');
            }
        }

        function showError(message) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').textContent = message;
        }

        function displayQuiz() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            document.getElementById('mainContainer').style.display = 'block';

            // Устанавливаем заголовок и подзаголовок
            if (quizConfig.display && quizConfig.display.title) {
                document.getElementById('quizTitle').textContent = quizConfig.display.title;
            } else {
                document.getElementById('quizTitle').textContent = quizConfig.name.toUpperCase();
            }

            if (quizConfig.display && quizConfig.display.subtitle) {
                document.getElementById('quizSubtitle').textContent = quizConfig.display.subtitle;
            }

            // Создаем карточки режимов
            const modeCards = document.getElementById('modeCards');
            modeCards.innerHTML = '';

            // Карточка одиночной игры
            if (quizConfig.soloMode !== false) {
                const soloCard = createModeCard('solo', 'Одиночная игра', 
                    'Играй один и соревнуйся с другими в рейтинге',
                    getSoloIcon(),
                    getSoloInfo(quizConfig));
                modeCards.appendChild(soloCard);
            }

            // Карточка мультиплеера
            if (quizConfig.multiplayerMode !== false) {
                const multiplayerCard = createModeCard('multiplayer', 'Мультиплеер',
                    'Создай комнату и играй с друзьями',
                    getMultiplayerIcon(),
                    'QR-код для подключения');
                modeCards.appendChild(multiplayerCard);
            }

            // Инициализируем Hub
            initHubs();
        }

        function createModeCard(mode, title, description, iconSvg, infoText) {
            const card = document.createElement('div');
            card.className = `quiz-card mode-card ${mode}`;
            card.onclick = () => selectMode(mode);

            card.innerHTML = `
                <div class="quiz-card-content">
                    <div class="quiz-icon">
                        ${iconSvg}
                    </div>
                    <div class="quiz-title">${title}</div>
                    <div class="quiz-description">${description}</div>
                    <div class="quiz-info-highlight">${infoText}</div>
                </div>
            `;

            return card;
        }

        function getSoloIcon() {
            return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="transform: scale(0.7); transform-origin: center;">
                <circle cx="50" cy="35" r="15" fill="#000" stroke="#000" stroke-width="2"/>
                <path d="M 50 50 Q 50 70 50 85" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
                <path d="M 50 60 L 30 75" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
                <path d="M 50 60 L 70 75" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
                <path d="M 50 85 L 35 100" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
                <path d="M 50 85 L 65 100" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round"/>
            </svg>`;
        }

        function getMultiplayerIcon() {
            return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="transform: scale(0.9); transform-origin: center;">
                <circle cx="25" cy="30" r="10" fill="#000" stroke="#000" stroke-width="2"/>
                <path d="M 25 40 Q 25 55 25 70" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M 25 50 L 12 62" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M 25 50 L 38 62" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M 25 70 L 15 85" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M 25 70 L 35 85" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
                <circle cx="50" cy="35" r="12" fill="#000" stroke="#000" stroke-width="2"/>
                <path d="M 50 47 Q 50 62 50 77" stroke="#000" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                <path d="M 50 57 L 35 70" stroke="#000" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                <path d="M 50 57 L 65 70" stroke="#000" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                <path d="M 50 77 L 37 92" stroke="#000" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                <path d="M 50 77 L 63 92" stroke="#000" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                <circle cx="75" cy="30" r="10" fill="#000" stroke="#000" stroke-width="2"/>
                <path d="M 75 40 Q 75 55 75 70" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M 75 50 L 62 62" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M 75 50 L 88 62" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M 75 70 L 65 85" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path d="M 75 70 L 85 85" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
            </svg>`;
        }

        function getSoloInfo(config) {
            if (config.display && config.display.questionsDisplay) {
                const total = config.gameSettings?.totalQuestions || config.questions?.length || 0;
                const perGame = config.gameSettings?.questionsPerGame || 15;
                return config.display.questionsDisplay.replace('{total}', total).replace('{count}', perGame);
            }
            const total = config.gameSettings?.totalQuestions || config.questions?.length || 0;
            const perGame = config.gameSettings?.questionsPerGame || 15;
            return `${perGame} вопросов из ${total}`;
        }

        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('passwordError');
            
            if (password === quizConfig.password) {
                passwordEntered = true;
                const storageKey = `quiz_${QUIZ_ID}_password`;
                localStorage.setItem(storageKey, 'true');
                document.getElementById('passwordOverlay').style.display = 'none';
                errorDiv.classList.remove('show');
                displayQuiz();
            } else {
                errorDiv.classList.add('show');
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }

        function goBack() {
            window.location.href = '/index.html';
        }

        function selectMode(mode) {
            const storageKey = `quiz_${QUIZ_ID}_verified`;
            localStorage.setItem(storageKey, 'true');
            
            if (mode === 'solo') {
                window.location.href = `/solo.html?quiz=${QUIZ_ID}&password=verified`;
            } else if (mode === 'multiplayer') {
                window.location.href = `/host.html?quiz=${QUIZ_ID}&password=verified`;
            }
        }

        function initHubs() {
            if (typeof Frame1 !== 'undefined' && typeof Frame2 !== 'undefined') {
                Frame1.init({
                    showBack: true,
                    backUrl: '/index.html'
                });
                
                // Инициализируем Frame2
                Frame2.init({
                    showSubtitle: true // Явно указываем, что нужно показать фразу
                });
                
                // Убираем inline стили, которые устанавливает функция адаптации
                // Используем только CSS стили из frame2.css для правильного размера
                setTimeout(() => {
                    ensureFrame2SubtitleUsesCSS();
                }, 200);
                
                setTimeout(() => {
                    ensureFrame2SubtitleUsesCSS();
                }, 500);
                
                setTimeout(() => {
                    ensureFrame2SubtitleUsesCSS();
                }, 1000);
                
                // Убеждаемся, что фраза в Frame2 имеет правильный текст и размер (как на index.html)
                setTimeout(() => {
                    const frame2Subtitle = document.querySelector('.frame2-logo-section .subtitle, .frame2 .subtitle, #frame2 .subtitle, .frame-2 .subtitle');
                    if (frame2Subtitle) {
                        // Устанавливаем правильный текст фразы
                        frame2Subtitle.textContent = 'хорошие люди объединяются играми';
                        // УБИРАЕМ inline стили, чтобы применялись CSS стили из frame2.css
                        // НЕ вызываем adaptSubtitleToLogo(), чтобы использовались CSS стили, а не inline
                        frame2Subtitle.style.fontSize = '';
                        frame2Subtitle.style.width = '';
                        frame2Subtitle.style.maxWidth = '';
                    } else {
                        // Если фраза не найдена, создаем её
                        const logoSection = document.querySelector('.frame2-logo-section, .frame2, #frame2');
                        if (logoSection) {
                            const subtitle = document.createElement('p');
                            subtitle.className = 'subtitle';
                            subtitle.textContent = 'хорошие люди объединяются играми';
                            logoSection.appendChild(subtitle);
                        }
                    }
                }, 300);
                
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            // Позиционирование теперь управляется через CSS Grid
                            
                            // Убеждаемся, что фраза использует CSS стили, а не inline стили от adaptSubtitleToLogo
                            const frame2Subtitle = document.querySelector('.frame2-logo-section .subtitle, .frame2 .subtitle, #frame2 .subtitle, .frame-2 .subtitle');
                            if (frame2Subtitle) {
                                // Убираем inline стили, чтобы применялись CSS стили из frame2.css
                                frame2Subtitle.style.fontSize = '';
                                frame2Subtitle.style.width = '';
                                frame2Subtitle.style.maxWidth = '';
                            }
                            
                            // НЕ вызываем adaptSubtitleToLogo() - используем только CSS стили из frame2.css
                            // Это гарантирует, что фраза будет соответствовать размеру логотипа через CSS
                        });
                    });
                });
            }
        }

        // Отслеживаем и убираем inline стили fontSize у фразы в Frame2
        // Это гарантирует, что применяются только CSS стили из frame2.css
        function ensureFrame2SubtitleUsesCSS() {
            const frame2Subtitle = document.querySelector('.frame2-logo-section .subtitle, .frame2 .subtitle, #frame2 .subtitle, .frame-2 .subtitle');
            if (frame2Subtitle) {
                // Убираем inline стили fontSize, чтобы применялись CSS стили
                if (frame2Subtitle.style.fontSize) {
                    frame2Subtitle.style.fontSize = '';
                }
                if (frame2Subtitle.style.width) {
                    frame2Subtitle.style.width = '';
                }
                if (frame2Subtitle.style.maxWidth) {
                    frame2Subtitle.style.maxWidth = '';
                }
            }
        }
        
        // Отслеживаем изменения в DOM и убираем inline стили
        const observer = new MutationObserver(() => {
            ensureFrame2SubtitleUsesCSS();
        });
        
        // Начинаем наблюдение после загрузки DOM
        document.addEventListener('DOMContentLoaded', () => {
            // Наблюдаем за изменениями в Frame2
            const frame2 = document.getElementById('frame2') || document.querySelector('.frame2, .frame-2');
            if (frame2) {
                observer.observe(frame2, {
                    attributes: true,
                    attributeFilter: ['style'],
                    subtree: true,
                    childList: true
                });
            }
            
            // Периодически проверяем и убираем inline стили
            setInterval(ensureFrame2SubtitleUsesCSS, 500);
        });
        
        // Обработка Enter в поле пароля
        document.addEventListener('DOMContentLoaded', () => {
            const passwordInput = document.getElementById('passwordInput');
            if (passwordInput) {
                passwordInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        checkPassword();
                    }
                });
            }
            
            // Загружаем конфигурацию квиза
            loadQuizConfig();
        });

        // Обновление при изменении размера окна
        let resizeTimeout;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(() => {
                if (typeof FrameCommon !== 'undefined') {
                    // Позиционирование теперь управляется через CSS Grid
                    
                    
                    
                    
                }
            }, 100);
        });
    </script>

        };
